做一次外部滲透測試，覆蓋所有解析入口","引入靜態分析，把所有可能的越界訪問枚舉出來人工複核","在CI中對解析器做覆蓋率引導的模糊測試，配合內存檢測器，並持續積累語料","提高依賴掃描頻率，確保第三方組件沒有已知漏洞"],"ans":2,"exp":"模糊測試專門用來發現「你還不知道的」內存破壞類缺陷：喂畸形輸入、盯崩潰和內存錯誤，覆蓋率引導還能自動往沒走過的分支鑽，語料隨構建不斷累積，越跑越值錢。選項A靠人力滲透覆蓋不了畸形輸入的長尾，季度頻率也追不上代碼變更；選項B的靜態分析能提示可疑模式，但越界往往取決於運行時的長度和索引，漏報誤報都不少，人工複核的成本會失控；選項D針對的是第三方已知漏洞，對自研代碼裡尚未公開的缺陷完全無效。","src":"原創"},{"id":"d8-24-01","ch":8,"level":"8-4","tag":"軟件能力成熟度模型","diff":3,"q":"Robert應將A公司的當前狀態報告為SW-CMM的哪個階段？","opts":["已定義","可重複","初始","已管理"],"ans":2,"exp":"一個正式流程都沒有，全靠一小隊人加班加點硬把軟件發出去，出了問題再救火，這就是第 1 級初始級——過程混亂、靠個人英雄主義撐著。B 可重複要求項目層面的做法能穩定複製成功，A 已定義要求全組織有成文的標準流程，都還差著好幾級。","src":"官方習題精選"},{"id":"d8-24-02","ch":8,"level":"8-4","tag":"軟件能力成熟度模型","diff":3,"q":"Robert正在與A公司合作制定一項策略，以改善其軟件開發實踐。 SW-CMM的下一個目標階段應該是什麼？","opts":["已定義","可重複","初始","已管理"],"ans":1,"exp":"人已經在第 1 級了，往上走一格就是第 2 級可重複：先把項目層面行之有效的做法固定下來，讓同類項目能重複成功。已定義是 3 級、已管理是 4 級，都在更上面，跳著走不現實。","src":"官方習題精選"},{"id":"d8-24-03","ch":8,"level":"8-4","tag":"軟件能力成熟度模型","diff":3,"q":"Robert應將B公司的當前狀態報告為SW-CMM的哪個階段？","opts":["已定義","可重複","初始","已管理"],"ans":0,"exp":"已經用上正式、成文、全公司統一的標準流程，說明組織級的過程立起來了，對應第 3 級已定義。它缺的是拿數據去量化管理過程，那是第 4 級才要求的，所以不能選 D。","src":"官方習題精選"},{"id":"d8-24-04","ch":8,"level":"8-4","tag":"軟件能力成熟度模型","diff":3,"q":"Robert正在與B公司合作制定一項策略，以改善其軟件開發實踐。SW-CMM的下一個目標階段應該是什麼？","opts":["已定義","可重複","初始","已管理"],"ans":3,"exp":"站在第 3 級，下一個臺階就是第 4 級已管理，開始拿度量數據去管過程、做預測。初始和可重複都是它腳下已經走過的臺階，不可能是前進方向。","src":"官方習題精選"},{"id":"d8-s12","ch":8,"level":"8-4","tag":"CMMI","diff":2,"q":"某部門負責人說：「我們已經通過CMMI三級評估了，所以安全這塊也已經達標。」作為安全顧問，最合適的回應是什麼？","opts":["認可，三級是最高等級，說明開發過程與安全都已成熟","三級只說明過程已在組織內定義並標準化，推不出安全控制有效；要用統計手段管理過程績效得到四級，持續優化才到五級","CMMI是安全專用模型，三級只覆蓋訪問控制，不覆蓋開發過程","等級越高要求的過程文檔越少，三級意味著可以精簡安全記錄"],"ans":1,"exp":"CMMI的成熟度階梯是：一級初始（靠個人英雄）→二級已管理（項目級有管理）→三級已定義（組織級標準過程，項目裁剪使用）→四級量化管理（用統計數據管過程績效、結果可預測）→五級持續優化。三級回答的是「有沒有一套統一的、被遵守的過程」，而不是「過程產出的東西安不安全」——一個定義良好、執行穩定的流程完全可以穩定地產出帶漏洞的軟件。選項A把三級當頂級；選項B張冠李戴，CMMI衡量的是過程成熟度，與具體控制項無關；選項D正好相反，等級越高越依賴度量數據和過程資產。","src":"原創"},{"id":"d8-s13","ch":8,"level":"8-4","tag":"管道憑證","diff":3,"q":"CI管道用一對長期雲訪問密鑰部署生產環境，密鑰存放在倉庫的加密變量裡，五年沒有輪換。最應該優先改什麼？","opts":["把密鑰拆成兩半，一半放倉庫變量一半放構建腳本，降低單點洩漏風險","給倉庫變量再加一層加密，並限制只有管理員可見","要求代碼評審時人工檢查構建腳本，確保沒有人把密鑰打印出來","改用短期聯合憑證換取臨時令牌，把部署角色收斂到最小權限，並保留完整審計記錄"],"ans":3,"exp":"管道里長期有效的靜態密鑰是典型的高價值目標：它跟著倉庫走、跟著構建日誌走，也跟著每一個能改構建腳本的人走，一旦洩漏在輪換前一直有效。正解是把「密鑰」換成「身份」——由管道自己的工作負載身份向雲換取短時令牌，權限只夠完成部署這一個動作，每次使用都留痕。選項A和B都只是把同一把長期鑰匙藏得更深，洩漏後的暴露窗口一點沒變，而且拆開存放反而更容易在構建腳本里留下明文；選項C靠人眼在評審裡找洩漏，構建日誌、第三方action、緩存這些路徑根本審不到，也攔不住惡意提交在合併之前就讀到變量。","src":"原創"},{"id":"d8-s14","ch":8,"level":"8-4","tag":"變更控制","diff":2,"q":"週五晚上生產環境因上游依賴服務故障大面積報錯，需要調整應用的重試與降級配置。常規變更諮詢委員會下週二才開會。最合適的做法是什麼？","opts":["等下週二的變更諮詢委員會批准後再改，流程不能破例","直接在生產上手工改配置，改完不必記錄，因為改動很小","啟動緊急變更流程：由值班負責人授權、在受控環境驗證後實施、保留回滾方案，事後補齊評審與文檔","先把所有服務重啟一遍看能不能自己恢復，恢復不了再說"],"ans":2,"exp":"變更控制的目標是讓變更被知情、被授權、可回溯，而不是讓變更變慢。所以正道是緊急變更通道，它不是繞過控制，而是把審批壓縮到分鐘級、把記錄補在後面。選項A把流程當成目的，在故障擴大面前放棄業務可用性；選項B那句「改動很小」恰恰是最危險的自我安慰，沒有回滾方案也沒有記錄，真出問題時沒人知道改了什麼；選項C在原因不明時對全量服務重啟，等於用一個影響面更大的未授權變更去賭運氣。","src":"原創"},{"id":"d8-s15","ch":8,"level":"8-4","tag":"配置管理","diff":3,"q":"審計發現生產環境有30%的主機配置與基礎設施即代碼模板不一致，都是運維手工改的，沒人知道具體改了什麼。最合適的整改措施是什麼？","opts":["每季度組織一次人工比對，把生產配置導出來與模板逐項對比後修正","把基礎設施即代碼作為唯一可信源，生產變更只能經管道實施，在CI中定期做漂移檢測並對差異告警，同時收回手工改配權限","直接收回運維的生產登錄權限，不再做檢測，反正改不了就不會漂移","每季度全量重建一次環境，用重建代替比對"],"ans":1,"exp":"配置漂移的根因是「存在第二條變更路徑」——只要還能手工改，模板就永遠只是建議。所以要按順序做三件事：先關掉旁路（權限收斂、只允許經管道變更），再加檢測（漂移告警），最後把基線納入版本控制形成閉環。選項A靠人眼季度比對，30%的漂移在兩次比對之間足夠再漂一輪，而且沒人能保證比對清單本身完整；選項C只堵不測，權限難免有例外（應急、供應商、遺留系統），沒有檢測你連例外存在都不知道；選項D是破壞性操作，會把手工配置裡可能有用的東西一起抹掉，而且重建本身也依賴一個可信的基線。","src":"原創"},{"id":"d8-s16","ch":8,"level":"8-5","tag":"SBOM","diff":2,"q":"新的組件漏洞爆發，CISO問「我們到底有哪些系統用了這個組件、是哪個版本」，團隊翻了三天倉庫才湊出七成答案。最該建設的能力是什麼？","opts":["要求各供應商在出事後主動通知我們，把清單維護的責任交給他們","完善服務器資產清單，把每臺主機和上面部署的應用都登記進去","為每個構建產物生成並保存SBOM，歸入可查詢的組件庫，並與構建管道和資產清單關聯","把滲透測試頻率從每季度一次提高到每月一次"],"ans":2,"exp":"這個問題問的是組件粒度的可追溯性，只有SBOM能回答：某個構建產物裡到底打包了哪些組件、什麼版本、什麼許可證、由誰引入的。關鍵是它必須自動生成、隨構建歸檔、能反向查詢，否則就只是一份沒人更新的文檔。選項A把可見性交給了別人，供應商此刻也在查自己的；選項B的資產清單隻到主機和應用這一層，回答不了「應用裡嵌了哪個版本的庫」，而這恰恰是漏洞響應要的粒度；選項D頻率再高也只是發現問題的速度，不提供任何清單能力。","src":"原創"},{"id":"d8-s17","ch":8,"level":"8-5","tag":"供應商","diff":2,"q":"採購一套處理員工數據的SaaS。供應商拒絕填寫安全問卷，只給了一份營銷白皮書和一句「我們很安全」。業務部門催著本週簽約。最合適的做法是什麼？","opts":["讓供應商籤一份保密協議，簽了就可以推進","要求提供獨立的第三方鑑證報告並核對範圍與期間，同時把審計權、事件通知時限、數據返還與刪除、分包商披露寫進合同，不滿足則不籤或縮小使用範圍","先簽約上線，等真出了問題再依據合同追責","因為業務緊急，接受風險並在內部記錄，之後不再跟進"],"ans":1,"exp":"第三方風險管理的核心是把「信任」換成「可驗證的證據加可執行的義務」。鑑證報告（如SOC 2 Type II、ISO 27001的適用範圍聲明）要看覆蓋哪些系統、哪些控制、評估期間是不是一年前的，營銷材料什麼都不是；合同裡必須落下審計權、事件通知時限、數據歸屬與刪除、分包商（第四方）披露，這些是出事時唯一能用的抓手。選項A的保密協議只管「別說出去」，不管對方做得夠不夠；選項C把控制推遲到損害發生之後，追責換不回已經洩漏的數據；選項D記錄本身不降低風險，接受風險必須由有權限的人基於評估作出並設複核期限，「不再跟進」是最不該出現的選項。","src":"原創"},{"id":"d8-s18","ch":8,"level":"8-5","tag":"開源許可","diff":3,"q":"法務在開源掃描中發現，團隊把一個AGPLv3的組件編進了對外提供的SaaS，產品只通過API提供服務、不向客戶發放任何二進制。最需要關注的是什麼？","opts":["AGPL第13條把通過網絡與用戶交互也納入源碼提供義務，SaaS形態並不天然豁免；要麼換成許可兼容的組件，要麼履行相應義務","AGPL只約束二進制分發，SaaS並不分發軟件，所以不存在任何義務","MIT和BSD也有同樣的網絡使用條款，需要一併替換掉","只要在代碼裡刪掉版權聲明和許可文件，就可以規避這項義務"],"ans":0,"exp":"AGPL相對GPL最關鍵的差別就是第13條：把「用戶通過網絡遠程使用」也算作觸發源碼提供義務的場景，專門堵住「SaaS不分發所以不用開源」這個口子。所以處理方式只有兩條——換成寬鬆許可的替代組件，或者接受義務、準備好對應源碼。選項B是這條款出現之前的老觀念，正是它要針對的誤解；選項C張冠李戴，MIT和BSD沒有網絡使用條款，只要求保留版權與許可聲明；選項D不但不能免責，刪除版權聲明本身還構成額外的許可違約。","src":"原創"},{"id":"d8-s19","ch":8,"level":"8-5","tag":"傳遞依賴","diff":3,"q":"團隊把直接依賴都升到了最新版，SCA仍然報出一條高危，來源是某個直接依賴內部第三層的傳遞依賴，而上游維護者還沒發佈修復版。最合適的處理方式是什麼？","opts":["只掃描直接依賴，把傳遞依賴從掃描範圍裡排除，先消掉噪音","刪掉lock文件，讓構建時重新解析，說不定就能拉到已修復的版本","用依賴覆蓋或鎖定機制把該傳遞依賴釘到已修復版本並回歸驗證；若上游不兼容或未修復，就隔離相關功能、加補償控制並登記為有期限的風險","等上游發佈修復版本，期間不做處理，因為問題不在我們的代碼裡"],"ans":2,"exp":"傳遞依賴是供應鏈風險的主要來源：它不在你的清單裡，卻實實在在跑在你的進程裡。可選動作是有優先級的——能覆蓋就覆蓋，釘住版本之後必須迴歸，因為跨版本可能破壞兼容性；覆蓋不了就用補償控制把暴露面關掉（禁用相關功能、加虛擬補丁、網絡隔離），同時把殘餘風險寫成帶到期日的條目，逼著有人回來處理。選項A只是把風險從報表裡刪掉，漏洞還在；選項B放棄可復現構建，下次構建拉到什麼版本全憑運氣，可能更糟；選項D把處置權交給上游，暴露期完全不可控，而真正被攻擊的那一端是你的系統。","src":"原創"},{"id":"d8-s20","ch":8,"level":"8-5","tag":"外包審計","diff":3,"q":"公司把核心模塊外包開發。供應商交付了可運行的容器鏡像，但以「知識產權保護」為由拒絕提供源碼。你們的安全要求中明確包含代碼審計。最應該做什麼？","opts":["接受現狀，改為對容器做黑盒測試，黑盒能覆蓋的部分已經夠了","要求供應商出具一份「已通過內部安全審查」的書面聲明即可","只要供應商提供SBOM，就等於覆蓋了代碼層面的風險","把源碼交付、代碼審計權（含第三方評估與源碼託管）寫成合同條款和驗收條件，不滿足則不驗收、不付款"],"ans":3,"exp":"拿不到源碼，SAST、代碼審查、後門排查全都做不了，這已經不是技術問題而是合同問題——必須在簽字之前把它變成可執行的條款：交付物包含源碼、你有權自行或委託第三方審計、爭議或供應商倒閉時可通過源碼託管取得代碼、驗收標準裡寫明審計通過。選項A用黑盒替代，黑盒看得見行為看不見實現，硬編碼後門、隱蔽外聯、把敏感數據打進日誌這些模式都測不出來；選項B是自證，你無從驗證，也無法據以追責；選項C的SBOM只覆蓋第三方組件，供應商自己寫的那部分代碼一行都不在裡面，而這恰恰是本次要審的對象。","src":"原創"},{"id":"d8-s21","ch":8,"level":"8-5","tag":"管道投毒","diff":3,"q":"開源項目用託管平臺的CI做構建。來自fork的PR會自動觸發構建，構建步驟直接執行PR裡的腳本，而倉庫密鑰在同一個作業裡可用。攻擊者只要提一個PR就能讀走發佈憑證。最應該優先改什麼？","opts":["要求PR合併前至少兩名維護者批准，人工審查足以看出惡意腳本","讓外部PR的構建跑在拿不到密鑰、權限受限的隔離作業裡，並給發佈動作加環境級審批與產物簽名驗證","把倉庫密鑰在workflow文件里加密後再解密使用，避免出現明文","啟用分支保護和HTTPS，問題即可解決"],"ans":1,"exp":"這是典型的CI/CD管道投毒面：構建系統執行的是不可信代碼，而它手裡握著可信憑證，等於把鑰匙交給訪客。正確做法是切斷這條鏈路——外部貢獻觸發的作業不給密鑰、令牌只讀、網絡出口受限，發佈動作走需要人工審批的受保護環境，產物簽名之後可驗證來源。選項A依賴人眼在diff裡找惡意行為，混淆、編碼、依賴包裡的副作用都能躲過去，而且構建在合併之前就已經執行了；選項C只是換了加密位置，作業運行時照樣要解密成明文，惡意步驟讀到的仍是明文；選項D是基礎衛生，跟「誰執行構建、能拿到什麼」毫無關係。","src":"原創"},{"id":"d8-s22","ch":8,"level":"8-5","tag":"模型安全","diff":3,"q":"團隊要從公開模型倉庫引入一份預訓練權重（pickle格式），用於內部推理服務。最應該優先做什麼？","opts":["只要倉庫是知名平臺、下載量很高，就可以直接下載加載使用","校驗文件大小和擴展名是否正常，再用殺毒軟件掃一遍即可","把模型與權重當作不可信輸入：優先使用不觸發任意代碼執行的格式，校驗來源與哈希或簽名，在隔離環境加載，並記錄模型、權重與訓練數據來源","先在測試環境跑一次推理，輸出結果正常就說明模型是安全的"],"ans":2,"exp":"模型文件本身就是可執行輸入的載體：pickle反序列化會執行任意代碼，加載即等於運行陌生人的腳本。所以第一層是格式，換成純張量的安全序列化格式，從根上消掉代碼執行面；第二層是來源與完整性，哈希、簽名、可追溯的發佈者；第三層是隔離，真出問題也限制在沙箱裡；最後是記錄，模型、權重、數據集的來源與版本是這條供應鏈可追溯性的基礎。選項A用平臺聲譽替代驗證，公開倉庫通常並不審核上傳內容；選項B的大小和擴展名隨手就能偽造，靜態殺毒對序列化載荷基本無效；選項D只證明了這一次輸入下輸出正常，後門恰恰被設計成在正常測試中看不出來。","src":"原創"},{"id":"d8-s23","ch":8,"level":"8-5","tag":"代碼託管","diff":2,"q":"公司把私有源碼託管在第三方平臺上。開發者各自使用個人賬戶和個人訪問令牌，權限給到組織管理員，離職時靠人工提醒去刪。最合適的整改方案是什麼？","opts":["要求開發者每90天更換一次密碼，其餘保持現狀","既然是私有倉庫，只要不開源就不會洩露，無需額外措施","繼續使用個人賬戶便於離職交接，只在離職時修改密碼即可","納入企業級組織：接入單點登錄與自動化的賬戶開通停用，收斂到最小權限與短有效期令牌，啟用分支保護與密鑰掃描，把審計日誌導出到SIEM，並按供應商風險持續監控平臺"],"ans":3,"exp":"代碼託管平臺承載的是知識產權和發佈憑證，屬於必須納入第三方風險管理的關鍵供應商。整改要同時解決四件事：身份（單點登錄加自動停用，離職即失效，不靠人提醒）、權限（最小權限、令牌短有效期且可撤銷）、內容與變更（分支保護、密鑰掃描，防止憑證被提交進倉庫）、可觀測（審計日誌外送SIEM，平臺側的可疑事件才能被及時發現）。選項A只動密碼，令牌權限和離職停用的問題一個沒解決；選項B混淆了「私有」和「安全」，平臺自身被入侵、內部人員越權、令牌洩漏都不看倉庫開不開源；選項C把個人賬戶當資產，賬戶歸屬在個人名下，人走了連倉庫所有權都可能跟著走。","src":"原創"},{"id":"off9-1","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"下列哪個術語描述了一段時間的瞬時高壓？","opts":["Sag","Brownout","Spike","Surge"],"ans":2,"exp":"功率尖峰power spike是高壓的一個瞬間。電湧surge是長時間的高電壓。Sag和brownout是低電壓期間。","src":"OPTv4 第12章"},{"id":"off9-2","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"Greg需要標記用於其公司醫療保險索賠數據庫的驅動器。以下列表中的哪個數據標籤最符合他正在處理的數據類型？","opts":["PII","Secret","Business confidential","PHI"],"ans":3,"exp":"醫療保險索賠將包含受保護的健康信息，或PHI。Greg應該將驅動器標記為包含PHI，然後確保根據其組織對此類數據的處理標準來處理它們。","src":"OPTv4 第12章"},{"id":"off9-3","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Chris是一家大公司的信息安全專家，當他走進大樓時，他注意到一個安全區域的門半開著。物理安全不屬於他的職責範圍，但他立即採取行動，關上了門，並將他的行動通知了物理安全團隊。克里斯在論證什麼原理？","opts":["Due care","Crime prevention through environmental design","Separation of duties","Informed consent"],"ans":0,"exp":"應盡關注原則指出，一個人在某種情況下應該以任何正常人應有的同樣程度的注意做出反應。這是一個非常寬泛的標準。通過環境設計預防犯罪是一種設計理念，其重點是減少環境對非法或有害行為的影響。職責分離對職責進行了劃分，以確保惡意行為者無法獨自執行購買和批准等操作。知情同意是醫療行業中使用的一個術語，要求必須獲得個人的許可，並且他們必須知道自己的行為可能產生的後果。","src":"OPTv4 第12章"},{"id":"off9-4","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"以下哪一項指標指定了業務連續性規劃人員認為災難後恢復服務可接受的時間量？","opts":["MTD","RTO","RPO","MTO"],"ans":1,"exp":"恢復時間目標(RTO)是指災難發生後，在不對業務造成不可接受的影響的情況下，恢復服務所需的時間。每項服務的RTO都是在業務影響評估期間確定的。","src":"OPTv4 第12章"},{"id":"off9-5","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"Chris正在兩棟建築之間使用6類電纜部署千兆以太網。根據6類標準，他可以敷設電纜的最大距離是多少？","opts":["50 meters","100 meters","200 meters","300 meters"],"ans":1,"exp":"6類電纜的最大允許長度為100米，即328英尺。長距離通常通過光纖線路或使用交換機或中繼器等網絡設備來處理，這不僅是因為距離，還因為室外線路可能會遭受雷擊，而雷擊不會影響光纖。瞭解銅雙絞線的距離限制在許多網絡設計中非常重要，並會影響交換機和其它設備的放置位置。","src":"OPTv4 第12章"},{"id":"off9-6","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"Carlos正在規劃一個數據中心的設計，該數據中心將建在一個新的四層公司總部內。這座建築由一個地下室和三個地上樓層組成。數據中心的最佳位置是哪裡？","opts":["Basement","First floor","Second floor","Third floor"],"ans":2,"exp":"數據中心應該位於建築物的核心。將它放置在較低的樓層會使它容易受到洪水和物理入侵的影響。把它放在頂樓會使它容易被風和屋頂損壞。","src":"OPTv4 第12章"},{"id":"off9-7","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"以下哪種滅火系統會造成最大的意外洩漏風險，從而損壞數據中心的設備？","opts":["Wet pipe","Dry pipe","Deluge","Preaction"],"ans":0,"exp":"幹管、噴淋和預作用系統都使用空管，直到系統檢測到火災跡象。溼式管道系統使用充滿水的管道，如果管道損壞，可能會損壞設備。","src":"OPTv4 第12章"},{"id":"off9-8","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"什麼級別的RAID也稱為磁盤條帶化？","opts":["RAID 0","RAID 1","RAID 5","RAID 10"],"ans":0,"exp":"RAID級別0也稱為磁盤條帶化。RAID 1稱為磁盤鏡像。RAID 5被稱為帶奇偶校驗的磁盤條帶化。RAID 10被稱為鏡像條帶。","src":"OPTv4 第12章"},{"id":"off9-9","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Carlos的團隊發現了一個漏洞，並啟動了事件響應流程。接下來會發生什麼？","opts":["Remediation","Mitigation","Reporting","Lessons learned"],"ans":1,"exp":"典型的事件響應(IR)流程將在響應開始後開始緩解工作，然後進入恢復、報告和吸取教訓階段。重要的是要記住，雖然IR週期被繪製為一個週期，但隨著新問題或細節的確定，它經常在各個階段之間來回移動。","src":"OPTv4 第12章"},{"id":"off9-10","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"Manesh希望幫助他的組織構建安全軟件。以下哪一項不是使用安全框架和庫的常見安全最佳實踐？","opts":["Use internally developed libraries and frameworks whenever possible to reduce third-party threats.","Identify and inventory all third-party libraries.","Encapsulate libraries to prevent the use of functions that are not needed.","Update libraries and components on a regular basis."],"ans":0,"exp":"OWASP為庫和框架推薦了四個關鍵的最佳實踐:使用來自廣泛使用且維護良好的可信來源的庫和框架，維護第三方庫的清單，主動更新庫和組件，以及通過限制可以使用的功能來減少攻擊面。對於大多數組織來說，構建自己的框架和庫比使用維護良好和受支持的現有選項更有可能導致漏洞。","src":"OPTv4 第12章"},{"id":"off9-11","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"通常採用什麼流程來確保即將停止使用但將被轉售或重新使用的工作站的數據安全？","opts":["Destruction","Erasing","Sanitization","Clearing"],"ans":2,"exp":"如果處理得當，清理過程可以完全確保數據在重新使用之前不會留在系統上。清除和擦除都很容易失敗，當然，銷燬也不會使機器或設備可供重複使用。","src":"OPTv4 第12章"},{"id":"off9-12","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"下圖顯示了什麼軟件開發生命週期模型？","opts":["Spiral","Agile","Boehm","Waterfall"],"ans":3,"exp":"該圖顯示了由溫斯頓·羅伊斯開發的瀑布模型。該模型的一個重要特徵是一系列連續的步驟，其中包括一個反饋循環，允許流程在必要時返回當前步驟之前的一個步驟。\nC選項的Boehm模型是由Barry W. Boehm在1978年提出的一個軟件質量模型。","src":"OPTv4 第12章"},{"id":"off9-13","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"Susan公司的領導層要求她實施一個訪問控制系統，該系統可以支持規則聲明，如“僅允許銷售人員在上午8點到下午6點之間通過無線網絡從受管設備進行訪問”。Susan的最佳選擇是哪種類型的訪問控制系統？","opts":["ABAC","RBAC","DAC","MAC"],"ans":0,"exp":"基於屬性的訪問控制(ABAC)系統將允許Susan指定關於主題、客體和訪問的細節，從而允許粒度控制。雖然基於規則的訪問控制系統(RBAC)可能允許這樣做，但基於屬性的訪問控制系統可能更具體，因此也更靈活。自主訪問控制(DAC)將允許客體所有者做出決策，強制訪問控制(MAC)將使用分類；這些功能都沒有在需求中描述。","src":"OPTv4 第12章"},{"id":"off9-14","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"以下哪一項是描述個人必須完成的具體行動的詳細分步文檔？","opts":["Policy","Standard","Guideline","Procedure"],"ans":3,"exp":"程序是正式的強制性文件，提供執行任務的個人所需的詳細、逐步的行動。","src":"OPTv4 第12章"},{"id":"off9-15","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"下圖顯示了一個攻擊示例，攻擊者Mal將流量從用戶系統重定向到自己的系統，從而讀取TLS加密的流量。以下哪個術語最恰當地描述了這種攻擊？","opts":["A DNS hijacking attack","An ARP spoofing attack","A man-in-the-middle attack","A SQL injection attack"],"ans":2,"exp":"中間人(MiTM)通常被稱為中間人或路徑攻擊，它允許攻擊者重定向流量，從而讀取或修改流量。這對最終用戶來說是完全透明的，如果惡意行為者得逞，危害極大。DNS劫持會改變系統的域名信息，這裡沒有直接的指示。類似地，ARP欺騙是進行MiTM攻擊的一種方式，但是這裡也沒有詳細說明。SQL注入通常通過web應用程序對數據庫服務器執行命令來完成。","src":"OPTv4 第12章"},{"id":"off9-16","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"Saria是一家醫療保健機構的系統所有者。對於駐留在她所擁有的系統上或由其處理的數據，她有什麼職責？","opts":["She has to classify the data.","She has to make sure that appropriate security controls are in place to protect the data.","She has to grant appropriate access to personnel.","She bears sole responsibility for ensuring that data is protected at rest, in transit, and in use."],"ans":1,"exp":"系統所有者與系統管理員一起開發和維護系統安全計劃，他們必須確保在這些系統上實施適當的安全控制。系統所有者也與數據所有者分擔數據保護的責任。系統管理員授予適當的訪問權限並應用控制，而數據所有者擁有分類流程。","src":"OPTv4 第12章"},{"id":"off9-17","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"Jill正在為她的組織採購新的網絡硬件。她找到了一個灰色市場供應商，該供應商以低得多的價格從國外進口硬件。對於以這種方式獲得的硬件來說，最重要的安全問題是什麼？","opts":["The security of the hardware and firmware","Availability of support for the hardware and software","Whether the hardware is a legitimate product of the actual vendor","The age of the hardware"],"ans":0,"exp":"這些答案中的每一個都可能是一個問題，但是最重要的安全問題是硬件和固件是否可信或者是否已經被修改。原始設備製造商(OEM)有商業原因來確保其產品的安全性，但供應鏈中的第三方可能不會感受到同樣的壓力。支持的可用性和硬件是否合法也是需要關注的問題，但是不太直接的安全問題。最後，硬件可能比預期的要舊，比如可能已經被使用過的、翻新的或者其他情形(反正就不是新的)。","src":"OPTv4 第12章"},{"id":"off9-18","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"Ben的團隊負責確保離開其組織的設備不包含組織數據。作為流程的一部分，他們已經擦除並重新格式化了系統中的驅動器，這些驅動器將被送往第三方電子回收公司，但一名記者最近報道稱，委託給Ben公司的組織是從回收公司購買的驅動器中恢復的。Ben的團隊遇到了什麼問題，他們應該選擇什麼解決方案來最有效地防止這個問題？","opts":["Data permanence, process certification","Data remanence, driver destruction","Data permanence, using a degausser","Data remanence, zero fill"],"ans":1,"exp":"數據殘留是指在嘗試刪除數據後，數據仍保留在介質上。銷燬驅動器是確保數據不可恢復的一種方式。數據持久性描述數據持續多長時間，並且不用於數據保留在設備上的情況。","src":"OPTv4 第12章"},{"id":"off9-19","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"Harold正在尋找一種軟件開發方法，這種方法將有助於解決他在組織中看到的一個主要問題。目前，開發人員和操作人員不在一起工作，並且經常被視為將問題“拋給”其他團隊。什麼技術管理方法被設計用來緩解這個問題？","opts":["ITIL","Lean","ITSM","DevOps"],"ans":3,"exp":"DevOps技術管理方法尋求將軟件開發、操作和質量保證集成為一個整體。它特別試圖通過在IT團隊成員之間建立協作關係，以消除收到問題並“將問題直接扔到圍欄另一側”的不良運營模式。","src":"OPTv4 第12章"},{"id":"off9-20","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"一名安全研究人員向Mikayla的組織通報了他們產品中的一個繞過身份驗證的漏洞。研究人員表示，如果Mikayla的公司未能修復該漏洞，他們將在接下來的90天內分享有關該漏洞的詳細信息。但是，他們也願意與公司合作，幫助他們瞭解問題，併為他們提供如何重現問題的完整細節。研究者遵循了什麼過程？","opts":["A CVE creation process","A bug bounty","Ethical disclosure","Blackmail"],"ans":2,"exp":"道德披露包括告知組織缺陷和問題。與bug獎金不同的是，其不依賴於提供財務或其他獎勵的組織。道德披露可能涉及時間框架，以確保公司不會忽視問題，但關注合作和公共安全是常見的。當缺陷被報告給CVE項目後會生成CVE記錄。該描述不涉及勒索行為。","src":"OPTv4 第12章"},{"id":"off9-21","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Marco希望部署一種網絡安全設備，該設備能夠檢測並阻止基於網絡的攻擊，而無需額外的外部干預。他應該使用什麼類型的設備，採用什麼配置？","opts":["An inline IDS","An IDS connected through a network tap","An inline IPS","An IPS connected through a network tap"],"ans":2,"exp":"雖然入侵檢測系統(IDS)和入侵防禦系統(IPS)都可以檢測攻擊，但只有IPS可以阻止攻擊。這需要將IPS放置在串行內聯位置。如果通過網絡分路器、span端口或其他用於複製網絡流量的類似工具的連接都會使得設備沒法直接採取防禦措施。","src":"OPTv4 第12章"},{"id":"off9-22","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"Kerberos身份驗證中的服務票證(ST)提供了什麼？","opts":["It serves as the authentication host.","It provides proof that the subject is authorized to access an object.","It provides proof that a subject has authenticated through a KDC and can request tickets to access other objects.","It provides ticket granting services."],"ans":1,"exp":"Kerberos身份驗證中的服務票據ST提供了主體被授權訪問客體的證據。票據發放服務由TGS提供。證明主體已經過身份驗證，可以向其他客體請求票證並使用票證授予票證。身份驗證主機是一個虛構的術語。","src":"OPTv4 第12章"},{"id":"off9-23","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"Sally希望保護其組織的VoIP系統。以下哪種攻擊是她不必擔心的？","opts":["Eavesdropping","Denial-of-service","XSS","Caller ID spoofing"],"ans":2,"exp":"竊聽、拒絕服務攻擊和來電顯示欺騙都是常見的VoIP攻擊。跨站點腳本面向web應用程序，而不是VoIP系統。","src":"OPTv4 第12章"},{"id":"off9-24","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"Fred的公司希望確保通過中央電子郵件服務器發送的電子郵件的完整性。如果消息的保密性不重要，Fred應該建議什麼解決方案？","opts":["Digitally sign and encrypt all messages to ensure integrity.","Digitally sign but don't encrypt all messages.","Use TLS to protect messages, ensuring their integrity.","Use a hashing algorithm to provide a hash in each message to prove that it hasn't changed."],"ans":1,"exp":"Fred的公司需要保護完整性，這可以通過對郵件進行數字簽名來實現。任何更改都將導致簽名無效。加密沒有必要，因為公司不想保護機密。TLS可以提供傳輸中的保護，但不能保護消息的完整性，當然，如果使用的散列無法驗證該散列沒有被更改，也不能確保完整性。","src":"OPTv4 第12章"},{"id":"off9-25","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"Selah希望確保車輛不會撞進公司的入口通道和前廳，同時行人、輪椅或其他移動設備仍然可以進入。什麼樣的物理安全控制最適合這一目的？","opts":["Fences","Bollards","Walls","Stairs"],"ans":1,"exp":"升降地柱是一種物理安全解決方案，是短而堅固的柱子或類似的解決方案，旨在阻止車輛衝撞或通過某個區域。升降地柱可用於在停車時讓行人和可移動設備通過。柵欄和牆壁會阻止個人通過它們，而樓梯對大多數移動設備來說是具有挑戰性的。","src":"OPTv4 第12章"},{"id":"off9-26","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"Melissa負責其組織的安全合規性工作，她被告知，除非存在正在被積極利用的零日漏洞，否則該組織在修補程序發佈一個月後才會安裝Windows修補程序。為什麼公司會像這樣推遲修補？","opts":["To minimize business impact of the installation","To allow any flaws with the patch to be identified","To prevent malware in the patches from being installed before it is identified","To allow the patch to be distributed to all systems"],"ans":1,"exp":"許多組織將修補程序延遲一段時間，以確保在整個組織安裝修補程序之前發現任何以前未發現的缺陷。Melissa需要在她的角色中平衡業務影響和安全性，她可能會根據組織的風險承受能力和安全需求選擇支持這一點或推動更積極的安裝實踐。","src":"OPTv4 第12章"},{"id":"off9-27","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Saria的開發團隊正在開發的web應用程序需要提供安全的會話管理，以防止使用應用程序所依賴的cookies劫持會話。下面哪種方法是她推薦的最好的預防方法？","opts":["Set the Secure attribute for the cookies, thus forcing TLS.","Set the Domain cookie attribute to example.com to limit cookie access to servers in the same domain.","Set the Expires cookie attribute to less than a week.","Set the HTTPOnly attribute to require only unencrypted sessions."],"ans":0,"exp":"設置安全cookie將允許僅通過HTTPS TLS或SSL會話發送cookie，從而防止針對cookie的中間人攻擊。其餘設置都有問題。例如，cookies容易受到DNS欺騙。域cookie通常應該具有儘可能窄的範圍，這實際上是通過不設置域cookie來實現的。這僅允許原始服務器訪問cookie。沒有Expires或Max-age屬性的cookie是短暫的，只會為會話保留，這使它們比存儲的cookie更不容易受到攻擊。通常，HTTPOnly屬性是一個好主意，但是它阻止腳本而不是要求未加密的HTTP會話。","src":"OPTv4 第12章"},{"id":"off9-28","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"提供帳戶開通、管理、身份驗證、授權、報告和監控功能的基於雲的服務被稱為哪種類型的服務？","opts":["PaaS","IDaaS","IaaS","SaaS"],"ans":1,"exp":"身份即服務(IDaaS)提供帳戶供應、管理、身份驗證、授權、報告和監控等功能。平臺即服務(PaaS)、基礎設施即服務(IaaS)和軟件即服務(SaaS)是雲服務模式，但不提供問題中描述的身份和訪問管理功能。","src":"OPTv4 第12章"},{"id":"off9-29","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"IPsec的哪個組件提供身份驗證、完整性和不可否認性？","opts":["L2TP","Encapsulating Security Payload","Encryption Security Header","Authentication Header"],"ans":3,"exp":"驗證頭HA為IPsec連接提供身份驗證、完整性和不可否認性。封裝安全有效載荷ESP提供加密，從而提供機密性。它還可以提供有限的身份驗證。L2TP是一個獨立的VPN協議，加密安全頭是一個虛構的術語。","src":"OPTv4 第12章"},{"id":"off9-30","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"Renee正在查看日誌，並注意到她網絡上的一個系統最近在短時間內收到了來自一個系統的所有65536個TCP端口的連接嘗試。Renee最有可能經歷了什麼類型的攻擊？","opts":["Denial of service","Reconnaissance","Malicious insider","Compromise"],"ans":1,"exp":"該場景中描述的攻擊是TCP掃描的經典示例，這是一種可能先於其他攻擊的網絡偵察技術。沒有證據表明攻擊破壞了系統可用性，這將是拒絕服務攻擊的特徵；也沒有證據表明它是由一個惡意的內部人員發動的，或者攻擊已導致系統受損。","src":"OPTv4 第12章"},{"id":"off9-31","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"在入侵嘗試期間，下列哪一項為攻擊者準備了最複雜的誘餌環境？","opts":["Honeypot","Darknet","Honeynet","Pseudo-flaw"],"ans":2,"exp":"蜜罐是一種用來引誘入侵者攻擊的誘餌計算機系統。蜜網是一個由多個蜜罐組成的網絡，它為入侵者創造了一個更復雜的探索環境。偽缺陷是系統中可能轉移攻擊者注意力的虛假漏洞。管理員通常在蜜罐上添加偽缺陷，以模擬眾所周知的操作系統漏洞。暗網是一段未使用的網絡地址空間，應該沒有任何網絡活動，因此很容易被用來監控非法活動。","src":"OPTv4 第12章"},{"id":"off9-32","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"Carlos正在調查他的組織中敏感信息的洩露。他認為攻擊者設法從數據庫中檢索了所有員工的個人信息，並在一個基於web的人事管理系統的日誌條目中發現了以下用戶提供的輸入:Collins'&1=1;--What type of attack took place, and how could it be prevented?\n發生了什麼類型的攻擊，以及如何預防？","opts":["SQL injection, use of stored procedures","Buffer overflow, automatic buffer expansion","Cross-site scripting, turning on XSS prevention on the web server","Cross-site request forgery, requiring signed requests"],"ans":0,"exp":"輸入字段中的單引號表明這是一次SQL注入攻擊。引號用於轉義SQL代碼的輸入字段，後面的文本用於直接操作從web應用程序發送到數據庫的SQL命令。","src":"OPTv4 第12章"},{"id":"off9-33","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Diana的組織教導員工，如果他們被綁架或受到威脅，可以使用預先安排的代碼與組織聯繫。這是什麼類型的解決方案？","opts":["A duress code","A panic button","A kidnap code","A threat code"],"ans":0,"exp":"脅迫代碼是預先安排的代碼，用於表明工作人員受到脅迫。它們通常被設計成在正常對話期間易於交流，而不會驚動任何可能正在收聽的人。緊急按鈕是用於召喚緊急服務或響應者的物理按鈕。綁架代碼和威脅代碼是為這個問題編造的。","src":"OPTv4 第12章"},{"id":"off9-34","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"封裝是支持哪一種類型協議的核心概念？","opts":["Bridging","Multilayer","Hashing","Storage"],"ans":1,"exp":"封裝為多層協議帶來了好處，也帶來了潛在的問題。橋接可以使用各種協議，但不依賴於封裝。哈希和存儲協議通常不依賴封裝作為其功能的核心部分。","src":"OPTv4 第12章"},{"id":"off9-35","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"Bob承擔了編寫一個策略的任務，該策略描述了數據應保留多長時間以及何時應清除數據。這項政策涉及什麼概念？","opts":["Data remanence","Record retention","Data redaction","Audit logging"],"ans":1,"exp":"記錄保留可確保數據在需要時被保留和維護，並在不再需要時被清除。當試圖刪除數據後留下數據時，就會發生數據殘留，而數據編輯不是描述這種努力的技術術語。最後，審計日誌可能是保留記錄的一部分，但並不描述數據的生命週期。","src":"OPTv4 第12章"},{"id":"off9-36","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"Judy正準備進行業務影響分析。在這個過程中她的第一步應該是什麼？","opts":["Identify threats to the business.","Identify risks to the organization.","Identify business priorities.","Conduct likelihood analysis."],"ans":2,"exp":"業務影響分析的第一步是確定業務的優先級。Judy應該確保所有業務領域都有代表，並且每個部門或領域的職能都得到評估。一旦完成，她就可以繼續識別風險，評估可能性和影響，然後對業務可用的資源進行優先級排序，以解決已識別的優先級。","src":"OPTv4 第12章"},{"id":"off9-37","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"什麼類型的訪問控制旨在通過在事件發生後提供信息來發現不期望發生的或未經授權的活動？","opts":["Preventive","Corrective","Detective","Directive"],"ans":2,"exp":"檢測訪問控制在事件發生後運行，旨在檢測或發現不需要的訪問或活動。預防性訪問控制旨在防止活動發生，而糾正性控制在問題發生後將環境恢復到其原始狀態。指令性訪問控制限制或指導主體的操作，以確保符合策略。","src":"OPTv4 第12章"},{"id":"off9-38","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"手機熱點給企業網絡帶來的最常見風險是什麼？","opts":["They can provide attackers with an unsecured network path into your network.","They can be used like rogue access points for man-in-the-middle attacks.","They allow wireless data to be intercepted.","They are unencrypted and can be easily sniffed."],"ans":0,"exp":"組織通常最關心的是熱點通過筆記本電腦或其他連接到它們的設備創建到安全網絡的不安全網絡連接。將蜂窩連接橋接到企業網絡的網絡連接創建了一條繞過安全控制的路徑。熱點可能被用作流氓接入點，但這種情況不太常見。它們不特別允許無線數據被攔截，並且在大多數現代實現中，被加密，因此限制了嗅探提供有用數據的可能性。","src":"OPTv4 第12章"},{"id":"off9-39","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Amanda的醫療保健提供者維護著關於她的健康、治療和醫療賬單等數據。這是什麼類型的數據？","opts":["Protected health information","Personally identifiable information","Protected health insurance","Individual protected data"],"ans":0,"exp":"HIPAA將受保護健康信息(PHI)定義為包括醫療保健提供者使用的健康信息，如醫療、歷史和賬單。個人可識別信息(PII)是可用於識別個人身份的信息，可能包含在PHI中，但不是專門的此類數據。受保護的健康保險和個人受保護的數據都是虛構的術語。","src":"OPTv4 第12章"},{"id":"off9-40","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"Jack正在更新他的災難恢復計劃，並希望確保與他的組織簽約的第三方數據中心能夠處理災難中所需的擴展需求。Jack應該與託管提供商簽署什麼類型的協議？","opts":["A resource capacity agreement","A cold-site agreement","An NDA","A business continuity agreement"],"ans":0,"exp":"資源容量協議用於確保在恢復場景中有適當的資源可用。冷站點只有空間和基礎設施，不提供完整的恢復資源。保密協議保護信息，但不能確保資源可用性，業務連續性協議不是CISSP考試中使用的術語。","src":"OPTv4 第12章"},{"id":"off9-41","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"Nora的公司運營服務器的生命週期為五年。根據該流程，當這些服務器達到其使用壽命時，它們將被送往電子垃圾回收商。Nora可以實施以下哪種最有效的控制來確保不會因剩餘數據而發生數據洩露？","opts":["Zero wipe the drives before the servers leave the organization.","Remove the drives and shred them.","Reformat the drives before the servers are sent to the e-waste company.","Require certificates of disposal from the e-waste company."],"ans":1,"exp":"最有效的控制是移除驅動器並粉碎它們，消除服務器留下數據的任何機會。一家可以提供帶有適當合同控制的處置證書的值得信賴的公司可能是一個合理且經濟高效的替代方案，但該公司可能還希望在系統離開之前將驅動器擦除為零，以降低系統脫離回收公司控制的風險。這裡最糟糕的答案是重新格式化，這不會刪除數據。","src":"OPTv4 第12章"},{"id":"off9-42","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"Ed的任務是保護其組織客戶的信息，包括他們的姓名、社會保險號、出生日期和出生地，以及各種其他信息。這種信息被稱為什麼？","opts":["PHI","PII","Personal protected data","PID"],"ans":1,"exp":"個人身份信息(PII)可以用來區分一個人的身份。受保護健康信息(PHI)包括病歷、實驗室結果、保險信息和其他有關患者的詳細信息等數據。個人受保護數據是一個虛構的術語，PID是進程ID的首字母縮寫，是與正在運行的程序或進程相關聯的編號。","src":"OPTv4 第12章"},{"id":"off9-43","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"組織中經常使用CIS基準的目的是什麼？","opts":["Secure coding standards","Performance testing","Baselining","Monitoring metrics"],"ans":2,"exp":"CIS基準是經常用於評估設備和軟件的安全設置或配置的配置基準。基線是配置和驗證系統是否符合安全配置準則或標準的過程。","src":"OPTv4 第12章"},{"id":"off9-44","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"Colleen正在進行一項軟件測試，評估代碼的安全性缺陷和可用性問題。她從最終用戶的角度使用應用程序，並在產品開發過程中引用源代碼。科琳在進行什麼類型的測試？","opts":["White box","Blue box","Gray box","Black box"],"ans":2,"exp":"在灰箱測試中，測試人員從用戶的角度評估軟件，但是在測試過程中可以訪問源代碼。白盒測試也可以訪問源代碼，但是從開發人員的角度來執行測試。黑盒測試從用戶的角度工作，但是不能訪問源代碼。藍盒子是電話竊聽工具，而不是軟件測試技術。注意:隨著語言的變化，零知識、部分知識和全部知識等新術語開始取代白盒、灰盒和黑盒測試術語。","src":"OPTv4 第12章"},{"id":"off9-45","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Marty發現他的組織中的訪問限制允許任何用戶登錄分配給任何其他用戶的工作站，即使他們來自完全不同的部門。這種類型的訪問最直接地違反了哪項信息安全原則？","opts":["Separation of duties","Two-person control","Need to know","Least privilege"],"ans":3,"exp":"這種廣泛的訪問權限可能會間接違反所有列出的安全原則，但它最直接地違反了最低權限，因為它授予了用戶他們的工作職責所不需要的權限。","src":"OPTv4 第12章"},{"id":"off9-46","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"以下哪種調查類型總是使用排除合理懷疑的證據標準？","opts":["Civil investigation","Criminal investigation","Operational investigation","Regulatory investigation"],"ans":1,"exp":"刑事調查事關重大，對罪犯的嚴厲懲罰可能包括監禁。因此，他們使用所有調查中最嚴格的證據標準:排除合理懷疑。民事調查使用優勢證據標準。監管調查可以使用任何適用於證據聽證場所的標準。這可能包括排除合理懷疑標準，但在美國的監管調查中並不總是使用。運營調查不使用證據標準。","src":"OPTv4 第12章"},{"id":"off9-47","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"NIST特別出版物800-92《計算機安全日誌管理指南》描述了日誌管理面臨的四種常見挑戰:\n①　Many log sources\n大量日誌源\n②　Inconsistent log content\n日誌內容不一致\n③　Inconsistent timestamps\n時間戳不一致\n④　Inconsistent log formats\n不一致的日誌格式\nWhich of the following solutions is best suited to solving these issues?\n以下哪種解決方案最適合解決這些問題？","opts":["Implement SNMP for all logging devices.","Implement a SIEM tool.","Standardize the Windows event log format for all devices and use NTP.","Ensure that logging is enabled on all endpoints using their native logging formats and set their local time correctly."],"ans":1,"exp":"安全信息和事件管理(SIEM)工具旨在以多種格式集中來自多個位置的日誌，並確保儘管不同系統和設備之間存在差異，也能讀取和分析日誌。簡單網絡管理協議(SNMP)用於一些日誌消息傳遞，但不是解決所有這些問題的解決方案。儘管使用NTP進行時間同步是一個好主意，但大多數非Windows設備，包括網絡設備等，都不是為使用Windows事件日誌格式而設計的。最後，本地日誌記錄是有用的，但是單獨設置時鐘會導致時間漂移，並且不能解決許多日誌源的問題。","src":"OPTv4 第12章"},{"id":"off9-48","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"Howard是一名安全分析師，與一名經驗豐富的計算機取證調查員合作。調查員要求他檢索一個取證驅動器控制器，但Howard無法在存儲室中找到具有該名稱的設備。取證驅動器控制器的另一個名稱是什麼？","opts":["RAID controller","Write blocker","SCSI terminator","Forensic device analyzer"],"ans":1,"exp":"取證驅動器控制器的主要功能之一是防止發送到設備的任何命令修改存儲在設備上的數據。因此，取證驅動器控制器也經常被稱為寫阻止器。","src":"OPTv4 第12章"},{"id":"off9-49","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"哪種類型的Windows審核記錄描述了操作系統關閉或服務停止之類的事件？","opts":["An application log","A security log","A system log","A setup log"],"ans":2,"exp":"Windows系統日誌包括重新啟動、關機和服務狀態更改。應用程序日誌記錄程序生成的事件，安全日誌跟蹤登錄和權限使用等事件，安裝日誌跟蹤應用程序安裝。","src":"OPTv4 第12章"},{"id":"off9-50","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"Kristen希望為她的數據使用多個處理站點，但不想為整個數據中心付費。如果她希望能夠將部分自定義應用程序環境快速遷移到多個國家的設施，而不必等待發運或購買硬件，你會推薦以下哪個選項作為她的最佳選項？","opts":["A cloud PaaS vendor","A hosted data center provider","A cloud IaaS vendor","A data center vendor that provides rack, power, and remote hands services"],"ans":2,"exp":"雲IaaS供應商將允許Kristen以她能夠部署和支付的速度建立基礎設施。PaaS供應商提供了一個平臺，要求她將自己的定製應用程序遷移到該平臺，這可能比託管數據中心提供商花費的時間更長。一家提供機架、電源和遠程協助的數據中心供應商未能通過測試，因為Kristen希望不必購買或運送硬件。","src":"OPTv4 第12章"},{"id":"off9-51","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"“你所知道的”是什麼類型的認證因素？","opts":["Type 1","Type 2","Type 3","Type 4"],"ans":0,"exp":"類型1身份驗證因素是你所知道的。類型2身份驗證因素是你所擁有的某種東西，如智能卡或硬件令牌。類型3身份驗證因素你所具備的特徵，如生物標識符。不存在第4類身份驗證因素。","src":"OPTv4 第12章"},{"id":"off9-52","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"什麼類型的代碼審查最適合識別業務邏輯缺陷？","opts":["Mutation fuzzing","Manual testing","Generational fuzzing","Interface testing"],"ans":1,"exp":"手動測試使用人類對業務邏輯的理解來評估程序流程和響應。突變或代際模糊將有助於確定程序如何響應預期的輸入，但不會測試業務邏輯。接口測試確保模塊之間的數據交換正常工作，但不關注程序或應用程序的邏輯。","src":"OPTv4 第12章"},{"id":"off9-53","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"Amanda希望在她的應用中使用新用戶已有的Gmail帳戶中的聯繫人。下列選項中的哪個協議用於提供安全的授權訪問？","opts":["Open ID","Kerberos","OAuth","SAML"],"ans":2,"exp":"OAuth專門設計用於提供安全的授權訪問，如允許Amanda的應用程序訪問用戶的Gmail聯繫人，而無需用戶共享其Gmail憑據。它被雲服務廣泛用於此目的。\nOpenID用於使用身份提供商提供的憑據登錄其他服務，例如當你使用Google的ID登錄其他網站或應用時。\nSAML用於身份提供者和服務提供者之間交換認證和授權數據。","src":"OPTv4 第12章"},{"id":"off9-54","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"哪種類型的備用處理設施包含恢復操作所需的硬件，但沒有數據的最新拷貝？","opts":["Hot site","Warm site","Cold site","Mobile site"],"ans":1,"exp":"溫站包含恢復操作所需的硬件，但沒有數據的最新拷貝。","src":"OPTv4 第12章"},{"id":"off9-55","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"Fred需要在不受信任的網絡上的兩臺服務器之間傳輸文件。因為他知道網絡不可信，所以他需要選擇一種加密協議來確保他的數據安全。他應該選擇什麼協議？","opts":["SSH","TCP","SFTP","IPsec"],"ans":2,"exp":"安全文件傳輸協議(SFTP)是專門為加密文件傳輸而設計的。SSH用於安全的命令行訪問，而TCP是常用於通過網絡傳輸數據的互聯網協議包之一。IPsec可用於創建傳輸數據的隧道，但不是專門為文件傳輸而設計的。","src":"OPTv4 第12章"},{"id":"off9-56","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"什麼訪問控制方案標籤主體和客體，並在標籤匹配時允許主體訪問客體？","opts":["DAC","MAC","Rule-based access control (RBAC)","Role-based access control (RBAC)"],"ans":1,"exp":"強制訪問控制(MAC)將標籤應用於主體和客體，並允許主體在標籤匹配時訪問客體。自主訪問控制(DAC)由客體的所有者控制，基於規則的訪問控制(有時稱為Rule-BAC)將規則應用於整個系統，基於角色的訪問控制(有時稱為Role-BAC)將權限基於角色，角色通常作為用戶組來處理。","src":"OPTv4 第12章"},{"id":"off9-57","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"在軟件測試期間，Jack描繪出了黑客可能如何接近他正在審查的應用程序，並確定了黑客可能有什麼要求。然後，他測試系統如何對攻擊者可能的行為做出反應。Jack正在進行什麼類型的測試？","opts":["Misuse case testing","Use-case testing","Hacker use-case testing","Static code analysis"],"ans":0,"exp":"Jack正在進行誤用案例分析，這是一個根據代碼被誤用而不是被正確使用時的表現來測試代碼的過程。用例測試測試有效的用例，而靜態代碼分析包括檢查代碼本身的缺陷，而不是測試實時軟件。黑客用例測試不是一種測試的行業術語。","src":"OPTv4 第12章"},{"id":"off9-59","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"James選擇實施一個NAC解決方案，該方案使用准入後原則來控制網絡連接。嚴格的准入後政策不能處理什麼類型的問題？","opts":["Out-of-band monitoring","Preventing an unpatched laptop from being exploited immediately after connecting to the network","Denying access when user behavior doesn't match an authorization matrix","Allowing a user access to a specific object when user behavior is allowed based on an authorization matrix"],"ans":1,"exp":"准入後原則基於預定義的授權矩陣，基於連接後的用戶活動來允許或拒絕訪問。由於這不會在連接前檢查機器的狀態，因此它不能在連接後立即防止系統被利用。這並不排除帶外或帶內監控，但它確實意味著在系統接入網絡之前，嚴格的准入後策略不會處理系統檢查。","src":"OPTv4 第12章"},{"id":"off9-60","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"Warren想進行內部安全審計。他希望使用一個被廣泛接受的審計框架，這樣他就可以更容易地將結果與其他組織進行比較。他應該選擇以下哪個選項作為他的基本審計框架？","opts":["ITSM","ATT&CK","COBIT","CIS"],"ans":2,"exp":"COBIT，即信息和相關技術的控制目標，框架描述了組織應該為其信息系統制定的通用要求。這是名單上唯一的審計或合規框架。ITSM是信息技術服務管理的縮寫；CIS是信息安全中心，為系統安全提供指導方針，可用於評估系統，但其本身不是審計框架；ATT&CK是一個描述威脅和攻擊方法的框架。","src":"OPTv4 第12章"},{"id":"off9-61","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"Gary工作的公司處理信用卡，並根據信用卡處理的行業標準運營。他的公司需要遵守以下哪項標準？","opts":["ISO27001","FIPS 140","PCI-DSS","ISO 27002"],"ans":2,"exp":"PCI-DSS，即支付卡行業數據安全標準，是Gary的公司需要遵守的行業標準。ISO 27001和27002是信息安全管理標準。FIPS 140是加密模塊的標準。","src":"OPTv4 第12章"},{"id":"off9-62","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"以下哪一個是風險轉移的例子？","opts":["Building a guard shack","Purchasing insurance","Erecting fences","Relocating facilities"],"ans":1,"exp":"風險轉移包括將風險從一方轉移到另一方的行為。購買保險是風險轉移的一個例子，因為它將風險從被保險人轉移到保險公司。","src":"OPTv4 第12章"},{"id":"off9-63","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"Travis擔心他的組織使用Microsoft的BitLocker為系統提供的安全性。如果系統配備了TPM並使用全磁盤加密，根據驅動器的加密狀態，什麼時候系統最不會丟失數據？","opts":["When they are booted up and running because the system monitors for drive access","When the system is shutting down because keys are removed from memory","When they are booting up because the TPM checks for a secure boot process","When they are off because the drive is fully encrypted"],"ans":3,"exp":"當系統關閉且硬盤經過加密且不處於可讀狀態時，硬盤上的文件最為安全。BitLocker在使用時根據需要解密文件，這意味著在系統啟動後的任何時間，文件都可能被訪問，特別是在用戶登錄並獲得對系統的訪問權限或惡意軟件正在運行的情況下。","src":"OPTv4 第12章"},{"id":"off9-64","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Elaine正在為她的組織制定業務連續性計劃。她應該尋求最小化什麼值？","opts":["AV","SSL","RTO","MTO"],"ans":2,"exp":"業務連續性規劃練習的目標是減少恢復運營所需的時間。這可以通過最小化恢復時間目標(RTO)來實現。","src":"OPTv4 第12章"},{"id":"off9-65","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"Jack的數據中心設計要求每個關鍵服務器都有雙電源。在這個設計決策中，他針對的是CIA的哪一部分？","opts":["Confidentiality","Integrity","Availability","None of the above"],"ans":2,"exp":"冗餘是許多可用性設計的一部分。雙電源允許多級可用性支持；它們允許你將服務器連接到不同的電源基礎架構，並在單個電源斷電時提供運行能力。有些服務器甚至設置為使用兩個以上的電源。實現這種可用性的另一種方法是使用更多的系統，而不是對可用性有更大支持的更昂貴的系統。","src":"OPTv4 第12章"},{"id":"off9-66","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"下列關於SDLC的陳述中，哪一項是正確的？","opts":["The SDLC requires the use of an iterative approach to software development.","The SDLC requires the use of a sequential approach to software development.","The SDLC does not include training for end users and support staff.","The waterfall methodology is compatible with the SDLC."],"ans":3,"exp":"SDLC方法包括為支持人員提供操作培訓以及最終用戶培訓的步驟。SDLC可能使用許多開發模型中的一種，包括瀑布模型和螺旋模型。SDLC不要求使用迭代或順序方法；它允許任何一種方法。","src":"OPTv4 第12章"},{"id":"off9-67","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"什麼協議取代了證書撤銷列表並增加了實時狀態驗證？","opts":["RTCP","RTVP","OCSP","CSRTP"],"ans":2,"exp":"在線證書狀態協議(OCSP)通過提供一種實時證書驗證的方法，消除了使用證書吊銷列表固有的延遲。","src":"OPTv4 第12章"},{"id":"off9-68","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"什麼過程使TCP成為面向連接的協議？","opts":["It works via network connections.","It uses a handshake.","It monitors for dropped connections.","It uses a complex header."],"ans":1,"exp":"TCP使用握手過程來建立通信，這使它成為面向連接的協議。TCP不監控斷開的連接，它通過網絡連接工作的事實也不使它面向連接。","src":"OPTv4 第12章"},{"id":"off9-69","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"你正在為你的組織進行定性風險評估。在風險分析中，兩個最重要的風險因素一個是概率，另一個是什麼？","opts":["Likelihood","History","Impact","Cost"],"ans":2,"exp":"定性風險評估的兩個最重要的要素是確定每個風險對組織的概率和影響。可能性是概率的另一種說法。應該考慮成本，但這只是影響的一個因素，還包括聲譽損害、運營中斷和其他不良影響。","src":"OPTv4 第12章"},{"id":"off9-70","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Ben建立了一個訪問控制列表，列出了他的用戶可以訪問的客體。當用戶試圖訪問他們無權訪問的客體時，他們會被拒絕訪問，即使沒有特定的規則禁止這樣做。這種行為的關鍵是什麼訪問控制原則？","opts":["Least privilege","Implicit deny","Explicit deny","Final rule fall-through"],"ans":1,"exp":"隱式拒絕原則聲明，任何未被明確允許的操作都將被拒絕。對於防火牆規則和其他訪問控制系統來說，這是一個重要的概念。實現最小特權可以確保主體只擁有完成工作所需的權限。雖然顯式拒絕和最終規則失敗穿透聽起來像是重要的訪問控制概念，但其實兩者都不是。","src":"OPTv4 第12章"},{"id":"off9-71","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"檢測到危害的平均時間是什麼類型的安全指標？","opts":["MTO","A technical control objective","A compliance objective","A KPI"],"ans":3,"exp":"檢測到危害的平均時間是安全KPI或關鍵性能指標。KPI用於確定實踐、程序和員工的有效性。","src":"OPTv4 第12章"},{"id":"off9-72","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"當考慮潛在的道德違規時，ISC2同行評審委員會可能施加的最高處罰是什麼？","opts":["Revocation of certification","Termination of employment","Financial penalty","Suspension of certification"],"ans":0,"exp":"如果ISC2同行評審委員會發現被認證的個人違反了ISC2道德準則，委員會可以撤銷他們的認證。該委員會不能終止個人就業或評估經濟處罰。","src":"OPTv4 第12章"},{"id":"off9-73","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"Alice向Bob發送了一條消息，並希望確保第三方Mal在傳輸過程中不會讀取消息的內容。愛麗絲試圖達到密碼學的什麼目標？","opts":["Confidentiality","Integrity","Authentication","Nonrepudiation"],"ans":0,"exp":"機密性確保數據在存儲或傳輸過程中不會被未經授權的個人讀取。","src":"OPTv4 第12章"},{"id":"off9-74","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"Chris被指派掃描系統上所有可能的TCP和UDP端口。他必須掃描每種類型的多少個端口才能完成任務？","opts":["65536個TCP端口和32768個UDP端口","1024個通用TCP端口和32768個臨時UDP端口","65536個TCP和65536個UDP端口","16384個TCP端口和16384個UDP端口"],"ans":2,"exp":"TCP和UDP端口號都是16位二進制數，這意味著可以有2的16次方個即65536個端口，編號從0到65535。","src":"OPTv4 第12章"},{"id":"off9-75","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"Harry被阻止閱讀比其安全許可級別更高的文件。什麼安全模型可以防止這種行為？","opts":["Bell–LaPadula","Biba","Clark–Wilson","Brewer–Nash"],"ans":0,"exp":"Bell-lapadula模型包括簡單安全屬性，可防止個人讀取高於個人安全許可級別的機密信息。","src":"OPTv4 第12章"},{"id":"off9-76","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Megan希望確保她的公司正在與之簽訂合同的新軟件即服務提供商能夠確保服務始終正常運行，不會出現中斷。以下哪一項通常是提供這種保證的合同的一部分？","opts":["SLA","RPA","NDA","MOU"],"ans":0,"exp":"服務水平協議(SLA)包含有關如何提供服務、可接受的中斷或停機水平以及在中斷或其他問題的情況下可能存在的補救措施的詳細信息。Megan應確保SLA包含適當的性能保證和懲罰，這些保證和懲罰的幅度足以補償公司的問題，同時激勵服務提供商保持可靠的服務。RPA是機器人流程自動化，一種自動化技術。NDA是一份保密協議，是一份用於幫助控制信息或數據暴露或共享風險的法律文件。MOU是一種諒解備忘錄，當兩個組織希望合作記錄共同的願景或共同的目標時使用。","src":"OPTv4 第12章"},{"id":"off9-77","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"Jen是一家工業生產設施的網絡管理員，她的任務是確保網絡不會受到生產車間運行的大型電機和其他設備的電磁干擾。如果這個問題比安裝的成本和難度更重要，她應該選擇什麼類型的網絡佈線？","opts":["10Base2","100BaseT","1000BaseT","Fiber optic"],"ans":3,"exp":"在某些情況下，光纜比絞合銅纜或同軸電纜更貴，也更難安裝，但它不易受電磁干擾(EMI)的影響。這對於Jen的問題來說是一個很好的解決方案，特別是如果她正在部署EMI加固系統來搭配她的抗EMI網絡電纜。","src":"OPTv4 第12章"},{"id":"off9-78","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"CVE和NVD都提供了什麼信息？","opts":["Vulnerabilities","Markup languages","Vulnerability assessment tools","Penetration testing methodologies"],"ans":0,"exp":"MITRE的常見漏洞和利用(CVE)字典和NIST的國家漏洞數據庫(NVD)都提供了有關漏洞的信息。","src":"OPTv4 第12章"},{"id":"off9-79","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"Ian希望確保他的組織使用適當的安全編碼技術。以下哪一項不是輸入驗證的常見做法？","opts":["Conduct data validation on a trusted system.","Validate data length.","Validate all client-provided data before it is processed.","Convert all data to the same data type."],"ans":3,"exp":"OWASP的安全編碼實踐清單提供了各種各樣的輸入驗證建議，包括在可信系統上進行數據驗證、驗證數據長度、範圍和類型，以及在處理之前驗證所有客戶端提供的數據。將所有數據轉換成相同的數據類型是不可能的，因為大多數程序和應用程序都需要多種數據類型。","src":"OPTv4 第12章"},{"id":"off9-80","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"Michelle希望確保她的公司記錄日誌的時間不會超過需要的時間。她應該制定和實施什麼類型的政策來確保這一點？","opts":["An EOL policy","A data classification policy","An EOS policy","A record retention policy"],"ans":3,"exp":"記錄保留政策用於確定組織保留哪些數據以及保留多長時間。數據保存時間過長會增加組織的風險，但在調查、法律合規性或其他業務目的需要時擁有數據也很重要。EOL(生命終止)和EOS(支持終止)適用於硬件或軟件，而不適用於數據。數據分類策略用於幫助對數據進行分類，這可能會影響數據的保留時間，但分類策略本身通常不會設置保留時限。","src":"OPTv4 第12章"},{"id":"off9-81","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"Mary是一家保險公司的安全風險分析師。她目前正在研究一種情況，由於公司的web應用程序中缺少補丁，黑客可能能夠修改web服務器上目錄的內容。在這種情況下，風險是什麼？","opts":["Unpatched web application","Web defacement","Hacker","Operating system"],"ans":1,"exp":"風險是威脅和漏洞的結合。威脅是尋求破壞安全的外部力量，例如本例中的黑客。漏洞是可能讓威脅得逞的內部弱點。在這種情況下，網頁汙損是風險所在。在這種情況下，如果黑客試圖對未打補丁的服務器(漏洞)進行SQL注入攻擊(威脅)，結果是網站損壞(風險)。","src":"OPTv4 第12章"},{"id":"off9-82","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Andrea希望確保她的虛擬化網絡在虛擬環境之間是安全的。她在所在州的多個地點使用虛擬機群集，這些地點之間有第三方互聯網服務提供商。如果她在這些位置之間運行扁平的第2層網絡，以下哪種解決方案最適合保護她的流量？","opts":["TLS","BGP","IPsec","AES"],"ans":2,"exp":"IPsec VPN將允許Andrea在必要時保持她的網絡作為第2層扁平網絡運行，同時為她想要的流量提供安全性。TLS運行在更高的網絡層，儘管流量可以通過它進行隧道傳輸。BGP是路由協議，AES是加密算法。","src":"OPTv4 第12章"},{"id":"off9-83","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"使用OSI模型時，數據鏈路層使用什麼格式來格式化從堆棧上層收到的消息？","opts":["A data stream","A frame","A segment","A datagram"],"ans":1,"exp":"當消息到達數據鏈路層時，它被稱為幀。數據流存在於應用層、表示層和會話層，而數據段和數據報存在於傳輸層(分別用於TCP和UDP)。","src":"OPTv4 第12章"},{"id":"off9-84","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"Asha的團隊希望確保他們軟件的所有功能都經過測試。他們在確保什麼？","opts":["Proper misuse case testing","That a breach attack simulation is conducted","Complete interface testing","Complete coverage"],"ans":3,"exp":"執行覆蓋分析是為了確保功能、需求或其他元素得到完全測試。問題中沒有描述誤用案例，也沒有描述接口，而且違規攻擊模擬旨在扮演攻擊者的角色，而不是測試所有功能。","src":"OPTv4 第12章"},{"id":"off9-85","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"Sylvia公司的新應用程序允許用戶註冊銀行服務。Sylvia需要找到一種方法來確保用戶就是他們所聲稱的那個人。這個過程叫什麼？","opts":["Proofing","Registration","FIM","Single sign-on"],"ans":0,"exp":"身份證明是驗證聲稱具有身份的實體或個人是他們所聲稱的真實個人或組織的過程。這通常依賴於其他人沒有的額外信息，如文檔或知識。註冊是創建帳戶的過程。FIM是聯合身份管理，SSO允許跨多個系統或服務使用單點登錄。","src":"OPTv4 第12章"},{"id":"off9-86","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"如果你試圖控制無線網絡的信號強度以及可以訪問的位置，應該考慮哪三個重要因素？","opts":["Antenna placement, antenna type, antenna power levels","Antenna design, power levels, use of a captive portal","Antenna placement, antenna design, use of a captive portal","Power levels, antenna placement, FCC minimum strength requirements"],"ans":0,"exp":"天線位置、天線設計和功率水平是決定信號接入位置和可用性的三個重要因素。強制網絡門戶可用於控制用戶登錄，天線設計是天線類型的一部分。FCC確實提供了最大廣播功率指南，但不要求最低功率水平。","src":"OPTv4 第12章"},{"id":"off9-87","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"Xavier的公司一直在使用越來越多的雲服務，他擔心該公司在現有數據中心實施的安全策略在雲中沒有得到遵守。以下哪種解決方案最適合確保將策略應用於所有云服務？","opts":["CIPS","CASB","CSG","CDLP"],"ans":1,"exp":"雲訪問安全代理(CASB)是一種位於內部和雲系統之間的工具，用於監控流量和執行安全策略。這個場景完全符合CASB的設計目的。其他答案都是瞎編的；這些都不是真正的雲安全設備或工具(至少在撰寫本書時是這樣！).","src":"OPTv4 第12章"},{"id":"off9-88","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"按照災難恢復測試類型對業務運營的潛在影響排序，從影響最小的開始，到影響最大的為止。\n① Checklist review\n清單審查\n② Parallel test\n平行測試\n③ Tabletop exercise\n桌面練習\n④ Full interruption test\n完全中斷測試","opts":["①，②，③，④","①，③，②，④","①，③，④，②","②，①，③，④"],"ans":1,"exp":"災難恢復測試類型按對業務的潛在影響從最小到最大的順序排列如下:\n①　Checklist review 清單審查\n②　Tabletop exercise 桌面練習\n③　Parallel test 平行試驗\n④　Full interruption test 完全中斷測試\nChecklist reviews are the least impactful type of exercise because they do not even require a meeting. Each team member reviews the checklist on their own. Tabletop exercises are slightly more impactful because they require bringing together the DR team in the same room. Parallel tests require the activation of alternate processing sites and require significant resources. Full interruption tests are the most impactful type of exercise because they involve shifting operations to the alternate site and could disrupt production activity.\n清單審查是最沒有影響力的一種活動，因為它們甚至不需要開會。每個團隊成員都要自己檢查清單。桌面練習稍微更有影響力，因為它們需要將災難恢復團隊聚集在同一個房間內。並行測試需要激活備用處理站點，並且需要大量資源。完全中斷測試是最具影響力的測試類型，因為它們涉及將操作轉移到備用站點，並且可能會中斷生產活動。","src":"OPTv4 第12章"},{"id":"off9-89","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"Beth的公司使用基於雲的基礎架構，該基礎架構結合使用策略和自動化安全控制來確保安全性。該公司部署了防火牆、終端安全工具和管理功能，以確保每個虛擬系統在上線時都受到保護。哪個術語描述了這種類型的實現？","opts":["Root of trust","Software-defined security","A policy engine","Software-defined networks"],"ans":1,"exp":"軟件定義的安全(SDS)是一種越來越常見的安全方法，它涉及使用軟件解決方案和策略來保護環境，而不是傳統的基於硬件的方法。這種策略允許靈活和動態的安全配置，特別適合雲的可伸縮性。雖然信任根在加密系統中提供了基本的安全元素，但策略引擎通過實施安全策略，有助於SDS和其他框架中的決策制定。軟件定義的網絡側重於通過軟件進行網絡管理，展示了在IT基礎設施中向軟件定義的方法發展的更廣泛趨勢。","src":"OPTv4 第12章"},{"id":"off9-90","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"Susan希望為她的組織建立一個安全意識計劃，但她知道讓員工參與進來很困難。以下哪種技術通常與評估過程中的分數和分值的使用有關？","opts":["Gamification","Phishing testing","Security champions","Social engineering evaluations"],"ans":0,"exp":"遊戲化使用遊戲中的常見組件，如分數、得分和競賽，來吸引參與者參與安全意識計劃。其他答案都沒有一起使用這些，除非他們使用了遊戲化組件。","src":"OPTv4 第12章"},{"id":"off9-91","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"確保數據無法從SSD恢復的最佳方法是什麼？","opts":["Use the built-in erase commands.","Use a random pattern wipe of 1s and 0s.","Physically destroy the drive.","Degauss the drive."],"ans":2,"exp":"物理銷燬驅動器是確保驅動器上沒有殘留數據的最佳方式。固態硬盤是閃存介質，這意味著你無法對其消磁，而隨機模式寫入和內置擦除命令都已被證明是有問題的，因為固態硬盤內置的損耗平衡以及它們處理擦除命令的方式存在差異。","src":"OPTv4 第12章"},{"id":"off9-92","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"Felipe工作的公司已經將他們託管在第三方數據中心的服務器連接到供應商擁有的系統，使用光纖電纜直接連接到它們。這叫什麼？","opts":["Ingress","Peering","East/west","Egress"],"ans":1,"exp":"這是一個對等的例子。對等可以是公共對等、經由網絡連接通過互聯網交換點的連接，或者是直接與主機託管設施中的另一個實體進行的私有對等。入口是進入網絡的流量，出口是離開網絡的流量，東/西是指網絡中同一區域或層的網絡流量。","src":"OPTv4 第12章"},{"id":"off9-93","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"此處顯示的事件響應（IR）流程循環圖中缺少哪個步驟？","opts":["Forensics","Retribution","Recovery","Analysis"],"ans":2,"exp":"CISSP CBK採用六階段流程:檢測、響應、緩解、報告、恢復和補救。此圖缺少恢復步驟。其他標準使用不同的術語或略有差異的過程。","src":"OPTv4 第12章"},{"id":"off9-94","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Val正在使用一種工具來測試她所在組織的軟件，該工具可以模擬攻擊者針對該軟件採取的行動。Val正在進行什麼類型的測試？","opts":["SAST","LAST","DAST","FAST"],"ans":2,"exp":"Val正在進行動態應用安全測試，即DAST。DAST模擬攻擊者對軟件的操作來測試它。SAST審查源代碼以識別漏洞。FAST和LAST不是軟件測試方法或工具。","src":"OPTv4 第12章"},{"id":"off9-96-1","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"Fred的公司在通過蜂窩網絡發送敏感數據時需要考慮哪些安全因素？","opts":["They should use the same requirements as data over any public network.","Cellular provider networks are private networks and should not require special consideration.","Encrypt all traffic to ensure confidentiality.","Require the use of WAP for all data sent from the phone."],"ans":0,"exp":"蜂窩網絡與任何公共網絡都有相同的問題。加密要求應與組織為其他公共網絡(如酒店、會議Wi-Fi和類似場景)選擇的要求相匹配。加密所有數據非常困難，而且會增加開銷，因此除非公司特別要求，否則這不應該是默認答案。WAP是一種過時的無線應用協議，並未廣泛使用；要求它將是困難的。WAP確實提供了TLS，這在使用時會有所幫助。","src":"OPTv4 第12章"},{"id":"off9-96-2","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"Fred打算參加今年的一個大型黑客會議，他需要在會議期間連接到僱主的網絡。當他在會議期間連接到他的移動電話提供商的4G網絡時，他應該做什麼？","opts":["Continue normal usage.","Discontinue all usage; towers can be spoofed.","Only use trusted Wi-Fi networks.","Connect to his company's encrypted VPN service."],"ans":3,"exp":"Fred的最佳選擇是使用加密的可信VPN服務來傳輸他的所有數據使用。可信的Wi-Fi網絡不太可能在黑客會議上存在，正常使用是危險的，因為技術的擴散允許建立假塔，停止所有使用不會支持Fred的業務需求。","src":"OPTv4 第12章"},{"id":"off9-96-3","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"最有可能導致移動電話遠程擦除失敗的情況是什麼？","opts":["The phone has a passcode on it.","The phone cannot contact a network.","The provider has not unlocked the phone.","The phone is in use."],"ans":1,"exp":"遠程擦除工具是一個有用的解決方案，但它們只有在手機可以訪問蜂窩網絡或Wi-Fi網絡的情況下才有效。遠程擦除解決方案旨在擦除手機中的數據，無論手機是否正在使用或是否有密碼。提供商解鎖手機是為了在其他蜂窩網絡上使用，而不是為了擦除或其他功能支持。","src":"OPTv4 第12章"},{"id":"off9-97-1","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"Bethany希望實施一些控制措施，為公司員工提供一個有組織的框架來建議她的團隊將開發的新網站功能。什麼樣的變革管理過程有助於實現這一點？","opts":["Configuration control","Change control","Release control","Request control"],"ans":3,"exp":"請求控制過程提供了一個有組織的框架，在這個框架中，用戶可以請求修改，經理可以進行成本/收益分析，開發人員可以確定任務的優先級。","src":"OPTv4 第12章"},{"id":"off9-97-2","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"Bethany還想創建一個過程來幫助多個開發人員同時處理代碼。什麼樣的變革管理過程有助於實現這一點？","opts":["Configuration control","Change control","Release control","Request control"],"ans":1,"exp":"變更控制提供了一個有組織的框架，在將解決方案推廣到生產環境之前，多個開發人員可以在其中創建和測試解決方案。","src":"OPTv4 第12章"},{"id":"off9-97-3","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Bethany正在和她的同事一起進行用戶接受度測試。什麼樣的變更管理流程包含此任務？","opts":["Configuration control","Change control","Release control","Request control"],"ans":2,"exp":"發佈控制包括驗收測試，以確保對最終用戶工作任務的任何更改都被理解並發揮作用。","src":"OPTv4 第12章"},{"id":"off9-97-4","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"Bethany注意到，當系統管理員在沒有通知開發人員的情況下更新庫時，會出現一些問題。什麼樣的變更管理流程可以幫助解決這個問題？","opts":["Configuration control","Change control","Release control","Request control"],"ans":0,"exp":"配置控制確保軟件版本的變更符合變更控制和配置管理流程。根據這些政策，只能通過授權的發行版進行更新。","src":"OPTv4 第12章"},{"id":"off9-98-1","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"Tara應該首先對服務器應用什麼備份？","opts":["Sunday's full backup","Monday's differential backup","Tuesday's differential backup","Wednesday's differential backup"],"ans":0,"exp":"Tara首先必須達到系統基線。為此，她將最新的完整備份應用到新系統。這是週日的完整備份。一旦Tara建立了這個基準，她就可以繼續應用差異備份，將系統恢復到更新的狀態。","src":"OPTv4 第12章"},{"id":"off9-98-2","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"Tara總共必須向系統應用多少備份才能使其包含的數據儘可能最新？","opts":["1","2","3","4"],"ans":1,"exp":"為了儘可能將系統恢復到最新狀態，Tara必須首先應用週日的完整備份。然後，她可以應用從星期三中午開始的最新差異備份。差異備份包括自最近一次完全備份以來更改過的所有文件，因此星期三備份的內容涵蓋了星期一和星期二備份中包含的所有數據，所以這種情況下不涉及星期一和星期二的備份文件。","src":"OPTv4 第12章"},{"id":"off9-98-3","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"在這種備份方法中，一些數據可能會不可挽回地丟失。在多長時間段內，所做的任何更改都會丟失？","opts":["3 hours.","5 hours.","8 hours.","No data will be lost."],"ans":0,"exp":"在這種情況下，差異備份是在中午進行的，而服務器在下午3點出現故障。因此，在星期三中午到下午3點之間修改或創建的任何數據都不會包含在任何備份中，並且會不可挽回地丟失。","src":"OPTv4 第12章"},{"id":"off9-98-4","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"如果Tara遵循相同的時間表，但將差異備份切換為增量備份，她總共需要向系統應用多少次備份才能使系統包含的數據儘可能最新？","opts":["1","2","3","4"],"ans":3,"exp":"通過從差異備份切換到增量備份，Tara的工作日備份將只包含自前一天以來更改過的信息。因此，她必須應用所有可用的增量備份。她將從恢復星期日的完整備份開始，然後應用星期一、星期二和星期三的增量備份。","src":"OPTv4 第12章"},{"id":"off9-98-5","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"如果Tara將差異備份更改為增量備份，並且我們假設每天更改的信息量相同，則以下哪個文件最大？","opts":["Monday's incremental backup.","Tuesday's incremental backup.","Wednesday's incremental backup.","All three will be the same size."],"ans":3,"exp":"每個增量備份僅包含自最近一次完整或增量備份以來更改過的信息。如果我們假設每天更改的信息量相同，則每個增量備份的大小將大致相同。","src":"OPTv4 第12章"},{"id":"off9-99-1","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"Ben的公司正在考慮將他們的系統配置為在圖中A點所示的級別工作。他們把敏感度設置到什麼水平了？","opts":["FRR","FAR","CER","CFR"],"ans":2,"exp":"交叉錯誤率(CER)是錯誤接受率(FAR)和錯誤拒絕率(FRR)的交叉點，是用於比較生物識別設備準確性的標準評估。","src":"OPTv4 第12章"},{"id":"off9-99-2","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"在B點，有可能出現什麼問題？","opts":["False acceptance will be very high.","False rejection will be very high.","False rejection will be very low.","False acceptance will be very low."],"ans":0,"exp":"在B點，錯誤接受率(FAR)相當高，而錯誤拒絕率(FRR)相對較低。在某些情況下，這可能是可以接受的，但是在錯誤的接受會導致重大問題的組織中，很可能他們應該選擇點a右邊的點。","src":"OPTv4 第12章"},{"id":"off9-99-3","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"如果此圖中顯示的FAR和FRR不能為其組織的需求提供可接受的性能水平，Ben應該怎麼做？","opts":["Adjust the sensitivity of the biometric devices.","Assess other biometric systems to compare them.","Move the CER.","Adjust the FRR settings in the software."],"ans":1,"exp":"CER是用於評估生物識別設備的標準。如果該設備的CER不符合組織的需求，Ben應該評估其他生物識別系統，以找到一個CER更低的系統。敏感性已經在CER的圖表中考慮到了，移動CER不是Ben能做的事。FRR不是軟件中的一個設置，所以Ben也不能把它作為一個選項。","src":"OPTv4 第12章"},{"id":"off9-100-1","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"如果客戶端已經向KDC進行了身份驗證，那麼當客戶端工作站想要訪問資源時，在A點向KDC發送什麼呢？","opts":["It resends the password.","A TGR.","Its TGT.","A service ticket."],"ans":2,"exp":"客戶端將其現有的有效TGT發送到KDC，並請求訪問該資源。","src":"OPTv4 第12章"},{"id":"off9-100-2","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"步驟A和B之間發生了什麼？","opts":["The KDC verifies the validity of the TGT and whether the user has the right privileges for the requested resource.","The KDC updates its access control list based on the data in the TGT.","The KDC checks its service listing and prepares an updated TGT based on the service request.","The KDC generates a service ticket to issue to the client."],"ans":0,"exp":"KDC必須驗證TGT是否有效，以及用戶是否有訪問其請求訪問的服務的權限。如果是，它生成一個服務票據並將其發送給客戶端(步驟B)。","src":"OPTv4 第12章"},{"id":"off9-100-3","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"被訪問的服務使用哪個或哪些系統來驗證票證？","opts":["KDC.","The client workstation and the KDC.","The client workstation supplies it in the form of a client-to-server ticket and an authenticator.","KVS."],"ans":2,"exp":"當客戶端連接到服務服務器(SS)時，它會發送以下兩條消息:\n①　The client-to-server ticket, encrypted using the service's secret key\n使用服務的秘密密鑰加密的客戶端到服務器的票證\n②　A new authenticator, including the client ID and timestamp that is encrypted using the client-server session key\n新的身份驗證器，包括使用客戶端-服務器會話密鑰加密的客戶端ID和時間戳\nThe server or service that is being accessed receives all of the data it needs in the service ticket. To do so, the client uses a client-to-server ticket received from the ticket granting service.\n被訪問的服務器或服務在服務票據中接收它需要的所有數據。為此，客戶端使用從票據授予服務接收的客戶端到服務器的票據。","src":"OPTv4 第12章"},{"id":"off9-101","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"Ian想評估他公司的新SaaS供應商的安全性。他最有可能使用以下哪個選項來評估主要雲提供商的安全性？","opts":["Run a vulnerability scan against the provider's external services.","Request a SOC 2 Type II report.","Run a vulnerability scan against the provider's internal systems.","Request a SOC 1 Type II report."],"ans":1,"exp":"Ian的最佳選擇是SOC報告，SOC2 Type II報告將評估安全控制及其隨時間的應用，告訴他組織是否負責任地維護他們的安全工作。SOC1報告著眼於財務控制，而I類報告只著眼於控制是如何描述的，而不是它們在一段時間內的應用。Ian不太可能被允許對主要提供商的內部或外部基礎架構運行漏洞掃描。","src":"OPTv4 第12章"},{"id":"off9-102","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"Henry的公司部署了廣泛的物聯網基礎設施用於建築物監控，包括環境控制、佔用傳感器和各種其他傳感器和控制器，以幫助管理建築物。在Henry對物聯網部署的分析中，他應該報告以下哪些安全問題是最關鍵的？","opts":["The lack of local storage space for security logs that is common to IoT devices.","The IoT devices may not have a separate administrative interface, allowing anybody on the same network to attempt to log into them and making brute-force attacks possible.","The IoT devices may not support strong encryption for communications, exposing the log and sensor data to interception on the network.","The long-term support and patching model for the IoT devices may create security and operational risks for the organization."],"ans":3,"exp":"Henry最擔心的應該是物聯網設備的長期安全性和可支持性。隨著這些設備越來越多地嵌入到建築物和基礎設施中，理解支持模式和安全模式非常重要。通過將物聯網設備放置在專用子網或網絡上，防止其他用戶直接訪問設備，可以解決缺乏單獨管理訪問和缺乏強加密的問題。這將有助於限制風險，而無需過多的費用或複雜性，並且是一種常見的做法。最後，存儲空間的缺乏可能是一個問題，但在考慮物聯網設備可能帶來的風險時，這不是最重要的問題。","src":"OPTv4 第12章"},{"id":"off9-103","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"Sharon想進行一次密碼攻擊。以下哪一項不是攻擊獲取NTLM哈希的常用手段？","opts":["Dumping the system's SAM","Dumping credentials from active memory","Capturing network traffic","Downloading the hashes from a third-party site"],"ans":3,"exp":"哈希傳遞攻擊(PtH)通常依賴於轉儲的本地帳戶數據庫(SAM ),在憑據傳輸過程中從網絡或活動內存中捕獲憑據。傳遞散列攻擊通常不是通過從第三方站點下載散列來進行的。","src":"OPTv4 第12章"},{"id":"off9-104","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"Tammy正在為她的組織選擇災難恢復設施。她希望選擇一家能夠平衡恢復運營所需時間和相關成本的工廠。她應該選擇什麼類型的設施？","opts":["Hot site","Warm site","Cold site","Red site"],"ans":1,"exp":"Tammy應該選擇一個溫站。這種類型的設施滿足了她在成本和恢復時間之間取得良好平衡的要求。它比熱站便宜，但比冷站有利於更快的恢復。紅站不是一種災難恢復設施。","src":"OPTv4 第12章"},{"id":"off9-105","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"Isaac希望使用無連接協議來傳輸數據，因為他需要優化傳輸速度而不是可靠性。他應該選擇哪種協議？","opts":["ICMP","TCP","UDP","SNMP"],"ans":2,"exp":"UDP(用戶數據報協議)是一種無連接、盡力而為的協議，通常在快速發送數據時使用，不需要對糾錯、檢測或流量控制等可靠性功能有很高的要求。TCP是面向連接的，提供這些和其他可靠性特性。互聯網控制消息協議ICMP用於檢查路由和路徑以及可用性，但在正常情況下不用於重要的數據傳輸。SNMP是一種網絡管理監控協議。","src":"OPTv4 第12章"},{"id":"off9-106","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"Kyle希望確保其組織的備份得到安全存儲，以防發生自然災害或其他事件。如果他需要存儲備份磁帶，他應該選擇什麼類型的解決方案？","opts":["A cloud backup service","A hot site","A media storage facility","A BaaS provider"],"ans":2,"exp":"當組織希望在安全、溫度受控的設施中安全地存儲磁帶等備份時，通常會使用介質存儲設施。雲服務不用於物理備份介質；熱站點是用來恢復操作的，不是用來存儲備份介質的；BaaS是備份即服務（雲備份服務的另一種描述）。","src":"OPTv4 第12章"},{"id":"off9-107","ch":9,"level":"9-4","tag":"官方模擬","diff":3,"q":"Norm希望為他的組織進行一次災難恢復測試，並希望選擇最徹底的測試類型，因為他意識到這可能會造成很大的干擾。Norm應該選擇什麼類型的測試？","opts":["Full interruption test","Parallel test","Tabletop exercise","Checklist review"],"ans":0,"exp":"在完全中斷測試期間，團隊關閉主站點，並確認災難恢復站點能夠處理常規操作。完全中斷測試是最徹底的測試，但也是最具破壞性的。在並行測試過程中，團隊實際上激活了災難恢復站點進行測試，但是主站點保持運行。清單審查是破壞性最小的災難恢復測試。在核對表審核過程中，團隊成員各自審核災難恢復核對表的內容，並提出任何必要的更改建議。在桌面練習中，團隊成員走到一起，在不對信息系統進行任何更改的情況下完成一個場景。","src":"OPTv4 第12章"},{"id":"off9-108","ch":9,"level":"9-5","tag":"官方模擬","diff":3,"q":"OSI模型的哪一層與數據報相關聯？","opts":["Session","Transport","Network","Data Link"],"ans":1,"exp":"當數據到達傳輸層時，它以數據段(TCP)或數據報(UDP)的形式發送。在傳輸層之上，數據成為數據流，而在傳輸層之下，數據在網絡層被轉換為數據包，在數據鏈路層被轉換為幀，在物理層被轉換為比特。","src":"OPTv4 第12章"},{"id":"off9-109","ch":9,"level":"9-6","tag":"官方模擬","diff":3,"q":"以下哪項技術提供了一個功能接口，允許開發人員在不瞭解系統實現細節的情況下直接與系統進行交互？","opts":["Data dictionary","Object model","Source code","API"],"ans":3,"exp":"應用程序編程接口(API)允許開發人員為其他用戶創建一個直接的方法，通過一個不需要了解實現細節的抽象來與他們的系統進行交互。對客體模型、源代碼和數據字典的訪問也間接促進了交互，但這是以向其他開發人員提供實現細節的方式進行的。","src":"OPTv4 第12章"},{"id":"off9-110","ch":9,"level":"9-1","tag":"官方模擬","diff":3,"q":"根據歐盟通用數據保護法規，以下哪一項操作不是必需的？","opts":["Organizations must allow individuals to opt out of information sharing.","Organizations must provide individuals with lists of employees with access to information.","Organizations must use proper mechanisms to protect data against unauthorized disclosure.","Organizations must have a dispute resolution process for privacy issues."],"ans":1,"exp":"《歐盟通用數據保護條例》不要求組織向個人提供員工名單。","src":"OPTv4 第12章"},{"id":"off9-111","ch":9,"level":"9-2","tag":"官方模擬","diff":3,"q":"Ed正在構建一個支持IPv6的網絡，但需要將其連接到IPv4網絡。Ed應該在網絡之間放置什麼類型的設備？","opts":["A switch","A router","A bridge","A gateway"],"ans":3,"exp":"Ed的最佳選擇是安裝一個IPv6到IPv4網關，該網關可以轉換網絡之間的流量。網橋適用於不同類型的網絡，而如果網絡相似，路由器就有意義了。一個現代的交換機可能能夠承載這兩種類型的流量，但在兩種協議之間的轉換上幫助不大。","src":"OPTv4 第12章"},{"id":"off9-112","ch":9,"level":"9-3","tag":"官方模擬","diff":3,"q":"以下哪一項不是高級加密標準的有效密鑰長度？","opts":["128 bits","192 bits","256 bits","384 bits"],"ans":3,"exp":"高級加密標準AES支持使用128位密鑰、192位密鑰和256位密鑰進行加密。","src":"OPTv4 第12章"}]</script>

function weightOf(q){const m=S.wrong[q.id]||0;const d=q.diff||2;return (1+Math.min(m,3)*1.6)*(1+0.22*(d-2))}
function pick(pool,n){
  const items=pool.map(q=>({q,w:weightOf(q)}));const out=[];
  while(out.length<n&&items.length){
    let tot=items.reduce((a,b)=>a+b.w,0),r=Math.random()*tot,k=0;
    for(let i=0;i<items.length;i++){r-=items[i].w;if(r<=0){k=i;break}}
    out.push(items.splice(k,1)[0].q);
  }
  return out;
}
function rollItem(){
  const w=rarityW(B.currentLevel?L(B.currentLevel).ch:1);
  const ownedIds=new Set(S.items);
  const pool=ITEMS.filter(i=>!ownedIds.has(i.id)&&(i.rarity!=='X'||eggOn()));
  if(!pool.length)return null;
  const tot=pool.reduce((a,i)=>a+w[i.rarity],0);let r=Math.random()*tot;
  for(const it of pool){r-=w[it.rarity];if(r<=0)return it}
  return pool[0];
}
function rollOffers(n, ch){
  const out=[];const used=new Set(S.items);
  for(let k=0;k<n;k++){
    const w=rarityW(ch||1);
    const pool=ITEMS.filter(i=>!used.has(i.id)&&(i.rarity!=='X'||eggOn()));
    if(!pool.length)break;
    const tot=pool.reduce((a,i)=>a+w[i.rarity],0);let r=Math.random()*tot;let sel=pool[0];
    for(const it of pool){r-=w[it.rarity];if(r<=0){sel=it;break}}
    out.push(sel.id);used.add(sel.id);
  }
  return out;
}

/* ================= 計分 ================= */
function calcScore(idx){
  let flat=10,mult=1,critC=critBase(),critM=critMultOf(),cScale=0;
  const combo=B.combo;
  for(const it of owned()){
    flat+=it.flat||0;
    if(it.goldFlat)flat+=Math.min(it.goldFlat.cap||99,Math.floor(S.gold/it.goldFlat.per));
    if(it.comboPer)flat+=Math.min(it.comboPer,combo);
    if(it.lateFlat&&idx>=3)flat+=it.lateFlat;
    if(it.comboMin&&combo>=it.comboMin)flat+=it.comboFlat||0;
    if(it.comboMult&&combo>=it.comboMin)mult*=it.comboMult;
    if(it.firstMult&&idx===0)mult*=it.firstMult;
    if(it.lastMult&&idx===B.qs.length-1)mult*=it.lastMult;
    if(it.posMult&&it.posMult[idx+1])mult*=it.posMult[idx+1];
    if(it.mult)mult*=it.mult;
    if(it.clutchMult&&B.hp<=1)mult*=it.clutchMult;              // 逆轉牌：殘血時放大
    if(it.behindFlat&&B.target&&B.score<B.target)flat+=it.behindFlat; // 追分筆記：落後時補分
    if(it.allInMult)mult*=it.allInMult;                        // 孤注一擲：大乘區，代價在 answer()
    if(it.lastAllIn&&idx===B.qs.length-1)mult*=it.lastAllIn;   // 最後通牒：最後一題加倍
    cScale+=it.comboScale||0;
  }
  let streak=1+0.25*(combo-1)+cScale*(combo-1);
  if(streak>4)streak=4; // 連擊倍率上限，跨關累積時防止數值失控
  const crit=Math.random()<critC;
  let v=Math.round(flat*streak*mult*(crit?critM:1));
  // 血債：暴擊吃紅利，沒爆就吞懲罰
  let bloodPen=false;
  if(!crit){for(const it of owned())if(it.nonCritPenalty){v=Math.round(v*it.nonCritPenalty);bloodPen=true}}
  // 賭徒硬幣：純隨機，25% 三倍、25% 歸零
  let gamble='';
  if(owned().some(x=>x.gamble)){
    const g=Math.random();
    if(g<0.25){v*=3;gamble='win'}
    else if(g<0.5){v=0;gamble='lose'}
  }
  if(B.qs[idx]&&B.qs[idx].__re)v=Math.round(v*0.5); // 錯題回流的題目只給半分
  return {v,crit,gamble,bloodPen};
}

function termsIn(q){
  const text=q.q+' '+q.opts.join(' ');
  const re=/\b[A-Z][A-Za-z0-9]{1,7}\b/g;
  const out=[],seen=new Set();let m;
  while((m=re.exec(text))){const t=m[0];if(DICT[t]&&!seen.has(t)){seen.add(t);out.push(t)}}
  return out;
}
function dictPrice(){
  const base=2+((B&&B.dictUses)||0);

}
function lookup(){
  if(!B||!B.qs)return;
  const q=B.qs[B.i];const terms=termsIn(q);
  if(!terms.length){alert('本題題面和選項裡沒有收錄的縮寫。');return}
  const price=dictPrice();
  if(S.gold<price){alert(`金幣不夠，查一次要 ${price} 金幣。`);return}
  S.gold-=price;B.dictUses=(B.dictUses||0)+1;
  B.dictTerms=terms;B.dictOpen=true;
  B.dictThis=(B.dictThis||[]).concat(terms.filter(t=>!(B.dictThis||[]).includes(t)));
  terms.forEach(t=>{S.glossary[t]=(S.glossary[t]||0)+1});
  save();render();
}

  if(B&&B.deadline&&(screen==='battle'||screen==='mock'))startTimer();
}
function startTimer(){
  clearInterval(timer);timer=setInterval(()=>{
    if(!B){clearInterval(timer);return}
    const el=document.getElementById('timer');
    const left=B.deadline?B.deadline-Date.now():null;
    let show=left;
    if(B.qDeadline)show=left===null?B.qDeadline-Date.now():Math.min(left,B.qDeadline-Date.now());
    if(el&&show!==null)el.textContent=fmt(show);
    // 限時詞條：單題超時直接判錯
    if(B.qDeadline&&B.sel===null&&Date.now()>B.qDeadline){answer(-1,true);return}
    if(left!==null&&left<=0){clearInterval(timer);if(B.mode==='mock')mockSubmit();else{B.hp=0;finishBattle()}}
  },250);
}

/* ================= 流程 ================= */
function startLevel(id){
  const l=L(id);const pool=poolOf(id);
  if(!pool.length){alert('這個關卡還沒有題目');return}
  const myMax=cappedHp();
  const od=sumOwned('overdraft');
  if(od){S.gold+=od;save()} // 透支卡：先預支，失敗再賠
  B={mode:'level',currentLevel:id,qs:pick(pool,6),i:0,hp:myMax,maxhp:myMax,target:l.target,
     score:0,combo:(S.combo||0),correct:0,sel:null,elim:[],hints:sumOwned('hints'),shieldLeft:sumOwned('shield'),
     skips:sumOwned('skips'),dictUses:0,dictThis:[],
     reviveLeft:owned().some(x=>x.revive)?1:0,gain:0,crit:false,
     mods:[],reflow:true,reflowed:new Set(),keepLeft:sumOwned('keepCombo'),flash:0,note:'',
     overdraft:od?10:0};
  screen='battle';render();
}
function startBoss(ch){
  const c=CHS.find(x=>x.n===ch);const pool=poolCh(ch);
  const myMax=cappedHp();
  const extra=owned().some(x=>x.bossTime)?300:0;
  const mods=(c.bossMods||[]).slice();
  const amnesia=mods.includes('amnesia');
  const od=sumOwned('overdraft');
  if(od){S.gold+=od;save()}
  B={mode:'boss',currentLevel:levelsOf(ch).slice(-1)[0].id,ch,qs:pick(pool,20),i:0,hp:myMax,maxhp:myMax,
     target:c.bossTarget,score:0,combo:(S.combo||0),correct:0,sel:null,elim:[],
     hints:amnesia?0:sumOwned('hints'),
     shieldLeft:sumOwned('shield'),skips:sumOwned('skips'),dictUses:0,dictThis:[],
     reviveLeft:owned().some(x=>x.revive)?1:0,gain:0,crit:false,
     mods,reflow:false,reflowed:new Set(),keepLeft:sumOwned('keepCombo'),flash:0,note:'',
     overdraft:od?10:0,
     qDeadline:mods.includes('pressure')?Date.now()+45000:0,
     deadline:Date.now()+(15*60+extra)*1000};
  screen='battle';render();
}
function answer(idx,timedOut){
  if(!B||B.sel!==null)return;
  if(idx>=0&&B.elim.includes(idx))return;
  const q=B.qs[B.i];
  const leftMs=B.qDeadline?Math.max(0,B.qDeadline-Date.now()):0;
  B.qDeadline=0;
  B.sel=timedOut?-1:idx;B.gain=0;B.crit=false;B.dmg=0;B.note='';S.tot.q++;
  const won=!timedOut&&idx===q.ans;
  if(won){
    const before=tierOf(B.combo);
    B.correct++;S.tot.c++;B.combo++;
    const r=calcScore(B.i);B.gain=r.v;B.crit=r.crit;B.score+=r.v;
    S.gold+=sumOwned('goldPerCorrect');
    if(r.gamble==='win')B.note='賭徒硬幣：骰中了，這題 ×3';
    else if(r.gamble==='lose')B.note='賭徒硬幣：這次空了，這題 0 分';
    if(r.bloodPen)B.note=(B.note?B.note+'　':'')+'血債：沒爆擊，這題只算 60%';
    // 限時詞條：剩餘秒數折算加分
    if(hasMod('pressure')){
      const sec=Math.round(leftMs/1000),bonus=sec*2;
      if(bonus>0){B.gain+=bonus;B.score+=bonus;
        B.note=(B.note?B.note+'　':'')+`限時獎勵 +${bonus} 分（剩 ${sec} 秒）`}
    }
    // 三連夾：連擊每到 N 的倍數觸發
    for(const it of owned()){
      if(it.streakAt&&B.combo>0&&B.combo%it.streakAt===0){
        B.gain+=it.streakVal;B.score+=it.streakVal;
        B.note=(B.note?B.note+'　':'')+`${it.name} 發動 +${it.streakVal} 分（連擊 ${B.combo}）`;
      }
    }
    const after=tierOf(B.combo);
    if(after>before)B.flash=after; // 跨過連擊檔位 → 全屏提示
    if(B.mode==='review'&&S.wrong[q.id]){S.wrong[q.id]--;if(S.wrong[q.id]<=0)delete S.wrong[q.id]}
  }else{
    if(!timedOut)S.wrong[q.id]=(S.wrong[q.id]||0)+1;
    B.dmg=(B.combo||0)>=6?2:1;
    if(sumOwned('wrongDmg2'))B.dmg=2; // 孤注一擲：不管連擊，失誤就是 2 點
    // 0x1028：連擊永遠不會斷
    if(sumOwned('keepComboAlways')){
      B.note='0x1028：連擊沒有斷';
    }
    // 活頁夾：答錯時保住連擊（仍扣血）
    else if(B.keepLeft>0&&B.combo>0){
      B.keepLeft--;B.note=`活頁夾發動：連擊 ${B.combo} 保住了（剩 ${B.keepLeft} 次）`;
    }else B.combo=0;
    if(hasMod('interfere')){
      const pen=Math.round(B.target*0.08);
      B.score=Math.max(0,B.score-pen);B.dmg=0;
      B.note=(B.note?B.note+'　':'')+`干擾：扣 ${pen} 分，不扣血`;
    }else if(B.reviveLeft>0&&B.hp<=1){
      B.hp=Math.max(1,B.hp-1);B.reviveLeft--;B.dmg=0;
    }else if(B.shieldLeft>0){
      B.shieldLeft--;B.dmg=0;
    }else B.hp-=B.dmg;
    // 最後通牒：最後一題答錯直接判負（要在回流之前判斷，回流會改變長度）
    if(B.mode!=='review'&&sumOwned('lastAllIn')&&B.i===B.qs.length-1){
      B.hp=0;
      B.note=(B.note?B.note+'　':'')+'最後通牒：最後一題答錯，本關直接失敗';
    }
    // 錯題回流：本關結束前要再見一次，答對只給半分
    if(B.reflow&&!q.__re&&!B.reflowed.has(q.id)&&!timedOut){
      B.reflowed.add(q.id);
      B.qs.push(Object.assign({},q,{__re:1}));
    }
  }
  if(B.mode!=='review')S.combo=B.combo;
  save();render();
}
function useHint(){
  if(!B||B.hints<=0||B.sel!==null)return;
  const q=B.qs[B.i];
  const wrongs=q.opts.map((_,i)=>i).filter(i=>i!==q.ans&&!B.elim.includes(i));
  if(!wrongs.length)return;
  B.elim.push(wrongs[Math.floor(Math.random()*wrongs.length)]);
  B.hints--;render();
}
function skipQ(){
  if(!B||B.sel!==null||B.skips<=0)return;
  B.skips--;B.i++;B.sel=null;B.gain=0;B.note='';
  B.qDeadline=hasMod('pressure')?Date.now()+45000:0;
  if(B.i>=B.qs.length){finishBattle();return}
  render();
}
function nextQ(){
  if(!B||B.sel===null)return;
  B.i++;B.sel=null;B.gain=0;B.note='';
  if(B.hp<=0||B.i>=B.qs.length){
    if(B.mode==='review'){B=null;screen='review';render();return}
    finishBattle();return}
  B.qDeadline=hasMod('pressure')?Date.now()+45000:0;
  render();
}
function finishBattle(){
  clearInterval(timer);
  const total=B.qs.length;
  if(B.mode==='review'){B=null;screen='review';render();return}
  const pass=B.score>=B.target&&B.hp>0;
  const ch=B.mode==='boss'?B.ch:L(B.currentLevel).ch;
  if(!pass){
    let refund=0;
    if(B.mode==='level'||B.mode==='boss'){refund=sumOwned('failRefund')}
    if(refund){S.gold+=refund}
    let penalty=0;
    if(B.overdraft){penalty=Math.min(S.gold,B.overdraft);S.gold-=penalty} // 透支卡：失敗要賠
    S.combo=0; // 關卡失敗，連擊斷
    B.result={score:B.score,target:B.target,correct:B.correct,total,refund,penalty};
    B.hp=Math.max(0,B.hp);save();screen='fail';render();return;
  }
  const ratio=B.score/B.target;
  let goldGain=4+B.hp*2+(ratio>=1.3?2:0)+sumOwned('endGold')+B.hp*sumOwned('hpToGold');
  if(B.mode==='boss')goldGain+=8;
  S.gold+=goldGain;
  if(B.mode==='level'){
    const stars=ratio>=1.4?3:ratio>=1.15?2:1;
    S.stars[B.currentLevel]=Math.max(starsOf(B.currentLevel),stars);
  }else{
    S.boss[B.ch]=1;
  }
  save();
  S.pending={offers:rollOffers(3+(owned().some(x=>x.rewardExtra)?1:0), currentCh()),goldGain};
  screen='reward';render();
}
function openShop(){
  const offers=rollOffers(3+sumOwned('shopSlots'), currentCh());
  // 優惠券鉤子：進店時隨機一件商品半價
  const halfIdx=(offers.length&&owned().some(x=>x.shopCoupon))?Math.floor(Math.random()*offers.length):-1;
  S.shop={offers,rerollCost:2,halfIdx};
  screen='shop';render();
}

  if(v==='10281028'){cheatErr='';screen='cheat';render();}

function cheatJump(id,boss){
  const isBoss=boss==='1';
  let gold, chNum;
  if(isBoss){
    const c=CHS.find(x=>x.n===+id);
    if(!c)return;
    gold=cheatGold({target:c.bossTarget});
    chNum=c.n;
  }else{
    const lv=L(id);
    if(!lv)return;
    gold=cheatGold(lv);
    chNum=lv.ch;
  }
  S.gold+=gold;
  S.cheat={offers:rollOffers(3+sumOwned('shopSlots'), chNum),rerolls:5,buys:0,levelId:id,boss:isBoss,ch:chNum};
  save();screen='cheatshop';render();
}
function cheatBuy(k){
  const ch=S.cheat;if(!ch)return;
  if(ch.buys>=5){alert('作弊商店最多買 5 件');return}
  const id=ch.offers[k];if(!id)return;
  if(S.items.length>=SLOTS){alert('道具欄已滿，先賣一個');return}
  const it=ITEMS.find(i=>i.id===id);
  const p=Math.max(1,Math.round(it.price*(1-shopDisc())));
  if(S.gold<p){alert('金幣不夠');return}
  S.gold-=p;S.items.push(id);ch.buys++;ch.offers.splice(k,1);save();render();
}
function cheatReroll(){
  const ch=S.cheat;if(!ch||ch.rerolls<=0)return;
  ch.rerolls--;ch.offers=rollOffers(3+sumOwned('shopSlots'), ch.ch||1);save();render();
}
function cheatLeave(){
  const ch=S.cheat;if(!ch)return;
  const boss=ch.boss,levelId=ch.levelId;
  S.cheat=null;save();
  if(boss)startBoss(+levelId);else startLevel(levelId);
}

function shopPrice(it,half){
  const disc=shopDisc();
  const p=Math.max(1,Math.round(it.price*(1-disc)));
  return half?Math.max(1,Math.floor(p/2)):p;
}
function buyItem(k){
  const sh=S.shop;if(!sh)return;
  const id=sh.offers[k];if(!id)return;
  const it=ITEMS.find(i=>i.id===id);
  if(S.items.length>=SLOTS){alert('道具欄已滿，先賣一個');return}
  const p=shopPrice(it,k===sh.halfIdx);
  if(S.gold<p){alert('金幣不夠');return}
  S.gold-=p;S.items.push(id);sh.offers.splice(k,1);
  if(sh.halfIdx===k)sh.halfIdx=-1;else if(sh.halfIdx>k)sh.halfIdx--;
  save();render();
}
function reroll(){
  const sh=S.shop;if(!sh)return;
  const cost=Math.round(sh.rerollCost*(1-shopDisc()));
  if(S.gold<cost){alert('金幣不夠');return}
  S.gold-=cost;
  const offers=rollOffers(3+sumOwned('shopSlots'), currentCh());
  sh.offers=offers;sh.rerollCost+=1;
  sh.halfIdx=(offers.length&&owned().some(x=>x.shopCoupon))?Math.floor(Math.random()*offers.length):-1;
  save();render();
}
function sellItem(k){
  if(!S.items[k])return;
  const it=ITEMS.find(i=>i.id===S.items[k]);
  const back=Math.max(1,Math.floor(it.price/2));
  S.items.splice(k,1);S.gold+=back;save();render();
}
function pickOffer(id){
  if(S.items.length>=SLOTS){alert('道具欄已滿，先賣一個');return}
  S.items.push(id);save();openShop();
}
function skipOffer(){S.gold+=4;save();openShop();}
function startMock(){
  const qs=pick(BANK,Math.min(100,BANK.length));
  B={mode:'mock',qs,i:0,answers:new Array(qs.length).fill(null),deadline:Date.now()+180*60*1000};
  screen='mock';render();
}
function mockAns(idx){B.answers[B.i]=idx;render()}
function mockNext(){if(B.i<B.qs.length-1)B.i++;render()}
function mockPrev(){if(B.i>0)B.i--;render()}
function mockSubmit(){
  clearInterval(timer);
  let correct=0;B.qs.forEach((q,i)=>{if(B.answers[i]===q.ans)correct++});
  const score=Math.round(correct/B.qs.length*1000);
  const pass=score>=700;if(pass)S.mockPass++;
  S.best=Math.max(S.best,score);S.tot.q+=B.qs.length;S.tot.c+=correct;save();
  B.result={correct,score,pass};screen='mockresult';render();
}
function resetAll(){
  if(!confirm('清空所有進度（導入的題庫會保留）？'))return;
  S=fresh();save();screen='menu';render();
}
function importBank(text){
  let data;try{data=JSON.parse(text)}catch(e){alert('JSON 解析失敗：'+e.message);return}
  if(!Array.isArray(data)){alert('需要一個數組');return}
  const ok=data.filter(d=>d&&d.id&&d.q&&Array.isArray(d.opts)&&d.opts.length===4&&Number.isInteger(d.ans)&&d.level);
  if(!ok.length){alert('沒有合法題目');return}
  ok.forEach(d=>{d.ch=d.ch||Number(String(d.level)[0]);d.src=d.src||'導入'});
  const custom=loadCustom().filter(x=>!ok.some(y=>y.id===x.id)).concat(ok);
  try{localStorage.setItem(CKEY,JSON.stringify(custom))}catch(err){alert('題庫太大，存不下：'+err.message);return}
  BANK=BASE.concat(custom);
  alert(`導入 ${ok.length} 題，當前題庫 ${BANK.length} 題`);
  screen='menu';render();
}

/* ================= 交互 ================= */
document.addEventListener('click',e=>{
  // 標題連點五下 → 隱藏入口（累計計數，觸發後歸零）
  if(screen==='menu'&&e.target.closest('.logo')){
    logoTaps++;
    if(logoTaps>=5){logoTaps=0;openCheatLogin();}
    return;
  }
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='map'){screen='map';render()}
  else if(act==='menu'){screen='menu';render()}
  else if(act==='cards'){screen='cards';render()}
  else if(act==='codex'){screen='codex';render()}
  else if(act==='egg-ack'){S.eggNew=false;save();render()}
  else if(act==='review'){screen='review';render()}
  else if(act==='review-run'){
    const ids=wrongIds();const qs=pick(ids.map(id=>BANK.find(q=>q.id===id)),Math.min(10,ids.length));
    B={mode:'review',qs,i:0,hp:99,maxhp:99,target:0,score:0,combo:0,correct:0,sel:null,elim:[],hints:0,
       shieldLeft:0,reviveLeft:0,dictUses:0,dictThis:[],gain:0,crit:false};
    screen='battle';render();
  }
  else if(act==='import'){screen='import';render()}
  else if(act==='reset'){resetAll()}
  else if(act==='intro'){B={currentLevel:el.dataset.id};screen='intro';render()}
  else if(act==='start'){startLevel(B.currentLevel)}
  else if(act==='opt'){answer(+el.dataset.i)}
  else if(act==='hint'){useHint()}
  else if(act==='skipq'){skipQ()}
  else if(act==='dict'){lookup()}
  else if(act==='dict-close'){B.dictOpen=false;render()}
  else if(act==='next'){nextQ()}
  else if(act==='flee'){clearInterval(timer);screen='map';B=null;render()}
  else if(act==='retry'){B.sel=null;if(B.mode==='boss')startBoss(B.ch);else startLevel(B.currentLevel)}
  else if(act==='boss'){startBoss(+el.dataset.ch)}
  else if(act==='pick'){pickOffer(el.dataset.id)}
  else if(act==='skip'){skipOffer()}
  else if(act==='buy'){buyItem(+el.dataset.k)}
  else if(act==='reroll'){reroll()}
  else if(act==='leave'){screen='map';render()}
  else if(act==='sell'){sellItem(+el.dataset.k)}
  else if(act==='mock'){startMock()}
  else if(act==='mopt'){mockAns(+el.dataset.i)}
  else if(act==='mock-next'){if(B.i===B.qs.length-1)mockSubmit();else mockNext()}
  else if(act==='mock-prev'){mockPrev()}
  else if(act==='mock-submit'){if(confirm('確定交卷？'))mockSubmit()}
  else if(act==='import-text'){importBank(document.getElementById('importbox').value)}
  else if(act==='import-file'){document.getElementById('filein').click()}
  else if(act==='cheat-login'){tryCheatLogin()}
  else if(act==='cheat-jump'){cheatJump(el.dataset.id,el.dataset.boss)}
  else if(act==='cheat-buy'){cheatBuy(+el.dataset.k)}
  else if(act==='cheat-reroll'){cheatReroll()}
  else if(act==='cheat-leave'){cheatLeave()}
});
document.getElementById('filein').addEventListener('change',ev=>{
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>importBank(r.result);r.readAsText(f,'utf-8');
});
document.addEventListener('keydown',e=>{
  if(screen==='cheatlogin'&&e.key==='Enter'){e.preventDefault();tryCheatLogin();return}
  if(screen==='battle'){
    if(B&&B.sel!==null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nextQ()}
    else if(/^[1-4]$/.test(e.key))answer(+e.key-1);
  }else if(screen==='mock'&&/^[1-4]$/.test(e.key)){mockAns(+e.key-1)}
});
render();
</script>
