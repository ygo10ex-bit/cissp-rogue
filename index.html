  <div class="small">擁有過一次就會記錄下來，賣掉不影響收集進度。</div>`;
  for(const r of ['C','U','R','X']){
    const list=ITEMS.filter(i=>i.rarity===r);
    if(!list.length)continue;
    const unlocked=r!=='X'||S.egg;
    const cnt=r==='X'?(S.egg?'已開啟':'未解鎖'):`${list.filter(i=>S.dex&&S.dex[i.id]).length}/${list.length}`;
    h+=`<div class="chap"><h3>${RARITY[r]}</h3><div class="w">${cnt}</div></div><div class="codex">`;
    for(const it of list){
      const has=r==='X'?S.egg:!!(S.dex&&S.dex[it.id]);
      h+=`<div class="cx ${it.rarity} ${has?'':'lock'}">
        <div class="cn">${has?esc(it.name):'???'}<span class="cr">${RARITY[it.rarity]}</span></div>
        <div class="cd">${has?esc(it.desc):(r==='X'?'集齊全部道具後解鎖':'尚未獲得')}</div>
        ${has?`<div class="cp">💰${it.price}</div>`:''}</div>`;
    }
    h+=`</div>`;
  }
  if(S.egg){
    h+=`<div class="card eggbox"><h4>彩蛋已開啟</h4>
      <div class="small">彩蛋道具已進入商店與過關獎勵的抽取池（權重比傳說更低）。它不會出現在圖鑑的收集進度裡——抽不到是正常的。</div></div>`;
  }else{
    h+=`<div class="card"><h4>彩蛋</h4><div class="small">集齊 ${total} 件道具後，商店與獎勵會開始出現一件圖鑑上沒有的東西。</div></div>`;
  }
  return h+`<div class="row"><button class="btn small ghost" data-act="menu">← 返回主菜單</button></div>`;
}
function viewImport(){
  return `<div class="hdr"><div class="logo" style="font-size:22px">導入題庫</div><div class="tagline">把官方題庫轉成 JSON 後粘進來</div></div>
  <div class="panel"><div class="small">每題字段：<br><code>id, ch, level, tag, diff, q, opts[4], ans(0-3), exp, src</code><br>
  level 用 <code>1-1</code>…<code>3-6</code>；同 id 會覆蓋舊題。</div>
  <textarea id="importbox" placeholder='[{"id":"x-001","ch":3,"level":"3-5","tag":"密碼","diff":3,"q":"題幹","opts":["A","B","C","D"],"ans":1,"exp":"解析","src":"官方題庫"}]'></textarea>
  <div class="row"><button class="btn primary small" data-act="import-text">粘貼導入</button>
    <button class="btn small" data-act="import-file">選擇 JSON 文件</button>
    <button class="btn small ghost" data-act="menu">返回</button></div>
  <div class="small" style="margin-top:10px">文件會存進瀏覽器本地。</div></div>`;
}

/* ================= 流程 ================= */
function startLevel(id){
  const l=L(id);const pool=poolOf(id);
  if(!pool.length){alert('這個關卡還沒有題目');return}
  const myMax=cappedHp();
  const od=sumOwned('overdraft');
  if(od){S.gold+=od;save()} // 透支卡：先預支，失敗再賠
  B={mode:'level',currentLevel:id,qs:pick(pool,6),i:0,hp:myMax,maxhp:myMax,target:l.target,
     score:0,combo:(S.combo||0),correct:0,sel:null,elim:[],hints:sumOwned('hints'),shieldLeft:sumOwned('shield'),
     skips:sumOwned('skips'),dictUses:0,dictThis:[],
     reviveLeft:owned().some(x=>x.revive)?1:0,gain:0,crit:false,
     mods:[],reflow:true,reflowed:new Set(),keepLeft:sumOwned('keepCombo'),flash:0,note:'',
     overdraft:od?10:0};
  screen='battle';render();
}
function startBoss(ch){
  const c=CHS.find(x=>x.n===ch);const pool=poolCh(ch);
  const myMax=cappedHp();
  const extra=owned().some(x=>x.bossTime)?300:0;
  const mods=(c.bossMods||[]).slice();
  const amnesia=mods.includes('amnesia');
  const od=sumOwned('overdraft');
  if(od){S.gold+=od;save()}
  B={mode:'boss',currentLevel:levelsOf(ch).slice(-1)[0].id,ch,qs:pick(pool,20),i:0,hp:myMax,maxhp:myMax,
     target:c.bossTarget,score:0,combo:(S.combo||0),correct:0,sel:null,elim:[],
     hints:amnesia?0:sumOwned('hints'),
     shieldLeft:sumOwned('shield'),skips:sumOwned('skips'),dictUses:0,dictThis:[],
     reviveLeft:owned().some(x=>x.revive)?1:0,gain:0,crit:false,
     mods,reflow:false,reflowed:new Set(),keepLeft:sumOwned('keepCombo'),flash:0,note:'',
     overdraft:od?10:0,
     qDeadline:mods.includes('pressure')?Date.now()+45000:0,
     deadline:Date.now()+(15*60+extra)*1000};
  screen='battle';render();
}
function answer(idx,timedOut){
  if(!B||B.sel!==null)return;
  if(idx>=0&&B.elim.includes(idx))return;
  const q=B.qs[B.i];
  const leftMs=B.qDeadline?Math.max(0,B.qDeadline-Date.now()):0;
  B.qDeadline=0;
  B.sel=timedOut?-1:idx;B.gain=0;B.crit=false;B.dmg=0;B.note='';S.tot.q++;
  const won=!timedOut&&idx===q.ans;
  if(won){
    const before=tierOf(B.combo);
    B.correct++;S.tot.c++;B.combo++;
    const r=calcScore(B.i);B.gain=r.v;B.crit=r.crit;B.score+=r.v;
    S.gold+=sumOwned('goldPerCorrect');
    if(r.gamble==='win')B.note='賭徒硬幣：骰中了，這題 ×3';
    else if(r.gamble==='lose')B.note='賭徒硬幣：這次空了，這題 0 分';
    if(r.bloodPen)B.note=(B.note?B.note+'　':'')+'血債：沒爆擊，這題只算 60%';
    // 限時詞條：剩餘秒數折算加分
    if(hasMod('pressure')){
      const sec=Math.round(leftMs/1000),bonus=sec*2;
      if(bonus>0){B.gain+=bonus;B.score+=bonus;
        B.note=(B.note?B.note+'　':'')+`限時獎勵 +${bonus} 分（剩 ${sec} 秒）`}
    }
    // 三連夾：連擊每到 N 的倍數觸發
    for(const it of owned()){
      if(it.streakAt&&B.combo>0&&B.combo%it.streakAt===0){
        B.gain+=it.streakVal;B.score+=it.streakVal;
        B.note=(B.note?B.note+'　':'')+`${it.name} 發動 +${it.streakVal} 分（連擊 ${B.combo}）`;
      }
    }
    const after=tierOf(B.combo);
    if(after>before)B.flash=after; // 跨過連擊檔位 → 全屏提示
    if(B.mode==='review'&&S.wrong[q.id]){S.wrong[q.id]--;if(S.wrong[q.id]<=0)delete S.wrong[q.id]}
  }else{
    if(!timedOut)S.wrong[q.id]=(S.wrong[q.id]||0)+1;
    B.dmg=(B.combo||0)>=6?2:1;
    if(sumOwned('wrongDmg2'))B.dmg=2; // 孤注一擲：不管連擊，失誤就是 2 點
    // 0x1028：連擊永遠不會斷
    if(sumOwned('keepComboAlways')){
      B.note='0x1028：連擊沒有斷';
    }
    // 活頁夾：答錯時保住連擊（仍扣血）
    else if(B.keepLeft>0&&B.combo>0){
      B.keepLeft--;B.note=`活頁夾發動：連擊 ${B.combo} 保住了（剩 ${B.keepLeft} 次）`;
    }else B.combo=0;
    if(hasMod('interfere')){
      const pen=Math.round(B.target*0.08);
      B.score=Math.max(0,B.score-pen);B.dmg=0;
      B.note=(B.note?B.note+'　':'')+`干擾：扣 ${pen} 分，不扣血`;
    }else if(B.reviveLeft>0&&B.hp<=1){
      B.hp=Math.max(1,B.hp-1);B.reviveLeft--;B.dmg=0;
    }else if(B.shieldLeft>0){
      B.shieldLeft--;B.dmg=0;
    }else B.hp-=B.dmg;
    // 最後通牒：最後一題答錯直接判負（要在回流之前判斷，回流會改變長度）
    if(B.mode!=='review'&&sumOwned('lastAllIn')&&B.i===B.qs.length-1){
      B.hp=0;
      B.note=(B.note?B.note+'　':'')+'最後通牒：最後一題答錯，本關直接失敗';
    }
    // 錯題回流：本關結束前要再見一次，答對只給半分
    if(B.reflow&&!q.__re&&!B.reflowed.has(q.id)&&!timedOut){
      B.reflowed.add(q.id);
      B.qs.push(Object.assign({},q,{__re:1}));
    }
  }
  if(B.mode!=='review')S.combo=B.combo;
  save();render();
}
function useHint(){
  if(!B||B.hints<=0||B.sel!==null)return;
  const q=B.qs[B.i];
  const wrongs=q.opts.map((_,i)=>i).filter(i=>i!==q.ans&&!B.elim.includes(i));
  if(!wrongs.length)return;
  B.elim.push(wrongs[Math.floor(Math.random()*wrongs.length)]);
  B.hints--;render();
}
function skipQ(){
  if(!B||B.sel!==null||B.skips<=0)return;
  B.skips--;B.i++;B.sel=null;B.gain=0;B.note='';
  B.qDeadline=hasMod('pressure')?Date.now()+45000:0;
  if(B.i>=B.qs.length){finishBattle();return}
  render();
}
function nextQ(){
  if(!B||B.sel===null)return;
  B.i++;B.sel=null;B.gain=0;B.note='';
  if(B.hp<=0||B.i>=B.qs.length){
    if(B.mode==='review'){B=null;screen='review';render();return}
    finishBattle();return}
  B.qDeadline=hasMod('pressure')?Date.now()+45000:0;
  render();
}
function finishBattle(){
  clearInterval(timer);
  const total=B.qs.length;
  if(B.mode==='review'){B=null;screen='review';render();return}
  const pass=B.score>=B.target&&B.hp>0;
  const ch=B.mode==='boss'?B.ch:L(B.currentLevel).ch;
  if(!pass){
    let refund=0;
    if(B.mode==='level'||B.mode==='boss'){refund=sumOwned('failRefund')}
    if(refund){S.gold+=refund}
    let penalty=0;
    if(B.overdraft){penalty=Math.min(S.gold,B.overdraft);S.gold-=penalty} // 透支卡：失敗要賠
    S.combo=0; // 關卡失敗，連擊斷
    B.result={score:B.score,target:B.target,correct:B.correct,total,refund,penalty};
    B.hp=Math.max(0,B.hp);save();screen='fail';render();return;
  }
  const ratio=B.score/B.target;
  let goldGain=4+B.hp*2+(ratio>=1.3?2:0)+sumOwned('endGold')+B.hp*sumOwned('hpToGold');
  if(B.mode==='boss')goldGain+=8;
  S.gold+=goldGain;
  if(B.mode==='level'){
    const stars=ratio>=1.4?3:ratio>=1.15?2:1;
    S.stars[B.currentLevel]=Math.max(starsOf(B.currentLevel),stars);
  }else{
    S.boss[B.ch]=1;
  }
  save();
  S.pending={offers:rollOffers(3+(owned().some(x=>x.rewardExtra)?1:0), currentCh()),goldGain};
  screen='reward';render();
}
function openShop(){
  const offers=rollOffers(3+sumOwned('shopSlots'), currentCh());
  // 優惠券鉤子：進店時隨機一件商品半價
  const halfIdx=(offers.length&&owned().some(x=>x.shopCoupon))?Math.floor(Math.random()*offers.length):-1;
  S.shop={offers,rerollCost:2,halfIdx};
  screen='shop';render();
}

/* ===== 作弊模式邏輯 ===== */
function cheatGold(level){
  // 略低於正常一關收入（正常約 10–12 金幣），讓作弊跳關不划算
  return 7+Math.floor((level.target||0)/120);
}
function openCheatLogin(){
  cheatErr='';screen='cheatlogin';render();
}
function tryCheatLogin(){
  const box=document.getElementById('passbox');
  const v=box?box.value.replace(/\s/g,''):'';
  if(v==='10281028'){cheatErr='';screen='cheat';render();}
  else{cheatErr='密碼錯誤';render();}
}
function cheatJump(id,boss){
  const isBoss=boss==='1';
  let gold, chNum;
  if(isBoss){
    const c=CHS.find(x=>x.n===+id);
    if(!c)return;
    gold=cheatGold({target:c.bossTarget});
    chNum=c.n;
  }else{
    const lv=L(id);
    if(!lv)return;
    gold=cheatGold(lv);
    chNum=lv.ch;
  }
  S.gold+=gold;
  S.cheat={offers:rollOffers(3+sumOwned('shopSlots'), chNum),rerolls:5,buys:0,levelId:id,boss:isBoss,ch:chNum};
  save();screen='cheatshop';render();
}
function cheatBuy(k){
  const ch=S.cheat;if(!ch)return;
  if(ch.buys>=5){alert('作弊商店最多買 5 件');return}
  const id=ch.offers[k];if(!id)return;
  if(S.items.length>=SLOTS){alert('道具欄已滿，先賣一個');return}
  const it=ITEMS.find(i=>i.id===id);
  const p=Math.max(1,Math.round(it.price*(1-shopDisc())));
  if(S.gold<p){alert('金幣不夠');return}
  S.gold-=p;S.items.push(id);ch.buys++;ch.offers.splice(k,1);save();render();
}
function cheatReroll(){
  const ch=S.cheat;if(!ch||ch.rerolls<=0)return;
  ch.rerolls--;ch.offers=rollOffers(3+sumOwned('shopSlots'), ch.ch||1);save();render();
}
function cheatLeave(){
  const ch=S.cheat;if(!ch)return;
  const boss=ch.boss,levelId=ch.levelId;
  S.cheat=null;save();
  if(boss)startBoss(+levelId);else startLevel(levelId);
}

function shopPrice(it,half){
  const disc=shopDisc();
  const p=Math.max(1,Math.round(it.price*(1-disc)));
  return half?Math.max(1,Math.floor(p/2)):p;
}
function buyItem(k){
  const sh=S.shop;if(!sh)return;
  const id=sh.offers[k];if(!id)return;
  const it=ITEMS.find(i=>i.id===id);
  if(S.items.length>=SLOTS){alert('道具欄已滿，先賣一個');return}
  const p=shopPrice(it,k===sh.halfIdx);
  if(S.gold<p){alert('金幣不夠');return}
  S.gold-=p;S.items.push(id);sh.offers.splice(k,1);
  if(sh.halfIdx===k)sh.halfIdx=-1;else if(sh.halfIdx>k)sh.halfIdx--;
  save();render();
}
function reroll(){
  const sh=S.shop;if(!sh)return;
  const cost=Math.round(sh.rerollCost*(1-shopDisc()));
  if(S.gold<cost){alert('金幣不夠');return}
  S.gold-=cost;
  const offers=rollOffers(3+sumOwned('shopSlots'), currentCh());
  sh.offers=offers;sh.rerollCost+=1;
  sh.halfIdx=(offers.length&&owned().some(x=>x.shopCoupon))?Math.floor(Math.random()*offers.length):-1;
  save();render();
}
function sellItem(k){
  if(!S.items[k])return;
  const it=ITEMS.find(i=>i.id===S.items[k]);
  const back=Math.max(1,Math.floor(it.price/2));
  S.items.splice(k,1);S.gold+=back;save();render();
}
function pickOffer(id){
  if(S.items.length>=SLOTS){alert('道具欄已滿，先賣一個');return}
  S.items.push(id);save();openShop();
}
function skipOffer(){S.gold+=4;save();openShop();}
function startMock(){
  const qs=pick(BANK,Math.min(100,BANK.length));
  B={mode:'mock',qs,i:0,answers:new Array(qs.length).fill(null),deadline:Date.now()+180*60*1000};
  screen='mock';render();
}
function mockAns(idx){B.answers[B.i]=idx;render()}
function mockNext(){if(B.i<B.qs.length-1)B.i++;render()}
function mockPrev(){if(B.i>0)B.i--;render()}
function mockSubmit(){
  clearInterval(timer);
  let correct=0;B.qs.forEach((q,i)=>{if(B.answers[i]===q.ans)correct++});
  const score=Math.round(correct/B.qs.length*1000);
  const pass=score>=700;if(pass)S.mockPass++;
  S.best=Math.max(S.best,score);S.tot.q+=B.qs.length;S.tot.c+=correct;save();
  B.result={correct,score,pass};screen='mockresult';render();
}
function resetAll(){
  if(!confirm('清空所有進度（導入的題庫會保留）？'))return;
  S=fresh();save();screen='menu';render();
}
function importBank(text){
  let data;try{data=JSON.parse(text)}catch(e){alert('JSON 解析失敗：'+e.message);return}
  if(!Array.isArray(data)){alert('需要一個數組');return}
  const ok=data.filter(d=>d&&d.id&&d.q&&Array.isArray(d.opts)&&d.opts.length===4&&Number.isInteger(d.ans)&&d.level);
  if(!ok.length){alert('沒有合法題目');return}
  ok.forEach(d=>{d.ch=d.ch||Number(String(d.level)[0]);d.src=d.src||'導入'});
  const custom=loadCustom().filter(x=>!ok.some(y=>y.id===x.id)).concat(ok);
  try{localStorage.setItem(CKEY,JSON.stringify(custom))}catch(err){alert('題庫太大，存不下：'+err.message);return}
  BANK=BASE.concat(custom);
  alert(`導入 ${ok.length} 題，當前題庫 ${BANK.length} 題`);
  screen='menu';render();
}

/* ================= 交互 ================= */
document.addEventListener('click',e=>{
  // 標題連點五下 → 隱藏入口（累計計數，觸發後歸零）
  if(screen==='menu'&&e.target.closest('.logo')){
    logoTaps++;
    if(logoTaps>=5){logoTaps=0;openCheatLogin();}
    return;
  }
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='map'){screen='map';render()}
  else if(act==='menu'){screen='menu';render()}
  else if(act==='cards'){screen='cards';render()}
  else if(act==='codex'){screen='codex';render()}
  else if(act==='egg-ack'){S.eggNew=false;save();render()}
  else if(act==='review'){screen='review';render()}
  else if(act==='review-run'){
    const ids=wrongIds();const qs=pick(ids.map(id=>BANK.find(q=>q.id===id)),Math.min(10,ids.length));
    B={mode:'review',qs,i:0,hp:99,maxhp:99,target:0,score:0,combo:0,correct:0,sel:null,elim:[],hints:0,
       shieldLeft:0,reviveLeft:0,dictUses:0,dictThis:[],gain:0,crit:false};
    screen='battle';render();
  }
  else if(act==='import'){screen='import';render()}
  else if(act==='reset'){resetAll()}
  else if(act==='intro'){B={currentLevel:el.dataset.id};screen='intro';render()}
  else if(act==='start'){startLevel(B.currentLevel)}
  else if(act==='opt'){answer(+el.dataset.i)}
  else if(act==='hint'){useHint()}
  else if(act==='skipq'){skipQ()}
  else if(act==='dict'){lookup()}
  else if(act==='dict-close'){B.dictOpen=false;render()}
  else if(act==='next'){nextQ()}
  else if(act==='flee'){clearInterval(timer);screen='map';B=null;render()}
  else if(act==='retry'){B.sel=null;if(B.mode==='boss')startBoss(B.ch);else startLevel(B.currentLevel)}
  else if(act==='boss'){startBoss(+el.dataset.ch)}
  else if(act==='pick'){pickOffer(el.dataset.id)}
  else if(act==='skip'){skipOffer()}
  else if(act==='buy'){buyItem(+el.dataset.k)}
  else if(act==='reroll'){reroll()}
  else if(act==='leave'){screen='map';render()}
  else if(act==='sell'){sellItem(+el.dataset.k)}
  else if(act==='mock'){startMock()}
  else if(act==='mopt'){mockAns(+el.dataset.i)}
  else if(act==='mock-next'){if(B.i===B.qs.length-1)mockSubmit();else mockNext()}
  else if(act==='mock-prev'){mockPrev()}
  else if(act==='mock-submit'){if(confirm('確定交卷？'))mockSubmit()}
  else if(act==='import-text'){importBank(document.getElementById('importbox').value)}
  else if(act==='import-file'){document.getElementById('filein').click()}
  else if(act==='cheat-login'){tryCheatLogin()}
  else if(act==='cheat-jump'){cheatJump(el.dataset.id,el.dataset.boss)}
  else if(act==='cheat-buy'){cheatBuy(+el.dataset.k)}
  else if(act==='cheat-reroll'){cheatReroll()}
  else if(act==='cheat-leave'){cheatLeave()}
});
document.getElementById('filein').addEventListener('change',ev=>{
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>importBank(r.result);r.readAsText(f,'utf-8');
});
document.addEventListener('keydown',e=>{
  if(screen==='cheatlogin'&&e.key==='Enter'){e.preventDefault();tryCheatLogin();return}
  if(screen==='battle'){
    if(B&&B.sel!==null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();nextQ()}
    else if(/^[1-4]$/.test(e.key))answer(+e.key-1);
  }else if(screen==='mock'&&/^[1-4]$/.test(e.key)){mockAns(+e.key-1)}
});
render();
</script>
