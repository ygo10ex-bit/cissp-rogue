<script id="structure" type="application/json">{"chapters":[{"n":1,"name":"第一章 安全與風險管理","weight":16,"bossTarget":600,"bossMods":["interfere"]},{"n":2,"name":"第二章 資產安全","weight":10,"bossTarget":800,"bossMods":["amnesia"]},{"n":3,"name":"第三章 安全架構與工程","weight":13,"bossTarget":1000,"bossMods":["pressure"]},{"n":4,"name":"第四章 官方綜合模擬","weight":0,"bossTarget":1100,"bossMods":["interfere","pressure"]}],"levels":[{"id":"1-1","ch":1,"name":"CIA 三要素與安全原則","target":45,"card":["CIA：機密性（加密/權限）、完整性（哈希/備份）、可用性（冗餘/備份）","DAD 是反面：洩露、篡改、破壞","不可否認必須靠非對稱+哈希（數字簽名），對稱加密做不到","三原則：縱深防禦、最小權限、需知原則"],"trap":"數字簽名不提供機密性"},{"id":"1-2","ch":1,"name":"治理與政策體系","target":55,"card":["治理＝高層定方向、擔最終責任；管理＝執行","政策四層：Policy 強制寬泛 → Standard 強制具體 → Procedure 強制步驟 → Guideline 僅建議","數據 Owner 定分類與訪問授權，Custodian 負責執行","審計要獨立，向董事會/審計委員會彙報"],"trap":"四層裡只有 Guideline 是非強制"},{"id":"1-3","ch":1,"name":"風險管理與計算","target":65,"card":["資產/威脅/脆弱性/風險/暴露/控制，六件套","SLE = AV × EF；ALE = SLE × ARO","控制划算：ALE 降幅 > 控制年成本","處置四法：緩解、轉移（保險/外包）、規避（不做）、接受","控制：預防/檢測/糾正/威懾/補償/恢復/指令"],"trap":"沒有「消除風險」這個選項"},{"id":"1-4","ch":1,"name":"業務連續性與審計","target":75,"card":["BCP 管業務，DRP 管 IT，DRP 隸屬 BCP；IR 管事件響應","BIA 產出 MTD（最多停多久）、RTO（多久恢復）、RPO（丟多少數據）","站點：熱（可立即接管）/溫（部分）/冷（只有場地）","演練由輕到重：通讀→走查→桌面推演→模擬→平行→完全中斷"],"trap":"RTO ≤ MTD；RPO 是數據量不是時間"},{"id":"1-5","ch":1,"name":"法規、倫理與人員安全","target":85,"card":["倫理四條順序：保護社會 → 榮譽誠實公正 → 為委託人勤勉 → 推進專業","公共利益 > 僱主利益","離職當天立即禁用賬號；輪崗+強制休假用於暴露舞弊","意識（知道）/培訓（會做）/教育（專精）"],"trap":"PCI DSS 是合同標準，不是法律"},{"id":"2-1","ch":2,"name":"生命週期與分類分級","target":130,"card":["生命週期：獲取 → 使用 → 存儲 → 處置（中間可拆共享、歸檔）","商業分類：機密 Confidential > 隱私 Private > 敏感 Sensitive > 公開 Public","軍事分類：絕密 > 秘密 > 機密 > 敏感但未分類 > 未分類","分類由數據所有者定，要定期複審、適時降密"],"trap":"Confidential 在兩套體系裡位置不同"},{"id":"2-2","ch":2,"name":"責任分層與角色","target":150,"card":["數據所有者 Owner：業務負責人，定分類與訪問授權","數據保管者 Custodian：IT 執行保護措施，不決定誰能看","系統所有者對系統負責；安全管理員負責實施；主管對下屬訪問負責","變更控制分析員審批變更、評估變更風險"],"trap":"Owner 定「誰能看」，Custodian 管「怎麼保護」"},{"id":"2-3","ch":2,"name":"保留策略與電子發現","target":170,"card":["保留三問：保留什麼、保留多久、怎麼組織（分類/索引）","保留期限取法律、合同、業務需求中最長的","訴訟保留 Legal Hold 立即凍結刪除；eDiscovery 依賴可檢索索引","到期要安全銷燬並留記錄"],"trap":"留太久同樣是風險"},{"id":"2-4","ch":2,"name":"隱私與數據殘留","target":190,"card":["刪除 ≠ 銷燬；數據殘留指刪除/覆寫後仍留在介質上的數據","覆寫（磁介質）、消磁（只對磁介質）、加密擦除（SSD/雲）、物理銷燬","隱私：最小化、目的限制、控制者 vs 處理者","介質退役要留證：誰、何時、怎麼銷燬"],"trap":"SSD 不能消磁"},{"id":"2-5","ch":2,"name":"資產保護與 DLP","target":210,"card":["靜態數據：加密；傳輸中：TLS/IPsec/VPN；使用中：TEE/HSM/防截屏","DLP：網絡 DLP（出口流量）、端點 DLP（終端操作）、混合","DLP 有效的前提是數據分類","移動設備：MDM/遠程擦除；紙質：上鎖、碎紙、簽收"],"trap":"不做分類的 DLP 只會產生誤報"},{"id":"3-1","ch":3,"name":"系統架構與操作系統","target":260,"card":["Ring 0 內核態 ↔ Ring 3 用戶態；進程隔離、內存保護","微內核：內核小、隔離強、性能略低","Hypervisor：Type 1 裸金屬（ESXi）/ Type 2 宿主型（VirtualBox）","容器共享宿主內核，隔離弱於虛擬機"],"trap":"容器不等於輕量虛擬機"},{"id":"3-2","ch":3,"name":"TCB、評估與認證","target":295,"card":["TCB＝所有安全相關機制的集合；越小越可評估","引用監控器三特性：始終被調用、不可繞過、可驗證","安全內核是引用監控器的實現；安全邊界是 TCB 的邊界","認證（技術評估）在前，認可（管理批准）在後；CC 的 EAL1–7"],"trap":"先認證，後認可"},{"id":"3-3","ch":3,"name":"安全模型","target":330,"card":["BLP（機密性）：簡單安全規則「不上讀」，星屬性「不下寫」","Biba（完整性）：簡單完整性「不下讀」，星完整性「不上寫」","Clark-Wilson：良構事務 + 職責分離，面向商業完整性","中文牆 Brewer-Nash 解決利益衝突；HRU 安全性不可判定"],"trap":"BLP 不解決完整性；兩組規則正好鏡像"},{"id":"3-4","ch":3,"name":"分佈式系統與雲","target":365,"card":["聚合（拼數據）vs 推理（由結果推結論）；對策：單元抑制、噪聲擾動、分隔","雲服務 IaaS → PaaS → SaaS，客戶責任遞減","共享責任：雲商管「雲的安全」，客戶管「雲裡的安全」","ICS/SCADA：可用性與安全運行優先，協議老舊、生命週期長"],"trap":"SaaS 責任最少，但數據和賬號仍要客戶自己管"},{"id":"3-5","ch":3,"name":"密碼學","target":400,"card":["對稱：快、適合大數據，但密鑰分發難、無不可否認性","非對稱：RSA / ECC / DH（僅密鑰交換）/ DSA（僅簽名）","哈希：完整性、加鹽防彩虹表；簽名＝私鑰籤、公鑰驗","混合加密：非對稱換密鑰 + 對稱加密數據（TLS 的做法）"],"trap":"DH 不加密也不簽名"},{"id":"3-6","ch":3,"name":"架構威脅與物理安全","target":435,"card":["TOCTOU 用檢驗與使用之間的時間窗；隱蔽通道分存儲型與時間型","CPTED 三要素：自然監視、自然訪問控制、領地強化","機房消防：預作用系統 + 潔淨劑；用 CO₂ 時人員必須撤離","UPS 在線式始終逆變；機房探測推薦吸氣式"],"trap":"機房裡千萬別選直接噴水"},{"id":"4-1","ch":4,"name":"官方綜合模擬 · 一","target":430,"card":["題目來自 CISSP 官方習題集（OPTv4）第 12 章，中英對照","多為場景判斷：先確認問的是流程、技術還是管理","選項保留英文原文，術語可以先按字面辨認"],"trap":"別用技術直覺去答管理題"},{"id":"4-2","ch":4,"name":"官方綜合模擬 · 二","target":450,"card":["官方題常把正確答案藏在「先做什麼」裡","看到 BEST / MOST / PRIMARY / FIRST，先想流程順序","不確定時，排除明顯違反最小權限與治理的選項"],"trap":"「最全面」的選項不一定對，題目問的是「最合適」"},{"id":"4-3","ch":4,"name":"官方綜合模擬 · 三","target":470,"card":["場景題裡的人物職責常常是關鍵線索","先找出題目問的是誰的責任，再選動作","和教材衝突時，以風險與合規優先"],"trap":"不要假設題目沒說的組織流程"},{"id":"4-4","ch":4,"name":"官方綜合模擬 · 四","target":490,"card":["官方題喜歡考「控制類型」：預防 / 檢測 / 糾正 / 補償","問「發現」就不要選「阻止」，問「降低影響」就不要選「避免發生」","有爭議時回到風險處置四法"],"trap":"控制分類混淆是官方題最常見的失分點"},{"id":"4-5","ch":4,"name":"官方綜合模擬 · 五","target":510,"card":["技術題也會考流程：變更管理、事件響應、取證順序","取證先看證據鏈與易失性順序","雲與虛擬化題注意共享責任邊界"],"trap":"事件響應別跳過「遏制」直接進「恢復」"},{"id":"4-6","ch":4,"name":"官方綜合模擬 · 六","target":530,"card":["最後一組官方題，難度與真考最接近","時間控制：一題別超過 1 分鐘","不確定的題先選最符合治理與風險邏輯的"],"trap":"別在單題上耗太久，模擬考更看重整體節奏"}]}</script>
<script id="bank" type="application/json">[{"id":"1-1-01","ch":1,"level":"1-1","tag":"CIA","diff":2,"q":"某醫院的核心病歷系統遭勒索軟件加密，醫生無法調閱患者資料。此時被破壞最直接的安全屬性是？","opts":["機密性","完整性","可用性","不可否認性"],"ans":2,"exp":"數據還在、也沒被篡改，但授權用戶無法使用，破壞的是可用性。"},{"id":"1-1-02","ch":1,"level":"1-1","tag":"CIA","diff":2,"q":"員工把客戶名單通過個人郵箱發到外部，事後辯稱「只是做個備份」。這一行為主要破壞了？","opts":["機密性","完整性","可用性","可問責性"],"ans":0,"exp":"未授權者獲得了數據，屬於機密性洩露（Disclosure）。"},{"id":"1-1-03","ch":1,"level":"1-1","tag":"CIA","diff":2,"q":"公司從官網下載安裝包後，用官方公佈的哈希值比對，確認文件未被替換。這主要保障的是？","opts":["可用性","完整性","機密性","不可否認性"],"ans":1,"exp":"哈希比對用於驗證內容是否被改動，屬於完整性。哈希本身不提供機密性。"},{"id":"1-1-04","ch":1,"level":"1-1","tag":"CIA","diff":2,"q":"以下哪一項是數字簽名不能提供的？","opts":["完整性","身份認證","不可否認性","機密性"],"ans":3,"exp":"數字簽名解決完整性、認證和不可否認；要機密性必須另外加密。"},{"id":"1-1-05","ch":1,"level":"1-1","tag":"CIA","diff":2,"q":"監管要求「每一筆敏感操作都能追溯到具體自然人」，這對應的安全屬性是？","opts":["可用性","可問責性 Accountability","完整性","機密性"],"ans":1,"exp":"可追溯依賴唯一身份、日誌與不可篡改記錄，即可問責性。"},{"id":"1-1-06","ch":1,"level":"1-1","tag":"CIA","diff":3,"q":"對稱加密無法提供不可否認性的根本原因是？","opts":["算法強度不足","密鑰長度太短","雙方共享同一把密鑰，無法證明是誰發的","沒有使用哈希"],"ans":2,"exp":"不可否認要求「只有發送方能生成簽名」，對稱密鑰雙方都有，做不到。"},{"id":"1-1-07","ch":1,"level":"1-1","tag":"CIA","diff":2,"q":"公司同時部署防火牆、入侵檢測、數據加密、員工培訓與異地備份，這體現的原則是？","opts":["縱深防禦","最小權限","職責分離","需知原則"],"ans":0,"exp":"多層不同類型的控制疊加，即縱深防禦（Defense in Depth）。"},{"id":"1-1-08","ch":1,"level":"1-1","tag":"CIA","diff":4,"q":"財務總監要求訪問研發代碼庫「以備不時之需」，但其職責與研發無關。依據哪個原則應拒絕？","opts":["縱深防禦","最小權限","需知原則","職責分離"],"ans":2,"exp":"即使給了權限，業務上不需要知道也不能訪問，這是需知原則；最小權限更偏向「授予多少」，需知偏向「該不該知道」。"},{"id":"1-2-01","ch":1,"level":"1-2","tag":"治理","diff":2,"q":"「所有員工密碼長度不得少於 12 位，且每 90 天更換」這份文件最可能屬於？","opts":["政策 Policy","標準 Standard","程序 Procedure","指南 Guideline"],"ans":1,"exp":"具體、可量化、強制執行的基線，屬於標準。"},{"id":"1-2-02","ch":1,"level":"1-2","tag":"治理","diff":2,"q":"信息安全政策體系中，建議性、非強制的是？","opts":["政策 Policy","標準 Standard","程序 Procedure","指南 Guideline"],"ans":3,"exp":"指南是推薦做法，不遵守不算違規。"},{"id":"1-2-03","ch":1,"level":"1-2","tag":"治理","diff":2,"q":"組織內信息安全的最終責任由誰承擔？","opts":["最高管理層/董事會","IT 運維部門","安全管理員","外部審計機構"],"ans":0,"exp":"安全治理責任在最高層，不能外包給 IT 部門。"},{"id":"1-2-04","ch":1,"level":"1-2","tag":"治理","diff":4,"q":"安全政策發佈後，各部門仍按老習慣辦事。最有效的下一步是？","opts":["立即處罰違規者","獲得高層支持，並把政策納入培訓與考核","採購更強 technical 管控設備","請外部審計出具報告"],"ans":1,"exp":"政策無人遵守的根因通常是缺乏高層支持與溝通；先解決治理與認同，再談處罰。"},{"id":"1-2-05","ch":1,"level":"1-2","tag":"治理","diff":3,"q":"為保證獨立性，內部審計部門應直接向誰彙報？","opts":["CIO","CFO","審計委員會或董事會","IT 運維經理"],"ans":2,"exp":"審計必須獨立於被審計對象，向董事會/審計委員會彙報是關鍵。"},{"id":"1-2-06","ch":1,"level":"1-2","tag":"治理","diff":3,"q":"CISO 直接向 CEO 彙報，而非掛在 CIO 之下，主要好處是？","opts":["可以拿到更高預算","避免安全決策讓位於 IT 運行效率","減少人員編制","便於直接管運維"],"ans":1,"exp":"彙報關係決定優先級與獨立性，這是治理設計的考點。"},{"id":"1-2-07","ch":1,"level":"1-2","tag":"治理","diff":2,"q":"針對遠程辦公場景專門制定的政策屬於？","opts":["組織級安全政策","系統特定政策","議題特定政策","技術標準"],"ans":2,"exp":"按議題（遠程辦公、BYOD、郵件）制定的政策即議題特定政策。"},{"id":"1-2-08","ch":1,"level":"1-2","tag":"治理","diff":3,"q":"政策（Policy）與程序（Procedure）的關鍵區別是？","opts":["政策給原則與方向，程序給具體操作步驟","政策是建議，程序是強制","政策由 IT 編寫，程序由高層批准","兩者只是叫法不同"],"ans":0,"exp":"政策定「做什麼、為什麼」，程序定「誰在何時按什麼步驟做」。"},{"id":"1-3-01","ch":1,"level":"1-3","tag":"風險","diff":3,"q":"某數據庫資產價值 100 萬元，一次洩露的暴露因子為 20%，預計每年發生 0.3 次。年化預期損失 ALE 是多少？","opts":["3 萬元","6 萬元","20 萬元","60 萬元"],"ans":1,"exp":"SLE=100×20%=20 萬；ALE=20×0.3=6 萬。"},{"id":"1-3-02","ch":1,"level":"1-3","tag":"風險","diff":2,"q":"公司為機房購買網絡安全保險，屬於哪種風險處置方式？","opts":["轉移 Transfer","緩解 Mitigate","規避 Avoid","接受 Accept"],"ans":0,"exp":"把財務後果轉給保險公司，即轉移。"},{"id":"1-3-03","ch":1,"level":"1-3","tag":"風險","diff":2,"q":"公司決定徹底停止某條高風險業務線，屬於？","opts":["緩解","轉移","規避","接受"],"ans":2,"exp":"不做了，即規避。"},{"id":"1-3-04","ch":1,"level":"1-3","tag":"風險","diff":4,"q":"上一項控制後，某風險的 ALE 由每年 10 萬降至 3 萬，該控制年成本 2 萬。結論是？","opts":["不值得，成本太高","值得，年淨收益約 5 萬","值得，因為風險歸零了","無法判斷，需再做定量分析"],"ans":1,"exp":"10−3−2=5 萬 > 0，值得；風險不會歸零，剩餘風險 3 萬。"},{"id":"1-3-05","ch":1,"level":"1-3","tag":"風險","diff":2,"q":"下列哪項屬於檢測控制（Detective Control）？","opts":["門禁刷卡","防火牆阻斷","員工安全培訓","IDS 告警與日誌審查"],"ans":3,"exp":"檢測控制是在事件發生時或之後發現它；阻斷是預防。"},{"id":"1-3-06","ch":1,"level":"1-3","tag":"風險","diff":3,"q":"風險管理的首要步驟是？","opts":["識別資產並確定其價值","購買保險","部署防火牆","制定應急預案"],"ans":0,"exp":"沒有資產清單與價值，後續的風險評估都是空中樓閣。"},{"id":"1-3-07","ch":1,"level":"1-3","tag":"風險","diff":2,"q":"「剩餘風險」指的是？","opts":["尚未識別的風險","所有風險之和","實施控制後仍然存在的風險","保險公司承擔的風險"],"ans":2,"exp":"控制只能降低風險，剩下的部分就是剩餘風險，需要被正式接受或繼續處理。"},{"id":"1-3-08","ch":1,"level":"1-3","tag":"風險","diff":3,"q":"威脅建模的主要目的是？","opts":["計算出精確的 ALE","在設計與開發階段識別攻擊面與威脅","替代滲透測試","滿足審計要求"],"ans":1,"exp":"威脅建模是「事前找漏洞」，與滲透測試（事後驗證）互補。"},{"id":"1-4-01","ch":1,"level":"1-4","tag":"BCP","diff":2,"q":"業務最多能中斷 12 小時，超過就不可接受。這個指標是？","opts":["RTO","MTD","RPO","MTBF"],"ans":1,"exp":"MTD 是最大可容忍中斷時間，RTO 是為恢復設定的目標，必須 ≤ MTD。"},{"id":"1-4-02","ch":1,"level":"1-4","tag":"BCP","diff":2,"q":"決定「最多能接受丟失多少數據」的指標是？","opts":["MTD","MTTR","RTO","RPO"],"ans":3,"exp":"RPO 由備份頻率決定，衡量數據丟失量。"},{"id":"1-4-03","ch":1,"level":"1-4","tag":"BCP","diff":2,"q":"熱站（Hot Site）的特點是？","opts":["設備齊全、可立即接管，成本最高","只有場地與電力","部分設備，需數天","與其他公司互藉機房"],"ans":0,"exp":"熱站 = 隨時能切換；冷站最便宜最慢；溫站居中。"},{"id":"1-4-04","ch":1,"level":"1-4","tag":"BCP","diff":2,"q":"最輕量的業務連續性測試方式是？","opts":["完全中斷測試","桌面推演","通讀檢查（Read-through）","平行運行"],"ans":2,"exp":"由輕到重：通讀→走查→桌面推演→模擬→平行→完全中斷。"},{"id":"1-4-05","ch":1,"level":"1-4","tag":"BCP","diff":3,"q":"BCP 與 DRP 的關係是？","opts":["兩者完全獨立","DRP 是 BCP 的一部分，專注 IT 恢復","BCP 是 DRP 的一部分","DRP 比 BCP 範圍更大"],"ans":1,"exp":"BCP 管整個業務怎麼活下去，DRP 管 IT 系統怎麼恢復，DRP 隸屬於 BCP。"},{"id":"1-4-06","ch":1,"level":"1-4","tag":"審計","diff":3,"q":"內部審計相較外部審計的主要短板是？","opts":["成本更高","週期更長","不瞭解業務","獨立性較弱"],"ans":3,"exp":"內部審計熟悉環境、成本低，但可能受組織內部關係影響客觀性。"},{"id":"1-4-07","ch":1,"level":"1-4","tag":"BCP","diff":3,"q":"業務影響分析（BIA）的主要輸出是？","opts":["關鍵業務功能及其 MTD/RTO/RPO","滲透測試報告","資產折舊表","供應商名單"],"ans":0,"exp":"BIA 找出關鍵業務、依賴關係與可容忍中斷時間，是 BCP 的地基。"},{"id":"1-4-08","ch":1,"level":"1-4","tag":"BCP","diff":2,"q":"選擇「溫站」作為恢復站點意味著？","opts":["數據實時同步，可立即接管","完全沒有設備","具備部分設備，需數小時至數天接管","與其他公司籤互惠協議"],"ans":2,"exp":"溫站有基本設備但需配置與數據恢復，介於冷熱之間。"},{"id":"1-5-01","ch":1,"level":"1-5","tag":"倫理","diff":2,"q":"ISC2 職業道德準則的第一條是？","opts":["保護社會、公共利益和必要的公眾信任","為客戶提供勝任的服務","推進本專業發展","遵守僱主的所有指令"],"ans":0,"exp":"四條準則的順序也考：保護社會 → 榮譽誠實公正合法 → 為委託人勤勉 → 推進專業。"},{"id":"1-5-02","ch":1,"level":"1-5","tag":"倫理","diff":4,"q":"你發現僱主正在隱瞞一起會危害公眾健康的數據洩露，按職業道德應？","opts":["嚴守保密，什麼都不做","先刪除證據避免擔責","優先保護公眾利益，必要時上報監管","在社交媒體公開細節"],"ans":2,"exp":"公共利益優先於僱主利益；但方式應走正式合規渠道，而不是隨意公開。"},{"id":"1-5-03","ch":1,"level":"1-5","tag":"法規","diff":2,"q":"GDPR 的主要特徵是？","opts":["只約束歐盟境內的公司","有域外效力，罰則嚴厲","只適用於政府機構","由支付卡行業制定"],"ans":1,"exp":"只要處理歐盟居民的個人數據就可能適用，且有高額罰款。"},{"id":"1-5-04","ch":1,"level":"1-5","tag":"法規","diff":3,"q":"PCI DSS 的性質是？","opts":["一部國際法律","美國政府法規","行業最佳實踐指南，無約束力","支付卡行業標準，通過合同強制實施"],"ans":3,"exp":"PCI DSS 不是法律，是對商戶與支付機構的合同要求。"},{"id":"1-5-05","ch":1,"level":"1-5","tag":"人員","diff":2,"q":"員工離職當天最重要的安全動作是？","opts":["立即禁用賬戶並回收權限與資產","發一封告別郵件","等 HR 通知後再處理","刪除其郵箱歷史"],"ans":0,"exp":"離職賬號是經典風險窗口，必須在最後工作日當天即時關閉。"},{"id":"1-5-06","ch":1,"level":"1-5","tag":"人員","diff":3,"q":"崗位輪換與強制休假的主要安全價值是？","opts":["提高員工滿意度","減少培訓成本","暴露異常操作與串通舞弊","縮短項目週期"],"ans":2,"exp":"長期由一人獨佔某崗位，舞弊不易被發現；輪換與強制休假製造暴露窗口。"},{"id":"1-5-07","ch":1,"level":"1-5","tag":"人員","diff":2,"q":"「讓全體員工知道公司存在安全政策，並定期收到釣魚演練提示」屬於？","opts":["培訓 Training","安全意識 Awareness","教育 Education","認證 Certification"],"ans":1,"exp":"意識是「知道有這回事」；培訓是「會做」；教育是「培養專家」。"},{"id":"1-5-08","ch":1,"level":"1-5","tag":"法規","diff":3,"q":"商業秘密的保護期限是？","opts":["20 年","作者死後 50 年","只要保持秘密狀態就可以持續保護","必須每年續展"],"ans":2,"exp":"商業秘密沒有固定期限，一旦公開就失去保護。"},{"id":"2-1-01","ch":2,"level":"2-1","tag":"責任","diff":2,"q":"確定一份客戶名單屬於哪個密級，應由誰負責？","opts":["數據所有者 Data Owner","數據保管者 Data Custodian","安全管理員","普通用戶"],"ans":0,"exp":"所有者是業務負責人，負責分類分級與訪問授權；保管者只負責執行保護措施。"},{"id":"2-1-02","ch":2,"level":"2-1","tag":"分類","diff":2,"q":"軍事/政府信息分類體系中最高一級是？","opts":["機密 Confidential","秘密 Secret","絕密 Top Secret","敏感但未分類 SBU"],"ans":2,"exp":"由高到低：絕密 > 秘密 > 機密 > 敏感但未分類 > 未分類。"},{"id":"2-1-03","ch":2,"level":"2-1","tag":"分類","diff":2,"q":"商業組織分類體系中最高一級通常是？","opts":["公開 Public","機密 Confidential","敏感 Sensitive","隱私 Private"],"ans":1,"exp":"商業體系裡 Confidential 最高；軍事體系裡 Confidential 在 Secret 之下，同一個詞位置不同，易混。"},{"id":"2-1-04","ch":2,"level":"2-1","tag":"分類","diff":3,"q":"數據分類的核心目的是？","opts":["方便統計","滿足審計形式要求","減少存儲成本","按敏感度匹配相應強度的保護措施"],"ans":3,"exp":"分類是為了「不同級別不同控制」，而不是為了分類本身。"},{"id":"2-1-05","ch":2,"level":"2-1","tag":"生命週期","diff":2,"q":"信息生命週期的正確順序是？","opts":["獲取→使用→存儲→處置","存儲→獲取→使用→處置","使用→獲取→存儲→處置","獲取→存儲→處置→使用"],"ans":0,"exp":"常見簡化四階段：獲取（創建）、使用、存儲、處置；不同教材還會拆出共享與歸檔。"},{"id":"2-1-06","ch":2,"level":"2-1","tag":"分類","diff":3,"q":"數據會隨時間失去敏感性（如訴訟結束、項目結項），因此需要？","opts":["永久保留原級別","立即銷燬全部數據","定期複審並降密","加密封存不再處理"],"ans":2,"exp":"分類不是一次性的，降密與複審是分類管理的固定動作。"},{"id":"2-1-07","ch":2,"level":"2-1","tag":"分類","diff":3,"q":"數據分類與數據分級的區別是？","opts":["分類按用途，分級按部門","分類按敏感度，分級按用途或合規類別","兩者完全相同","分類由 IT 做，分級由用戶做"],"ans":1,"exp":"Classification 定敏感度級別；Categorization 按用途/法規類別（PII、PHI 等）。"},{"id":"2-1-08","ch":2,"level":"2-1","tag":"生命週期","diff":3,"q":"數據在「共享」階段最關鍵的控制是？","opts":["提高存儲容量","最小化共享範圍並加密、記錄審計","延長保留期限","把所有數據轉為公開"],"ans":1,"exp":"共享是洩露高發點：最小化 + 加密 + 審計 + 必要時 DLP。"},{"id":"2-2-01","ch":2,"level":"2-2","tag":"責任","diff":2,"q":"按數據所有者的要求執行備份、加密與權限配置的是？","opts":["首席執行官","數據保管者 Data Custodian","數據分析員","審計員"],"ans":1,"exp":"保管者通常是 IT 運維角色，負責「怎麼保護」，不負責「誰能看」。"},{"id":"2-2-02","ch":2,"level":"2-2","tag":"責任","diff":2,"q":"誰負責決定「哪些人可以看到某份數據」？","opts":["數據所有者","數據保管者","安全管理員","系統用戶"],"ans":0,"exp":"訪問授權決策屬於數據所有者（業務負責人）。"},{"id":"2-2-03","ch":2,"level":"2-2","tag":"責任","diff":3,"q":"系統所有者的職責是？","opts":["負責整個組織的安全策略","負責公司財務","對某個系統的安全運行與配置負責","只負責用戶賬號開通"],"ans":2,"exp":"系統所有者對系統整體（含安全配置與合規）負責，與數據所有者不是一回事。"},{"id":"2-2-04","ch":2,"level":"2-2","tag":"責任","diff":3,"q":"安全管理員主要做什麼？","opts":["決定數據分類級別","審批業務預算","設計業務流程","實施與維護安全設備、策略和權限"],"ans":3,"exp":"安全管理員是執行層，落實所有者與系統所有者定的規則。"},{"id":"2-2-05","ch":2,"level":"2-2","tag":"責任","diff":3,"q":"變更控制分析員的職責是？","opts":["編寫應用程序","審批變更並評估變更帶來的風險","維護網絡設備","制定公司戰略"],"ans":1,"exp":"變更控制分析員把關變更，評估其對安全與業務的影響。"},{"id":"2-2-06","ch":2,"level":"2-2","tag":"責任","diff":4,"q":"數據保管者不應承擔下列哪項？","opts":["決定數據的分類級別與訪問授權","執行備份","實施加密","維護存儲設備"],"ans":0,"exp":"分類與授權是所有者的事；保管者只執行。這是本章最高頻的區分點。"},{"id":"2-2-07","ch":2,"level":"2-2","tag":"責任","diff":2,"q":"首席隱私官（CPO）的主要職責是？","opts":["管理機房供電","負責隱私合規與個人數據處理治理","審批採購合同","維護防火牆規則"],"ans":1,"exp":"CPO 面向隱私與個人信息保護合規（GDPR/PIPL 等）。"},{"id":"2-2-08","ch":2,"level":"2-2","tag":"責任","diff":3,"q":"業務主管（Manager）在訪問控制中的責任是？","opts":["決定全體員工權限","為下屬的訪問申請與使用承擔責任","維護賬號系統","編寫安全政策"],"ans":1,"exp":"主管是審批鏈上的關鍵人，對下屬申請的權限與使用後果負責。"},{"id":"2-3-01","ch":2,"level":"2-3","tag":"保留","diff":3,"q":"數據保留期限應依據什麼確定？","opts":["存儲成本最低原則","IT 部門的技術偏好","法律、合同與業務需求中最長的那個","員工投票結果"],"ans":2,"exp":"多個來源取最長；到期則應銷燬，留存過久同樣是風險。"},{"id":"2-3-02","ch":2,"level":"2-3","tag":"保留","diff":3,"q":"公司收到訴訟通知後，應立即？","opts":["啟動訴訟保留，凍結相關數據的刪除流程","立刻刪除敏感郵件","通知全體員工","停用所有備份"],"ans":0,"exp":"Legal Hold 是防止證據被銷燬的第一動作。"},{"id":"2-3-03","ch":2,"level":"2-3","tag":"保留","diff":3,"q":"電子發現（eDiscovery）能順利進行的前提是？","opts":["數據全部打印成紙質","數據可檢索、有索引與分類","關閉所有備份","使用單一存儲設備"],"ans":1,"exp":"沒有索引與分類，訴訟時無法在海量數據中定位相關記錄。"},{"id":"2-3-04","ch":2,"level":"2-3","tag":"保留","diff":3,"q":"保留數據過久的風險是？","opts":["磁盤收益下降","系統運行變慢","員工不方便","擴大洩露面並增加訴訟時需披露的範圍"],"ans":3,"exp":"「留得越多，被要求交出的越多」，保留策略也應控制上限。"},{"id":"2-3-05","ch":2,"level":"2-3","tag":"保留","diff":2,"q":"數據保留策略應覆蓋哪些對象？","opts":["只覆蓋數據庫","只覆蓋紙質文件","紙質、電子、備份與第三方存儲","只覆蓋在用的生產數據"],"ans":2,"exp":"備份、歸檔和第三方託管的數據同樣在保留範圍內。"},{"id":"2-3-06","ch":2,"level":"2-3","tag":"保留","diff":2,"q":"數據保留期屆滿時應？","opts":["繼續無限期保留","按安全銷燬流程處理並留存記錄","轉存到個人設備","改為公開數據"],"ans":1,"exp":"到期銷燬要可追溯：誰、何時、以什麼方式銷燬。"},{"id":"2-3-07","ch":2,"level":"2-3","tag":"保留","diff":2,"q":"歸檔數據是否屬於保留策略的範圍？","opts":["屬於，歸檔數據同樣適用","不屬於，歸檔數據可永久保存","只在訴訟期間屬於","取決於介質類型"],"ans":0,"exp":"歸檔只是訪問頻率低，不代表可以不受保留策略約束。"},{"id":"2-3-08","ch":2,"level":"2-3","tag":"保留","diff":3,"q":"分類法、分級、標準化與索引，屬於保留策略中的哪一部分？","opts":["保留多久","保留什麼","如何組織保留的數據","誰來審批"],"ans":2,"exp":"保留策略要回答三問：保留什麼、保留多久、怎麼組織以便檢索。"},{"id":"2-4-01","ch":2,"level":"2-4","tag":"殘留","diff":3,"q":"一臺全盤加密的固態硬盤要退役，最經濟可靠的處置方式是？","opts":["多次覆寫","加密擦除（銷燬密鑰）","消磁","格式化"],"ans":1,"exp":"密鑰丟掉，數據就無法解開；對 SSD 最合適。格式化與刪除都不算銷燬。"},{"id":"2-4-02","ch":2,"level":"2-4","tag":"殘留","diff":3,"q":"消磁（Degaussing）對下列哪種介質無效？","opts":["機械硬盤","磁帶","軟盤","固態硬盤與閃存"],"ans":3,"exp":"消磁只對磁介質有效，閃存沒有可磁化的記錄方式。"},{"id":"2-4-03","ch":2,"level":"2-4","tag":"殘留","diff":2,"q":"在操作系統裡「直接刪除文件」算不算數據銷燬？","opts":["不算，只是刪除了索引","算，數據已不可見","算，但僅限機械硬盤","取決於文件大小"],"ans":0,"exp":"刪除只釋放索引，數據仍在介質上，可被恢復。"},{"id":"2-4-04","ch":2,"level":"2-4","tag":"殘留","diff":2,"q":"數據殘留（Data Remanence）指的是？","opts":["數據在內存中的副本","數據在傳輸中的狀態","刪除或覆寫後仍殘留在介質上的數據","數據的備份副本"],"ans":2,"exp":"這就是為什麼退役介質需要覆寫、消磁、加密擦除或物理銷燬。"},{"id":"2-4-05","ch":2,"level":"2-4","tag":"殘留","diff":4,"q":"覆寫（Overwriting）對 SSD 效果差的主要原因是？","opts":["SSD 容量太小","磨損均衡使數據分佈不確定，覆寫不到全部物理塊","SSD 不支持寫入","SSD 斷電即丟數據"],"ans":1,"exp":"閃存控制器會重映射物理塊，覆寫邏輯地址不等於覆蓋原物理位置。"},{"id":"2-4-06","ch":2,"level":"2-4","tag":"隱私","diff":2,"q":"隱私保護中「只收集完成業務所必需的最少數據」屬於？","opts":["數據最小化","數據完整","數據可用","數據歸檔"],"ans":0,"exp":"最小化是隱私原則裡的第一條，也直接降低洩露後果。"},{"id":"2-4-07","ch":2,"level":"2-4","tag":"隱私","diff":3,"q":"決定個人數據的處理目的與方式的主體是？","opts":["數據管理者","數據主體","數據控制者","數據保管者"],"ans":2,"exp":"控制者（Controller）定目的與方式；處理者（Processor）受託處理，如雲服務商。"},{"id":"2-4-08","ch":2,"level":"2-4","tag":"殘留","diff":2,"q":"介質退役記錄至少應包含？","opts":["介質型號與採購價格","用戶評價","維修記錄","誰、何時、以何種方式銷燬"],"ans":3,"exp":"銷燬證據鏈是合規審計的必備材料。"},{"id":"2-5-01","ch":2,"level":"2-5","tag":"資產","diff":2,"q":"數據庫透明加密主要保護哪種狀態的數據？","opts":["靜態數據 Data at Rest","傳輸中的數據","使用中的數據","備份中的數據"],"ans":0,"exp":"落盤後的數據屬於靜態數據；備份加密也屬於靜態範疇。"},{"id":"2-5-02","ch":2,"level":"2-5","tag":"資產","diff":2,"q":"保護傳輸中數據（Data in Motion）的典型手段是？","opts":["全盤加密","屏幕水印","TLS/IPsec/VPN","數據庫脫敏"],"ans":2,"exp":"鏈路上的加密靠 TLS、IPsec、VPN 等。"},{"id":"2-5-03","ch":2,"level":"2-5","tag":"資產","diff":3,"q":"保護使用中數據（Data in Use）的典型手段是？","opts":["異地備份","安全隔離區（TEE/HSM）與防截屏","TLS 加密","磁帶歸檔"],"ans":1,"exp":"數據在內存裡被處理時，靠隔離執行環境、內存保護、防截屏/水印。"},{"id":"2-5-04","ch":2,"level":"2-5","tag":"DLP","diff":2,"q":"網絡 DLP 的部署位置通常是？","opts":["終端本地","數據庫內部","郵件服務器硬盤","網絡出口或網關"],"ans":3,"exp":"網絡 DLP 看外發流量，端點 DLP 看終端操作。"},{"id":"2-5-05","ch":2,"level":"2-5","tag":"DLP","diff":2,"q":"端點 DLP 主要防範什麼？","opts":["終端上的複製、U 盤拷貝、打印與截屏外洩","服務器被入侵","網絡帶寬濫用","機房斷電"],"ans":0,"exp":"端點 DLP 盯的是數據離開終端的各種本地通道。"},{"id":"2-5-06","ch":2,"level":"2-5","tag":"DLP","diff":3,"q":"DLP 策略要真正有效，前提是？","opts":["購買最貴的設備","以數據分類為基礎制定規則","禁止員工使用電腦","只在夜間運行"],"ans":1,"exp":"不知道哪些數據是敏感數據，DLP 只能產生海量誤報。"},{"id":"2-5-07","ch":2,"level":"2-5","tag":"資產","diff":2,"q":"移動設備丟失後最關鍵的補救措施是？","opts":["更換 SIM 卡","遠程擦除與鎖定（MDM）","格式化辦公電腦","通知物業"],"ans":1,"exp":"MDM 的遠程擦除/鎖定是移動設備的標準補救動作。"},{"id":"2-5-08","ch":2,"level":"2-5","tag":"資產","diff":2,"q":"紙質記錄的保護措施是？","opts":["放在工位抽屜裡","掃描後銷燬原件","只在夜間鎖門","上鎖保管、碎紙銷燬、傳遞簽收"],"ans":3,"exp":"紙質資產的控制常被忽略，但考試會考：鎖、碎、簽收。"},{"id":"3-1-01","ch":3,"level":"3-1","tag":"OS","diff":2,"q":"保護環（Protection Ring）結構中，Ring 0 通常運行的是？","opts":["操作系統內核","普通用戶程序","瀏覽器插件","數據庫客戶端"],"ans":0,"exp":"環號越小特權越高；內核態在 Ring 0，用戶態在 Ring 3。"},{"id":"3-1-02","ch":3,"level":"3-1","tag":"OS","diff":2,"q":"微內核（Microkernel）架構的主要優點是？","opts":["性能最高","兼容所有硬件","內核小、隔離強","開發簡單"],"ans":2,"exp":"服務移到用戶態，內核極小便於驗證；代價是通信開銷、性能略低。"},{"id":"3-1-03","ch":3,"level":"3-1","tag":"虛擬化","diff":2,"q":"下列哪個屬於 Type 1（裸金屬）Hypervisor？","opts":["VirtualBox","VMware ESXi","Docker","Java 虛擬機"],"ans":1,"exp":"Type 1 直接跑在硬件上（ESXi、Hyper-V、KVM）；Type 2 跑在宿主 OS 上。"},{"id":"3-1-04","ch":3,"level":"3-1","tag":"虛擬化","diff":3,"q":"虛擬機逃逸（VM Escape）指什麼？","opts":["虛擬機性能下降","快照文件丟失","虛擬機自動遷移","攻擊者從虛擬機突破到宿主或其他虛擬機"],"ans":3,"exp":"這是虛擬化環境最嚴重的一類風險，隔離被攻破。"},{"id":"3-1-05","ch":3,"level":"3-1","tag":"虛擬化","diff":3,"q":"容器隔離通常弱於虛擬機，根本原因是？","opts":["容器共享宿主內核","容器沒有文件系統","容器不能用網絡","容器不支持加密"],"ans":0,"exp":"共享內核意味著內核漏洞可能影響所有容器；VM 有獨立內核。"},{"id":"3-1-06","ch":3,"level":"3-1","tag":"OS","diff":3,"q":"緩解緩衝區溢出攻擊的常見機制是？","opts":["DNS 過濾","磁盤配額","ASLR 與 DEP","端口鏡像"],"ans":2,"exp":"地址空間隨機化 + 數據執行保護，再配合邊界檢查與安全編碼。"},{"id":"3-1-07","ch":3,"level":"3-1","tag":"OS","diff":3,"q":"保證固件與啟動鏈未被篡改的技術是？","opts":["磁盤陣列","安全啟動（Secure Boot）與 TPM 度量","負載均衡","日誌輪轉"],"ans":1,"exp":"啟動鏈完整性是可信計算的基礎，TPM 用於度量與證明。"},{"id":"3-1-08","ch":3,"level":"3-1","tag":"OS","diff":2,"q":"沙箱（Sandbox）的作用是？","opts":["提升 CPU 頻率","加密磁盤","備份數據","限制程序可訪問的資源範圍"],"ans":3,"exp":"沙箱通過隔離限制程序行為，即便被利用也難擴散。"},{"id":"3-2-01","ch":3,"level":"3-2","tag":"TCB","diff":3,"q":"引用監控器（Reference Monitor）的三個特性是？","opts":["始終被調用、不可繞過、可驗證","加密、認證、審計","快速、便宜、可擴展","冗餘、備份、恢復"],"ans":0,"exp":"這是必背三特性，考「哪三個」直接送分。"},{"id":"3-2-02","ch":3,"level":"3-2","tag":"TCB","diff":3,"q":"TCB（可信計算基）指的是？","opts":["所有服務器硬件","安全政策文檔","系統中所有安全相關機制的集合","備份系統"],"ans":2,"exp":"TCB 是必須被信任的那部分，越小越容易評估。"},{"id":"3-2-03","ch":3,"level":"3-2","tag":"TCB","diff":3,"q":"安全內核應儘量小，主要原因是？","opts":["節省磁盤空間","便於驗證並減少攻擊面","提高網絡速度","降低採購成本"],"ans":1,"exp":"內核越小越可被形式化驗證，能被審計。"},{"id":"3-2-04","ch":3,"level":"3-2","tag":"TCB","diff":3,"q":"安全邊界（Security Perimeter）指的是？","opts":["機房圍牆","防火牆規則集","公司網絡出口","TCB 與不可信部分之間的邊界"],"ans":3,"exp":"邊界內的機制需要被信任，邊界外不可信；所有訪問應由引用監控器把關。"},{"id":"3-2-05","ch":3,"level":"3-2","tag":"評估","diff":3,"q":"認證（Certification）與認可（Accreditation）的先後關係是？","opts":["先認證，後認可","先認可，後認證","兩者同時進行","沒有先後要求"],"ans":0,"exp":"認證是技術評估，認可是管理層正式批准投入運行；技術在前，管理批准在後。"},{"id":"3-2-06","ch":3,"level":"3-2","tag":"評估","diff":2,"q":"通用準則（Common Criteria）最高評估保證級是？","opts":["EAL5","EAL6","EAL7","EAL4"],"ans":2,"exp":"EAL1 功能測試 → EAL7 形式化驗證，越高越嚴格也越貴。"},{"id":"3-2-07","ch":3,"level":"3-2","tag":"評估","diff":2,"q":"TCSEC（橙皮書）的現狀是？","opts":["仍是全球通用標準","已廢棄，被 Common Criteria 取代","只適用於雲環境","只用於中國"],"ans":1,"exp":"橙皮書是歷史標準（D/C/B/A 級），現在考的是常識與替代者。"},{"id":"3-2-08","ch":3,"level":"3-2","tag":"架構","diff":3,"q":"使用開放系統架構的主要安全風險是？","opts":["性能不足","成本過高","無法升級","公開接口使攻擊者更易研究攻擊方式"],"ans":3,"exp":"開放系統可互操作，但攻擊面與研究成本都降低；封閉系統靠隱蔽，一旦曝光更脆弱。"},{"id":"3-3-01","ch":3,"level":"3-3","tag":"模型","diff":3,"q":"Bell-LaPadula 模型的「簡單安全規則」要求？","opts":["不上讀（no read up）","不下讀（no read down）","不上寫（no write up）","不下寫（no write down）"],"ans":0,"exp":"機密性模型：不能讀取更高密級的信息。"},{"id":"3-3-02","ch":3,"level":"3-3","tag":"模型","diff":3,"q":"Bell-LaPadula 模型的「星屬性（* 屬性）」要求？","opts":["不上讀","不下讀","不下寫（no write down）","不上寫"],"ans":2,"exp":"不能把高密級信息寫到低密級，防止洩露。BLP = 不上讀 + 不下寫。"},{"id":"3-3-03","ch":3,"level":"3-3","tag":"模型","diff":3,"q":"Bell-LaPadula 模型解決的是？","opts":["完整性，不解決機密性","機密性，不解決完整性","可用性","不可否認性"],"ans":1,"exp":"BLP 只管機密性；完整性要用 Biba 或 Clark-Wilson。"},{"id":"3-3-04","ch":3,"level":"3-3","tag":"模型","diff":3,"q":"Biba 模型的規則是？","opts":["不上讀、不下寫","不下讀、不下寫","不上讀、不上寫","不下讀、不上寫"],"ans":3,"exp":"完整性模型：不讀更低完整性的數據，不寫更高完整性的對象。與 BLP 正好鏡像。"},{"id":"3-3-05","ch":3,"level":"3-3","tag":"模型","diff":4,"q":"Clark-Wilson 模型最強調什麼？","opts":["良構事務與職責分離，面向商業完整性","多級機密性","隱蔽通道防護","物理安全"],"ans":0,"exp":"它用受約束數據項、良構事務、完整性驗證過程實現商業系統的完整性。"},{"id":"3-3-06","ch":3,"level":"3-3","tag":"模型","diff":2,"q":"Brewer-Nash 模型（中文牆）用於解決？","opts":["網絡分段","密碼強度","利益衝突","備份策略"],"ans":2,"exp":"用戶不能同時訪問存在利益衝突的兩家客戶數據，常見於諮詢、投行、審計。"},{"id":"3-3-07","ch":3,"level":"3-3","tag":"模型","diff":4,"q":"Harrison-Ruzzo-Ullman 模型的重要結論是？","opts":["訪問控制可以完全自動化","訪問控制矩陣的安全性不可判定","所有權限都可被證明安全","模型只能用於軍事系統"],"ans":1,"exp":"權限可變時，判斷系統是否能達到某個安全狀態在理論上不可判定。"},{"id":"3-3-08","ch":3,"level":"3-3","tag":"模型","diff":4,"q":"無干擾（Noninterference）模型主要針對？","opts":["性能問題","數據庫推理","網絡延遲","隱蔽通道"],"ans":3,"exp":"要求高安全級行為不能影響低安全級可觀察狀態，用於限制隱蔽通道。"},{"id":"3-4-01","ch":3,"level":"3-4","tag":"分佈式","diff":3,"q":"把多條低敏感數據組合後得出高敏感結論，這叫？","opts":["聚合 Aggregation","推理 Inference","脫敏","加密"],"ans":0,"exp":"聚合是「拼數據」；推理是「由非敏感結果推敏感信息」。"},{"id":"3-4-02","ch":3,"level":"3-4","tag":"分佈式","diff":3,"q":"通過一系列非敏感查詢推斷出敏感信息，這叫？","opts":["聚合","脫敏","推理 Inference","備份"],"ans":2,"exp":"推理攻擊靠多次低敏感查詢的組合反推敏感數據。"},{"id":"3-4-03","ch":3,"level":"3-4","tag":"分佈式","diff":3,"q":"數據庫防推理的常見措施是？","opts":["提高查詢速度","單元抑制、噪聲擾動、數據庫分隔","增加索引","使用緩存"],"ans":1,"exp":"讓單次查詢結果不足以推出敏感信息，或隔離不同用途的數據庫。"},{"id":"3-4-04","ch":3,"level":"3-4","tag":"雲","diff":2,"q":"SaaS 模式下，客戶承擔的安全責任通常？","opts":["最多","與 IaaS 相同","為零","最少"],"ans":3,"exp":"越往 SaaS 走，客戶的控制面越小，責任也越少（但數據與賬號仍要自己管）。"},{"id":"3-4-05","ch":3,"level":"3-4","tag":"雲","diff":3,"q":"共享責任模型下，雲商與客戶的分工是？","opts":["雲商管「雲的安全」，客戶管「雲裡的安全」","雲商承擔全部責任","客戶承擔全部責任","按合同隨意劃分"],"ans":0,"exp":"基礎設施安全歸雲商，配置、數據、身份歸客戶。"},{"id":"3-4-06","ch":3,"level":"3-4","tag":"分佈式","diff":3,"q":"ICS/SCADA 工業控制系統的安全首要目標是？","opts":["機密性","性能","可用性與安全運行","可移植性"],"ans":2,"exp":"工控系統停機可能造成物理傷害，可用性優先，且協議老舊、生命週期長。"},{"id":"3-4-07","ch":3,"level":"3-4","tag":"雲","diff":3,"q":"IaaS 模式下，客戶需要負責？","opts":["機房供電","操作系統及以上（補丁、配置、應用）","物理服務器","虛擬化層"],"ans":1,"exp":"IaaS 客戶拿到的是虛擬機，OS 以上的補丁、配置、應用與數據都歸客戶。"},{"id":"3-4-08","ch":3,"level":"3-4","tag":"雲","diff":3,"q":"多租戶環境的典型風險是？","opts":["帶寬不足","電費太高","軟件許可費用增加","隔離失效導致跨租戶數據洩露"],"ans":3,"exp":"租戶共享底層資源，隔離機制一旦有缺陷就可能橫向穿透。"},{"id":"3-5-01","ch":3,"level":"3-5","tag":"密碼","diff":2,"q":"對稱加密的主要缺點是？","opts":["密鑰分發困難，且不能提供不可否認性","加密速度太慢","密鑰長度太短","無法處理大數據"],"ans":0,"exp":"雙方共享同一密鑰，分發和管理困難，也證明不了是誰加密的。"},{"id":"3-5-02","ch":3,"level":"3-5","tag":"密碼","diff":2,"q":"AES 支持的密鑰長度是？","opts":["56/112/168","64/128/256","128/192/256","1024/2048/4096"],"ans":2,"exp":"AES 分組 128 位，密鑰 128/192/256 位。"},{"id":"3-5-03","ch":3,"level":"3-5","tag":"密碼","diff":2,"q":"DES 的有效密鑰長度是？","opts":["64 位","56 位","128 位","32 位"],"ans":1,"exp":"DES 密鑰名義 64 位，其中 8 位作校驗，有效 56 位，早已不安全。"},{"id":"3-5-04","ch":3,"level":"3-5","tag":"密碼","diff":3,"q":"Diffie-Hellman 算法能提供什麼？","opts":["加密與簽名","僅數字簽名","僅哈希","密鑰交換，但不提供加密與簽名"],"ans":3,"exp":"DH 只完成密鑰協商，且不認證雙方身份，易受中間人攻擊。"},{"id":"3-5-05","ch":3,"level":"3-5","tag":"密碼","diff":3,"q":"ECC 256 位的強度大致相當於 RSA 多少位？","opts":["3072 位","1024 位","4096 位","2048 位"],"ans":0,"exp":"橢圓曲線密鑰短但強度高，256 位 ECC ≈ 3072 位 RSA。"},{"id":"3-5-06","ch":3,"level":"3-5","tag":"密碼","diff":2,"q":"加鹽（Salt）的主要作用是？","opts":["提高加密速度","壓縮數據","防彩虹表與預計算攻擊","增加密鑰長度"],"ans":2,"exp":"鹽讓相同密碼得到不同哈希，預計算表失效；還要配合慢哈希防暴力。"},{"id":"3-5-07","ch":3,"level":"3-5","tag":"密碼","diff":3,"q":"數字簽名的正確流程是？","opts":["發送方用公鑰簽名，接收方用私鑰驗證","發送方用自己的私鑰籤消息哈希，接收方用發送方公鑰驗證","雙方用同一把對稱密鑰簽名","用哈希直接當簽名"],"ans":1,"exp":"私鑰籤、公鑰驗；提供完整性、認證、不可否認。"},{"id":"3-5-08","ch":3,"level":"3-5","tag":"密碼","diff":3,"q":"混合加密的典型做法是？","opts":["只用對稱加密","只用非對稱加密","兩次對稱加密","用非對稱加密交換對稱密鑰，再用對稱加密數據"],"ans":3,"exp":"TLS 就是這套：非對稱解決密鑰分發，對稱解決性能。"},{"id":"3-6-01","ch":3,"level":"3-6","tag":"威脅","diff":3,"q":"TOCTOU 攻擊利用的是？","opts":["檢驗與使用之間的時間窗口","數據庫索引缺失","加密密鑰太短","網絡帶寬不足"],"ans":0,"exp":"Time-of-Check 與 Time-of-Use 之間資源被替換，也叫異步攻擊。"},{"id":"3-6-02","ch":3,"level":"3-6","tag":"威脅","diff":3,"q":"隱蔽通道（Covert Channel）分為哪兩類？","opts":["上行與下行","內網與外網","存儲隱蔽通道與時間隱蔽通道","加密與未加密"],"ans":2,"exp":"用存儲位置傳信息 vs 用時間/響應快慢傳信息。"},{"id":"3-6-03","ch":3,"level":"3-6","tag":"物理","diff":3,"q":"機房發生火災時，推薦的滅火系統與滅火劑組合是？","opts":["溼式噴淋 + 水","預作用系統 + 潔淨劑（FM-200 等）","乾粉 + 手動滅火器","泡沫滅火系統"],"ans":1,"exp":"預作用避免誤噴，潔淨劑不損設備、不傷人員。"},{"id":"3-6-04","ch":3,"level":"3-6","tag":"物理","diff":3,"q":"使用 CO₂ 滅火系統時最重要的注意事項是？","opts":["滅火後要通風","不能用於電氣火災","必須每年更換鋼瓶","人員必須撤離，防止窒息"],"ans":3,"exp":"CO₂ 會置換氧氣，機房人員必須撤離，這也是它常被潔淨劑替代的原因。"},{"id":"3-6-05","ch":3,"level":"3-6","tag":"物理","diff":3,"q":"CPTED（環境設計預防犯罪）的三要素是？","opts":["自然監視、自然訪問控制、領地強化","圍牆、電網、攝像頭","門禁、保安、巡邏","照明、綠化、停車位"],"ans":0,"exp":"用環境設計降低犯罪機會，是物理安全的理論框架。"},{"id":"3-6-06","ch":3,"level":"3-6","tag":"物理","diff":3,"q":"在線式 UPS 的特點是？","opts":["斷電時才切換","只保護服務器","始終由逆變器供電，電能質量最好","不能接發電機"],"ans":2,"exp":"在線式持續逆變，切換無中斷；離線式斷電才切換。"},{"id":"3-6-07","ch":3,"level":"3-6","tag":"物理","diff":3,"q":"機房火災探測推薦使用？","opts":["離子式煙感","吸氣式煙霧探測（ASD）","熱感探測器","手動報警按鈕"],"ans":1,"exp":"吸氣式靈敏度高，能在陰燃階段發現，適合高價值機房。"},{"id":"3-6-08","ch":3,"level":"3-6","tag":"物理","diff":2,"q":"雙人規則（Two-Person Rule）適用於？","opts":["日常辦公區","員工食堂","停車場","高敏感區域或高風險操作"],"ans":3,"exp":"要求兩人同時在場，防止單人作案或誤操作。"},{"id":"off4-1","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"下列哪個術語描述了一段時間的瞬時高壓？","opts":["Sag","Brownout","Spike","Surge"],"ans":2,"exp":"功率尖峰power spike是高壓的一個瞬間。電湧surge是長時間的高電壓。Sag和brownout是低電壓期間。","src":"OPTv4 第12章"},{"id":"off4-2","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"Greg需要標記用於其公司醫療保險索賠數據庫的驅動器。以下列表中的哪個數據標籤最符合他正在處理的數據類型？","opts":["PII","Secret","Business confidential","PHI"],"ans":3,"exp":"醫療保險索賠將包含受保護的健康信息，或PHI。Greg應該將驅動器標記為包含PHI，然後確保根據其組織對此類數據的處理標準來處理它們。","src":"OPTv4 第12章"},{"id":"off4-3","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Chris是一家大公司的信息安全專家，當他走進大樓時，他注意到一個安全區域的門半開著。物理安全不屬於他的職責範圍，但他立即採取行動，關上了門，並將他的行動通知了物理安全團隊。克里斯在論證什麼原理？","opts":["Due care","Crime prevention through environmental design","Separation of duties","Informed consent"],"ans":0,"exp":"應盡關注原則指出，一個人在某種情況下應該以任何正常人應有的同樣程度的注意做出反應。這是一個非常寬泛的標準。通過環境設計預防犯罪是一種設計理念，其重點是減少環境對非法或有害行為的影響。職責分離對職責進行了劃分，以確保惡意行為者無法獨自執行購買和批准等操作。知情同意是醫療行業中使用的一個術語，要求必須獲得個人的許可，並且他們必須知道自己的行為可能產生的後果。","src":"OPTv4 第12章"},{"id":"off4-4","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"以下哪一項指標指定了業務連續性規劃人員認為災難後恢復服務可接受的時間量？","opts":["MTD","RTO","RPO","MTO"],"ans":1,"exp":"恢復時間目標(RTO)是指災難發生後，在不對業務造成不可接受的影響的情況下，恢復服務所需的時間。每項服務的RTO都是在業務影響評估期間確定的。","src":"OPTv4 第12章"},{"id":"off4-5","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"Chris正在兩棟建築之間使用6類電纜部署千兆以太網。根據6類標準，他可以敷設電纜的最大距離是多少？","opts":["50 meters","100 meters","200 meters","300 meters"],"ans":1,"exp":"6類電纜的最大允許長度為100米，即328英尺。長距離通常通過光纖線路或使用交換機或中繼器等網絡設備來處理，這不僅是因為距離，還因為室外線路可能會遭受雷擊，而雷擊不會影響光纖。瞭解銅雙絞線的距離限制在許多網絡設計中非常重要，並會影響交換機和其它設備的放置位置。","src":"OPTv4 第12章"},{"id":"off4-6","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"Carlos正在規劃一個數據中心的設計，該數據中心將建在一個新的四層公司總部內。這座建築由一個地下室和三個地上樓層組成。數據中心的最佳位置是哪裡？","opts":["Basement","First floor","Second floor","Third floor"],"ans":2,"exp":"數據中心應該位於建築物的核心。將它放置在較低的樓層會使它容易受到洪水和物理入侵的影響。把它放在頂樓會使它容易被風和屋頂損壞。","src":"OPTv4 第12章"},{"id":"off4-7","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"以下哪種滅火系統會造成最大的意外洩漏風險，從而損壞數據中心的設備？","opts":["Wet pipe","Dry pipe","Deluge","Preaction"],"ans":0,"exp":"幹管、噴淋和預作用系統都使用空管，直到系統檢測到火災跡象。溼式管道系統使用充滿水的管道，如果管道損壞，可能會損壞設備。","src":"OPTv4 第12章"},{"id":"off4-8","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"什麼級別的RAID也稱為磁盤條帶化？","opts":["RAID 0","RAID 1","RAID 5","RAID 10"],"ans":0,"exp":"RAID級別0也稱為磁盤條帶化。RAID 1稱為磁盤鏡像。RAID 5被稱為帶奇偶校驗的磁盤條帶化。RAID 10被稱為鏡像條帶。","src":"OPTv4 第12章"},{"id":"off4-9","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Carlos的團隊發現了一個漏洞，並啟動了事件響應流程。接下來會發生什麼？","opts":["Remediation","Mitigation","Reporting","Lessons learned"],"ans":1,"exp":"典型的事件響應(IR)流程將在響應開始後開始緩解工作，然後進入恢復、報告和吸取教訓階段。重要的是要記住，雖然IR週期被繪製為一個週期，但隨著新問題或細節的確定，它經常在各個階段之間來回移動。","src":"OPTv4 第12章"},{"id":"off4-10","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"Manesh希望幫助他的組織構建安全軟件。以下哪一項不是使用安全框架和庫的常見安全最佳實踐？","opts":["Use internally developed libraries and frameworks whenever possible to reduce third-party threats.","Identify and inventory all third-party libraries.","Encapsulate libraries to prevent the use of functions that are not needed.","Update libraries and components on a regular basis."],"ans":0,"exp":"OWASP為庫和框架推薦了四個關鍵的最佳實踐:使用來自廣泛使用且維護良好的可信來源的庫和框架，維護第三方庫的清單，主動更新庫和組件，以及通過限制可以使用的功能來減少攻擊面。對於大多數組織來說，構建自己的框架和庫比使用維護良好和受支持的現有選項更有可能導致漏洞。","src":"OPTv4 第12章"},{"id":"off4-11","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"通常採用什麼流程來確保即將停止使用但將被轉售或重新使用的工作站的數據安全？","opts":["Destruction","Erasing","Sanitization","Clearing"],"ans":2,"exp":"如果處理得當，清理過程可以完全確保數據在重新使用之前不會留在系統上。清除和擦除都很容易失敗，當然，銷燬也不會使機器或設備可供重複使用。","src":"OPTv4 第12章"},{"id":"off4-12","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"下圖顯示了什麼軟件開發生命週期模型？","opts":["Spiral","Agile","Boehm","Waterfall"],"ans":3,"exp":"該圖顯示了由溫斯頓·羅伊斯開發的瀑布模型。該模型的一個重要特徵是一系列連續的步驟，其中包括一個反饋循環，允許流程在必要時返回當前步驟之前的一個步驟。\nC選項的Boehm模型是由Barry W. Boehm在1978年提出的一個軟件質量模型。","src":"OPTv4 第12章"},{"id":"off4-13","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"Susan公司的領導層要求她實施一個訪問控制系統，該系統可以支持規則聲明，如“僅允許銷售人員在上午8點到下午6點之間通過無線網絡從受管設備進行訪問”。Susan的最佳選擇是哪種類型的訪問控制系統？","opts":["ABAC","RBAC","DAC","MAC"],"ans":0,"exp":"基於屬性的訪問控制(ABAC)系統將允許Susan指定關於主題、客體和訪問的細節，從而允許粒度控制。雖然基於規則的訪問控制系統(RBAC)可能允許這樣做，但基於屬性的訪問控制系統可能更具體，因此也更靈活。自主訪問控制(DAC)將允許客體所有者做出決策，強制訪問控制(MAC)將使用分類；這些功能都沒有在需求中描述。","src":"OPTv4 第12章"},{"id":"off4-14","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"以下哪一項是描述個人必須完成的具體行動的詳細分步文檔？","opts":["Policy","Standard","Guideline","Procedure"],"ans":3,"exp":"程序是正式的強制性文件，提供執行任務的個人所需的詳細、逐步的行動。","src":"OPTv4 第12章"},{"id":"off4-15","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"下圖顯示了一個攻擊示例，攻擊者Mal將流量從用戶系統重定向到自己的系統，從而讀取TLS加密的流量。以下哪個術語最恰當地描述了這種攻擊？","opts":["A DNS hijacking attack","An ARP spoofing attack","A man-in-the-middle attack","A SQL injection attack"],"ans":2,"exp":"中間人(MiTM)通常被稱為中間人或路徑攻擊，它允許攻擊者重定向流量，從而讀取或修改流量。這對最終用戶來說是完全透明的，如果惡意行為者得逞，危害極大。DNS劫持會改變系統的域名信息，這裡沒有直接的指示。類似地，ARP欺騙是進行MiTM攻擊的一種方式，但是這裡也沒有詳細說明。SQL注入通常通過web應用程序對數據庫服務器執行命令來完成。","src":"OPTv4 第12章"},{"id":"off4-16","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"Saria是一家醫療保健機構的系統所有者。對於駐留在她所擁有的系統上或由其處理的數據，她有什麼職責？","opts":["She has to classify the data.","She has to make sure that appropriate security controls are in place to protect the data.","She has to grant appropriate access to personnel.","She bears sole responsibility for ensuring that data is protected at rest, in transit, and in use."],"ans":1,"exp":"系統所有者與系統管理員一起開發和維護系統安全計劃，他們必須確保在這些系統上實施適當的安全控制。系統所有者也與數據所有者分擔數據保護的責任。系統管理員授予適當的訪問權限並應用控制，而數據所有者擁有分類流程。","src":"OPTv4 第12章"},{"id":"off4-17","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"Jill正在為她的組織採購新的網絡硬件。她找到了一個灰色市場供應商，該供應商以低得多的價格從國外進口硬件。對於以這種方式獲得的硬件來說，最重要的安全問題是什麼？","opts":["The security of the hardware and firmware","Availability of support for the hardware and software","Whether the hardware is a legitimate product of the actual vendor","The age of the hardware"],"ans":0,"exp":"這些答案中的每一個都可能是一個問題，但是最重要的安全問題是硬件和固件是否可信或者是否已經被修改。原始設備製造商(OEM)有商業原因來確保其產品的安全性，但供應鏈中的第三方可能不會感受到同樣的壓力。支持的可用性和硬件是否合法也是需要關注的問題，但是不太直接的安全問題。最後，硬件可能比預期的要舊，比如可能已經被使用過的、翻新的或者其他情形(反正就不是新的)。","src":"OPTv4 第12章"},{"id":"off4-18","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"Ben的團隊負責確保離開其組織的設備不包含組織數據。作為流程的一部分，他們已經擦除並重新格式化了系統中的驅動器，這些驅動器將被送往第三方電子回收公司，但一名記者最近報道稱，委託給Ben公司的組織是從回收公司購買的驅動器中恢復的。Ben的團隊遇到了什麼問題，他們應該選擇什麼解決方案來最有效地防止這個問題？","opts":["Data permanence, process certification","Data remanence, driver destruction","Data permanence, using a degausser","Data remanence, zero fill"],"ans":1,"exp":"數據殘留是指在嘗試刪除數據後，數據仍保留在介質上。銷燬驅動器是確保數據不可恢復的一種方式。數據持久性描述數據持續多長時間，並且不用於數據保留在設備上的情況。","src":"OPTv4 第12章"},{"id":"off4-19","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"Harold正在尋找一種軟件開發方法，這種方法將有助於解決他在組織中看到的一個主要問題。目前，開發人員和操作人員不在一起工作，並且經常被視為將問題“拋給”其他團隊。什麼技術管理方法被設計用來緩解這個問題？","opts":["ITIL","Lean","ITSM","DevOps"],"ans":3,"exp":"DevOps技術管理方法尋求將軟件開發、操作和質量保證集成為一個整體。它特別試圖通過在IT團隊成員之間建立協作關係，以消除收到問題並“將問題直接扔到圍欄另一側”的不良運營模式。","src":"OPTv4 第12章"},{"id":"off4-20","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"一名安全研究人員向Mikayla的組織通報了他們產品中的一個繞過身份驗證的漏洞。研究人員表示，如果Mikayla的公司未能修復該漏洞，他們將在接下來的90天內分享有關該漏洞的詳細信息。但是，他們也願意與公司合作，幫助他們瞭解問題，併為他們提供如何重現問題的完整細節。研究者遵循了什麼過程？","opts":["A CVE creation process","A bug bounty","Ethical disclosure","Blackmail"],"ans":2,"exp":"道德披露包括告知組織缺陷和問題。與bug獎金不同的是，其不依賴於提供財務或其他獎勵的組織。道德披露可能涉及時間框架，以確保公司不會忽視問題，但關注合作和公共安全是常見的。當缺陷被報告給CVE項目後會生成CVE記錄。該描述不涉及勒索行為。","src":"OPTv4 第12章"},{"id":"off4-21","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Marco希望部署一種網絡安全設備，該設備能夠檢測並阻止基於網絡的攻擊，而無需額外的外部干預。他應該使用什麼類型的設備，採用什麼配置？","opts":["An inline IDS","An IDS connected through a network tap","An inline IPS","An IPS connected through a network tap"],"ans":2,"exp":"雖然入侵檢測系統(IDS)和入侵防禦系統(IPS)都可以檢測攻擊，但只有IPS可以阻止攻擊。這需要將IPS放置在串行內聯位置。如果通過網絡分路器、span端口或其他用於複製網絡流量的類似工具的連接都會使得設備沒法直接採取防禦措施。","src":"OPTv4 第12章"},{"id":"off4-22","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"Kerberos身份驗證中的服務票證(ST)提供了什麼？","opts":["It serves as the authentication host.","It provides proof that the subject is authorized to access an object.","It provides proof that a subject has authenticated through a KDC and can request tickets to access other objects.","It provides ticket granting services."],"ans":1,"exp":"Kerberos身份驗證中的服務票據ST提供了主體被授權訪問客體的證據。票據發放服務由TGS提供。證明主體已經過身份驗證，可以向其他客體請求票證並使用票證授予票證。身份驗證主機是一個虛構的術語。","src":"OPTv4 第12章"},{"id":"off4-23","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"Sally希望保護其組織的VoIP系統。以下哪種攻擊是她不必擔心的？","opts":["Eavesdropping","Denial-of-service","XSS","Caller ID spoofing"],"ans":2,"exp":"竊聽、拒絕服務攻擊和來電顯示欺騙都是常見的VoIP攻擊。跨站點腳本面向web應用程序，而不是VoIP系統。","src":"OPTv4 第12章"},{"id":"off4-24","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"Fred的公司希望確保通過中央電子郵件服務器發送的電子郵件的完整性。如果消息的保密性不重要，Fred應該建議什麼解決方案？","opts":["Digitally sign and encrypt all messages to ensure integrity.","Digitally sign but don't encrypt all messages.","Use TLS to protect messages, ensuring their integrity.","Use a hashing algorithm to provide a hash in each message to prove that it hasn't changed."],"ans":1,"exp":"Fred的公司需要保護完整性，這可以通過對郵件進行數字簽名來實現。任何更改都將導致簽名無效。加密沒有必要，因為公司不想保護機密。TLS可以提供傳輸中的保護，但不能保護消息的完整性，當然，如果使用的散列無法驗證該散列沒有被更改，也不能確保完整性。","src":"OPTv4 第12章"},{"id":"off4-25","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"Selah希望確保車輛不會撞進公司的入口通道和前廳，同時行人、輪椅或其他移動設備仍然可以進入。什麼樣的物理安全控制最適合這一目的？","opts":["Fences","Bollards","Walls","Stairs"],"ans":1,"exp":"升降地柱是一種物理安全解決方案，是短而堅固的柱子或類似的解決方案，旨在阻止車輛衝撞或通過某個區域。升降地柱可用於在停車時讓行人和可移動設備通過。柵欄和牆壁會阻止個人通過它們，而樓梯對大多數移動設備來說是具有挑戰性的。","src":"OPTv4 第12章"},{"id":"off4-26","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"Melissa負責其組織的安全合規性工作，她被告知，除非存在正在被積極利用的零日漏洞，否則該組織在修補程序發佈一個月後才會安裝Windows修補程序。為什麼公司會像這樣推遲修補？","opts":["To minimize business impact of the installation","To allow any flaws with the patch to be identified","To prevent malware in the patches from being installed before it is identified","To allow the patch to be distributed to all systems"],"ans":1,"exp":"許多組織將修補程序延遲一段時間，以確保在整個組織安裝修補程序之前發現任何以前未發現的缺陷。Melissa需要在她的角色中平衡業務影響和安全性，她可能會根據組織的風險承受能力和安全需求選擇支持這一點或推動更積極的安裝實踐。","src":"OPTv4 第12章"},{"id":"off4-27","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Saria的開發團隊正在開發的web應用程序需要提供安全的會話管理，以防止使用應用程序所依賴的cookies劫持會話。下面哪種方法是她推薦的最好的預防方法？","opts":["Set the Secure attribute for the cookies, thus forcing TLS.","Set the Domain cookie attribute to example.com to limit cookie access to servers in the same domain.","Set the Expires cookie attribute to less than a week.","Set the HTTPOnly attribute to require only unencrypted sessions."],"ans":0,"exp":"設置安全cookie將允許僅通過HTTPS TLS或SSL會話發送cookie，從而防止針對cookie的中間人攻擊。其餘設置都有問題。例如，cookies容易受到DNS欺騙。域cookie通常應該具有儘可能窄的範圍，這實際上是通過不設置域cookie來實現的。這僅允許原始服務器訪問cookie。沒有Expires或Max-age屬性的cookie是短暫的，只會為會話保留，這使它們比存儲的cookie更不容易受到攻擊。通常，HTTPOnly屬性是一個好主意，但是它阻止腳本而不是要求未加密的HTTP會話。","src":"OPTv4 第12章"},{"id":"off4-28","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"提供帳戶開通、管理、身份驗證、授權、報告和監控功能的基於雲的服務被稱為哪種類型的服務？","opts":["PaaS","IDaaS","IaaS","SaaS"],"ans":1,"exp":"身份即服務(IDaaS)提供帳戶供應、管理、身份驗證、授權、報告和監控等功能。平臺即服務(PaaS)、基礎設施即服務(IaaS)和軟件即服務(SaaS)是雲服務模式，但不提供問題中描述的身份和訪問管理功能。","src":"OPTv4 第12章"},{"id":"off4-29","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"IPsec的哪個組件提供身份驗證、完整性和不可否認性？","opts":["L2TP","Encapsulating Security Payload","Encryption Security Header","Authentication Header"],"ans":3,"exp":"驗證頭HA為IPsec連接提供身份驗證、完整性和不可否認性。封裝安全有效載荷ESP提供加密，從而提供機密性。它還可以提供有限的身份驗證。L2TP是一個獨立的VPN協議，加密安全頭是一個虛構的術語。","src":"OPTv4 第12章"},{"id":"off4-30","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"Renee正在查看日誌，並注意到她網絡上的一個系統最近在短時間內收到了來自一個系統的所有65536個TCP端口的連接嘗試。Renee最有可能經歷了什麼類型的攻擊？","opts":["Denial of service","Reconnaissance","Malicious insider","Compromise"],"ans":1,"exp":"該場景中描述的攻擊是TCP掃描的經典示例，這是一種可能先於其他攻擊的網絡偵察技術。沒有證據表明攻擊破壞了系統可用性，這將是拒絕服務攻擊的特徵；也沒有證據表明它是由一個惡意的內部人員發動的，或者攻擊已導致系統受損。","src":"OPTv4 第12章"},{"id":"off4-31","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"在入侵嘗試期間，下列哪一項為攻擊者準備了最複雜的誘餌環境？","opts":["Honeypot","Darknet","Honeynet","Pseudo-flaw"],"ans":2,"exp":"蜜罐是一種用來引誘入侵者攻擊的誘餌計算機系統。蜜網是一個由多個蜜罐組成的網絡，它為入侵者創造了一個更復雜的探索環境。偽缺陷是系統中可能轉移攻擊者注意力的虛假漏洞。管理員通常在蜜罐上添加偽缺陷，以模擬眾所周知的操作系統漏洞。暗網是一段未使用的網絡地址空間，應該沒有任何網絡活動，因此很容易被用來監控非法活動。","src":"OPTv4 第12章"},{"id":"off4-32","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"Carlos正在調查他的組織中敏感信息的洩露。他認為攻擊者設法從數據庫中檢索了所有員工的個人信息，並在一個基於web的人事管理系統的日誌條目中發現了以下用戶提供的輸入:Collins'&1=1;--What type of attack took place, and how could it be prevented?\n發生了什麼類型的攻擊，以及如何預防？","opts":["SQL injection, use of stored procedures","Buffer overflow, automatic buffer expansion","Cross-site scripting, turning on XSS prevention on the web server","Cross-site request forgery, requiring signed requests"],"ans":0,"exp":"輸入字段中的單引號表明這是一次SQL注入攻擊。引號用於轉義SQL代碼的輸入字段，後面的文本用於直接操作從web應用程序發送到數據庫的SQL命令。","src":"OPTv4 第12章"},{"id":"off4-33","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Diana的組織教導員工，如果他們被綁架或受到威脅，可以使用預先安排的代碼與組織聯繫。這是什麼類型的解決方案？","opts":["A duress code","A panic button","A kidnap code","A threat code"],"ans":0,"exp":"脅迫代碼是預先安排的代碼，用於表明工作人員受到脅迫。它們通常被設計成在正常對話期間易於交流，而不會驚動任何可能正在收聽的人。緊急按鈕是用於召喚緊急服務或響應者的物理按鈕。綁架代碼和威脅代碼是為這個問題編造的。","src":"OPTv4 第12章"},{"id":"off4-34","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"封裝是支持哪一種類型協議的核心概念？","opts":["Bridging","Multilayer","Hashing","Storage"],"ans":1,"exp":"封裝為多層協議帶來了好處，也帶來了潛在的問題。橋接可以使用各種協議，但不依賴於封裝。哈希和存儲協議通常不依賴封裝作為其功能的核心部分。","src":"OPTv4 第12章"},{"id":"off4-35","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"Bob承擔了編寫一個策略的任務，該策略描述了數據應保留多長時間以及何時應清除數據。這項政策涉及什麼概念？","opts":["Data remanence","Record retention","Data redaction","Audit logging"],"ans":1,"exp":"記錄保留可確保數據在需要時被保留和維護，並在不再需要時被清除。當試圖刪除數據後留下數據時，就會發生數據殘留，而數據編輯不是描述這種努力的技術術語。最後，審計日誌可能是保留記錄的一部分，但並不描述數據的生命週期。","src":"OPTv4 第12章"},{"id":"off4-36","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"Judy正準備進行業務影響分析。在這個過程中她的第一步應該是什麼？","opts":["Identify threats to the business.","Identify risks to the organization.","Identify business priorities.","Conduct likelihood analysis."],"ans":2,"exp":"業務影響分析的第一步是確定業務的優先級。Judy應該確保所有業務領域都有代表，並且每個部門或領域的職能都得到評估。一旦完成，她就可以繼續識別風險，評估可能性和影響，然後對業務可用的資源進行優先級排序，以解決已識別的優先級。","src":"OPTv4 第12章"},{"id":"off4-37","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"什麼類型的訪問控制旨在通過在事件發生後提供信息來發現不期望發生的或未經授權的活動？","opts":["Preventive","Corrective","Detective","Directive"],"ans":2,"exp":"檢測訪問控制在事件發生後運行，旨在檢測或發現不需要的訪問或活動。預防性訪問控制旨在防止活動發生，而糾正性控制在問題發生後將環境恢復到其原始狀態。指令性訪問控制限制或指導主體的操作，以確保符合策略。","src":"OPTv4 第12章"},{"id":"off4-38","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"手機熱點給企業網絡帶來的最常見風險是什麼？","opts":["They can provide attackers with an unsecured network path into your network.","They can be used like rogue access points for man-in-the-middle attacks.","They allow wireless data to be intercepted.","They are unencrypted and can be easily sniffed."],"ans":0,"exp":"組織通常最關心的是熱點通過筆記本電腦或其他連接到它們的設備創建到安全網絡的不安全網絡連接。將蜂窩連接橋接到企業網絡的網絡連接創建了一條繞過安全控制的路徑。熱點可能被用作流氓接入點，但這種情況不太常見。它們不特別允許無線數據被攔截，並且在大多數現代實現中，被加密，因此限制了嗅探提供有用數據的可能性。","src":"OPTv4 第12章"},{"id":"off4-39","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Amanda的醫療保健提供者維護著關於她的健康、治療和醫療賬單等數據。這是什麼類型的數據？","opts":["Protected health information","Personally identifiable information","Protected health insurance","Individual protected data"],"ans":0,"exp":"HIPAA將受保護健康信息(PHI)定義為包括醫療保健提供者使用的健康信息，如醫療、歷史和賬單。個人可識別信息(PII)是可用於識別個人身份的信息，可能包含在PHI中，但不是專門的此類數據。受保護的健康保險和個人受保護的數據都是虛構的術語。","src":"OPTv4 第12章"},{"id":"off4-40","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"Jack正在更新他的災難恢復計劃，並希望確保與他的組織簽約的第三方數據中心能夠處理災難中所需的擴展需求。Jack應該與託管提供商簽署什麼類型的協議？","opts":["A resource capacity agreement","A cold-site agreement","An NDA","A business continuity agreement"],"ans":0,"exp":"資源容量協議用於確保在恢復場景中有適當的資源可用。冷站點只有空間和基礎設施，不提供完整的恢復資源。保密協議保護信息，但不能確保資源可用性，業務連續性協議不是CISSP考試中使用的術語。","src":"OPTv4 第12章"},{"id":"off4-41","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"Nora的公司運營服務器的生命週期為五年。根據該流程，當這些服務器達到其使用壽命時，它們將被送往電子垃圾回收商。Nora可以實施以下哪種最有效的控制來確保不會因剩餘數據而發生數據洩露？","opts":["Zero wipe the drives before the servers leave the organization.","Remove the drives and shred them.","Reformat the drives before the servers are sent to the e-waste company.","Require certificates of disposal from the e-waste company."],"ans":1,"exp":"最有效的控制是移除驅動器並粉碎它們，消除服務器留下數據的任何機會。一家可以提供帶有適當合同控制的處置證書的值得信賴的公司可能是一個合理且經濟高效的替代方案，但該公司可能還希望在系統離開之前將驅動器擦除為零，以降低系統脫離回收公司控制的風險。這裡最糟糕的答案是重新格式化，這不會刪除數據。","src":"OPTv4 第12章"},{"id":"off4-42","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"Ed的任務是保護其組織客戶的信息，包括他們的姓名、社會保險號、出生日期和出生地，以及各種其他信息。這種信息被稱為什麼？","opts":["PHI","PII","Personal protected data","PID"],"ans":1,"exp":"個人身份信息(PII)可以用來區分一個人的身份。受保護健康信息(PHI)包括病歷、實驗室結果、保險信息和其他有關患者的詳細信息等數據。個人受保護數據是一個虛構的術語，PID是進程ID的首字母縮寫，是與正在運行的程序或進程相關聯的編號。","src":"OPTv4 第12章"},{"id":"off4-43","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"組織中經常使用CIS基準的目的是什麼？","opts":["Secure coding standards","Performance testing","Baselining","Monitoring metrics"],"ans":2,"exp":"CIS基準是經常用於評估設備和軟件的安全設置或配置的配置基準。基線是配置和驗證系統是否符合安全配置準則或標準的過程。","src":"OPTv4 第12章"},{"id":"off4-44","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"Colleen正在進行一項軟件測試，評估代碼的安全性缺陷和可用性問題。她從最終用戶的角度使用應用程序，並在產品開發過程中引用源代碼。科琳在進行什麼類型的測試？","opts":["White box","Blue box","Gray box","Black box"],"ans":2,"exp":"在灰箱測試中，測試人員從用戶的角度評估軟件，但是在測試過程中可以訪問源代碼。白盒測試也可以訪問源代碼，但是從開發人員的角度來執行測試。黑盒測試從用戶的角度工作，但是不能訪問源代碼。藍盒子是電話竊聽工具，而不是軟件測試技術。注意:隨著語言的變化，零知識、部分知識和全部知識等新術語開始取代白盒、灰盒和黑盒測試術語。","src":"OPTv4 第12章"},{"id":"off4-45","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Marty發現他的組織中的訪問限制允許任何用戶登錄分配給任何其他用戶的工作站，即使他們來自完全不同的部門。這種類型的訪問最直接地違反了哪項信息安全原則？","opts":["Separation of duties","Two-person control","Need to know","Least privilege"],"ans":3,"exp":"這種廣泛的訪問權限可能會間接違反所有列出的安全原則，但它最直接地違反了最低權限，因為它授予了用戶他們的工作職責所不需要的權限。","src":"OPTv4 第12章"},{"id":"off4-46","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"以下哪種調查類型總是使用排除合理懷疑的證據標準？","opts":["Civil investigation","Criminal investigation","Operational investigation","Regulatory investigation"],"ans":1,"exp":"刑事調查事關重大，對罪犯的嚴厲懲罰可能包括監禁。因此，他們使用所有調查中最嚴格的證據標準:排除合理懷疑。民事調查使用優勢證據標準。監管調查可以使用任何適用於證據聽證場所的標準。這可能包括排除合理懷疑標準，但在美國的監管調查中並不總是使用。運營調查不使用證據標準。","src":"OPTv4 第12章"},{"id":"off4-47","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"NIST特別出版物800-92《計算機安全日誌管理指南》描述了日誌管理面臨的四種常見挑戰:\n①　Many log sources\n大量日誌源\n②　Inconsistent log content\n日誌內容不一致\n③　Inconsistent timestamps\n時間戳不一致\n④　Inconsistent log formats\n不一致的日誌格式\nWhich of the following solutions is best suited to solving these issues?\n以下哪種解決方案最適合解決這些問題？","opts":["Implement SNMP for all logging devices.","Implement a SIEM tool.","Standardize the Windows event log format for all devices and use NTP.","Ensure that logging is enabled on all endpoints using their native logging formats and set their local time correctly."],"ans":1,"exp":"安全信息和事件管理(SIEM)工具旨在以多種格式集中來自多個位置的日誌，並確保儘管不同系統和設備之間存在差異，也能讀取和分析日誌。簡單網絡管理協議(SNMP)用於一些日誌消息傳遞，但不是解決所有這些問題的解決方案。儘管使用NTP進行時間同步是一個好主意，但大多數非Windows設備，包括網絡設備等，都不是為使用Windows事件日誌格式而設計的。最後，本地日誌記錄是有用的，但是單獨設置時鐘會導致時間漂移，並且不能解決許多日誌源的問題。","src":"OPTv4 第12章"},{"id":"off4-48","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"Howard是一名安全分析師，與一名經驗豐富的計算機取證調查員合作。調查員要求他檢索一個取證驅動器控制器，但Howard無法在存儲室中找到具有該名稱的設備。取證驅動器控制器的另一個名稱是什麼？","opts":["RAID controller","Write blocker","SCSI terminator","Forensic device analyzer"],"ans":1,"exp":"取證驅動器控制器的主要功能之一是防止發送到設備的任何命令修改存儲在設備上的數據。因此，取證驅動器控制器也經常被稱為寫阻止器。","src":"OPTv4 第12章"},{"id":"off4-49","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"哪種類型的Windows審核記錄描述了操作系統關閉或服務停止之類的事件？","opts":["An application log","A security log","A system log","A setup log"],"ans":2,"exp":"Windows系統日誌包括重新啟動、關機和服務狀態更改。應用程序日誌記錄程序生成的事件，安全日誌跟蹤登錄和權限使用等事件，安裝日誌跟蹤應用程序安裝。","src":"OPTv4 第12章"},{"id":"off4-50","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"Kristen希望為她的數據使用多個處理站點，但不想為整個數據中心付費。如果她希望能夠將部分自定義應用程序環境快速遷移到多個國家的設施，而不必等待發運或購買硬件，你會推薦以下哪個選項作為她的最佳選項？","opts":["A cloud PaaS vendor","A hosted data center provider","A cloud IaaS vendor","A data center vendor that provides rack, power, and remote hands services"],"ans":2,"exp":"雲IaaS供應商將允許Kristen以她能夠部署和支付的速度建立基礎設施。PaaS供應商提供了一個平臺，要求她將自己的定製應用程序遷移到該平臺，這可能比託管數據中心提供商花費的時間更長。一家提供機架、電源和遠程協助的數據中心供應商未能通過測試，因為Kristen希望不必購買或運送硬件。","src":"OPTv4 第12章"},{"id":"off4-51","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"“你所知道的”是什麼類型的認證因素？","opts":["Type 1","Type 2","Type 3","Type 4"],"ans":0,"exp":"類型1身份驗證因素是你所知道的。類型2身份驗證因素是你所擁有的某種東西，如智能卡或硬件令牌。類型3身份驗證因素你所具備的特徵，如生物標識符。不存在第4類身份驗證因素。","src":"OPTv4 第12章"},{"id":"off4-52","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"什麼類型的代碼審查最適合識別業務邏輯缺陷？","opts":["Mutation fuzzing","Manual testing","Generational fuzzing","Interface testing"],"ans":1,"exp":"手動測試使用人類對業務邏輯的理解來評估程序流程和響應。突變或代際模糊將有助於確定程序如何響應預期的輸入，但不會測試業務邏輯。接口測試確保模塊之間的數據交換正常工作，但不關注程序或應用程序的邏輯。","src":"OPTv4 第12章"},{"id":"off4-53","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"Amanda希望在她的應用中使用新用戶已有的Gmail帳戶中的聯繫人。下列選項中的哪個協議用於提供安全的授權訪問？","opts":["Open ID","Kerberos","OAuth","SAML"],"ans":2,"exp":"OAuth專門設計用於提供安全的授權訪問，如允許Amanda的應用程序訪問用戶的Gmail聯繫人，而無需用戶共享其Gmail憑據。它被雲服務廣泛用於此目的。\nOpenID用於使用身份提供商提供的憑據登錄其他服務，例如當你使用Google的ID登錄其他網站或應用時。\nSAML用於身份提供者和服務提供者之間交換認證和授權數據。","src":"OPTv4 第12章"},{"id":"off4-54","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"哪種類型的備用處理設施包含恢復操作所需的硬件，但沒有數據的最新拷貝？","opts":["Hot site","Warm site","Cold site","Mobile site"],"ans":1,"exp":"溫站包含恢復操作所需的硬件，但沒有數據的最新拷貝。","src":"OPTv4 第12章"},{"id":"off4-55","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"Fred需要在不受信任的網絡上的兩臺服務器之間傳輸文件。因為他知道網絡不可信，所以他需要選擇一種加密協議來確保他的數據安全。他應該選擇什麼協議？","opts":["SSH","TCP","SFTP","IPsec"],"ans":2,"exp":"安全文件傳輸協議(SFTP)是專門為加密文件傳輸而設計的。SSH用於安全的命令行訪問，而TCP是常用於通過網絡傳輸數據的互聯網協議包之一。IPsec可用於創建傳輸數據的隧道，但不是專門為文件傳輸而設計的。","src":"OPTv4 第12章"},{"id":"off4-56","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"什麼訪問控制方案標籤主體和客體，並在標籤匹配時允許主體訪問客體？","opts":["DAC","MAC","Rule-based access control (RBAC)","Role-based access control (RBAC)"],"ans":1,"exp":"強制訪問控制(MAC)將標籤應用於主體和客體，並允許主體在標籤匹配時訪問客體。自主訪問控制(DAC)由客體的所有者控制，基於規則的訪問控制(有時稱為Rule-BAC)將規則應用於整個系統，基於角色的訪問控制(有時稱為Role-BAC)將權限基於角色，角色通常作為用戶組來處理。","src":"OPTv4 第12章"},{"id":"off4-57","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"在軟件測試期間，Jack描繪出了黑客可能如何接近他正在審查的應用程序，並確定了黑客可能有什麼要求。然後，他測試系統如何對攻擊者可能的行為做出反應。Jack正在進行什麼類型的測試？","opts":["Misuse case testing","Use-case testing","Hacker use-case testing","Static code analysis"],"ans":0,"exp":"Jack正在進行誤用案例分析，這是一個根據代碼被誤用而不是被正確使用時的表現來測試代碼的過程。用例測試測試有效的用例，而靜態代碼分析包括檢查代碼本身的缺陷，而不是測試實時軟件。黑客用例測試不是一種測試的行業術語。","src":"OPTv4 第12章"},{"id":"off4-59","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"James選擇實施一個NAC解決方案，該方案使用准入後原則來控制網絡連接。嚴格的准入後政策不能處理什麼類型的問題？","opts":["Out-of-band monitoring","Preventing an unpatched laptop from being exploited immediately after connecting to the network","Denying access when user behavior doesn't match an authorization matrix","Allowing a user access to a specific object when user behavior is allowed based on an authorization matrix"],"ans":1,"exp":"准入後原則基於預定義的授權矩陣，基於連接後的用戶活動來允許或拒絕訪問。由於這不會在連接前檢查機器的狀態，因此它不能在連接後立即防止系統被利用。這並不排除帶外或帶內監控，但它確實意味著在系統接入網絡之前，嚴格的准入後策略不會處理系統檢查。","src":"OPTv4 第12章"},{"id":"off4-60","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"Warren想進行內部安全審計。他希望使用一個被廣泛接受的審計框架，這樣他就可以更容易地將結果與其他組織進行比較。他應該選擇以下哪個選項作為他的基本審計框架？","opts":["ITSM","ATT&CK","COBIT","CIS"],"ans":2,"exp":"COBIT，即信息和相關技術的控制目標，框架描述了組織應該為其信息系統制定的通用要求。這是名單上唯一的審計或合規框架。ITSM是信息技術服務管理的縮寫；CIS是信息安全中心，為系統安全提供指導方針，可用於評估系統，但其本身不是審計框架；ATT&CK是一個描述威脅和攻擊方法的框架。","src":"OPTv4 第12章"},{"id":"off4-61","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"Gary工作的公司處理信用卡，並根據信用卡處理的行業標準運營。他的公司需要遵守以下哪項標準？","opts":["ISO27001","FIPS 140","PCI-DSS","ISO 27002"],"ans":2,"exp":"PCI-DSS，即支付卡行業數據安全標準，是Gary的公司需要遵守的行業標準。ISO 27001和27002是信息安全管理標準。FIPS 140是加密模塊的標準。","src":"OPTv4 第12章"},{"id":"off4-62","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"以下哪一個是風險轉移的例子？","opts":["Building a guard shack","Purchasing insurance","Erecting fences","Relocating facilities"],"ans":1,"exp":"風險轉移包括將風險從一方轉移到另一方的行為。購買保險是風險轉移的一個例子，因為它將風險從被保險人轉移到保險公司。","src":"OPTv4 第12章"},{"id":"off4-63","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"Travis擔心他的組織使用Microsoft的BitLocker為系統提供的安全性。如果系統配備了TPM並使用全磁盤加密，根據驅動器的加密狀態，什麼時候系統最不會丟失數據？","opts":["When they are booted up and running because the system monitors for drive access","When the system is shutting down because keys are removed from memory","When they are booting up because the TPM checks for a secure boot process","When they are off because the drive is fully encrypted"],"ans":3,"exp":"當系統關閉且硬盤經過加密且不處於可讀狀態時，硬盤上的文件最為安全。BitLocker在使用時根據需要解密文件，這意味著在系統啟動後的任何時間，文件都可能被訪問，特別是在用戶登錄並獲得對系統的訪問權限或惡意軟件正在運行的情況下。","src":"OPTv4 第12章"},{"id":"off4-64","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Elaine正在為她的組織制定業務連續性計劃。她應該尋求最小化什麼值？","opts":["AV","SSL","RTO","MTO"],"ans":2,"exp":"業務連續性規劃練習的目標是減少恢復運營所需的時間。這可以通過最小化恢復時間目標(RTO)來實現。","src":"OPTv4 第12章"},{"id":"off4-65","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"Jack的數據中心設計要求每個關鍵服務器都有雙電源。在這個設計決策中，他針對的是CIA的哪一部分？","opts":["Confidentiality","Integrity","Availability","None of the above"],"ans":2,"exp":"冗餘是許多可用性設計的一部分。雙電源允許多級可用性支持；它們允許你將服務器連接到不同的電源基礎架構，並在單個電源斷電時提供運行能力。有些服務器甚至設置為使用兩個以上的電源。實現這種可用性的另一種方法是使用更多的系統，而不是對可用性有更大支持的更昂貴的系統。","src":"OPTv4 第12章"},{"id":"off4-66","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"下列關於SDLC的陳述中，哪一項是正確的？","opts":["The SDLC requires the use of an iterative approach to software development.","The SDLC requires the use of a sequential approach to software development.","The SDLC does not include training for end users and support staff.","The waterfall methodology is compatible with the SDLC."],"ans":3,"exp":"SDLC方法包括為支持人員提供操作培訓以及最終用戶培訓的步驟。SDLC可能使用許多開發模型中的一種，包括瀑布模型和螺旋模型。SDLC不要求使用迭代或順序方法；它允許任何一種方法。","src":"OPTv4 第12章"},{"id":"off4-67","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"什麼協議取代了證書撤銷列表並增加了實時狀態驗證？","opts":["RTCP","RTVP","OCSP","CSRTP"],"ans":2,"exp":"在線證書狀態協議(OCSP)通過提供一種實時證書驗證的方法，消除了使用證書吊銷列表固有的延遲。","src":"OPTv4 第12章"},{"id":"off4-68","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"什麼過程使TCP成為面向連接的協議？","opts":["It works via network connections.","It uses a handshake.","It monitors for dropped connections.","It uses a complex header."],"ans":1,"exp":"TCP使用握手過程來建立通信，這使它成為面向連接的協議。TCP不監控斷開的連接，它通過網絡連接工作的事實也不使它面向連接。","src":"OPTv4 第12章"},{"id":"off4-69","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"你正在為你的組織進行定性風險評估。在風險分析中，兩個最重要的風險因素一個是概率，另一個是什麼？","opts":["Likelihood","History","Impact","Cost"],"ans":2,"exp":"定性風險評估的兩個最重要的要素是確定每個風險對組織的概率和影響。可能性是概率的另一種說法。應該考慮成本，但這只是影響的一個因素，還包括聲譽損害、運營中斷和其他不良影響。","src":"OPTv4 第12章"},{"id":"off4-70","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Ben建立了一個訪問控制列表，列出了他的用戶可以訪問的客體。當用戶試圖訪問他們無權訪問的客體時，他們會被拒絕訪問，即使沒有特定的規則禁止這樣做。這種行為的關鍵是什麼訪問控制原則？","opts":["Least privilege","Implicit deny","Explicit deny","Final rule fall-through"],"ans":1,"exp":"隱式拒絕原則聲明，任何未被明確允許的操作都將被拒絕。對於防火牆規則和其他訪問控制系統來說，這是一個重要的概念。實現最小特權可以確保主體只擁有完成工作所需的權限。雖然顯式拒絕和最終規則失敗穿透聽起來像是重要的訪問控制概念，但其實兩者都不是。","src":"OPTv4 第12章"},{"id":"off4-71","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"檢測到危害的平均時間是什麼類型的安全指標？","opts":["MTO","A technical control objective","A compliance objective","A KPI"],"ans":3,"exp":"檢測到危害的平均時間是安全KPI或關鍵性能指標。KPI用於確定實踐、程序和員工的有效性。","src":"OPTv4 第12章"},{"id":"off4-72","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"當考慮潛在的道德違規時，ISC2同行評審委員會可能施加的最高處罰是什麼？","opts":["Revocation of certification","Termination of employment","Financial penalty","Suspension of certification"],"ans":0,"exp":"如果ISC2同行評審委員會發現被認證的個人違反了ISC2道德準則，委員會可以撤銷他們的認證。該委員會不能終止個人就業或評估經濟處罰。","src":"OPTv4 第12章"},{"id":"off4-73","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"Alice向Bob發送了一條消息，並希望確保第三方Mal在傳輸過程中不會讀取消息的內容。愛麗絲試圖達到密碼學的什麼目標？","opts":["Confidentiality","Integrity","Authentication","Nonrepudiation"],"ans":0,"exp":"機密性確保數據在存儲或傳輸過程中不會被未經授權的個人讀取。","src":"OPTv4 第12章"},{"id":"off4-74","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"Chris被指派掃描系統上所有可能的TCP和UDP端口。他必須掃描每種類型的多少個端口才能完成任務？","opts":["65536個TCP端口和32768個UDP端口","1024個通用TCP端口和32768個臨時UDP端口","65536個TCP和65536個UDP端口","16384個TCP端口和16384個UDP端口"],"ans":2,"exp":"TCP和UDP端口號都是16位二進制數，這意味著可以有2的16次方個即65536個端口，編號從0到65535。","src":"OPTv4 第12章"},{"id":"off4-75","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"Harry被阻止閱讀比其安全許可級別更高的文件。什麼安全模型可以防止這種行為？","opts":["Bell–LaPadula","Biba","Clark–Wilson","Brewer–Nash"],"ans":0,"exp":"Bell-lapadula模型包括簡單安全屬性，可防止個人讀取高於個人安全許可級別的機密信息。","src":"OPTv4 第12章"},{"id":"off4-76","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Megan希望確保她的公司正在與之簽訂合同的新軟件即服務提供商能夠確保服務始終正常運行，不會出現中斷。以下哪一項通常是提供這種保證的合同的一部分？","opts":["SLA","RPA","NDA","MOU"],"ans":0,"exp":"服務水平協議(SLA)包含有關如何提供服務、可接受的中斷或停機水平以及在中斷或其他問題的情況下可能存在的補救措施的詳細信息。Megan應確保SLA包含適當的性能保證和懲罰，這些保證和懲罰的幅度足以補償公司的問題，同時激勵服務提供商保持可靠的服務。RPA是機器人流程自動化，一種自動化技術。NDA是一份保密協議，是一份用於幫助控制信息或數據暴露或共享風險的法律文件。MOU是一種諒解備忘錄，當兩個組織希望合作記錄共同的願景或共同的目標時使用。","src":"OPTv4 第12章"},{"id":"off4-77","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"Jen是一家工業生產設施的網絡管理員，她的任務是確保網絡不會受到生產車間運行的大型電機和其他設備的電磁干擾。如果這個問題比安裝的成本和難度更重要，她應該選擇什麼類型的網絡佈線？","opts":["10Base2","100BaseT","1000BaseT","Fiber optic"],"ans":3,"exp":"在某些情況下，光纜比絞合銅纜或同軸電纜更貴，也更難安裝，但它不易受電磁干擾(EMI)的影響。這對於Jen的問題來說是一個很好的解決方案，特別是如果她正在部署EMI加固系統來搭配她的抗EMI網絡電纜。","src":"OPTv4 第12章"},{"id":"off4-78","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"CVE和NVD都提供了什麼信息？","opts":["Vulnerabilities","Markup languages","Vulnerability assessment tools","Penetration testing methodologies"],"ans":0,"exp":"MITRE的常見漏洞和利用(CVE)字典和NIST的國家漏洞數據庫(NVD)都提供了有關漏洞的信息。","src":"OPTv4 第12章"},{"id":"off4-79","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"Ian希望確保他的組織使用適當的安全編碼技術。以下哪一項不是輸入驗證的常見做法？","opts":["Conduct data validation on a trusted system.","Validate data length.","Validate all client-provided data before it is processed.","Convert all data to the same data type."],"ans":3,"exp":"OWASP的安全編碼實踐清單提供了各種各樣的輸入驗證建議，包括在可信系統上進行數據驗證、驗證數據長度、範圍和類型，以及在處理之前驗證所有客戶端提供的數據。將所有數據轉換成相同的數據類型是不可能的，因為大多數程序和應用程序都需要多種數據類型。","src":"OPTv4 第12章"},{"id":"off4-80","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"Michelle希望確保她的公司記錄日誌的時間不會超過需要的時間。她應該制定和實施什麼類型的政策來確保這一點？","opts":["An EOL policy","A data classification policy","An EOS policy","A record retention policy"],"ans":3,"exp":"記錄保留政策用於確定組織保留哪些數據以及保留多長時間。數據保存時間過長會增加組織的風險，但在調查、法律合規性或其他業務目的需要時擁有數據也很重要。EOL(生命終止)和EOS(支持終止)適用於硬件或軟件，而不適用於數據。數據分類策略用於幫助對數據進行分類，這可能會影響數據的保留時間，但分類策略本身通常不會設置保留時限。","src":"OPTv4 第12章"},{"id":"off4-81","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"Mary是一家保險公司的安全風險分析師。她目前正在研究一種情況，由於公司的web應用程序中缺少補丁，黑客可能能夠修改web服務器上目錄的內容。在這種情況下，風險是什麼？","opts":["Unpatched web application","Web defacement","Hacker","Operating system"],"ans":1,"exp":"風險是威脅和漏洞的結合。威脅是尋求破壞安全的外部力量，例如本例中的黑客。漏洞是可能讓威脅得逞的內部弱點。在這種情況下，網頁汙損是風險所在。在這種情況下，如果黑客試圖對未打補丁的服務器(漏洞)進行SQL注入攻擊(威脅)，結果是網站損壞(風險)。","src":"OPTv4 第12章"},{"id":"off4-82","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Andrea希望確保她的虛擬化網絡在虛擬環境之間是安全的。她在所在州的多個地點使用虛擬機群集，這些地點之間有第三方互聯網服務提供商。如果她在這些位置之間運行扁平的第2層網絡，以下哪種解決方案最適合保護她的流量？","opts":["TLS","BGP","IPsec","AES"],"ans":2,"exp":"IPsec VPN將允許Andrea在必要時保持她的網絡作為第2層扁平網絡運行，同時為她想要的流量提供安全性。TLS運行在更高的網絡層，儘管流量可以通過它進行隧道傳輸。BGP是路由協議，AES是加密算法。","src":"OPTv4 第12章"},{"id":"off4-83","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"使用OSI模型時，數據鏈路層使用什麼格式來格式化從堆棧上層收到的消息？","opts":["A data stream","A frame","A segment","A datagram"],"ans":1,"exp":"當消息到達數據鏈路層時，它被稱為幀。數據流存在於應用層、表示層和會話層，而數據段和數據報存在於傳輸層(分別用於TCP和UDP)。","src":"OPTv4 第12章"},{"id":"off4-84","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"Asha的團隊希望確保他們軟件的所有功能都經過測試。他們在確保什麼？","opts":["Proper misuse case testing","That a breach attack simulation is conducted","Complete interface testing","Complete coverage"],"ans":3,"exp":"執行覆蓋分析是為了確保功能、需求或其他元素得到完全測試。問題中沒有描述誤用案例，也沒有描述接口，而且違規攻擊模擬旨在扮演攻擊者的角色，而不是測試所有功能。","src":"OPTv4 第12章"},{"id":"off4-85","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"Sylvia公司的新應用程序允許用戶註冊銀行服務。Sylvia需要找到一種方法來確保用戶就是他們所聲稱的那個人。這個過程叫什麼？","opts":["Proofing","Registration","FIM","Single sign-on"],"ans":0,"exp":"身份證明是驗證聲稱具有身份的實體或個人是他們所聲稱的真實個人或組織的過程。這通常依賴於其他人沒有的額外信息，如文檔或知識。註冊是創建帳戶的過程。FIM是聯合身份管理，SSO允許跨多個系統或服務使用單點登錄。","src":"OPTv4 第12章"},{"id":"off4-86","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"如果你試圖控制無線網絡的信號強度以及可以訪問的位置，應該考慮哪三個重要因素？","opts":["Antenna placement, antenna type, antenna power levels","Antenna design, power levels, use of a captive portal","Antenna placement, antenna design, use of a captive portal","Power levels, antenna placement, FCC minimum strength requirements"],"ans":0,"exp":"天線位置、天線設計和功率水平是決定信號接入位置和可用性的三個重要因素。強制網絡門戶可用於控制用戶登錄，天線設計是天線類型的一部分。FCC確實提供了最大廣播功率指南，但不要求最低功率水平。","src":"OPTv4 第12章"},{"id":"off4-87","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"Xavier的公司一直在使用越來越多的雲服務，他擔心該公司在現有數據中心實施的安全策略在雲中沒有得到遵守。以下哪種解決方案最適合確保將策略應用於所有云服務？","opts":["CIPS","CASB","CSG","CDLP"],"ans":1,"exp":"雲訪問安全代理(CASB)是一種位於內部和雲系統之間的工具，用於監控流量和執行安全策略。這個場景完全符合CASB的設計目的。其他答案都是瞎編的；這些都不是真正的雲安全設備或工具(至少在撰寫本書時是這樣！).","src":"OPTv4 第12章"},{"id":"off4-88","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"按照災難恢復測試類型對業務運營的潛在影響排序，從影響最小的開始，到影響最大的為止。\n① Checklist review\n清單審查\n② Parallel test\n平行測試\n③ Tabletop exercise\n桌面練習\n④ Full interruption test\n完全中斷測試","opts":["①，②，③，④","①，③，②，④","①，③，④，②","②，①，③，④"],"ans":1,"exp":"災難恢復測試類型按對業務的潛在影響從最小到最大的順序排列如下:\n①　Checklist review 清單審查\n②　Tabletop exercise 桌面練習\n③　Parallel test 平行試驗\n④　Full interruption test 完全中斷測試\nChecklist reviews are the least impactful type of exercise because they do not even require a meeting. Each team member reviews the checklist on their own. Tabletop exercises are slightly more impactful because they require bringing together the DR team in the same room. Parallel tests require the activation of alternate processing sites and require significant resources. Full interruption tests are the most impactful type of exercise because they involve shifting operations to the alternate site and could disrupt production activity.\n清單審查是最沒有影響力的一種活動，因為它們甚至不需要開會。每個團隊成員都要自己檢查清單。桌面練習稍微更有影響力，因為它們需要將災難恢復團隊聚集在同一個房間內。並行測試需要激活備用處理站點，並且需要大量資源。完全中斷測試是最具影響力的測試類型，因為它們涉及將操作轉移到備用站點，並且可能會中斷生產活動。","src":"OPTv4 第12章"},{"id":"off4-89","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"Beth的公司使用基於雲的基礎架構，該基礎架構結合使用策略和自動化安全控制來確保安全性。該公司部署了防火牆、終端安全工具和管理功能，以確保每個虛擬系統在上線時都受到保護。哪個術語描述了這種類型的實現？","opts":["Root of trust","Software-defined security","A policy engine","Software-defined networks"],"ans":1,"exp":"軟件定義的安全(SDS)是一種越來越常見的安全方法，它涉及使用軟件解決方案和策略來保護環境，而不是傳統的基於硬件的方法。這種策略允許靈活和動態的安全配置，特別適合雲的可伸縮性。雖然信任根在加密系統中提供了基本的安全元素，但策略引擎通過實施安全策略，有助於SDS和其他框架中的決策制定。軟件定義的網絡側重於通過軟件進行網絡管理，展示了在IT基礎設施中向軟件定義的方法發展的更廣泛趨勢。","src":"OPTv4 第12章"},{"id":"off4-90","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"Susan希望為她的組織建立一個安全意識計劃，但她知道讓員工參與進來很困難。以下哪種技術通常與評估過程中的分數和分值的使用有關？","opts":["Gamification","Phishing testing","Security champions","Social engineering evaluations"],"ans":0,"exp":"遊戲化使用遊戲中的常見組件，如分數、得分和競賽，來吸引參與者參與安全意識計劃。其他答案都沒有一起使用這些，除非他們使用了遊戲化組件。","src":"OPTv4 第12章"},{"id":"off4-91","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"確保數據無法從SSD恢復的最佳方法是什麼？","opts":["Use the built-in erase commands.","Use a random pattern wipe of 1s and 0s.","Physically destroy the drive.","Degauss the drive."],"ans":2,"exp":"物理銷燬驅動器是確保驅動器上沒有殘留數據的最佳方式。固態硬盤是閃存介質，這意味著你無法對其消磁，而隨機模式寫入和內置擦除命令都已被證明是有問題的，因為固態硬盤內置的損耗平衡以及它們處理擦除命令的方式存在差異。","src":"OPTv4 第12章"},{"id":"off4-92","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"Felipe工作的公司已經將他們託管在第三方數據中心的服務器連接到供應商擁有的系統，使用光纖電纜直接連接到它們。這叫什麼？","opts":["Ingress","Peering","East/west","Egress"],"ans":1,"exp":"這是一個對等的例子。對等可以是公共對等、經由網絡連接通過互聯網交換點的連接，或者是直接與主機託管設施中的另一個實體進行的私有對等。入口是進入網絡的流量，出口是離開網絡的流量，東/西是指網絡中同一區域或層的網絡流量。","src":"OPTv4 第12章"},{"id":"off4-93","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"此處顯示的事件響應（IR）流程循環圖中缺少哪個步驟？","opts":["Forensics","Retribution","Recovery","Analysis"],"ans":2,"exp":"CISSP CBK採用六階段流程:檢測、響應、緩解、報告、恢復和補救。此圖缺少恢復步驟。其他標準使用不同的術語或略有差異的過程。","src":"OPTv4 第12章"},{"id":"off4-94","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Val正在使用一種工具來測試她所在組織的軟件，該工具可以模擬攻擊者針對該軟件採取的行動。Val正在進行什麼類型的測試？","opts":["SAST","LAST","DAST","FAST"],"ans":2,"exp":"Val正在進行動態應用安全測試，即DAST。DAST模擬攻擊者對軟件的操作來測試它。SAST審查源代碼以識別漏洞。FAST和LAST不是軟件測試方法或工具。","src":"OPTv4 第12章"},{"id":"off4-96-1","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"Fred的公司在通過蜂窩網絡發送敏感數據時需要考慮哪些安全因素？","opts":["They should use the same requirements as data over any public network.","Cellular provider networks are private networks and should not require special consideration.","Encrypt all traffic to ensure confidentiality.","Require the use of WAP for all data sent from the phone."],"ans":0,"exp":"蜂窩網絡與任何公共網絡都有相同的問題。加密要求應與組織為其他公共網絡(如酒店、會議Wi-Fi和類似場景)選擇的要求相匹配。加密所有數據非常困難，而且會增加開銷，因此除非公司特別要求，否則這不應該是默認答案。WAP是一種過時的無線應用協議，並未廣泛使用；要求它將是困難的。WAP確實提供了TLS，這在使用時會有所幫助。","src":"OPTv4 第12章"},{"id":"off4-96-2","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"Fred打算參加今年的一個大型黑客會議，他需要在會議期間連接到僱主的網絡。當他在會議期間連接到他的移動電話提供商的4G網絡時，他應該做什麼？","opts":["Continue normal usage.","Discontinue all usage; towers can be spoofed.","Only use trusted Wi-Fi networks.","Connect to his company's encrypted VPN service."],"ans":3,"exp":"Fred的最佳選擇是使用加密的可信VPN服務來傳輸他的所有數據使用。可信的Wi-Fi網絡不太可能在黑客會議上存在，正常使用是危險的，因為技術的擴散允許建立假塔，停止所有使用不會支持Fred的業務需求。","src":"OPTv4 第12章"},{"id":"off4-96-3","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"最有可能導致移動電話遠程擦除失敗的情況是什麼？","opts":["The phone has a passcode on it.","The phone cannot contact a network.","The provider has not unlocked the phone.","The phone is in use."],"ans":1,"exp":"遠程擦除工具是一個有用的解決方案，但它們只有在手機可以訪問蜂窩網絡或Wi-Fi網絡的情況下才有效。遠程擦除解決方案旨在擦除手機中的數據，無論手機是否正在使用或是否有密碼。提供商解鎖手機是為了在其他蜂窩網絡上使用，而不是為了擦除或其他功能支持。","src":"OPTv4 第12章"},{"id":"off4-97-1","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"Bethany希望實施一些控制措施，為公司員工提供一個有組織的框架來建議她的團隊將開發的新網站功能。什麼樣的變革管理過程有助於實現這一點？","opts":["Configuration control","Change control","Release control","Request control"],"ans":3,"exp":"請求控制過程提供了一個有組織的框架，在這個框架中，用戶可以請求修改，經理可以進行成本/收益分析，開發人員可以確定任務的優先級。","src":"OPTv4 第12章"},{"id":"off4-97-2","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"Bethany還想創建一個過程來幫助多個開發人員同時處理代碼。什麼樣的變革管理過程有助於實現這一點？","opts":["Configuration control","Change control","Release control","Request control"],"ans":1,"exp":"變更控制提供了一個有組織的框架，在將解決方案推廣到生產環境之前，多個開發人員可以在其中創建和測試解決方案。","src":"OPTv4 第12章"},{"id":"off4-97-3","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Bethany正在和她的同事一起進行用戶接受度測試。什麼樣的變更管理流程包含此任務？","opts":["Configuration control","Change control","Release control","Request control"],"ans":2,"exp":"發佈控制包括驗收測試，以確保對最終用戶工作任務的任何更改都被理解並發揮作用。","src":"OPTv4 第12章"},{"id":"off4-97-4","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"Bethany注意到，當系統管理員在沒有通知開發人員的情況下更新庫時，會出現一些問題。什麼樣的變更管理流程可以幫助解決這個問題？","opts":["Configuration control","Change control","Release control","Request control"],"ans":0,"exp":"配置控制確保軟件版本的變更符合變更控制和配置管理流程。根據這些政策，只能通過授權的發行版進行更新。","src":"OPTv4 第12章"},{"id":"off4-98-1","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"Tara應該首先對服務器應用什麼備份？","opts":["Sunday's full backup","Monday's differential backup","Tuesday's differential backup","Wednesday's differential backup"],"ans":0,"exp":"Tara首先必須達到系統基線。為此，她將最新的完整備份應用到新系統。這是週日的完整備份。一旦Tara建立了這個基準，她就可以繼續應用差異備份，將系統恢復到更新的狀態。","src":"OPTv4 第12章"},{"id":"off4-98-2","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"Tara總共必須向系統應用多少備份才能使其包含的數據儘可能最新？","opts":["1","2","3","4"],"ans":1,"exp":"為了儘可能將系統恢復到最新狀態，Tara必須首先應用週日的完整備份。然後，她可以應用從星期三中午開始的最新差異備份。差異備份包括自最近一次完全備份以來更改過的所有文件，因此星期三備份的內容涵蓋了星期一和星期二備份中包含的所有數據，所以這種情況下不涉及星期一和星期二的備份文件。","src":"OPTv4 第12章"},{"id":"off4-98-3","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"在這種備份方法中，一些數據可能會不可挽回地丟失。在多長時間段內，所做的任何更改都會丟失？","opts":["3 hours.","5 hours.","8 hours.","No data will be lost."],"ans":0,"exp":"在這種情況下，差異備份是在中午進行的，而服務器在下午3點出現故障。因此，在星期三中午到下午3點之間修改或創建的任何數據都不會包含在任何備份中，並且會不可挽回地丟失。","src":"OPTv4 第12章"},{"id":"off4-98-4","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"如果Tara遵循相同的時間表，但將差異備份切換為增量備份，她總共需要向系統應用多少次備份才能使系統包含的數據儘可能最新？","opts":["1","2","3","4"],"ans":3,"exp":"通過從差異備份切換到增量備份，Tara的工作日備份將只包含自前一天以來更改過的信息。因此，她必須應用所有可用的增量備份。她將從恢復星期日的完整備份開始，然後應用星期一、星期二和星期三的增量備份。","src":"OPTv4 第12章"},{"id":"off4-98-5","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"如果Tara將差異備份更改為增量備份，並且我們假設每天更改的信息量相同，則以下哪個文件最大？","opts":["Monday's incremental backup.","Tuesday's incremental backup.","Wednesday's incremental backup.","All three will be the same size."],"ans":3,"exp":"每個增量備份僅包含自最近一次完整或增量備份以來更改過的信息。如果我們假設每天更改的信息量相同，則每個增量備份的大小將大致相同。","src":"OPTv4 第12章"},{"id":"off4-99-1","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"Ben的公司正在考慮將他們的系統配置為在圖中A點所示的級別工作。他們把敏感度設置到什麼水平了？","opts":["FRR","FAR","CER","CFR"],"ans":2,"exp":"交叉錯誤率(CER)是錯誤接受率(FAR)和錯誤拒絕率(FRR)的交叉點，是用於比較生物識別設備準確性的標準評估。","src":"OPTv4 第12章"},{"id":"off4-99-2","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"在B點，有可能出現什麼問題？","opts":["False acceptance will be very high.","False rejection will be very high.","False rejection will be very low.","False acceptance will be very low."],"ans":0,"exp":"在B點，錯誤接受率(FAR)相當高，而錯誤拒絕率(FRR)相對較低。在某些情況下，這可能是可以接受的，但是在錯誤的接受會導致重大問題的組織中，很可能他們應該選擇點a右邊的點。","src":"OPTv4 第12章"},{"id":"off4-99-3","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"如果此圖中顯示的FAR和FRR不能為其組織的需求提供可接受的性能水平，Ben應該怎麼做？","opts":["Adjust the sensitivity of the biometric devices.","Assess other biometric systems to compare them.","Move the CER.","Adjust the FRR settings in the software."],"ans":1,"exp":"CER是用於評估生物識別設備的標準。如果該設備的CER不符合組織的需求，Ben應該評估其他生物識別系統，以找到一個CER更低的系統。敏感性已經在CER的圖表中考慮到了，移動CER不是Ben能做的事。FRR不是軟件中的一個設置，所以Ben也不能把它作為一個選項。","src":"OPTv4 第12章"},{"id":"off4-100-1","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"如果客戶端已經向KDC進行了身份驗證，那麼當客戶端工作站想要訪問資源時，在A點向KDC發送什麼呢？","opts":["It resends the password.","A TGR.","Its TGT.","A service ticket."],"ans":2,"exp":"客戶端將其現有的有效TGT發送到KDC，並請求訪問該資源。","src":"OPTv4 第12章"},{"id":"off4-100-2","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"步驟A和B之間發生了什麼？","opts":["The KDC verifies the validity of the TGT and whether the user has the right privileges for the requested resource.","The KDC updates its access control list based on the data in the TGT.","The KDC checks its service listing and prepares an updated TGT based on the service request.","The KDC generates a service ticket to issue to the client."],"ans":0,"exp":"KDC必須驗證TGT是否有效，以及用戶是否有訪問其請求訪問的服務的權限。如果是，它生成一個服務票據並將其發送給客戶端(步驟B)。","src":"OPTv4 第12章"},{"id":"off4-100-3","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"被訪問的服務使用哪個或哪些系統來驗證票證？","opts":["KDC.","The client workstation and the KDC.","The client workstation supplies it in the form of a client-to-server ticket and an authenticator.","KVS."],"ans":2,"exp":"當客戶端連接到服務服務器(SS)時，它會發送以下兩條消息:\n①　The client-to-server ticket, encrypted using the service's secret key\n使用服務的秘密密鑰加密的客戶端到服務器的票證\n②　A new authenticator, including the client ID and timestamp that is encrypted using the client-server session key\n新的身份驗證器，包括使用客戶端-服務器會話密鑰加密的客戶端ID和時間戳\nThe server or service that is being accessed receives all of the data it needs in the service ticket. To do so, the client uses a client-to-server ticket received from the ticket granting service.\n被訪問的服務器或服務在服務票據中接收它需要的所有數據。為此，客戶端使用從票據授予服務接收的客戶端到服務器的票據。","src":"OPTv4 第12章"},{"id":"off4-101","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"Ian想評估他公司的新SaaS供應商的安全性。他最有可能使用以下哪個選項來評估主要雲提供商的安全性？","opts":["Run a vulnerability scan against the provider's external services.","Request a SOC 2 Type II report.","Run a vulnerability scan against the provider's internal systems.","Request a SOC 1 Type II report."],"ans":1,"exp":"Ian的最佳選擇是SOC報告，SOC2 Type II報告將評估安全控制及其隨時間的應用，告訴他組織是否負責任地維護他們的安全工作。SOC1報告著眼於財務控制，而I類報告只著眼於控制是如何描述的，而不是它們在一段時間內的應用。Ian不太可能被允許對主要提供商的內部或外部基礎架構運行漏洞掃描。","src":"OPTv4 第12章"},{"id":"off4-102","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"Henry的公司部署了廣泛的物聯網基礎設施用於建築物監控，包括環境控制、佔用傳感器和各種其他傳感器和控制器，以幫助管理建築物。在Henry對物聯網部署的分析中，他應該報告以下哪些安全問題是最關鍵的？","opts":["The lack of local storage space for security logs that is common to IoT devices.","The IoT devices may not have a separate administrative interface, allowing anybody on the same network to attempt to log into them and making brute-force attacks possible.","The IoT devices may not support strong encryption for communications, exposing the log and sensor data to interception on the network.","The long-term support and patching model for the IoT devices may create security and operational risks for the organization."],"ans":3,"exp":"Henry最擔心的應該是物聯網設備的長期安全性和可支持性。隨著這些設備越來越多地嵌入到建築物和基礎設施中，理解支持模式和安全模式非常重要。通過將物聯網設備放置在專用子網或網絡上，防止其他用戶直接訪問設備，可以解決缺乏單獨管理訪問和缺乏強加密的問題。這將有助於限制風險，而無需過多的費用或複雜性，並且是一種常見的做法。最後，存儲空間的缺乏可能是一個問題，但在考慮物聯網設備可能帶來的風險時，這不是最重要的問題。","src":"OPTv4 第12章"},{"id":"off4-103","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"Sharon想進行一次密碼攻擊。以下哪一項不是攻擊獲取NTLM哈希的常用手段？","opts":["Dumping the system's SAM","Dumping credentials from active memory","Capturing network traffic","Downloading the hashes from a third-party site"],"ans":3,"exp":"哈希傳遞攻擊(PtH)通常依賴於轉儲的本地帳戶數據庫(SAM ),在憑據傳輸過程中從網絡或活動內存中捕獲憑據。傳遞散列攻擊通常不是通過從第三方站點下載散列來進行的。","src":"OPTv4 第12章"},{"id":"off4-104","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"Tammy正在為她的組織選擇災難恢復設施。她希望選擇一家能夠平衡恢復運營所需時間和相關成本的工廠。她應該選擇什麼類型的設施？","opts":["Hot site","Warm site","Cold site","Red site"],"ans":1,"exp":"Tammy應該選擇一個溫站。這種類型的設施滿足了她在成本和恢復時間之間取得良好平衡的要求。它比熱站便宜，但比冷站有利於更快的恢復。紅站不是一種災難恢復設施。","src":"OPTv4 第12章"},{"id":"off4-105","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"Isaac希望使用無連接協議來傳輸數據，因為他需要優化傳輸速度而不是可靠性。他應該選擇哪種協議？","opts":["ICMP","TCP","UDP","SNMP"],"ans":2,"exp":"UDP(用戶數據報協議)是一種無連接、盡力而為的協議，通常在快速發送數據時使用，不需要對糾錯、檢測或流量控制等可靠性功能有很高的要求。TCP是面向連接的，提供這些和其他可靠性特性。互聯網控制消息協議ICMP用於檢查路由和路徑以及可用性，但在正常情況下不用於重要的數據傳輸。SNMP是一種網絡管理監控協議。","src":"OPTv4 第12章"},{"id":"off4-106","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"Kyle希望確保其組織的備份得到安全存儲，以防發生自然災害或其他事件。如果他需要存儲備份磁帶，他應該選擇什麼類型的解決方案？","opts":["A cloud backup service","A hot site","A media storage facility","A BaaS provider"],"ans":2,"exp":"當組織希望在安全、溫度受控的設施中安全地存儲磁帶等備份時，通常會使用介質存儲設施。雲服務不用於物理備份介質；熱站點是用來恢復操作的，不是用來存儲備份介質的；BaaS是備份即服務（雲備份服務的另一種描述）。","src":"OPTv4 第12章"},{"id":"off4-107","ch":4,"level":"4-4","tag":"官方模擬","diff":3,"q":"Norm希望為他的組織進行一次災難恢復測試，並希望選擇最徹底的測試類型，因為他意識到這可能會造成很大的干擾。Norm應該選擇什麼類型的測試？","opts":["Full interruption test","Parallel test","Tabletop exercise","Checklist review"],"ans":0,"exp":"在完全中斷測試期間，團隊關閉主站點，並確認災難恢復站點能夠處理常規操作。完全中斷測試是最徹底的測試，但也是最具破壞性的。在並行測試過程中，團隊實際上激活了災難恢復站點進行測試，但是主站點保持運行。清單審查是破壞性最小的災難恢復測試。在核對表審核過程中，團隊成員各自審核災難恢復核對表的內容，並提出任何必要的更改建議。在桌面練習中，團隊成員走到一起，在不對信息系統進行任何更改的情況下完成一個場景。","src":"OPTv4 第12章"},{"id":"off4-108","ch":4,"level":"4-5","tag":"官方模擬","diff":3,"q":"OSI模型的哪一層與數據報相關聯？","opts":["Session","Transport","Network","Data Link"],"ans":1,"exp":"當數據到達傳輸層時，它以數據段(TCP)或數據報(UDP)的形式發送。在傳輸層之上，數據成為數據流，而在傳輸層之下，數據在網絡層被轉換為數據包，在數據鏈路層被轉換為幀，在物理層被轉換為比特。","src":"OPTv4 第12章"},{"id":"off4-109","ch":4,"level":"4-6","tag":"官方模擬","diff":3,"q":"以下哪項技術提供了一個功能接口，允許開發人員在不瞭解系統實現細節的情況下直接與系統進行交互？","opts":["Data dictionary","Object model","Source code","API"],"ans":3,"exp":"應用程序編程接口(API)允許開發人員為其他用戶創建一個直接的方法，通過一個不需要了解實現細節的抽象來與他們的系統進行交互。對客體模型、源代碼和數據字典的訪問也間接促進了交互，但這是以向其他開發人員提供實現細節的方式進行的。","src":"OPTv4 第12章"},{"id":"off4-110","ch":4,"level":"4-1","tag":"官方模擬","diff":3,"q":"根據歐盟通用數據保護法規，以下哪一項操作不是必需的？","opts":["Organizations must allow individuals to opt out of information sharing.","Organizations must provide individuals with lists of employees with access to information.","Organizations must use proper mechanisms to protect data against unauthorized disclosure.","Organizations must have a dispute resolution process for privacy issues."],"ans":1,"exp":"《歐盟通用數據保護條例》不要求組織向個人提供員工名單。","src":"OPTv4 第12章"},{"id":"off4-111","ch":4,"level":"4-2","tag":"官方模擬","diff":3,"q":"Ed正在構建一個支持IPv6的網絡，但需要將其連接到IPv4網絡。Ed應該在網絡之間放置什麼類型的設備？","opts":["A switch","A router","A bridge","A gateway"],"ans":3,"exp":"Ed的最佳選擇是安裝一個IPv6到IPv4網關，該網關可以轉換網絡之間的流量。網橋適用於不同類型的網絡，而如果網絡相似，路由器就有意義了。一個現代的交換機可能能夠承載這兩種類型的流量，但在兩種協議之間的轉換上幫助不大。","src":"OPTv4 第12章"},{"id":"off4-112","ch":4,"level":"4-3","tag":"官方模擬","diff":3,"q":"以下哪一項不是高級加密標準的有效密鑰長度？","opts":["128 bits","192 bits","256 bits","384 bits"],"ans":3,"exp":"高級加密標準AES支持使用128位密鑰、192位密鑰和256位密鑰進行加密。","src":"OPTv4 第12章"}]</script>

function weightOf(q){const m=S.wrong[q.id]||0;const d=q.diff||2;return (1+Math.min(m,3)*1.6)*(1+0.22*(d-2))}
function pick(pool,n){
  const items=pool.map(q=>({q,w:weightOf(q)}));const out=[];
  while(out.length<n&&items.length){
    let tot=items.reduce((a,b)=>a+b.w,0),r=Math.random()*tot,k=0;
    for(let i=0;i<items.length;i++){r-=items[i].w;if(r<=0){k=i;break}}
    out.push(items.splice(k,1)[0].q);
  }
  return out;
}
function rollItem(){
  const w=rarityW(B.currentLevel?L(B.currentLevel).ch:1);
  const ownedIds=new Set(S.items);
  const pool=ITEMS.filter(i=>!ownedIds.has(i.id)&&(i.rarity!=='X'||eggOn()));
  if(!pool.length)return null;
  const tot=pool.reduce((a,i)=>a+w[i.rarity],0);let r=Math.random()*tot;
  for(const it of pool){r-=w[it.rarity];if(r<=0)return it}
  return pool[0];
}
function rollOffers(n, ch){
  const out=[];const used=new Set(S.items);
  for(let k=0;k<n;k++){
    const w=rarityW(ch||1);
    const pool=ITEMS.filter(i=>!used.has(i.id)&&(i.rarity!=='X'||eggOn()));
    if(!pool.length)break;
    const tot=pool.reduce((a,i)=>a+w[i.rarity],0);let r=Math.random()*tot;let sel=pool[0];
    for(const it of pool){r-=w[it.rarity];if(r<=0){sel=it;break}}
    out.push(sel.id);used.add(sel.id);
  }
  return out;
}
function currentCh(){
  const lv=(B&&B.currentLevel)?L(B.currentLevel):null;
  return lv?lv.ch:1;
}

/* ================= 計分 ================= */
function calcScore(idx){
  let flat=10,mult=1,critC=critBase(),critM=critMultOf(),cScale=0;
  const combo=B.combo;
  for(const it of owned()){
    flat+=it.flat||0;
    if(it.goldFlat)flat+=Math.min(it.goldFlat.cap||99,Math.floor(S.gold/it.goldFlat.per));
    if(it.comboPer)flat+=Math.min(it.comboPer,combo);
    if(it.lateFlat&&idx>=3)flat+=it.lateFlat;
    if(it.comboMin&&combo>=it.comboMin)flat+=it.comboFlat||0;
    if(it.comboMult&&combo>=it.comboMin)mult*=it.comboMult;
    if(it.firstMult&&idx===0)mult*=it.firstMult;
    if(it.lastMult&&idx===B.qs.length-1)mult*=it.lastMult;
    if(it.posMult&&it.posMult[idx+1])mult*=it.posMult[idx+1];
    if(it.mult)mult*=it.mult;
    if(it.clutchMult&&B.hp<=1)mult*=it.clutchMult;              // 逆轉牌：殘血時放大
    if(it.behindFlat&&B.target&&B.score<B.target)flat+=it.behindFlat; // 追分筆記：落後時補分
    if(it.allInMult)mult*=it.allInMult;                        // 孤注一擲：大乘區，代價在 answer()
    if(it.lastAllIn&&idx===B.qs.length-1)mult*=it.lastAllIn;   // 最後通牒：最後一題加倍
    cScale+=it.comboScale||0;
  }
  let streak=1+0.25*(combo-1)+cScale*(combo-1);
  if(streak>4)streak=4; // 連擊倍率上限，跨關累積時防止數值失控
  const crit=Math.random()<critC;
  let v=Math.round(flat*streak*mult*(crit?critM:1));
  // 血債：暴擊吃紅利，沒爆就吞懲罰
  let bloodPen=false;
  if(!crit){for(const it of owned())if(it.nonCritPenalty){v=Math.round(v*it.nonCritPenalty);bloodPen=true}}
  // 賭徒硬幣：純隨機，25% 三倍、25% 歸零
  let gamble='';
  if(owned().some(x=>x.gamble)){
    const g=Math.random();
    if(g<0.25){v*=3;gamble='win'}
    else if(g<0.5){v=0;gamble='lose'}
  }
  if(B.qs[idx]&&B.qs[idx].__re)v=Math.round(v*0.5); // 錯題回流的題目只給半分
  return {v,crit,gamble,bloodPen};
}

function termsIn(q){
  const text=q.q+' '+q.opts.join(' ');
  const re=/\b[A-Z][A-Za-z0-9]{1,7}\b/g;
  const out=[],seen=new Set();let m;
  while((m=re.exec(text))){const t=m[0];if(DICT[t]&&!seen.has(t)){seen.add(t);out.push(t)}}
  return out;
}

  const base=2+((B&&B.dictUses)||0);

  B.dictTerms=terms;B.dictOpen=true;
  B.dictThis=(B.dictThis||[]).concat(terms.filter(t=>!(B.dictThis||[]).includes(t)));
