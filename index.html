areas. 確保敏感區域的訪客需要有人陪同。","Provide camera monitoring of visitors while in sensitive areas. 對進入敏感區域的訪客進行攝像監控。","Route visitors through corridors that separate them from sensitive areas. 引導訪客通過將他們與敏感區域隔開的走廊（過道）。","Require that visitors display badges clearly while in sensitive areas. 要求訪客在敏感區域內清楚地展示徽章。"],"ans":2,"exp":"【作者解題思路原文】\n四個選項對於工作區域的物理安全都有正面意義。\nrestricting的意思其實是“非必要最好不要”讓訪客進入敏感區域，所以A、B、D略欠妥。\n另外還需理解C選項這種做法的意義。\n依據ISO 27002:2022 7.6，安全區域的存在或其內的活動應該基於按需知曉（need-to-know）原則被內外部人員所知曉，如非必要，根本不需要讓訪客知道有這個敏感區域存在。\n安全區域可以設計為被幾個被連續的內部物理安全屏障包圍。在安全邊界內具有不同安全要求的區域之間，需要額外的屏障和邊界來控制物理訪問。（ISO 27002:2022 7.1）\n一個能引導訪客順利進入歡迎參觀區域，同時避開敏感區域的走廊（過道）顯然滿足上述要求，值得借鑑。","src":"官方習題精選"},{"id":"d4-35-01","ch":4,"level":"4-1","tag":"網絡安全","diff":3,"q":"根據上圖，這種消息服務的流量最有可能使用哪種協議？","opts":["SLACK","HTTP","SMTP","HTTPS"],"ans":1,"exp":"圖裡這條流量走的是 TCP 80，而 80 端口就是 HTTP 的默認端口，所以最可能是 HTTP。Slack 是個聊天產品，不是協議；HTTPS 走 443，SMTP 是發郵件用的 25 端口，都對不上。","src":"官方習題精選"},{"id":"d4-35-02","ch":4,"level":"4-1","tag":"網絡安全","diff":3,"q":"將內部通信用這個消息服務從A發送到B會引起什麼安全問題？","opts":["防火牆不保護系統B。","系統C可以看到從系統A到系統B的廣播流量。","它是通過未加密的協議傳輸的。","報文傳送不提供不可否認性。"],"ans":2,"exp":"問題就出在 HTTP 是明文：A 發給 B 的內部消息，同一網段或鏈路上的任何人抓包都能直接讀，一點遮擋都沒有。防火牆不是不保護 B，它只是管不住已經進來的流量內容；廣播是另一回事；不可否認性要靠簽名解決，這裡最直接的毛病是沒加密。","src":"官方習題精選"},{"id":"d4-35-03","ch":4,"level":"4-1","tag":"網絡安全","diff":3,"q":"Lauren的公司應該怎麼做，才能最好地滿足內部系統A和C的用戶對安全消息傳遞的需求呢？","opts":["使用第三方消息服務。","實現和使用本地託管服務。","使用HTTPS。","停止使用短信，改為使用電子郵件，這樣更安全。"],"ans":1,"exp":"內部系統 A 和 C 之間通信，最穩的辦法是自己搭一套本地託管的即時消息服務，消息在企業網內轉一圈就到，不出門，加密、日誌、歸檔也全捏在自己手裡。用第三方服務等於把內部消息送到別人服務器上；光上 HTTPS 只解決了傳輸加密，數據照樣往外走；改用電子郵件並不比 IM 更安全。","src":"官方習題精選"},{"id":"d4-37-01","ch":4,"level":"4-1","tag":"網絡技術","diff":3,"q":"以下哪個選項包括OSI模型第6層的標準或協議？","opts":["NFS, SQL, and RPC","TCP, UDP, and TLS","JPEG, ASCII, and MIDI","HTTP, FTP, and SMTP"],"ans":2,"exp":"第 6 層是表示層，管的是數據長什麼樣——格式、編碼、壓縮、加密，JPEG、ASCII、MIDI 都是這一層的東西。NFS/SQL/RPC 和 HTTP/FTP/SMTP 屬於第 7 層應用層，TCP 和 UDP 屬於第 4 層傳輸層，都放錯樓層了。","src":"官方習題精選"},{"id":"d4-37-02","ch":4,"level":"4-1","tag":"網絡技術","diff":3,"q":"Sarah正在手動檢查捕獲的數據包中的TCP流量，發現一個系統正在短時間內重複發送設置了RST標誌的TCP數據報文。\n該標誌在TCP數據報頭中是什麼意思？","opts":["RST標誌的意思是“Rest”，服務器需要短時的暫停流量。","RST標誌的意思是“Relay-set”，數據包將轉發到數據包中設置的地址。","RST標誌的意思是“Resume Standard”，通信將以其正常格式重傳。","RST表示“Reset”， TCP會話將被斷開。"],"ans":3,"exp":"RST 就是 Reset，收到它的那一頭會立刻把連接拆掉，連句再見都不說。所以看到某系統短時間內猛發 RST，通常是它那邊端口沒開或者狀態對不上，在反覆拒連。另外三個 Rest、Relay-set、Resume Standard 都是編出來的說法，TCP 報頭裡沒有這種東西。","src":"官方習題精選"},{"id":"d4-37-03","ch":4,"level":"4-1","tag":"網絡技術","diff":3,"q":"出於安全原因，Lauren被要求實施L2TP替換其組織的PPTP。L2TP取代PPTP的主要安全原因是什麼？","opts":["L2TP可以使用IPsec。","L2TP創建點對點隧道，避免了多點鏈接的問題。","PPTP不支持EAP。","PPTP沒有正確封裝PPP數據包。"],"ans":0,"exp":"L2TP 自己不管加密，它常和 IPsec 搭夥成 L2TP/IPsec，加密和完整性校驗全交給 IPsec，這才是不用 PPTP 的主要安全理由。PPTP 靠的是較弱的 MPPE，安全性一直被人詬病。B 講的是架構差異，不算安全理由；C 不對，PPTP 也支持 EAP；D 也不對，PPTP 的 PPP 封裝是正常的。","src":"官方習題精選"},{"id":"d4-s01","ch":4,"level":"4-1","tag":"ARP欺騙","diff":3,"q":"財務部多名員工反映，訪問內部報銷系統時偶爾會跳到證書告警頁面，隨後又恢復正常。網絡管理員抓包發現：網關 10.20.0.1 在幾乎所有主機的 ARP 表裡都指向同一臺陌生主機的 MAC，而這臺主機還在持續向全網發送 ARP 應答。最可能是哪種攻擊，應優先採取哪項措施？","opts":["DNS 緩存投毒；在內部 DNS 服務器上啟用 DNSSEC","ARP 欺騙導致的中間人攻擊；在接入交換機上啟用 DHCP snooping 與動態 ARP 檢測（DAI），並綁定網關的靜態 ARP 表項","VLAN 跳躍；關閉所有接入端口上的 native VLAN","廣播風暴；在交換機上啟用生成樹協議（STP）"],"ans":1,"exp":"解析：ARP 沒有認證機制，任何主機都能宣稱自己是網關。攻擊者持續發送偽造 ARP 應答，把網關 IP 映射到自己的 MAC，流量就會先經過它，形成中間人；證書告警是因為它轉發的流量被替換或解密失敗。DAI 依賴 DHCP snooping 生成的 IP-MAC 綁定表來校驗 ARP 報文，靜態綁定網關則保證即使欺騙成功也改不了網關映射。A 錯：症狀是 MAC 映射被改，不是域名解析結果被改，DNSSEC 也管不到 ARP。C 錯：VLAN 跳躍表現為跨 VLAN 收到不該有的幀，與 ARP 表被系統性改寫無關。D 錯：廣播風暴表現為廣播流量暴漲、交換機 CPU 升高，不會把網關 MAC 穩定地改成同一臺主機。","src":"原創"},{"id":"d4-s02","ch":4,"level":"4-1","tag":"DHCP","diff":2,"q":"新員工把家裡的無線路由器 LAN 口接進了辦公網，第二天部分同事的電腦拿到了 192.168.1.x 的地址，網關指向那臺家用路由器，上網時被引導到一個仿冒的登錄頁。網絡管理員要在不改變終端配置的前提下防止此類事件再次發生，最合適的做法是？","opts":["在所有終端上手工配置靜態 IP 和網關","在核心交換機上把所有接入端口都配置成 trunk，放行全部 VLAN","在邊界防火牆上阻斷所有 UDP 67 和 68 流量","在接入交換機上啟用 DHCP snooping，只把連接合法 DHCP 服務器的上行端口設為信任端口"],"ans":3,"exp":"解析：私接的 DHCP 服務器之所以危險，是因為它能在客戶端廣播發現時搶先應答，把默認網關指向自己，後續流量就全部經過它，等於天然的中間人。DHCP snooping 會在非信任端口丟棄 DHCP Offer/ACK，只允許合法服務器方向（信任端口）下發地址，從源頭擋住。A 錯：靜態配置在移動辦公和大量終端下不可維護，也攔不住別人繼續被騙。B 錯：把接入端口改成 trunk 並放行所有 VLAN 只會擴大二層攻擊面，與 DHCP 問題無關。C 錯：67/68 是 DHCP 的服務端/客戶端端口，一刀切斷會讓合法 DHCP 也失效；正確做法是在接入層做信任端口控制，而不是在邊界全阻斷。","src":"原創"},{"id":"d4-36-01","ch":4,"level":"4-2","tag":"防火牆","diff":3,"q":"以下哪一種規則未顯示在規則庫中，但將由防火牆強制執行？","opts":["隱形的","隱式拒絕","連接代理","出口過濾器"],"ans":1,"exp":"規則庫只登記管理員親手加進去的條目，而每條防火牆策略末尾都自帶一句沒說出口的「其餘全拒」，它不在表上，卻對每個沒匹配上的包生效。所以看不見、照樣強制執行的就是隱式拒絕。A 的「隱形」指的是躲掃描的手法，跟規則表沒關係；C 連接代理是防火牆的另一種工作方式；D 出口過濾得有人顯式寫規則才會存在。","src":"官方習題精選"},{"id":"d4-36-02","ch":4,"level":"4-2","tag":"防火牆","diff":3,"q":"在IP地址10.1.0.26上運行的是哪種類型的服務器？","opts":["Email","Web","FTP","Database"],"ans":0,"exp":"看放行的端口就能反推：25 是發信（SMTP），465 是加密發信（SMTPS），兩個都指向郵件服務器。B 的 Web 走 80/443，C 的 FTP 走 20/21，D 的數據庫常見 1433、3306，這些端口規則裡都沒有，自然排除。","src":"官方習題精選"},{"id":"d4-36-03","ch":4,"level":"4-2","tag":"防火牆","diff":3,"q":"位於15.246.10.1的系統嘗試與在10.1.0.50運行的Web服務器進行HTTP和HTTPS連接。以下關於該連接的說法中哪一項是正確的？","opts":["兩個連接都將被允許。","兩個連接都將被阻止。","將允許HTTP連接，並阻止HTTPS連接。","將阻止HTTP連接，並允許HTTPS連接。"],"ans":2,"exp":"防火牆是從上往下一條條比的，只要某條命中就停手，不再往下看。規則 1 已經放行了任何源到 10.1.0.50 的 80 端口，所以 15.246.10.1 的 HTTP 先被放過，後面那條拒絕根本輪不到它。HTTPS 的 443 沒有任何允許規則，掉進末尾的隱式拒絕裡被擋掉。","src":"官方習題精選"},{"id":"d4-36-04","ch":4,"level":"4-2","tag":"防火牆","diff":3,"q":"應該使用什麼值填充規則#3的源端口？","opts":["25","465","80","Any"],"ans":3,"exp":"來源端口是客戶端臨時隨機挑的高位端口，每次都不一樣，根本沒法預先寫死，只能填 Any。25 是服務器的目的端口，塞進源端口的位置等於把方向搞反了；465 和 80 跟這條規則也沒有關係。","src":"官方習題精選"},{"id":"d4-s03","ch":4,"level":"4-2","tag":"入侵檢測","diff":3,"q":"某公司內網是一個扁平的大二層網絡，服務器之間可以直接互訪。安全工程師需要檢測針對內部服務器的攻擊，但既不能改變現有流量的轉發路徑，也不能引入單點故障。最合適的部署方式是？","opts":["在核心交換機上配置 SPAN 鏡像端口（或接入網絡 TAP），把流量副本送給網絡型 IDS","把網絡型 IDS 以網橋方式串接在核心交換機與服務器區之間","在每臺服務器上安裝主機防火牆，並開啟自動阻斷","把 IDS 部署在互聯網出口外側，只分析入站流量"],"ans":0,"exp":"解析：NIDS 是被動檢測設備，靠鏡像口或 TAP 拿流量副本，流量照原路轉發，既不改路徑，也不會因為設備故障斷網，正好滿足題目兩個約束。B 錯：串聯是網絡型 IPS 的部署方式，會帶來延遲、成為單點故障，還要承擔誤阻斷的業務風險，與「不改變路徑」衝突。C 錯：主機防火牆屬於主機加固/HIPS 範疇，不是網絡流量檢測手段，而且「自動阻斷」是 IPS 行為，題目要的是檢測。D 錯：只看出入口就看不見服務器之間的橫向流量，而扁平內網裡橫向移動恰恰是重點檢測對象。","src":"原創"},{"id":"d4-s04","ch":4,"level":"4-2","tag":"DMZ","diff":3,"q":"一家電商公司要上線新的訂單系統：Web 前端必須對公網開放，訂單數據庫保存客戶支付信息。安全架構師提出的下列方案中，最合適的是？","opts":["Web 前端和數據庫都放在 DMZ，靠各自的主機防火牆互相隔離","Web 前端放內部網絡，數據庫放 DMZ，由 Web 前端反向連接數據庫","Web 前端放 DMZ，數據庫放內部網絡，內層防火牆只放行 Web 前端到數據庫的特定端口，並禁止數據庫主動向公網發起連接","兩者都放內部網絡，依靠 NAT 隱藏地址，公網就無法直接訪問"],"ans":2,"exp":"解析：DMZ 的定位是「一旦被攻破，損失可控的緩衝區」。把必須暴露的 Web 前端放進去，把最敏感的數據庫留在內網，再用內層防火牆把訪問收斂成單向、單端口的必要流量，是標準的分層做法。A 錯：DMZ 內的主機彼此可達，Web 一旦失守就能橫向直連數據庫，等於自廢分層。B 錯：數據庫是全系統最該保護的對象，把它放到最暴露的區段，方向反了。D 錯：NAT 只是地址轉換，不是訪問控制；Web 前端本來就要對外開放，而且內網一旦被突破，扁平網絡裡的數據庫沒有任何額外屏障。","src":"原創"},{"id":"d4-s05","ch":4,"level":"4-2","tag":"代理","diff":2,"q":"公司有十套內部 Web 應用要對外提供服務。運維希望公網只看到一個 IP，由邊界設備統一做 TLS 終止、按 URL 過濾入站請求，並隱藏後端服務器的真實地址和數量。最合適的組件是？","opts":["部署在員工 PC 與互聯網之間的正向代理","部署在內網的 SOCKS 代理","在邊界路由器上為十臺服務器分別做靜態 NAT 端口映射","部署在互聯網與內部 Web 服務器之間的反向代理"],"ans":3,"exp":"解析：反向代理站在服務器這一側代表服務器接收請求，可以做 TLS 終止、基於 URL/Host 的路由與過濾，並讓外部只知道代理地址，正好對應題目三項要求。A 錯：正向代理代表客戶端出站訪問，服務的是內部用戶上網，不保護入站服務。B 錯：SOCKS 是通用的正向代理協議，同樣面向出站連接。C 錯：靜態 NAT 只改地址，不能做 TLS 終止後的 URL 級過濾，而且十個映射端口把後端規模直接暴露出去。","src":"原創"},{"id":"d4-s06","ch":4,"level":"4-2","tag":"狀態檢測","diff":3,"q":"審計人員發現，邊界防火牆的規則是「允許內網到互聯網的任意流量」和「允許互聯網到內網的高位端口」，隨後用 ACK 掃描成功探測出內網存活主機和端口狀態，還能讓偽造 ACK 的報文穿過。安全團隊最應該做的改進是？","opts":["在返回方向再加一條規則，把源端口固定為 443","改用狀態檢測防火牆，只允許屬於已建立會話的返回流量通過","在規則表最前面加一條「拒絕所有」","啟用 NAT，把內網地址全部隱藏起來"],"ans":1,"exp":"解析：無狀態包過濾逐包看字段，分不清「主動發起的連接」和「偽造的返回包」，所以偽造 ACK 也能過，ACK 掃描才有意義。狀態檢測維護會話表，只有匹配已有會話（或 RELATED 關聯連接）的回包才放行，其餘一律丟棄。A 錯：客戶端源端口是隨機高位端口，無法固定成 443，而且這條規則同樣擋不住偽造。C 錯：防火牆規則自上而下匹配，最前面放「拒絕所有」會讓後面所有規則失效，把業務全斷掉。D 錯：NAT 只改變地址映射，不能判斷報文是否屬於合法會話；對已經做了端口映射的入站連接更是毫無幫助。","src":"原創"},{"id":"d4-23-01","ch":4,"level":"4-3","tag":"IPSec","diff":3,"q":"Sue的僱主已要求她使用IPsec VPN連接到其網絡。當Sue連接時，IPsec VPN允許她做什麼？","opts":["通過公共網絡發送解密的數據，就像她在僱主的內部網絡上一樣。","創建一個通過公共網絡承載的私有加密網絡，並像她在僱主的內部網絡中一樣進行操作。","在其僱主的內部網絡上使用TLS創建虛擬專用網絡。","創建一個將其僱主的網絡連接到其內部家庭網絡的隧道網絡。"],"ans":1,"exp":"IPsec VPN 就是在一根誰都能看的公網線路上，給你拉一條加密管道，Sue 坐在這頭用起來跟坐在公司工位沒兩樣。A 說“通過公共網絡發送解密的數據”正好說反了，那等於裸奔；C 描述的是 TLS 做的 VPN；D 是把公司網絡和家裡網絡固定連起來的站點到站點隧道，不是員工遠程撥入。","src":"官方習題精選"},{"id":"d4-23-02","ch":4,"level":"4-3","tag":"IPSec","diff":3,"q":"Susan希望以一種對數據包內容提供機密性的方式配置IPsec。IPsec的哪個組件提供了此功能？","opts":["AH","ESP","IKE","ISAKMP"],"ans":1,"exp":"管機密性的是 ESP，它把數據包裡的內容整個加密，中間人抓到也只是一串亂碼。AH 只做完整性和來源認證，根本不加密，內容照樣明文可讀；IKE 和 ISAKMP 是負責談算法、換密鑰的“談判代表”，不碰數據本體。","src":"官方習題精選"},{"id":"d4-23-03","ch":4,"level":"4-3","tag":"IPSec","diff":3,"q":"Sally在傳輸模式下使用IPsec的ESP組件。她應該瞭解有關傳輸模式的哪些重要信息？","opts":["傳輸模式可對整個IP數據包進行完全加密。","傳輸模式添加了一個新的未加密報頭，以確保數據包到達其目的地。","傳輸模式不加密數據包的報頭。","傳輸模式不提供加密；僅隧道模式提供加密。"],"ans":2,"exp":"傳輸模式只把 IP 載荷（TCP/UDP 那一段）加密，原來的 IP 報頭原封不動留著，因為沿途路由器得靠它轉發。A 和 B 描述的其實是隧道模式——整包加密、外面再套一個新報頭；D 也不對，兩種模式都能加密，區別只在加密範圍。","src":"官方習題精選"},{"id":"d4-s07","ch":4,"level":"4-3","tag":"AH/ESP","diff":3,"q":"合規部門要求某條站點間鏈路上的數據保持明文可審計、不得加密；但安全團隊仍必須保證報文沒有被篡改，並能確認發送方身份。鏈路中間沒有 NAT 設備，也不跨運營商的地址轉換。最合適的方案是？","opts":["IPsec AH 傳輸模式","IPsec ESP 傳輸模式，用加密算法保護載荷","只使用 IKE 第一階段做身份認證","在兩端路由器之間建立 SSH 隧道"],"ans":0,"exp":"解析：AH 提供數據完整性、數據源認證和抗重放，但不提供機密性，正好滿足「明文可審計 + 防篡改 + 驗身份」。它把 IP 頭也納入保護，在沒有 NAT 的環境裡最合適。B 錯：ESP 的設計目的之一就是加密載荷，會直接違反不得加密的要求，而且 ESP 不保護外層 IP 頭。C 錯：IKE 只負責協商密鑰和安全參數，認證完成後並不保護實際的數據流量。D 錯：SSH 隧道是應用層的端口轉發，只能承載特定 TCP 連接，無法為任意 IP 流量提供完整性保護，而且它本身就是要加密的。","src":"原創"},{"id":"d4-s08","ch":4,"level":"4-3","tag":"IKE","diff":3,"q":"公司與四十家合作伙伴建立站點到站點 IPsec 連接。對方的公網地址經常變化，安全團隊還希望能單獨吊銷某一家合作伙伴的接入資格。最合適的對等體認證方式是？","opts":["所有合作伙伴共用一個預共享密鑰","每家一個預共享密鑰，並按對端 IP 地址匹配","用數字證書（PKI）認證對等體，靠 CRL/OCSP 實現吊銷","不認證對等體，只使用足夠強的加密算法"],"ans":2,"exp":"解析：預共享密鑰本質上是「共享的秘密」，身份和對端 IP 綁在一起，地址一變就得改配置；共用一個密鑰則一家洩露等於全部洩露，也無法只吊銷一家。數字證書把身份和地址解耦，吊銷只要把證書放進 CRL 或在 OCSP 上標記，規模擴大也不會失控。A 錯：無法單獨吊銷，一家洩露全線失守。B 錯：依賴固定 IP 識別身份，對端地址變化就失效，四十份密鑰的輪換也難以管理。D 錯：IKE 必須認證對端，跳過認證等於任何主機都能和網關協商隧道，加密再強也保護不了錯誤的對象。","src":"原創"},{"id":"d4-s09","ch":4,"level":"4-3","tag":"TLS","diff":3,"q":"員工發現訪問外部網銀時，瀏覽器顯示的證書籤發者是公司自己的內部 CA，公司代理服務器也能看到完整的 HTTPS URL 和表單內容。IT 部門表示這是有意配置的。最準確的解釋是？","opts":["網銀服務器被入侵，攻擊者替換了它的證書","瀏覽器存在漏洞，緩存了錯誤的證書鏈","網銀使用了自簽名證書，瀏覽器會自動信任並繼續連接","公司部署了 TLS 攔截（SSL 檢查），代理分別與客戶端和服務器建立 TLS 連接，客戶端信任企業根 CA"],"ans":3,"exp":"解析：TLS 能提供服務器認證和傳輸加密，但「信不信這張證書」由客戶端決定。終端被下發了企業根 CA 之後，代理就可以用企業 CA 現籤一張網銀證書給客戶端，自己再以客戶端身份連真正的網銀，兩段 TLS 各自成立，代理在中間看到明文——這就是 TLS 攔截。A 錯：證書由企業 CA 簽發，說明是企業主動介入，而不是外部入侵。B 錯：瀏覽器證書校驗漏洞不會穩定地產生企業 CA 簽發的證書鏈。C 錯：自簽名證書會觸發告警，瀏覽器不會自動信任；而且自簽名與「簽發者是企業 CA」也對不上。","src":"原創"},{"id":"d4-s10","ch":4,"level":"4-3","tag":"VPN分流","diff":2,"q":"員工在家通過公司 VPN 訪問內網系統，同時用本地瀏覽器直接訪問互聯網。安全團隊發現這類終端的個人瀏覽流量完全繞過了公司的 Web 過濾和終端檢測，惡意軟件隨後借這條 VPN 會話進入了內網。最合適的整改措施是？","opts":["關閉 split tunneling，要求所有流量都經 VPN 全隧道回到公司出口再出去","規定員工只能在非工作時間使用個人瀏覽器","把遠程訪問 VPN 的協議從 IPsec 換成 SSL VPN","在員工電腦上安裝個人防火牆，並允許所有出站連接"],"ans":0,"exp":"解析：split tunneling 讓目的為內網的流量走隧道、其餘流量走本地出口，個人瀏覽因此繞過了公司的過濾、代理和檢測；終端一旦中招，惡意流量還能順著已建立的 VPN 進入內網。全隧道強制所有流量經公司出口，檢查和日誌才覆蓋得到。B 錯：靠制度約束無法驗證，也不是技術控制。C 錯：換協議不改變分流方式，問題是路由策略而不是隧道協議。D 錯：允許所有出站的個人防火牆等於沒有控制，既不攔惡意流量也不提供檢測。","src":"原創"},{"id":"d4-s11","ch":4,"level":"4-3","tag":"GRE","diff":3,"q":"兩家公司合併後，需要在兩個站點之間運行動態路由協議 OSPF，並讓所有跨站流量都加密。網絡工程師提出的方案中，最合適的是？","opts":["只啟用 IPsec 傳輸模式，讓 OSPF 報文直接走 IPsec","先用 GRE 建立隧道承載 OSPF 組播，再用 IPsec 隧道模式保護 GRE 流量","只啟用 L2TP 隧道，因為它自帶加密","用 SSH 端口轉發把兩臺邊界路由器連起來"],"ans":1,"exp":"解析：IPsec 的安全關聯通常只處理單播，無法直接把 OSPF 的組播/廣播報文塞進去；GRE 能把組播包封裝成單播，但 GRE 本身不加密，所以外面要再套一層 IPsec 隧道模式，形成 GRE over IPsec。A 錯：IPsec 傳輸模式不改變原 IP 頭，也解決不了組播承載問題。C 錯：L2TP 自己不提供加密，必須和 IPsec 配合；而且它是 PPP 的點到點隧道，不解決組播路由。D 錯：SSH 端口轉發是應用層單端口轉發，無法承載整段網絡的路由協議和任意 IP 流量。","src":"原創"},{"id":"d4-08-01","ch":4,"level":"4-4","tag":"WiFi安全","diff":3,"q":"Chris被要求在實施PEAP和LEAP進行無線身份驗證之間進行選擇。他應該選擇什麼，為什麼？","opts":["LEAP，因為它解決了TKIP的問題，從而提高了安全性。","PEAP，因為它為安全性實現了CCMP","LEAP，因為它為端到端會話加密實現了EAP-TLS","PEAP，因為它可以提供TLS隧道封裝EAP的方法，保護整個會話"],"ans":3,"exp":"LEAP 是思科早年的東西，認證靠 MS-CHAPv2，整個過程在空氣裡裸奔，誰抓了握手包都能拿回去慢慢猜密碼。PEAP 不一樣，它先讓服務器出示證書，用 TLS 挖一條隧道，再把 EAP 認證塞進隧道里跑，外面的人只看到一團加密數據。所以答案是 D。A 和 C 把 TKIP、EAP-TLS 記到 LEAP 賬上，這倆跟 LEAP 根本不是一個東西；B 的 CCMP 是 WPA2 的加密模式，也不是認證隧道。","src":"官方習題精選"},{"id":"d4-08-02","ch":4,"level":"4-4","tag":"WiFi安全","diff":3,"q":"在對無線網絡進行安全評估期間，Jim發現該網絡結合使用WPA和LEAP。Jim應該提出什麼建議？","opts":["繼續使用LEAP，它為WPA網絡提供了比TKIP更好的安全性。","使用替代協議如PEAP或EAP-TLS，並在支持的情況下實現WPA2。","繼續使用LEAP避免身份驗證問題，但轉到WPA2。","使用替代協議如PEAP或EAP-TLS，並實施WEP（有線等效私密），以避免無線安全問題。"],"ans":1,"exp":"WPA 加 LEAP 這個組合，加密那頭湊合、認證這頭還是個窟窿——LEAP 的 MS-CHAPv2 能被離線字典攻擊啃下來，換個加密算法救不了它。正確的建議是認證方式換成 PEAP 或 EAP-TLS，同時設備支持就把 WPA 升到 WPA2。A、C 都在說繼續用 LEAP，等於沒治；D 更離譜，讓人退回去用 WEP，那是往回走。","src":"官方習題精選"},{"id":"d4-08-03","ch":4,"level":"4-4","tag":"WiFi安全","diff":3,"q":"Ben將其網絡配置成不廣播SSID。禁用SSID廣播有什麼好處？在這種情況下如何發現他的SSID？","opts":["禁用SSID廣播可防止攻擊者發現加密密鑰。可以從解密的數據包中恢復SSID。","禁用SSID廣播可以對未經授權的人員隱藏網絡。可以使用無線嗅探器發現SSID。","禁用SSID廣播可防止信標幀出現問題。可以通過重建BSSID來恢復SSID。","禁用SSID廣播有助於避免SSID衝突。可以通過嘗試連接到網絡來發現SSID。"],"ans":1,"exp":"關掉 SSID 廣播就是給門牌摘了，普通掃描列表裡看不到這個網絡，得手動輸名字才連得上——這叫隱晦式安全，擋得住隨手蹭網的人，擋不住認真的人。攻擊者拿個無線嗅探器，照樣能從探測幀、關聯幀、斷開幀裡把 SSID 撿出來。A 說能防密鑰洩露，純屬兩碼事；C、D 講信標幀故障和 SSID 衝突，跟這個設置一點關係沒有。","src":"官方習題精選"},{"id":"d4-46-01","ch":4,"level":"4-4","tag":"無線安全","diff":3,"q":"Ben如何為他的客戶提供訪問控制，既不必在他們連接之前提供用戶ID，同時還為他的業務目的收集有用的聯繫信息？","opts":["WPA2 PSK","強制門戶","要求客戶使用公開發布的密碼，如“BensCoffee”。","端口安全"],"ans":1,"exp":"題目要的是「連之前不用給用戶 ID，但能被控制住、還能拿到聯繫方式」。強制門戶正合適：先讓你連上開放網絡，再用一個網頁攔住，註冊或同意條款之後才放你出去。WPA2 PSK 得提前發口令，也收不到任何信息；端口安全是交換機端口上的事，跟咖啡館顧客無關。","src":"官方習題精選"},{"id":"d4-46-02","ch":4,"level":"4-4","tag":"無線安全","diff":3,"q":"Ben打算運行一個開放(未加密)的無線網絡。他應該如何連接他的商務設備？","opts":["在同一SSID上運行WPA2。","使用WPA2設置單獨的SSID。","在企業模式下運行開放網絡。","使用WEP設置單獨的無線網絡。"],"ans":1,"exp":"顧客要開放網絡，那自家設備就別跟它擠在同一張網裡。另起一個 SSID 並開 WPA2，等於給業務設備單獨拉一條加密線路，訪客那邊怎麼折騰都碰不到。開放網絡沒法跑企業模式，WEP 早就廢了，A 更是把兩種安全性混在同一張網上。","src":"官方習題精選"},{"id":"d4-46-03","ch":4,"level":"4-4","tag":"無線安全","diff":3,"q":"在執行了第一個問題的解決方案後，Ben收到了一個投訴，稱他的咖啡館裡的用戶劫持了其他顧客的網絡流量，包括使用他們的用戶名和密碼。\n這怎麼可能？","opts":["密碼由所有用戶共享，這使得流量容易受到攻擊。","惡意用戶在路由器上安裝了特洛伊木馬程序。","一個用戶使用ARP欺騙了路由器，使所有流量廣播給所有用戶。","開放網絡是不加密的，使得流量很容易被嗅探。"],"ans":3,"exp":"開放網絡等於在大廳裡喊話——同一範圍內誰都能把空中的包收下來看，用戶名口令就那麼裸著。不需要共享密碼，也不用往路由器裡塞木馬，發生的就是嗅探。ARP 欺騙是另一種手法，但根源還是「沒加密」，加密了嗅探也就白搭。","src":"官方習題精選"},{"id":"d4-s12","ch":4,"level":"4-4","tag":"802.1X","diff":2,"q":"公司無線網使用 WPA2-PSK，密碼在多個辦公點共用，離職員工仍然知道密碼。安全經理要求做到按人認證、離職當天即失效，並能集中審計誰在什麼時候接入了哪個 AP。最合適的方案是？","opts":["每季度更換一次 PSK，並只通知在職員工","關閉 SSID 廣播，並啟用 MAC 地址過濾","改為 WPA2/WPA3-Enterprise，用 802.1X + EAP 由 RADIUS 按用戶憑據或設備證書認證","把 PSK 的長度增加到 63 位"],"ans":2,"exp":"解析：PSK 是全網共享的秘密，誰拿到都能用，也沒有「這個人」的概念，所以無法按人吊銷、無法歸因。802.1X 把認證交給 RADIUS：每個用戶或設備有獨立憑據，離職時禁用賬號即可失效，認證日誌天然可審計。A 錯：輪換期間離職者照樣能用，共享密碼依然無法歸因。B 錯：SSID 隱藏和 MAC 過濾都建立在「對方不知道、改不了」的假設上，抓包和改 MAC 就能繞過。D 錯：長度隻影響離線爆破難度，改變不了共享憑據的本質。","src":"原創"},{"id":"d4-s13","ch":4,"level":"4-4","tag":"WPA3","diff":3,"q":"一家小診所用 WPA2-Personal 給候診患者提供 Wi-Fi。安全顧問指出，攻擊者只要在停車場抓到一個四次握手包，就能拿回機器上離線跑字典。升級到 WPA3-Personal 能帶來的最直接改善是？","opts":["使用 SAE 同時認證雙方，每次口令猜測都必須與 AP 實時交互，離線字典攻擊不再可行","自動隱藏 SSID，攻擊者無法發現網絡","用 AES 取代 RC4，彌補 WPA2 的加密缺陷","強制所有客戶端改用 802.1X 和 RADIUS 認證"],"ans":0,"exp":"解析：WPA2-Personal 的 PSK 派生方式允許攻擊者把抓到的握手包帶回本地無限次嘗試，口令弱就必然被破。WPA3-Personal 用 SAE（Dragonfly）做對等實體同時認證，每次猜測都要和 AP 真實交互，離線爆破失去意義；它還強制啟用 PMF（802.11w），偽造去認證幀的干擾也被削弱。B 錯：隱藏 SSID 會被被動掃描輕易發現，WPA3 也不以隱藏為賣點。C 錯：WPA2 用的已經是 AES-CCMP，被 RC4 拖累的是更早的 WPA，不是 WPA2。D 錯：802.1X/RADIUS 屬於企業模式，不是升級 Personal 模式的直接效果，給候診患者發賬號也不現實。","src":"原創"},{"id":"d4-09-01","ch":4,"level":"4-5","tag":"虛擬化安全","diff":3,"q":"Ben負責使用IDS通過交換機上的鏡像端口監視數據中心的通信流量。一旦數據中心中的大多數服務器實現虛擬化，Ben將會看到什麼流量？","opts":["與他當前（尚未實施虛擬化）看到的相同流量","所有VM間流量","只有從VM環境向外部發送的流量","所有hypervisor間的流量"],"ans":2,"exp":"服務器虛擬化之後，同一臺宿主機上兩臺 VM 說話，包走的是虛擬交換機內部，壓根不出物理網卡，物理交換機上的鏡像端口自然什麼都抓不到。Ben 能看到的只剩那些離開虛擬環境、跑到物理網絡上的流量。想要 VM 間流量，得在虛擬交換機或 hypervisor 層做鏡像。","src":"官方習題精選"},{"id":"d4-09-02","ch":4,"level":"4-5","tag":"虛擬化安全","diff":3,"q":"VM管理員建議啟用虛擬機之間的剪切和粘貼。對於這種做法，Ben應該考慮安全方面的什麼問題？","opts":["這可能會導致拒絕服務。","它可以用作秘密通道。","它可以使病毒傳播。","它可以繞過身份驗證控制。"],"ans":1,"exp":"剪切粘貼看著是便利功能，實際上開了個後門——數據在 VM 之間直接搬，完全不經過網絡，基於網絡的 DLP、IDS/IPS 什麼都看不到。這就是隱蔽通道的定義：繞開正常監控路徑傳數據。DoS 和繞過認證跟這功能不沾邊，官方也說沒有證據表明剪貼板是病毒傳播的主渠道。","src":"官方習題精選"},{"id":"d4-09-03","ch":4,"level":"4-5","tag":"虛擬化安全","diff":3,"q":"Ben擔心虛擬機逃逸漏洞的問題。他應該建議哪種選擇來幫助限制虛擬機（VM）逃逸漏洞的影響？","opts":["根據任務或數據類型將虛擬機分離到單獨的物理硬件上。","在基礎虛擬機管理程序上使用VM逃逸檢測工具。","定期將計算機還原到其原始快照。","使用Tripwire之類的專業工具查找虛擬機中的變更。"],"ans":0,"exp":"VM 逃逸打的是 hypervisor，一旦成功，同一臺宿主上的其他 VM 都可能跟著遭殃。要限制影響範圍，就得把不同任務、不同數據類型的 VM 拆到不同物理機上，逃出去也只炸一個格子。B 的檢測工具是事後發現，限不住影響；C 快照回滾是恢復手段；D 的 Tripwire 看的是 VM 內部文件有沒有被改，攔不了逃逸擴散。（題目問的是「限制影響」，不是「發現」，這點很關鍵。）","src":"官方習題精選"},{"id":"d4-43-01","ch":4,"level":"4-5","tag":"雲計算","diff":3,"q":"Brian剛入職了一個機構，該機構在自己數據中心的虛擬化平臺上運行其大部分服務，但也利用IaaS提供商託管其Web服務和SaaS電子郵件系統。\n哪個術語最能描述該組織使用的雲環境類型？","opts":["公有云","專用雲","私有云","混合雲"],"ans":3,"exp":"這題看的是「東西放在哪幾處」：機構自己的數據中心跑大部分服務，這是私有那半邊；Web 託管給 IaaS、郵件交給 SaaS，這是外部公有那半邊。兩邊都算上，就只能選混合雲。單純的公有云或私有云都只說了一半，「專用雲」是編出來的干擾項。","src":"官方習題精選"},{"id":"d4-43-02","ch":4,"level":"4-5","tag":"雲計算","diff":3,"q":"Renee是一名軟件開發人員，她用Node.js為她的公司編寫代碼。\n該公司正在考慮從自託管的Node.js環境轉移到雲上，Renee將在雲供應商管理的應用程序服務器上運行代碼。\nRenee的公司正在考慮哪種類型的雲解決方案？","opts":["IaaS","CaaS","PaaS","SaaS"],"ans":2,"exp":"關鍵詞是「在雲供應商管理的應用服務器上跑她的代碼」——服務器和運行環境歸別人管，代碼是她自己的。這一層正好卡在中間：IaaS 只到虛擬機為止，上面全得自己裝；SaaS 連應用都替你寫好了。所以是 PaaS。","src":"官方習題精選"},{"id":"d4-43-03","ch":4,"level":"4-5","tag":"雲計算","diff":3,"q":"Bert正在考慮使用IaaS雲計算合作伙伴來提供虛擬服務器。在此方案中，以下哪一項是供應商的責任？","opts":["維護虛擬機管理程序","管理操作系統安全設置","維護主機防火牆","配置服務器訪問控制"],"ans":0,"exp":"IaaS 的分界線畫在 hypervisor 這一層：物理機器、存儲網絡、虛擬機管理程序全是供應商的活。從操作系統往上——安全設置、主機防火牆策略、賬號和訪問控制——都是租戶自己的責任。所以 B、C、D 全都是客戶該乾的。","src":"官方習題精選"},{"id":"d4-43-04","ch":4,"level":"4-5","tag":"雲計算","diff":3,"q":"以下哪一項將被視為基礎設施即服務(IaaS)雲計算的例子？","opts":["由供應商管理並通過Web交付的薪資系統","運行客戶代碼的由供應商管理的應用程序平臺","由客戶在供應商管理的虛擬化平臺上開通的服務器","由供應商提供的基於Web的電子郵件服務"],"ans":2,"exp":"認 IaaS 就看一句話：客戶自己開機器、自己裝系統、自己配。A 的薪資系統和 D 的 Web 郵件都是打開就能用的成品，屬於 SaaS；B 是給你一個平臺跑代碼，屬於 PaaS。只有 C 是客戶在虛擬化平臺上自己開通服務器。","src":"官方習題精選"},{"id":"d4-s14","ch":4,"level":"4-5","tag":"SDN","diff":3,"q":"數據中心引入 SDN 後，網絡策略不再逐臺交換機配置，而是由集中控制器計算並下發流表。安全團隊評估新的攻擊面時，認為有一個組件一旦被攻陷，攻擊者就能改寫全網的轉發與分段策略。這個組件最可能是？","opts":["接入交換機的 SNMP 團體字符串","終端的 DHCP 租約數據庫","機櫃裡各設備的冗餘電源","SDN 控制器及其管理通道"],"ans":3,"exp":"解析：SDN 把控制平面從數據平面裡抽出來，控制器掌握全網拓撲與策略，流表由它統一下發；拿下控制器就等於拿下所有交換機的轉發行為，可以悄悄把流量引到攻擊者主機，或繞過微隔離策略。所以控制器要放在獨立管理網、強認證、TLS、變更審計，並做高可用。A 錯：SNMP 團體字符串洩露影響的是單臺設備的監控與配置，範圍有限。B 錯：DHCP 租約影響地址分配，不掌握轉發策略。C 錯：電源冗餘是可用性問題，與策略下發權限無關。","src":"原創"},{"id":"d5-06-01","ch":5,"level":"5-1","tag":"身份鑑別","diff":3,"q":"Gabe關注用作其組織的信息安全計劃基石的口令的安全性。以下哪個控制措施可以最大限度地提高Gabe對用戶進行身份驗證的能力？","opts":["更復雜的密碼","教育用戶如何抵禦社會工程攻擊","多因素認證","基於個人知識的安全問題的添加"],"ans":2,"exp":"多因素認證把「知道的、拿著的、是什麼」混著用，冒充難度陡增，對認證強度的提升最大。複雜口令再複雜也還是單一因素；安全教育只能降低被騙概率，不改變認證機制；密保問題反而是常被攻破的軟肋。","src":"官方習題精選"},{"id":"d5-06-02","ch":5,"level":"5-1","tag":"身份鑑別","diff":3,"q":"Ben正在整合一個聯合身份管理系統，這個系統需要為基於瀏覽器的單點登錄交換身份驗證和授權信息。什麼樣的技術是他最好的選擇？","opts":["HTML","XACML","SAML","SPML"],"ans":2,"exp":"瀏覽器單點登錄、在身份提供者和應用之間傳「這個人是誰、能幹什麼」的斷言，標準答案就是 SAML。XACML 是寫授權策略的語言，SPML 管的是開賬號、同步用戶，HTML 跟身份聯合根本不是一個層面的事。","src":"官方習題精選"},{"id":"d5-06-03","ch":5,"level":"5-1","tag":"身份鑑別","diff":3,"q":"Kerberos認證中，一個服務票據（ST）提供的是什麼？","opts":["它作為認證主機","它提供了一個證據，證明主體已被授權訪問一個客體","它提供了一個證據，證明主體已經通過了KDC的驗證，可以請求訪問其他客體的票據了。","提供生成票據的服務"],"ans":1,"exp":"服務票據是 KDC 發給某個具體服務的門票，證明「這傢伙已經被授權來訪問你了」，所以選 B。選項 C 描述的是 TGT——證明你已通過 KDC 認證、可以拿它去換別的票，那是入場券不是門票。","src":"官方習題精選"},{"id":"d5-22-01","ch":5,"level":"5-1","tag":"身份鑑別元素","diff":3,"q":"Jacob計劃在其組織中部署生物識別系統，並正在考慮使用視網膜掃描。他的組織中的其他人可能會對視網膜掃描產生什麼擔憂？","opts":["視網膜掃描可以揭示有關醫療狀況（個人健康狀況）的信息。","視網膜掃描很痛苦，因為它們需要向用戶的眼睛吹氣。","視網膜掃描儀是最昂貴的生物識別設備。","視網膜掃描儀的假陽性率（誤報警）很高，並且會引起支持問題。"],"ans":0,"exp":"視網膜上的血管紋路能連帶反映出糖尿病、高血壓、青光眼這類身體狀況，員工最怕的其實不是被掃描，是公司順手把自己的健康信息也收走了。B 說的“往眼睛吹氣”是測眼壓查青光眼的做法，跟視網膜掃描沒關係；C 說它最貴、D 說它誤報率高，都不是視網膜掃描的典型毛病。","src":"官方習題精選"},{"id":"d5-22-02","ch":5,"level":"5-1","tag":"身份鑑別元素","diff":3,"q":"以下哪一項是用戶能否接受生物特徵識別系統的關鍵因素？","opts":["FAR（錯誤接受率）","吞吐率和註冊所需的時間","CER（交叉錯誤率）和ERR（相等錯誤率）","用戶必須重新註冊的頻率和參考配置文件要求"],"ans":1,"exp":"技術再準，員工嫌麻煩也一樣推不動——註冊要折騰多久、上下班排隊過閘要等幾秒，這才是決定大家願不願意伸手的關鍵。A 的 FAR 和 C 的 CER 講的是安全強度和準確度，屬於採購選型時看的指標，不是使用者關心的；D 的重新註冊頻率雖然也煩，但影響沒有吞吐和註冊時間那麼直接。","src":"官方習題精選"},{"id":"d5-22-03","ch":5,"level":"5-1","tag":"身份鑑別元素","diff":3,"q":"Kathleen在數據中心託管設施工作，該設施為個人和組織提供物理數據中心空間。一直以來，每個客戶都被授予一個基於磁條的鑰匙卡來訪問其服務器所在的設施區域，並且還交給了他們一把鑰匙來訪問其服務器所在的機櫃或機架。在過去的一個月中，好幾臺服務器被盜了，但鑰匙卡的使用日誌顯示都是有效的ID訪問了設施區域。\n要確保密碼卡的用戶是他們應該的身份，下面哪一項是最佳選擇？","opts":["添加一個讀卡器，該讀卡器要求鑰匙卡用戶使用PIN。","將攝像機（監控）系統添加到設施區域中，以觀察誰在訪問服務器。","添加一個生物特徵識別因素。","用智能卡替換磁條鑰匙卡。"],"ans":2,"exp":"日誌裡全是“有效 ID”，說明卡本身沒毛病，問題出在卡被借來借去——磁條卡只能證明“你手裡有卡”，證明不了“你就是本人”。加一個生物特徵因素，才能把人真正綁到身份上，別人拿了卡也進不去。A 的 PIN 照樣可以寫在紙上告訴同事，D 的智能卡只是更結實的持有物、一樣能轉借；B 的監控只能事後翻錄像，擋不住有人當場把服務器搬走。","src":"官方習題精選"},{"id":"d5-j09","ch":5,"level":"5-1","tag":"身份鑑別","diff":3,"q":"The recommended time period for enforcing password updates, in accordance with modern best practices, is which of the following?\n根據現代最佳實踐，以下哪一項是推薦的強制執行密碼更新的時間週期？","opts":["42 days or 6 weeks 42天，或者說6周","At least once a year, to meet the audit requirements. 每年至少一次，以滿足審計要求","Perform passwords updating at planned intervals or promptly after a security breach. 按照計劃的時間間隔執行或在出現安全破壞事件後立即執行密碼更新。","Recommendations from modern best practices is that users should not be forced to change their passwords periodically . 現代最佳實踐的建議是，不應該強迫用戶定期更改密碼。"],"ans":3,"exp":"【作者解題思路原文】\n1、在ISO 27002:2022中，只要求“必要時”強制更新口令，並提到“要求頻繁更改口令可能會出問題”，見5.17 “口令管理系統”。原文摘錄如下：\nPassword management system\nWhen passwords are used as authentication information, the password management system should:\n······\nd) enforce password changes as necessary, for example after a security incident, or upon termination or change of employment when a user has known passwords for identities that remain active (e.g.shared identities);\nOther information\n······\nRequiring frequent change of passwords can be problematic ······\n2、NIST sp 800-63B中說的比較直接（見正文第14頁）：\nVerifiers SHOULD NOT require memorized secrets to be changed arbitrarily (e.g., periodically).\n驗證器不應該要求記憶的秘密[注：即口令、挑戰問題、應答密語等]被肆意(例如，週期性地)改變。\n3、我國的網絡安全等級保護基本要求中，每一個級別的“安全計算環境”要求(GB/T 22239-2019 6.1.4.1、7.1.4.1、8.1.4.1、9.1.4.1)的第一條都是：\n應對登錄的用戶進行身份標識和鑑別，身份標識具有唯一性，身份鑑別信息具有複雜度要求並定期更換；\n但是對於CISSP考試而言，“modern best practices”只包括NIST和ISO的標準或指南，等保不算，這題一定意義上專坑國內安全從業者的。","src":"官方習題精選"},{"id":"d5-07-01","ch":5,"level":"5-2","tag":"訪問控制模型","diff":3,"q":"Matthew是一家諮詢公司的安全管理員，必須執行訪問控制以限制用戶根據其先前的活動進行訪問。例如，一旦顧問訪問了屬於諮詢客戶Acme Cola的數據，他們就可能不再訪問屬於Acme的任何競爭對手的數據。哪種安全模型最適合Matthew的需求？","opts":["Clark-Wilson","Biba","Bell-LaPadula","Brewer-Nash"],"ans":3,"exp":"碰了 Acme 的數據，就得躲開 Acme 競爭對手的數據，這是防利益衝突的「中國牆」，只有 Brewer-Nash 幹這個。Biba 管完整性，Bell-LaPadula 管密級，Clark-Wilson 管良構事務，三者都不處理跨客戶的利益衝突。","src":"官方習題精選"},{"id":"d5-07-02","ch":5,"level":"5-2","tag":"訪問控制模型","diff":3,"q":"由於Biba完整性模型，Sally被阻止讀取文件。Sally具有機密級許可別，文件是秘密級分類。\n那麼這是正在執行Biba模型的什麼原則？","opts":["簡單安全規則","簡單完整性規則","*-安全規則","*-完整性規則"],"ans":1,"exp":"Biba 的簡單完整性規則就是「不能往下讀」：主體不能讀完整性等級比自己低的對象。Sally 是機密級，文件只是秘密級（更低），讀取被拒正是撞在這條上。簡單安全規則和 *-安全規則屬於 Bell-LaPadula，管的是機密性不是完整性，別混。","src":"官方習題精選"},{"id":"d5-07-03","ch":5,"level":"5-2","tag":"訪問控制模型","diff":3,"q":"Harry具有機密級安全許可，數據文件具有秘密級分類。Harry寫入數據文件的請求被阻止。\nBell-LaPadula模型的什麼原則阻止了此請求？","opts":["簡單安全規則","簡單完整性規則","*-安全規則","自主裁定規則"],"ans":2,"exp":"Bell-LaPadula 的 *-安全規則禁止「往下寫」：高等級主體不能把數據寫進低等級對象，防的是洩密。Harry 機密級、文件秘密級，屬於往下寫，所以被攔。簡單安全規則管的是「不能往上讀」，自主裁定規則是讓所有者自行授權，都不是這次被觸發的那條。","src":"官方習題精選"},{"id":"d5-15-01","ch":5,"level":"5-2","tag":"訪問控制","diff":3,"q":"Gary在決定應授予各個用戶哪些訪問權限時，應遵循什麼原則來指導他做出有關默認權限的決定？","opts":["職責分離","最低特權","聚合","特權分離"],"ans":1,"exp":"定默認權限的思路其實很樸素：先把門全關上，誰要幹活才給開哪一扇，而且只開剛好夠用的那一條縫。這就是最低特權。職責分離是把活兒拆給不同人互相牽制，特權分離是把同一份權限再切細，聚合則是把零散信息湊一起那種威脅，都跟“默認給多少權限”不搭界。","src":"官方習題精選"},{"id":"d5-15-02","ch":5,"level":"5-2","tag":"訪問控制","diff":3,"q":"在Gary設計程序時，使用如下顯示的矩陣。這個矩陣最直接地幫助執行什麼信息安全原則？","opts":["職責分離","聚合","雙人控制","縱深防禦"],"ans":0,"exp":"這個矩陣乾的事就一件：把互相沖突的任務分給不同主體，同一個個體不許同時佔住衝突的兩格。所以它最直接落實的是職責分離。雙人控制要求同一項操作兩人同時到場一起做，矩陣只是畫標記分活兒，不是每次都兩個人一起按；聚合和縱深防禦跟這個矩陣沒關係。","src":"官方習題精選"},{"id":"d5-15-03","ch":5,"level":"5-2","tag":"訪問控制","diff":3,"q":"Gary正準備為新用戶創建賬戶，併為其分配HR數據庫訪問權限。\n在授予此訪問權限之前，Gary必須驗證哪兩個信息元素？","opts":["憑證和需知","許可和需知","密碼和許可","密碼和生物識別掃描"],"ans":1,"exp":"給 HR 數據庫開門之前，得先確認兩件事：這人夠不夠級別（許可），以及業務上是不是真的需要知道這份數據（需知）。兩個條件缺一不可，有級別不代表該看，有業務需要也不代表有資格。密碼、憑證、生物識別只是在證明“你是你”，證明不了你有權碰這份東西。","src":"官方習題精選"},{"id":"d5-15-04","ch":5,"level":"5-2","tag":"訪問控制","diff":3,"q":"Gary準備開發訪問根加密密鑰的控件，並希望針對特別敏感的操作應用專門設計的安全性原則。\n他應採用以下哪個原則？","opts":["最小特權","縱深防禦","通過隱晦實現安全","雙人控制"],"ans":3,"exp":"根加密密鑰這種東西，一個人拿著就太危險了，所以要拆開、分人保管，真正動用時兩人同時在場才算數——這就是雙人控制。最小特權管的是“給得少”，縱深防禦管的是“多疊幾層”，都解決不了“一個人就能獨斷”的問題。通過隱晦實現安全本來就不是該用的設計原則。","src":"官方習題精選"},{"id":"d5-j02","ch":5,"level":"5-2","tag":"訪問控制模型","diff":3,"q":"In the figure shown here, Sally is blocked from reading the file due to the Biba integrity model. Sally has a Confidential security clearance, and the file has a Secret classification. What principle of the Biba model is being enforced?下圖中，由於Biba完整性模型，Sally被阻止讀取文件。Sally有秘密安全許可，文件有機密分類。Biba模式的什麼原則正在被執行？","opts":["Simple Security Property 簡單安全屬性","Simple Integrity Property 簡單完整性屬性","*-Security Property *-安全屬性","*-Integrity Property *-完整性屬性"],"ans":1,"exp":"【作者解題思路原文】\n本題天坑（有之一），題幹看著主體為“下”--秘密級，客體為“上”--機密級，biba允許向上讀呀，題目是不是出錯了\n其實這裡談論的是biba模型，這是個完整性模型，關注的是“完整”級而不是“密”級，所以題幹中那些“秘密安全許可”、“機密分類”等關於密級的字眼都應該忽略。\n解題思路很簡單：\nBell-LaPadula 對應 機密性；\nbiba 對應 完整性，談論biba時忽略關於密級的描述；\n無論Bell-LaPadula還是biba，“讀”就對應 簡單規則（屬性）；\n無論Bell-LaPadula還是biba，“寫”就對應 ＊-規則（屬性）；\n題幹討論biba，狀態是阻止讀，照著上面的對應關係，就是完整性的簡單規則，所以選B。","src":"官方習題精選"},{"id":"d5-18-01","ch":5,"level":"5-3","tag":"Kerberos","diff":3,"q":"如果客戶端已經通過KDC身份驗證，則當客戶端工作站要訪問資源時，客戶端工作站將在A點向KDC發送什麼？","opts":["它重新發送密碼。","票證授予請求（TGR）","票證授予票證（TGT）","服務票證（ST）"],"ans":2,"exp":"客戶端早就跟 KDC 認證過了，手裡攥著的是那張票證授予票證（TGT）。現在要訪問新資源，就拿著這張 TGT 去 KDC 換服務票證。密碼不會重發一遍，服務票證這個時候也還沒到手。","src":"官方習題精選"},{"id":"d5-18-02","ch":5,"level":"5-3","tag":"Kerberos","diff":3,"q":"在步驟A和B之間會發生什麼？","opts":["KDC驗證TGT的有效性以及用戶是否對請求的資源具有合適的特權。","KDC根據TGT中的數據更新其訪問控制列表。","KDC檢查其服務列表，並根據服務請求準備更新的TGT。","KDC生成服務票證以發放給客戶端。"],"ans":3,"exp":"A 點客戶端把 TGT 交上去，B 點它已經拿著票證去訪問服務了，那中間這一步只能是 KDC 生成服務票證發回來。TGT 本來就在客戶端自己手上，KDC 不會根據它去更新 ACL，也不會再發一張新的 TGT。","src":"官方習題精選"},{"id":"d5-18-03","ch":5,"level":"5-3","tag":"Kerberos","diff":3,"q":"被訪問的服務使用什麼系統來驗證票證？","opts":["KDC","客戶端工作站和KDC","客戶端工作站以客戶端到服務器票據和身份驗證器的形式提供它。","KVS"],"ans":2,"exp":"題幹問的是“被訪問的服務靠什麼驗證票證”。服務端拿到客戶端遞過來的服務票證，用自己的密鑰解密，再用隨票附上的驗證器核對身份和時效——整套東西都是客戶端提供的，服務端不必回頭去問 KDC。所以選“客戶端以客戶端到服務器票證加驗證器的形式提供”。","src":"官方習題精選"},{"id":"d5-18-04","ch":5,"level":"5-3","tag":"Kerberos","diff":3,"q":"服務票證（ST）在Kerberos身份驗證中提供什麼？","opts":["它充當身份驗證主機。","它提供了證明主體有權訪問客體的證據。","它提供了一個證明，表明一個主體已經通過KDC進行了身份驗證，並且可以請求票證訪問其他物體。","它提供票證授予服務。"],"ans":1,"exp":"服務票證是給“某個具體服務”看的，作用就是證明“我有權訪問你”。證明“我已經通過 KDC 認證、還能繼續申請別的票證”那是 TGT 的活兒。剩下兩項，一個在說身份驗證主機，一個在說票證授予服務，都是 KDC 的職責，不是 ST 的作用。","src":"官方習題精選"},{"id":"d5-21-01","ch":5,"level":"5-3","tag":"聯合身份認證","diff":3,"q":"Alex擔心SAML流量會被竊聽，還希望確保偽造的聲明不會成功。他應該怎麼做才能防止這些潛在的攻擊？","opts":["使用SAML的安全模式提供安全的身份驗證。","使用強大的密碼套件實施TLS，這將防止兩種攻擊。","使用強大的密碼套件實施TLS，並使用數字簽名。","使用強大的密碼套件和消息哈希實現TLS。"],"ans":2,"exp":"怕人偷聽，就用強密碼套件的 TLS 把通道加密；怕有人偽造斷言，就對 SAML 斷言做數字簽名，讓接收方能驗出真假。SAML 沒有所謂的“安全模式”；光加消息哈希也解決不了冒名問題，哈希只能說明內容沒變，說明不了是誰發的。","src":"官方習題精選"},{"id":"d5-21-02","ch":5,"level":"5-3","tag":"聯合身份認證","diff":3,"q":"如果Alex的機構主要是由外地出差用戶組成，那麼將關鍵業務應用程序集成到機構本地的身份驗證中會帶來哪些可用性風險，他將如何解決？","opts":["第三方集成可能不可信；使用SSL和數字簽名。","如果機構本地站點處於離線狀態，則出差用戶將無法訪問第三方應用程序；實施混合雲/本地身份驗證系統。","本地用戶可能無法正確重定向到第三方服務；實現本地網關。","瀏覽器可能無法正確重定向；使用主機文件來確保重定向問題得到解決。"],"ans":1,"exp":"員工大多在外面跑，如果認證完全靠公司本地那套，總部一端線，外面的人拿不到斷言，第三方應用就全進不去了——這就是可用性風險。解決辦法是搞混合雲/本地認證，本地掛了還有云端能發斷言。其餘選項講的都是信任和重定向的問題，不是可用性。","src":"官方習題精選"},{"id":"d5-21-03","ch":5,"level":"5-3","tag":"聯合身份認證","diff":3,"q":"哪種解決方案可以最好地幫助解決對由第三方機構控制SSO重定向（如圖中的步驟2）的擔憂？","opts":["有關受信任的第三方的宣傳活動","TLS","在本地站點處理重定向","實施IPS以捕獲SSO重定向攻擊"],"ans":2,"exp":"擔心的是“重定向這一步交給第三方，人家掛了或者不可信怎麼辦”。那最直接的辦法就是把重定向收回本地站點來做，控制權握在自己手裡。TLS 只管傳輸加密，管不了誰控制流程；IPS 也很難可靠認出這種邏輯層的操控；搞宣傳活動更不解決架構問題。","src":"官方習題精選"},{"id":"d5-25-01","ch":5,"level":"5-4","tag":"賬戶管理","diff":3,"q":"Joe是ERP系統的安全管理員。他正準備為多名新員工創建賬戶。創建賬戶時，他應為所有新員工提供什麼默認訪問權限？","opts":["只讀","編輯者","管理員","無訪問權"],"ans":3,"exp":"新賬戶要按最小權限加默認拒絕來建：先什麼都不給，再照崗位一個個往上加。一上來就給只讀、編輯者甚至管理員，等於先把門打開再想該不該開，出事就是越權。","src":"官方習題精選"},{"id":"d5-25-02","ch":5,"level":"5-4","tag":"賬戶管理","diff":3,"q":"以下哪一項不是特權管理活動，但是應自動發送一條記錄到超級用戶操作日誌中？","opts":["清除日誌條目","從備份還原系統","登錄到工作站","管理用戶帳戶"],"ans":2,"exp":"登錄自己的工作站是每個普通員工天天都在做的事，談不上什麼特權。而清日誌、從備份還原系統、管理用戶賬戶，這三樣都能直接動到系統的安全或可用性，所以才需要自動寫進超級用戶操作日誌留痕。","src":"官方習題精選"},{"id":"d5-25-03","ch":5,"level":"5-4","tag":"賬戶管理","diff":3,"q":"組織應何時審查用戶對敏感系統的特權訪問？","opts":["定期","用戶離開組織時","用戶更改角色時","以上所有這些"],"ans":3,"exp":"特權訪問不是審一次就完了：定期要複審一遍，人走了得立刻收回，換崗了要按新崗位重新核一遍。三項各管一種場景，缺一個就會留下權限過期的口子。","src":"官方習題精選"},{"id":"d5-30-01","ch":5,"level":"5-4","tag":"賬戶管理","diff":3,"q":"如果Alex僱用了新員工，並且在HR根據Alex用一系列表格提供的數據將信息手動輸入到配置系統中之後，該員工的帳戶會被配置（翻譯成“開通”可能更合適），則發生了什麼類型的配置？","opts":["自主決定的帳戶配置","基於工作流的帳戶配置","自動帳戶配置","自助帳戶配置"],"ans":0,"exp":"整個過程都是人在動手：HR 拿著 Alex 填的一堆表格，一條一條敲進配置系統。既沒有系統自動對接，也沒有審批流程在跑，開不開這個賬號、開哪些權限，全看人當時怎麼判斷，這就叫自主決定型。基於工作流的要走多級審批單；自動型是 HR 系統直接觸發、人不用插手；自助型是員工自己申請自己弄。","src":"官方習題精選"},{"id":"d5-30-02","ch":5,"level":"5-4","tag":"賬戶管理","diff":3,"q":"Alex可以訪問圖中的B，C和D。他應該向大學的身份管理團隊提出什麼關注？","opts":["配置過程沒有給他所需的權利。","他有了過多的特權。","可能正在發生特權蠕變（特權蔓延）。","未正確啟用日誌記錄。"],"ans":2,"exp":"Alex 十年裡當過系統管理員、DBA、幫助臺，現在居然還能摸到 B、C、D，說明每次換崗時舊權限都沒被收走，是一層層攢下來的。單看每一條權限可能都不算離譜，攢起來才出事，這個現象就叫特權蔓延。選「特權過多」容易混，但那是某一次分配給多了，跟跨崗位累積殘留不是一回事。","src":"官方習題精選"},{"id":"d5-30-03","ch":5,"level":"5-4","tag":"賬戶管理","diff":3,"q":"當Alex更換角色時，應該怎麼辦？","opts":["應該取消他原來的賬戶配置，並創建一個新賬戶。","他應該獲得添加到他的現有賬戶中的新權限。","應該只為他提供與其角色相匹配的權限。","他的權限應與他要替代的人的權限相匹配。"],"ans":2,"exp":"換崗的正確做法是按新角色重新配權限——該給的給，不該給的一律撤掉，只保留和當前職責匹配的那部分。直接取消舊賬號再新建一個沒必要，還會讓審計記錄斷檔；照著前任的權限抄更不行，權限是跟著崗位走的，不是跟著人走的。","src":"官方習題精選"},{"id":"d5-44-01","ch":5,"level":"5-4","tag":"特權管理","diff":3,"q":"下列哪種機制通常不被視為對欺詐的威懾作用？","opts":["工作輪換","強制休假","事件響應","雙人控制"],"ans":2,"exp":"威懾靠的是「我可能被抓住」。強制休假、工作輪換、雙人控制都在壓縮「做完手腳還能一直捂著」的空間，所以確實能嚇住人。事件響應是事情已經發生之後的處置流程，它既不懲罰誰，也嚇不住誰。","src":"官方習題精選"},{"id":"d5-44-02","ch":5,"level":"5-4","tag":"特權管理","diff":3,"q":"海倫正在實施一種新的安全機制，以便在會計系統中授予員工管理特權。她對流程進行了設計，員工獲得訪問權限之前，該員工的經理和會計經理必須都批准請求。海倫執行的是什麼信息安全原則？","opts":["最低權限","雙人控制","工作輪換","職責分離"],"ans":1,"exp":"關鍵在那句「經理和會計經理必須都批准」——權力被劈成兩半，誰一個人都動不了，這就是雙人控制。職責分離拆的是任務，講的是一個人別從頭包到尾，和這裡的共同授權不是一回事。最低權限回答的是「給多少」，而這題問的是「誰來批」。","src":"官方習題精選"},{"id":"d5-44-03","ch":5,"level":"5-4","tag":"特權管理","diff":3,"q":"Javier正在驗證是否只有IT系統管理員有權出於管理目的登錄服務器。\n他執行的是什麼信息安全原則？","opts":["知其所需","最低權限","雙人控制","傳遞信任"],"ans":1,"exp":"Javier 查的是「到底誰有資格登管理服務器」，一圈下來只剩系統管理員，其他人一律無權——這就是最低權限。知其所需管的是信息層面，看的是該不該看到某份數據；傳遞信任講的是信任關係層層外推；雙人控制要求兩個人一起操作，都不是這題在查的。","src":"官方習題精選"},{"id":"d5-44-04","ch":5,"level":"5-4","tag":"特權管理","diff":3,"q":"Tommy為他的組織處理訪問控制請求。一位用戶走近他並解釋說，他需要訪問人力資源數據庫才能完成CFO請求的人數分析。\n用戶成功地向Tommy展示了什麼？","opts":["許可","職責分離","知其所需","隔離"],"ans":2,"exp":"這用戶沒說「我是領導所以給我開權限」，他給的是具體用途：CFO 要一份人數分析，不做這個分析我就用不上這張表。這就是知其所需的定義——光有權限級別不算，還得說清幹什麼用。許可級別說的是他能碰哪一檔密級，不是這題演示的東西。","src":"官方習題精選"},{"id":"d5-19-01","ch":5,"level":"5-5","tag":"對訪問控制的攻擊","diff":3,"q":"在日誌核查期間，Saria發現了一系列顯示登錄失敗的日誌，如下所示：\nJan 31 11:39:12 ip-10-0-0-2 sshd[29092]: Invalid user admin from remotehost passwd=orange\nJan 31 11:39:20 ip-10-0-0-2 sshd[29098]: Invalid user admin from remotehost passwd=Orang3\nJan 31 11:39:23 ip-10-0-0-2 sshd[29100]: Invalid user admin from remotehost passwd=Orange93\nJan 31 11:39:31 ip-10-0-0-2 sshd[29106]: Invalid user admin from remotehost passwd=Orangutan1\nJan 31 20:40:53 ip-10-0-0-254 sshd[30520]: Invalid user admin from remotehost passwd=Orangemonkey\nSaria發現了哪種類型的攻擊？","opts":["暴力攻擊","中間人攻擊","字典攻擊","彩虹表攻擊"],"ans":2,"exp":"orange、Orang3、Orange93、Orangutan1——全是從同一個詞根上做大小寫和數字變形，這是拿詞表挨個去試，典型的字典攻擊。暴力攻擊是把字符組合窮舉一遍，出來的東西不會這麼整齊地圍著“orange”打轉。","src":"官方習題精選"},{"id":"d5-19-02","ch":5,"level":"5-5","tag":"對訪問控制的攻擊","diff":3,"q":"在日誌核查過程中，Danielle發現了一系列顯示登錄失敗的日誌：\nJan 31 11:39:12 ip-10-0-0-2 sshd[29092]: Invalid user admin from remotehost passwd=aaaaaaaa\nJan 31 11:39:20 ip-10-0-0-2 sshd[29098]: Invalid user admin from remotehost passwd=aaaaaaab\nJan 31 11:39:23 ip-10-0-0-2 sshd[29100]: Invalid user admin from remotehost passwd=aaaaaaac\nJan 31 11:39:31 ip-10-0-0-2 sshd[29106]: Invalid user admin from remotehost passwd=aaaaaaad\nJan 31 20:40:53 ip-10-0-0-254 sshd[30520]: Invalid user admin from remotehost passwd=aaaaaaae\nDanielle發現了哪種類型的攻擊？","opts":["哈希傳遞攻擊","暴力攻擊","中間人攻擊","字典攻擊"],"ans":1,"exp":"aaaaaaaa、aaaaaaab、aaaaaaac……按字母順序一位一位往上推，就是在窮舉字符空間，標準的暴力攻擊。字典攻擊會冒出詞語和它的變形；哈希傳遞玩的是抓到的哈希值，日誌裡不會留下這種明文口令一次次失敗的痕跡。","src":"官方習題精選"},{"id":"d5-19-03","ch":5,"level":"5-5","tag":"對訪問控制的攻擊","diff":3,"q":"以下哪種不是針對訪問控制的攻擊？","opts":["字典攻擊","暴力攻擊","淚滴","中間人"],"ans":2,"exp":"淚滴（Teardrop）是拿畸形的 IP 分片把目標打崩，屬於拒絕服務，跟“你是誰、你能幹什麼”這套訪問控制沒關係。字典攻擊、暴力攻擊、中間人都衝著認證和授權去，是訪問控制的常見對手。","src":"官方習題精選"},{"id":"d5-19-04","ch":5,"level":"5-5","tag":"對訪問控制的攻擊","diff":3,"q":"以下哪一項不是對訪問控制機制的常見威脅？","opts":["偽造的登錄頁面","網絡釣魚","字典攻擊","中間人攻擊"],"ans":1,"exp":"偽造登錄頁、字典攻擊、中間人，都是直接衝著認證或授權環節動手的技術手段。網絡釣魚主要是騙人點鏈接、把憑證交出去，落點在“人”身上，屬於社會工程，而不是直接攻擊訪問控制機制本身。","src":"官方習題精選"},{"id":"d5-19-05","ch":5,"level":"5-5","tag":"對訪問控制的攻擊","diff":3,"q":"以下預防措施可幫助預防哪種類型的攻擊？\n請求身份證明對僅語音請求要求回撥授權不通過語音通信更改密碼","opts":["DoS攻擊","蠕蟲","社會工程","肩窺"],"ans":2,"exp":"要求出示身份證明、純語音請求一律回撥核實、不許在電話裡改密碼——這三條全是在防“有人冒充身份騙你”的套路，也就是社會工程。肩窺是站你背後偷看，DoS 是把服務打癱，蠕蟲是自我複製傳播，都靠這幾條電話流程解決不了。","src":"官方習題精選"},{"id":"d5-20-01","ch":5,"level":"5-5","tag":"LDAP","diff":3,"q":"哪種LDAP認證模式可以提供安全認證？","opts":["匿名","SASL","簡單模式","S-LDAP"],"ans":1,"exp":"SASL 是個可插拔的認證框架，能掛 Kerberos、Digest-MD5 這類像樣的機制，所以能提供安全認證。匿名和簡單模式都是把口令明著發出去，S-LDAP 壓根不是標準認證模式。","src":"官方習題精選"},{"id":"d5-20-02","ch":5,"level":"5-5","tag":"LDAP","diff":3,"q":"Jim將他的LDAP客戶端配置為連接到LDAP目錄服務器。根據配置指南，他的客戶端應該在端口636上連接到服務器。\n這對Jim意味著，以下哪一個有關這個LDAP服務器的配置是正確的？","opts":["它要求通過SSL / TLS的連接。","它僅支持未加密的連接。","提供全局目錄服務。","它不提供全局目錄服務。"],"ans":0,"exp":"LDAP 的 636 端口就是 LDAPS，走的是 SSL/TLS 加密通道，所以說明這臺服務器要求加密連接。389 才是明文 LDAP，3268/3269 才是全局目錄相關的端口。","src":"官方習題精選"},{"id":"d5-20-03","ch":5,"level":"5-5","tag":"LDAP","diff":3,"q":"Alex將他的LDAP服務器配置為在636和3269上提供服務。根據LDAP的默認端口，Alex配置了哪種類型的LDAP服務？","opts":["不安全LDAP和不安全全局目錄","不安全LDAP和安全全局目錄","安全LDAP和安全全局目錄","安全LDAP和不安全全局目錄"],"ans":2,"exp":"636 是 LDAPS，安全；3269 是全局目錄走 SSL 的端口，也安全。所以配的是安全 LDAP 加安全全局目錄。沒加密的那兩個對應端口分別是 389 和 3268。","src":"官方習題精選"},{"id":"d5-20-04","ch":5,"level":"5-5","tag":"LDAP","diff":3,"q":"LDAP辨識名（DN）由用逗號分隔的、被稱為相對辨識名（RDN）的組件組成，這些組件具有屬性名稱和值。DN從左到右特異性逐漸變少（翻譯不出那個意思，其實就跟域名系統相似，越左邊的越具體，右邊的越寬泛）。\n以下哪個LDAP DN最適合此規則？","opts":["uid=ben,ou=sales,dc=example,dc=com","uid=ben,dc=com,dc=example","dc=com,dc=example,ou=sales,uid=ben","ou=sales,dc=com,dc=example"],"ans":0,"exp":"DN 從左往右越來越寬：先具體到某個人（uid=ben），再上一級到部門（ou=sales），最後才是域（dc=example、dc=com），跟域名越往右越泛是一個道理。B 把 dc=com 排在了 dc=example 前面，C 整個順序倒過來了，D 少了用戶這一級、順序也不對。","src":"官方習題精選"},{"id":"d5-20-05","ch":5,"level":"5-5","tag":"LDAP","diff":3,"q":"以下哪個不是有效的LDAP DN（辨識名）？","opts":["cn=ben+ou=sales","ou=example","cn=ben,ou=example;","ou=example,dc=example,dc=com+dc=org"],"ans":2,"exp":"DN 的各段之間只能用逗號隔開，末尾拿分號收尾是不合法的寫法，所以 C 有問題。A 和 D 裡的“+”表示一個 RDN 帶多個屬性值，是合法語法；B 只有一個組件，也是合法的。","src":"官方習題精選"},{"id":"d6-17-01","ch":6,"level":"6-1","tag":"評估與測試","diff":3,"q":"今年早些時候，Jim所在公司的信息安全團隊發現了他負責維護的網絡服務器存在漏洞，他立即應用並確定已正確安裝了補丁程序。但是即使Jim確信已安裝該補丁，漏洞掃描程序仍繼續基於發現的版本號將系統錯誤地標記為易受攻擊。以下哪個選項是Jim解決該問題的最佳選擇？","opts":["卸載並重新安裝補丁。","要求信息安全團隊將系統標記為已修補且不易受到攻擊。","更新Web服務器配置中的版本信息。","查看漏洞報告並使用其他修復選項。"],"ans":3,"exp":"補丁已經裝了、也確認裝對了，掃描器卻還憑版本號喊“有洞”——問題出在掃描器的判斷方法上，不在補丁上。正確做法是回頭複核漏洞報告，採用替代修復或補償性措施，比如加緩解控制、調整檢測邏輯、走例外流程。改配置裡的版本號是偽造狀態，讓安全團隊手工標“已修補”是繞過流程，兩個都不合規。","src":"官方習題精選"},{"id":"d6-17-02","ch":6,"level":"6-1","tag":"評估與測試","diff":3,"q":"在滲透測試過程中，Lauren被要求測試組織的藍牙安全性。\n以下哪個問題是她不必要向僱主解釋的？","opts":["藍牙掃描可能很耗時。","可能被掃描到的許多設備很可能是個人設備。","藍牙被動掃描可能需要在不同時間進行多次訪問，以識別所有目標。","藍牙主動掃描無法評估藍牙設備的安全模式。"],"ans":3,"exp":"主動掃描本來就是連上去問設備“你支持什麼、現在什麼模式”，恰恰能看出它的安全設置，所以這句話本身是錯的，當然不用跟僱主解釋。其餘三條都是真實存在的限制：掃起來費時間、掃到的大多是員工的私人設備、被動掃描得挑不同時段多去幾趟才湊得齊目標。","src":"官方習題精選"},{"id":"d6-17-03","ch":6,"level":"6-1","tag":"評估與測試","diff":3,"q":"Susan需要為其組織預測高風險領域，並希望使用度量標準來評估風險趨勢。她應該怎麼處理呢？","opts":["進行年度風險評估。","聘請滲透測試公司定期測試組織的安全性。","識別和跟蹤關鍵風險指標。","使用SIEM設備監視日誌和事件。"],"ans":2,"exp":"要“預測”高風險區、看“趨勢”，得靠能連續量化的東西，也就是關鍵風險指標，盯著它漲落就能看出走勢。年度風險評估一年才一次，太稀，看不出趨勢；滲透測試測的是具體控制扛不扛打，SIEM 看的是已經發生的事件日誌，都不是用來度量風險走向的。","src":"官方習題精選"},{"id":"d6-27-01","ch":6,"level":"6-1","tag":"評估與測試","diff":3,"q":"Susan的軟件測試員團隊需要測試每條代碼路徑，包括那些僅在出現錯誤情況時才會使用的代碼路徑。她的團隊需要哪種類型的測試環境來確保完整的代碼覆蓋？","opts":["白盒","灰盒","黑盒","動態"],"ans":0,"exp":"要連出錯分支那種平時跑不到的路徑都覆蓋，測試的人必須看得見源碼、能照著內部邏輯去設計用例，這就是白盒。黑盒和灰盒看不到全部內部結構，只能保證功能被點到，保證不了每條路徑都被走過。","src":"官方習題精選"},{"id":"d6-27-02","ch":6,"level":"6-1","tag":"評估與測試","diff":3,"q":"作為新應用程序持續測試的一部分，Susan的質量保證團隊為一系列黑盒測試設計了一組測試用例，然後運行這些功能測試，並準備一份報告來解釋發生了什麼。在此測試過程中，通常會生成哪種類型的報告來指示測試指標？","opts":["測試覆蓋報告","滲透測試報告","代碼覆蓋報告","行覆蓋報告"],"ans":0,"exp":"黑盒功能測試關心的是“需求和功能點有沒有被測到”，所以出的是測試覆蓋報告。代碼覆蓋報告和行覆蓋報告都得扒開代碼數執行過哪幾行，那是白盒的活兒；滲透測試報告是完全另一回事。","src":"官方習題精選"},{"id":"d6-27-03","ch":6,"level":"6-1","tag":"評估與測試","diff":3,"q":"作為代碼覆蓋測試的一部分，Susan的團隊使用日誌記錄和跟蹤工具在非生產環境中運行分析。由於操作環境中的這種變化，在測試過程中最有可能遺漏以下哪種類型的代碼問題？","opts":["不正確的邊界檢查","輸入驗證","競爭條件","指針操縱"],"ans":2,"exp":"競爭條件靠的是真實併發下的時序，非生產環境一開日誌和跟蹤，執行節奏全變了，本來能撞上的時序窗口就撞不上了，所以最容易漏。邊界檢查、輸入驗證、指針操作這些看代碼、造用例就能查出來，不靠時序碰運氣。","src":"官方習題精選"},{"id":"d6-j01","ch":6,"level":"6-1","tag":"安全評估與測試","diff":3,"q":"一家銀行緊急聘請了一名安全顧問來發現其業務中任何未知的和可利用的弱點。由於是長假期週末，高級管理人員和半數的員工都不在，該顧問決定在這期間採取行動。\n該顧問首先通過各種自動掃描工具收集目標的初步情報。然後，她通過遠程VPN(虛擬專用網絡)連接隧道傳輸流量，訪問其中一個內部網絡。在利用了該組織的服務器和數據庫中的幾個其他漏洞之後，該顧問設法自由地遍歷了環境的多個區域，收集了儘可能多的數據。一旦收集到足夠的信息，她就清除了所有她出現在被破壞的網絡中的痕跡。在接下來的一個工作日，她加密了安全測試的結果，並將有密碼保護的報告發送給了銀行的高級管理團隊。\n以下哪一項是該安全顧問所執行的？","opts":["漏洞掃描","滲透測試","入侵","道德黑客行為(Ethical hacking)"],"ans":2,"exp":"【作者解題思路原文】\n解析：\n黑客攻擊和滲透測試之間只有一個區別：許可(permission)。\nCISSP的一個核心概念是，在進行涉及組織生產環境的任何類型的測試之前，必須始終獲得書面許可和範圍界定。\n許可與合同（聘書）是不同的東西喲！！！","src":"官方習題精選"},{"id":"d6-s01","ch":6,"level":"6-1","tag":"集成測試","diff":2,"q":"支付團隊的兩個模塊分別通過了全部單元測試，但聯調時訂單金額與賬務金額對不上。QA 只剩兩天，最應該優先補做哪類測試？","opts":["對兩個模塊繼續追加單元測試，把行覆蓋率再提高几個百分點","針對服務之間的接口、消息格式和契約做集成測試","先對整套系統跑一遍端到端性能測試，看是不是負載導致","請業務部門按驗收標準做一輪用戶驗收測試"],"ans":1,"exp":"解析：兩個模塊各自在隔離環境裡都正確，問題多半出在它們對接口的假設不一致——字段含義、單位、序列化方式、錯誤碼，這類缺陷只有把組件真正連起來才會暴露，所以優先做集成測試。A 繼續堆單元測試只能證明單個單元更可靠，跨模塊的契約錯位它看不見；C 性能測試回答的是容量與時延問題，兩天內也搭不出可信的壓測環境；D 用戶驗收測試是業務方確認需求是否被滿足，前提是系統已經正確集成，拿它定位金額錯位既慢又找不準。","src":"原創"},{"id":"d6-26-01","ch":6,"level":"6-2","tag":"漏洞管理","diff":3,"q":"在工作日期間，流行的Apache Web服務器發佈了一個零日漏洞。Jacob擔任信息安全分析師的角色，他需要快速掃描其網絡，以確定哪些服務器容易受到此問題的影響。Jacob快速識別易受攻擊的系統的最佳途徑是什麼？","opts":["立即對所有服務器運行Nessus，以確定哪些系統易受攻擊。","檢查CVE數據庫以查找漏洞信息和補丁程序信息。","創建一個自定義IDS或IPS簽名。","識別受影響的版本，並使用自動掃描器檢查系統的版本號。"],"ans":3,"exp":"零日剛爆出來那天，商業掃描器的插件往往還沒來得及更新，指望 Nessus 當天就查出來不現實。最快的路子是先從公告裡確認哪個版本中招，再用自動化工具全網核對服務器的版本號，版本對得上的先隔離。B 只是查資料、定位不到主機，C 的 IDS/IPS 簽名也做不了全網盤點。","src":"官方習題精選"},{"id":"d6-26-02","ch":6,"level":"6-2","tag":"漏洞管理","diff":3,"q":"Jim使用一種工具來掃描系統中的可用服務，然後將其連接以收集banner信息，以確定正在運行的服務的版本。然後，它會基於服務指紋、banner信息以及與CVE關聯的的詳細信息，提供一份報告，詳細說明收集的內容。Jim使用哪種類型的工具？","opts":["端口掃描程序","服務驗證程序","漏洞掃描程序","補丁管理工具"],"ans":2,"exp":"先掃端口找服務，再連上去抓 banner 認版本，最後跟 CVE 對一遍出報告——這條流水線就是漏洞掃描器。端口掃描器掃完端口就收工，不判斷有沒有洞；補丁管理工具管的是把補丁發下去，不管找洞。","src":"官方習題精選"},{"id":"d6-26-03","ch":6,"level":"6-2","tag":"漏洞管理","diff":3,"q":"以下哪種策略不是補救漏洞掃描程序確定的漏洞的合理方法？","opts":["安裝補丁。","使用變通解決方案。","更新banner或版本號。","使用應用程序層防火牆或IPS來防止針對已識別漏洞的攻擊。"],"ans":2,"exp":"把 banner 或版本號改掉只是換了塊招牌，洞還在原地，反而讓後面的掃描和審計看走眼。打補丁、用變通方案（關掉服務、加規則）、在應用層防火牆或 IPS 上把攻擊流量擋掉，都是正經的修或者遮。","src":"官方習題精選"},{"id":"d6-s02","ch":6,"level":"6-2","tag":"優先級","diff":3,"q":"漏洞管理員拿到本月報告：兩個漏洞的 CVSS 基礎分都是 9.8。一個位於可從互聯網訪問的舊版 VPN 網關，已有公開利用代碼並出現在在野利用清單裡；另一個位於與生產隔離的實驗室環境，暫時沒有可用的利用方式。他最合理的處理順序依據是什麼？","opts":["兩個分數一樣，按掃描器輸出的順序依次處理","先修實驗室那一個，因為實驗室主機數量更多","先處理互聯網暴露且在野利用的那個，另一個結合資產關鍵性與補償控制來安排","等廠商發佈下一個累積補丁時一起修，減少變更次數"],"ans":2,"exp":"解析：CVSS 基礎分只描述漏洞自身的固有屬性，不包含資產暴露面、業務重要性，也不反映當前是否已被利用；真正的修復順序要把基礎分與環境指標、威脅情報（是否有在野利用）、資產關鍵性合起來看。A 把基礎分當成唯一排序依據，等於放棄風險管理；B 主機數量不是關鍵變量，隔離環境已經大幅降低了可利用性；D 對已有在野利用的 9.8 漏洞拖延修復，暴露窗口內的風險不可接受。","src":"原創"},{"id":"d6-s03","ch":6,"level":"6-2","tag":"結果分析","diff":3,"q":"新入職的漏洞管理員收到 1200 條掃描結果，直接按 CVSS 從高到低派單，運維一週後抱怨根本做不完。他最先應該改變的做法是什麼？","opts":["先合併重複項、複核誤報，再結合資產清單確認暴露面與業務關鍵性，排出可執行的修復隊列","讓掃描器只輸出 9 分以上的結果，減少工單數量","把 1200 條平均分給每個系統管理員，限期各自關閉","關掉低危插件，專注高危，避免告警疲勞"],"ans":0,"exp":"解析：漏洞管理是風險管理流程，不是把掃描結果原樣轉發。同一個 CVE 在多臺主機上重複出現要先歸併，誤報要先複核，再用資產清單判斷哪些資產真正暴露、承載什麼業務，才能得到數量有限、能落地的修復順序。B 只看分數會漏掉 7 分但位於關鍵暴露系統的漏洞，而且掩蓋了真實工作量；C 平均分配無視風險差異和責任人歸屬；D 關閉插件會失去可見性，低危漏洞組合起來同樣能打通一條攻擊鏈。","src":"原創"},{"id":"d6-s04","ch":6,"level":"6-2","tag":"誤報處理","diff":2,"q":"掃描器連續三週報告某臺服務器仍啟用 SMBv1，但管理員已按基線禁用，並用組策略和本機命令核對過。作為漏洞管理負責人，最合適的做法是？","opts":["在報告裡手工刪掉這一條，不必留記錄，免得反覆解釋","直接為該主機申請永久風險接受，以後不再掃描它","把該主機移出掃描範圍，避免影響整體指標","用帶憑證的掃描和手工驗證複核檢測邏輯，確認是誤報後提交調優或誤報工單，並納入例外跟蹤"],"ans":3,"exp":"解析：誤報也要有證據、有記錄、有閉環：先用認證掃描或手工核驗確認檢測邏輯（插件版本、註冊表或協議探測方式），確認後向廠商提交調優，或在內部登記誤報與例外並保留證據，這樣指標才可信。A 手工刪除沒有審計痕跡，報告和趨勢都被汙染；B 永久接受等於放棄這臺主機的可見性；C 移出範圍會讓這臺主機將來出現的真實漏洞也一起消失。","src":"原創"},{"id":"d6-s05","ch":6,"level":"6-2","tag":"資產清單","diff":3,"q":"公司剛收購一家子公司，CIO 要求下週就對對方網絡做全量漏洞掃描併發布修復 SLA。安全經理最應該先做什麼？","opts":["立即對全部網段做高強度掃描，邊掃邊補資產清單","先採購一套功能更強的掃描器，工具到位問題自然解決","先按行業平均水平發佈修復時限制度，清單以後再補","先取得主機與責任人清單，確認掃描授權和維護窗口，再據此制定 SLA"],"ans":3,"exp":"解析：資產清單是漏洞管理的地基——不知道有哪些系統、歸誰負責、跑什麼業務，就無法界定掃描範圍、分派修復責任，也定不出合理的時限；同時掃描要事先取得授權並避開維護窗口，避免打掛老舊設備或觸發生產告警。A 無清單的高強度掃描在剛接管的網絡上風險很高，結果也沒人認領；B 工具解決不了範圍與責任問題；C 沒有清單支撐的 SLA 既無法執行也無法度量。","src":"原創"},{"id":"d6-s06","ch":6,"level":"6-2","tag":"風險處置","diff":3,"q":"某支付服務器存在認證繞過漏洞，CVSS 7.5，官方補丁需要重啟、停機約四小時。正值月末結算高峰，業務負責人明確表示不能停。安全經理最合適的做法是？","opts":["今晚低峰期強制重啟打補丁，安全優先，不必再問業務","把該服務器從資產清單裡移除，避免留下未修復記錄","與業務負責人共同評估風險，先上補償控制（收緊訪問、WAF 規則、加強監控），約定結算後的變更窗口，並留下限期修復與風險接受記錄","把這條發現標記為誤報，等下一輪掃描再說"],"ans":2,"exp":"解析：修復時機本質上是業務風險決策，安全部門既無權單方面停掉結算系統，也不能因此不修；正確路徑是補償控制先頂上、限期修復、把接受的風險正式記錄下來並由業務所有者確認。A 未經變更管理強行重啟關鍵系統，造成的業務中斷可能比漏洞本身更大；B 移除資產是掩蓋問題，審計和攻擊者都不會因此放過它；D 標記誤報屬於造假，會破壞整個漏洞管理數據的可信度。","src":"原創"},{"id":"d6-16-01","ch":6,"level":"6-3","tag":"漏洞與攻擊","diff":3,"q":"作為事件響應過程的一部分，Charles安全地擦除了受感染計算機的驅動器，並用原始介質重新安裝了操作系統。完成後，他為計算機打好所有補丁並應用其組織的安全模板，然後再將系統重新連接到網絡。但他發現，在系統恢復服務後，幾乎是同時的，系統又重新連接到之前連接著的那個殭屍網絡了。\nCharles應該在哪裡尋找導致此行為的惡意軟件？","opts":["操作系統分區","系統BIOS或固件","系統內存","安裝介質"],"ans":1,"exp":"重裝系統、補丁打全、模板也套上了，結果一聯網幾秒鐘就回連原來那個殭屍網絡——最合理的解釋是惡意代碼根本不住在硬盤上，而是藏在 BIOS 或固件裡，重裝系統碰都碰不到它。安裝介質是原始官方介質，可以排除；內存斷電就清空，活不過一次重啟。","src":"官方習題精選"},{"id":"d6-16-02","ch":6,"level":"6-3","tag":"漏洞與攻擊","diff":3,"q":"一名黑客最近通過精確定時(控制時機的)攻擊來修改文件，從而侵犯了James公司的數據完整性。攻擊者一直等到James使用哈希值驗證文件內容的完整性之後，然後在James驗證完整性並讀取文件內容的時間之間修改文件。這是發生了什麼類型的攻擊？","opts":["社會工程","TOC/TOU","數據欺詐","參數檢查"],"ans":1,"exp":"攻擊者專門卡在“你剛驗完哈希”和“你真正去讀文件”之間那點時間差裡，把內容換掉。檢查時看到的東西和使用時用到的東西不是同一個，這就是典型的 TOC/TOU（檢查時間與使用時間）攻擊。數據欺詐是在錄入那一步就改數，不靠這個時間窗；社會工程是騙人，參數檢查屬於另一類輸入校驗問題。","src":"官方習題精選"},{"id":"d6-16-03","ch":6,"level":"6-3","tag":"漏洞與攻擊","diff":3,"q":"Johnson Widgets公司嚴格限制了對總銷量信息的訪問，將其歸類為競爭機密。但是，出貨文員可以不受限制地訪問訂單記錄，以完成交付。一個出貨文員最近拉取了一個季度的所有個人銷售記錄，並將它們總計起來以確定總銷量。這是發生了什麼類型的攻擊？","opts":["社會工程","推理","聚合","數據欺詐"],"ans":2,"exp":"單看每一條訂單記錄，出貨文員都有權訪問；但他把整季度的個人銷售記錄全拉下來加總，就湊出了“總銷量”這個密級更高、本來不該給他的結論。用低敏感信息拼出高敏感情報，這是聚合攻擊。推理攻擊是從能看到的信息推出沒看到的東西，靠的不是逐條收集再彙總。","src":"官方習題精選"},{"id":"d6-s07","ch":6,"level":"6-3","tag":"授權範圍","diff":3,"q":"滲透測試合同授權範圍為 203.0.113.10 至 .12 三臺 Web 服務器。測試中乙方發現同網段的 .13 是客戶合作方的訂單系統，且存在同樣的漏洞。測試人員最合適的做法是？","opts":["既然是同一個項目，一併測完再報告，客戶會理解的","只做一次無害驗證，不利用就不算越界","直接聯繫合作方，告訴他們系統存在漏洞","立即停止對 .13 的任何測試，記錄該發現，書面向客戶說明並申請擴展授權後再進行"],"ans":3,"exp":"解析：滲透測試與入侵的分界線就是授權，範圍外系統即使同網段、同項目也不在授權內，任何探測都需要新的書面授權。A 越界測試可能違法並影響合作方業務；B “無害驗證”仍然是未授權訪問，法律風險一樣存在；C 繞過客戶直接聯繫第三方，既無授權也可能洩露客戶信息。正確做法是停下、記錄、走擴權流程。","src":"原創"},{"id":"d6-s08","ch":6,"level":"6-3","tag":"社會工程","diff":3,"q":"客戶要求“測一測員工會不會上釣魚郵件的當”，但合同裡只寫了“社會工程測試”四個字。項目經理在動手前最應該確認什麼？","opts":["與客戶書面確認允許的手法、目標人群、是否可以收集憑證、數據如何處置，以及 HR 與法務的介入和通報機制","直接對全公司發釣魚郵件，樣本越大結果越可信","冒充 IT 支持打電話索要密碼，這樣最能反映真實水平","從暗網買一份員工郵箱列表，提高郵件可信度"],"ans":0,"exp":"解析：社會工程測試直接涉及員工、個人信息和勞動關係，規則必須事先寫清楚：用什麼手法（郵件、電話、物理入侵）、測哪些人、能不能真的收集憑證、收集到的數據怎麼保管銷燬、出了問題向誰通報，並讓 HR 和法務參與。B 未經協調的全員釣魚可能引發恐慌、投訴甚至勞動爭議；C 索取真實口令超出最小必要，風險和責任都不受控；D 使用非法來源的數據本身就違法，還會把客戶拖進數據洩露事件。","src":"原創"},{"id":"d6-s09","ch":6,"level":"6-3","tag":"紅隊演練","diff":3,"q":"公司連續三年做滲透測試，董事會問的卻是“我們的 SOC 到底能不能發現真實攻擊”。安全負責人最合適的回應是？","opts":["再做一次全量漏洞掃描，用高危漏洞數量說明檢測水平","讓合規部門把 SIEM 規則文檔審一遍，規則齊全就說明能發現","組織一次隱蔽、目標導向的紅隊演練，由紫隊把攻擊路徑轉化為檢測規則和響應改進","安排一次桌面推演，大家坐下來討論流程"],"ans":2,"exp":"解析：滲透測試的目標是找漏洞，通常有時間盒，也不刻意隱蔽；要檢驗檢測與響應能力，需要紅隊按真實對手的戰術、技術和過程行動並儘量不被發現，再由紫隊把“為什麼沒看到”變成具體的檢測規則和流程改進。A 掃描不產生攻擊行為，測不出 SOC 的水平；B 紙面規則不等於有效告警，規則寫了也可能不觸發；D 桌面推演練的是決策流程，不驗證真實檢測能力。","src":"原創"},{"id":"d6-s10","ch":6,"level":"6-3","tag":"測試報告","diff":2,"q":"滲透測試報告裡有一個尚未修復的高危漏洞，客戶市場部要求把它刪掉，“否則潛在客戶做審計時會看到”。作為測試負責人，最合適的做法是？","opts":["刪掉該條，改在口頭彙報時說明","把該條的風險等級改成低風險，讓報告看起來平衡一些","出兩份報告，給審計一份乾淨的，內部留一份完整的","保留髮現、證據和風險等級，在報告中另附客戶的整改計劃與管理層回應，但不刪除事實"],"ans":3,"exp":"解析：測試報告是審計證據和決策依據，測試方不能替客戶篡改事實；客戶可以附加管理回應、整改計劃或正式的風險接受說明，但不能讓發現消失。A 口頭說明沒有證據力，事後無法追溯；B 擅自降級就是造假，會讓讀到報告的人低估風險；C 雙版本報告屬於欺騙，一旦被發現，報告的獨立性和測試方的信譽都會崩塌。若客戶堅持，測試方應書面記錄分歧，必要時終止合作。","src":"原創"},{"id":"d6-s11","ch":6,"level":"6-3","tag":"複測","diff":2,"q":"三個月前報告的一個高危漏洞，客戶說開發已經修好，並提供了補丁發佈記錄，要求你出具“已修復”證明用於外部審計。最合適的做法是？","opts":["依據補丁記錄直接出具證明，省時省力","按原範圍做複測，用原驗證方法並補充變體，確認修復有效後出具註明日期的複測報告","複用原報告，在後面加一句“相關漏洞已修復”","讓開發經理籤一份修復聲明，附在報告後面"],"ans":1,"exp":"解析：漏洞是否真的關閉必須由獨立驗證來證明，補丁記錄只能說明“裝了什麼”，不能說明“洞沒了”——常見情況是隻修了報告裡那一個入口，繞過路徑依然存在。複測要限定範圍、註明時點，還可以對同類變體抽樣。A、C、D 都是把被審計方的自述當成審計證據，缺少獨立性，外部審計不會接受。","src":"原創"},{"id":"d6-01-01","ch":6,"level":"6-4","tag":"基線","diff":3,"q":"CIS基準是一種什麼實踐的例子？","opts":["進行風險評估","實施數據標籤","適當的系統所有權","使用安全基線"],"ans":3,"exp":"CIS 基準說白了就是別人替你把操作系統、數據庫、中間件「該怎麼配才安全」列成一份清單，你照著打勾就行——這份東西的本體就是安全基線，所以選 D。A 的風險評估是另一件事，B 的數據標籤是給數據貼密級，C 的系統所有權說的是「這攤事歸誰負責」，三個都跟配置清單不搭邊。","src":"官方習題精選"},{"id":"d6-01-02","ch":6,"level":"6-4","tag":"基線","diff":3,"q":"要將CIS基準與組織的使命和特定的IT系統相校準，將涉及哪兩個過程？","opts":["範圍和選擇","範圍和裁剪","基線化和裁剪","裁剪和選擇"],"ans":1,"exp":"通用的 CIS 基準是給全世界用的，直接照抄肯定不合身，所以要兩步：先劃圈——哪些系統、哪些版本歸它管（scoping）；再動刀——把不適用或過頭的條目刪掉改掉（tailoring）。所以選 B。選項裡帶「選擇」和「基線化」的都可以排除：選擇聽起來像從菜單裡挑，基線化指的是把基準落地成基線本身，都不含「按本組織改寫通用條目」這層意思。","src":"官方習題精選"},{"id":"d6-01-03","ch":6,"level":"6-4","tag":"基線","diff":3,"q":"要為選定的系統或軟件包從基線中選擇控制措施，你應該如何決策？","opts":["去諮詢數據的保管者","根據所存儲或處理的數據的分類（密級）進行選擇","將相同的控制應用於所有系統","去諮詢這些系統或數據所支持的業務的企業所有者"],"ans":3,"exp":"某個系統或軟件包該套哪些控制，得由「這套系統所支撐的業務」的所有者拍板，因為他承擔風險、也最清楚業務要什麼，所以找業務所有者（D）。A 的數據保管者只管按要求執行，不做決策；B 光看數據密級只是一項輸入，不是全部依據；C 一刀切最省事，也最容易配錯。","src":"官方習題精選"},{"id":"d6-s12","ch":6,"level":"6-4","tag":"SOC 2","diff":3,"q":"一家 SaaS 供應商的客戶要求它證明：過去 12 個月裡，與安全性、可用性相關的控制持續有效運行，並要看到詳細的控制描述和測試結果。客戶應該索取哪份報告？","opts":["SOC 1 Type II 報告","SOC 2 Type I 報告","SOC 2 Type II 報告","SOC 3 報告"],"ans":2,"exp":"解析：SOC 2 依據信任服務原則（安全性、可用性、處理完整性、保密性、隱私），Type II 覆蓋一段期間，說明控制在這段時間內是否持續有效運行，正好對應“過去 12 個月”。SOC 1 只覆蓋與財務報告相關的控制；Type I 是某個時點的快照，不證明持續運行；SOC 3 是面向公眾的摘要報告，沒有詳細控制描述和測試結果。","src":"原創"},{"id":"d6-s13","ch":6,"level":"6-4","tag":"SOC 3","diff":2,"q":"一家初創 SaaS 公司想把合規證明放到官網，讓所有潛在客戶自行下載，又不願公開詳細的控制描述和測試細節。最合適的是哪份報告？","opts":["SOC 3 報告","SOC 2 Type II 報告全文","SOC 1 Type II 報告","內部審計報告"],"ans":0,"exp":"解析：SOC 3 是面向公眾的通用報告，只包含審計意見和對系統描述的摘要，可以公開發布，正好滿足“能下載但不暴露細節”。SOC 2 詳細報告是受限分發的，通常要在保密協議下提供給客戶；SOC 1 針對的是財務報告相關控制，不適合拿來做安全能力宣傳；內部審計報告沒有獨立第三方意見，也不宜對外公開。","src":"原創"},{"id":"d6-s14","ch":6,"level":"6-4","tag":"SOC 1","diff":3,"q":"採購經理拿到服務商的 SOC 1 Type II 報告，看到是無保留意見，就認為“安全控制沒問題，可以簽約”。安全經理應該怎麼糾正？","opts":["SOC 1 Type II 已經覆蓋全部安全控制，可以直接作為依據","SOC 1 只覆蓋與財務報告相關的控制，不能證明信息安全控制有效，應另行索取 SOC 2 或等效的獨立鑑證報告","SOC 1 是服務商的自評報告，沒有審計師意見","SOC 1 只有 Type I 有效，Type II 不作數"],"ans":1,"exp":"解析：SOC 1 關注的是服務商與客戶財務報告相關的內部控制（ICFR），無保留意見只說明這部分控制沒問題，推不出信息安全控制有效。評估安全、可用性要看 SOC 2。C 說反了，SOC 1 是獨立審計師出具的鑑證報告，不是自評；D 也說反了，Type II 覆蓋一段期間的運行有效性，可信度高於只描述時點設計的 Type I；A 則是把報告範圍擴大到了它沒覆蓋的領域。","src":"原創"},{"id":"d6-s15","ch":6,"level":"6-4","tag":"CC/EAL","diff":3,"q":"採購部門看到某款防火牆通過了 CC EAL4+ 認證，認為“等級夠高，可以直接採購”。安全架構師最合適的回應是？","opts":["EAL4 表示只發現了 4 個漏洞，數字越大越安全","通過 CC 認證的產品不需要再做配置加固和補丁管理","EAL 是保障等級，反映評估的深度和嚴格程度，不代表功能強弱或是否適合本組織；應結合安全目標、保護輪廓和自身需求判斷","EAL 越高性能越好，可以直接替代風險評估"],"ans":2,"exp":"解析：CC 同時評估功能要求（SFR）和保障要求（SAR），EAL 是一組保障要求的組合，衡量“這個產品被驗證到什麼程度”，既不等於安全功能更強，也不保證沒有漏洞；是否適用要看 Security Target、Protection Profile 與組織的實際需求，認證也有版本和時效，運維加固與補丁管理照舊。A 是對 EAL 的編造；B 把認證當成了運維豁免；D 把保障等級和性能、風險評估混為一談。","src":"原創"},{"id":"d6-s16","ch":6,"level":"6-4","tag":"審計證據","diff":3,"q":"審計師要驗證“所有生產變更都經過審批”。管理層提供的證據是變更委員會會議截圖和一份手工整理的 Excel 清單。最合適的下一步是？","opts":["從變更管理系統直接導出帶時間戳的完整記錄，抽樣並與實際部署記錄、工單交叉核對","接受截圖，因為管理層已經簽字確認","只抽查最近一個月，其餘月份可以合理推定","改為詢問變更經理，口頭確認即可"],"ans":0,"exp":"解析：審計證據要可靠、完整、可驗證。系統直接導出的記錄比截圖和手工清單可靠得多——後兩者可以編輯，也可以只提供想給的那部分；抽樣要覆蓋整個審計期間，並用部署日誌、工單、審批流交叉驗證，才能支撐“所有變更”都走了流程這個結論。B 簽字不能替代證據本身；C 不能用一個月推定全年；D 口頭證據證明力最弱，只能作為補充，不能單獨支撐結論。","src":"原創"},{"id":"d6-02-01","ch":6,"level":"6-5","tag":"STRIDE","diff":3,"q":"Bobbi正在調查一個安全事件，發現攻擊者從普通的用戶賬戶著手，設法利用系統脆弱性為該賬戶提供管理權限。按STRIDE威脅建模方法這是什麼類型的攻擊？","opts":["欺騙","否認（抵賴）","篡改","特權提升"],"ans":3,"exp":"普通用戶賬戶借漏洞把自己「升」成管理員，這就是特權提升（Elevation of Privilege）。欺騙是冒用別人的身份，篡改是改數據，抵賴是事後不認賬，這三個都對不上「權限被放大」這個動作。","src":"官方習題精選"},{"id":"d6-02-02","ch":6,"level":"6-5","tag":"STRIDE","diff":3,"q":"Gary正在分析一個安全事件，在他的調查過程中，一個用戶否認曾執行了Gary認為是該用戶所做的一個動作。參照STRIDE模型，發生了什麼類型的威脅？","opts":["否認（抵賴）","信息洩漏","篡改","特權提升"],"ans":0,"exp":"幹了事不認賬，正是 STRIDE 裡的抵賴（Repudiation），對策是審計日誌、數字簽名這類讓行為賴不掉的手段。信息洩露是數據漏出去，篡改是數據被改，特權提升是權限被放大，都跟「否認自己做過」無關。","src":"官方習題精選"},{"id":"d6-02-03","ch":6,"level":"6-5","tag":"STRIDE","diff":3,"q":"John正在分析針對他的公司的攻擊，攻擊者在其中發現嵌入在HTML代碼中的註釋，這些註釋提供了關於可利用的軟件漏洞的線索。使用STRIDE模型，他發現了什麼類型的攻擊？","opts":["欺騙","否認（抵賴）","信息洩漏","特權提升"],"ans":2,"exp":"開發人員忘了刪 HTML 註釋，把路徑、版本號、調試線索白白送給攻擊者，這是把內部信息漏出去，屬於信息洩露。攻擊者既沒冒充誰（不是欺騙），也沒改數據（不是篡改），更沒升權限。","src":"官方習題精選"},{"id":"d6-s17","ch":6,"level":"6-5","tag":"STRIDE","diff":3,"q":"團隊用數據流圖做威脅建模，對圖中的“數據流”（從進程 A 流向進程 B）應用 STRIDE，哪些威脅類別適用？","opts":["欺騙、抵賴、特權提升","篡改、信息洩露、拒絕服務","六類全部適用","只有信息洩露"],"ans":1,"exp":"解析：STRIDE 要按元素映射才準確。數據流可能被篡改、被竊聽導致信息洩露、被中斷造成拒絕服務；而數據流本身沒有身份可供冒充（欺騙）、不會自己否認做過事（抵賴）、也沒有權限可以提升，這三類針對的是進程、外部實體等元素。C 一刀切地說六類全適用，會讓威脅列表塞滿不可能發生的場景；A 列的三類恰好是數據流不適用的；D 漏掉了篡改和拒絕服務。","src":"原創"},{"id":"d6-s18","ch":6,"level":"6-5","tag":"DREAD","diff":3,"q":"團隊用 DREAD 給威脅排序，五名成員對同一個威脅給出 4 到 9 的不同分數，會上爭執不下。作為負責人，最合適的做法是？","opts":["取平均值，先把排序做完再說","放棄 DREAD，改用 CVSS 基礎分給威脅排序","由資歷最高的人直接定分，避免爭論","為每個維度定義可觀察的評分錨點和統一口徑，先做一次校準練習再打分，並記錄評分假設"],"ans":3,"exp":"解析：DREAD 的五個維度（潛在損害、可復現性、可利用性、受影響用戶、可發現性）本身帶主觀性，分數差異大通常不是態度問題，而是口徑不一致；先給每個等級定義可觀察的錨點、集體校準，分數才有可比性，同時把假設寫下來便於複核。A 取平均只是把噪聲攤平，分歧仍在；B 概念錯位，CVSS 評的是漏洞嚴重性，不評威脅場景；C 用權威壓分歧，下次還會吵。","src":"原創"},{"id":"d6-s19","ch":6,"level":"6-5","tag":"攻擊樹","diff":3,"q":"團隊以“獲取客戶數據庫管理員憑證”為根節點建攻擊樹，發現一條路徑成本最低：供應商門戶弱口令、跳到內網、讀取配置文件裡的明文口令。最合適的下一步是？","opts":["在該路徑的關鍵節點同時加固：供應商門戶上多因素認證、跳板機最小權限、配置中的口令改由密鑰管理服務託管，然後重新評估攻擊樹","只修最末端“配置文件存明文口令”這一處就夠了","繼續把攻擊樹的所有葉子畫完，再統一動手","把攻擊樹換成 STRIDE，按六類威脅重新排查"],"ans":0,"exp":"解析：攻擊樹的價值在於找出最可能的攻擊路徑並優先剪斷；一條鏈上多個環節同時減弱，攻擊者換招的成本才會真正上升，單點修復往往被繞過——弱口令入口和多因素認證缺失仍然在。B 只修末端那一處，攻擊者改走門戶弱口令直接進內網，路徑依然通。C 是分析癱瘓，攻擊者不會等你畫完；D 換方法並不能消除已經識別出的低成本路徑。","src":"原創"},{"id":"d6-s20","ch":6,"level":"6-5","tag":"KRI","diff":3,"q":"董事會問 CISO：“未來一個季度，我們的安全風險是在上升還是下降？”CISO 最應該提供哪類信息？","opts":["KPI，例如補丁及時率、安全培訓完成率","本季度安全事件總數，越少越好","KRI，例如互聯網暴露的高危漏洞數量、攻擊者平均駐留時間、異常特權登錄的趨勢，並附基線與閾值","漏洞掃描次數和工單關閉數量"],"ans":2,"exp":"解析：KRI 是前瞻性的風險指標，用來觀察風險暴露的變化趨勢，配合基線和閾值才能回答“在變好還是變壞”。KPI 衡量的是控制活動執行得好不好（補丁打得多及時、培訓做沒做），是“我們做得怎麼樣”，不是“風險往哪走”。B 是滯後的事件計數，發生了才知道，預測不了；D 是工作量指標，掃描次數多不等於風險低，還容易被刷量。","src":"原創"},{"id":"d6-s21","ch":6,"level":"6-5","tag":"建模時機","diff":2,"q":"一個功能已經開發完成、下週就要上線，團隊這時才開始做威脅建模，架構師說“太晚了”。最合適的理由和補救方式是？","opts":["威脅建模應在設計階段隨架構迭代進行，此時修改設計成本最低；現在做只能得到補救性結論，應把識別出的威脅轉為整改項和監控規則","威脅建模屬於運維階段的工作，上線後做才準確","威脅建模應該在滲透測試之後做，用測試結果反推威脅","威脅建模一年做一次就行，和開發生命週期沒有關係"],"ans":0,"exp":"解析：威脅建模是設計活動，越早做越能影響信任邊界、認證方式、數據流這些結構性問題，越往後返工成本越高；上線前才做，架構基本凍結，能做的只是補償控制和監控，等於把設計缺陷留到運行階段去還。B 把被動運維當成建模時機；C 順序顛倒，滲透測試是驗證手段，不能替代建模；D 與 SDLC 脫節，新功能和新數據流出現時就必須重新建模。","src":"原創"},{"id":"d7-14-01","ch":7,"level":"7-1","tag":"事件響應","diff":3,"q":"在事件響應流程的方面，哪個術語最能描述Ann的組織中發生的事情？","opts":["Security occurrence 偶發安全事件","Security incident 嚴重安全事件","Security event 安全事件","Security intrusion 安全入侵"],"ans":2,"exp":"這會兒只是 IDS 報了個異常流量的警，還沒人確認它真是攻擊——題裡也說了，這套系統的警報很多都是誤報。所以只能算安全事件（event），即觀察到的狀態變化。incident 要確認違反了安全策略，intrusion 要確認真的被闖進去了，兩個都還差證據。（先別急著定性，這是事件響應的基本功。）","src":"官方習題精選"},{"id":"d7-14-02","ch":7,"level":"7-1","tag":"事件響應","diff":3,"q":"Ann繼續調查發現，生成警報的流量是異常大量的UDP端口53入站流量。通常什麼服務會使用這個端口？","opts":["DNS","SSH/SCP","SSL/TLS","HTTP"],"ans":0,"exp":"UDP 53 是 DNS 的端口，域名解析就走它（TCP 53 一般留給區域傳送這類大塊數據）。另外幾個順手記一下：SSH/SCP 是 22，SSL/TLS 是 443，HTTP 是 80。這題屬於送分，但要背熟。","src":"官方習題精選"},{"id":"d7-14-03","ch":7,"level":"7-1","tag":"事件響應","diff":3,"q":"當Ann對流量進行進一步分析時，她意識到流量來自許多不同的來源，並且淹沒了網絡，從而阻止了合法的使用。入站數據包是對查詢的響應，但她在出站流量中沒看到對應的查詢。相對於它們的類型，響應包也大得異常。Ann應該懷疑是受到了哪種類型的攻擊？","opts":["偵察","惡意代碼","系統滲透","拒絕服務"],"ans":3,"exp":"幾個特徵湊一起就明白了：入站包多得把網絡淹了、正常業務進不來；這些包是查詢的響應，可出站方向根本找不到對應的查詢；響應包還大得離譜。這是典型的反射放大式 DDoS——攻擊者偽造源地址去問 DNS，讓一堆服務器把放大的應答全砸向受害者。偵察只是探路，惡意代碼和系統滲透也不是靠淹沒帶寬來生效的。","src":"官方習題精選"},{"id":"d7-14-04","ch":7,"level":"7-1","tag":"事件響應","diff":3,"q":"既然Ann知道發生了違反其組織的安全策略的攻擊，那麼哪個術語最能描述Ann的組織中發生了什麼？","opts":["偶發安全事件","嚴重安全事件","安全事件","安全入侵"],"ans":1,"exp":"現在性質變了：已經確認是攻擊，而且違反了組織的安全策略，這就夠上「安全事件 incident」的定義，該正式啟動事件響應流程了。event 只是觀察到的現象，定性還沒到這一步；intrusion 是 incident 的一種具體類型，用它反而把範圍說窄了；occurrence 壓根不是標準術語。","src":"官方習題精選"},{"id":"d7-45-01","ch":7,"level":"7-1","tag":"事件調查","diff":3,"q":"Tim是一名取證分析師，他正試圖從硬盤中檢索信息。用戶似乎試圖擦除數據，而Tim正在嘗試重建數據。\nTim正在進行哪種類型的法證分析？","opts":["軟件分析","介質分析","嵌入式設備分析","網絡分析"],"ans":1,"exp":"Tim 動手的對象是硬盤本身，要找的是被抹掉、被格式化之後殘留的內容——這是直接在存儲介質這一層刨。軟件分析看的是程序日誌，網絡分析看流量，嵌入式設備分析是查攝像頭、路由器那類設備。所以是介質分析。","src":"官方習題精選"},{"id":"d7-45-02","ch":7,"level":"7-1","tag":"事件調查","diff":3,"q":"Jerome正在進行取證調查，並正在檢查數據庫服務器日誌，以調查查詢內容，尋找SQL注入攻擊的證據。他在做什麼類型的分析？","opts":["硬件分析","軟件分析","網絡分析","介質分析"],"ans":1,"exp":"他看的是數據庫服務器日誌，也就是在找「程序記下來的這些查詢語句裡有沒有貓膩」。這屬於應用層和日誌層的活，是軟件分析。介質分析是去硬盤扇區裡刨，網絡分析看流量，硬件分析看物理設備本身。","src":"官方習題精選"},{"id":"d7-45-03","ch":7,"level":"7-1","tag":"事件調查","diff":3,"q":"你正在對網絡上潛在的殭屍網絡感染進行調查，並希望對在網絡上的不同系統和Internet上的不同系統之間傳遞的信息執行取證分析。\n你認為這些信息很可能是加密的。而且開始調查的時候，這些活動已經結束了。獲取這些信息的原始材料的最佳且最簡單的方式是什麼？","opts":["數據包捕獲","Netflow 數據","入侵檢測系統日誌","集中式身份認證的記錄"],"ans":1,"exp":"兩個條件把別的選項全卡死了：流量已加密，抓包抓回來也只有看不懂的密文；活動已經結束，現在去抓根本抓不到東西。Netflow 是設備平時一直在記的元數據，只記誰連了誰、什麼時候、傳了多少——加密擋不住它，事後還能翻，最省事。","src":"官方習題精選"},{"id":"d7-j04","ch":7,"level":"7-1","tag":"事件響應","diff":3,"q":"Which of the following should be the FIRST action to take when a fire spreads throughout the building?\n整棟建築起火時，首先應採取以下哪一項措施？","opts":["Check the facility access logs. 檢查設施訪問記錄。","Call together the crisis management team. 召集危機管理團隊。","Launch the disaster recovery plan. 啟動災難恢復計劃。","Launch the business continuity plan. 啟動業務持續計劃。"],"ans":0,"exp":"【作者解題思路原文】\n解析：\n災難發生時人員安全始終排在第一位，所以B、C、D雖然與災難應對有關但並不算好答案。\n這題的有趣之處在於檢查設施（facility常見翻譯為“設施”，但意義其實挺廣泛的，這裡的意思更接近於“場所”）訪問記錄有啥用。這主要是為了確保所有人員均安全撤離，尤其是那些不在常駐人員名錄中的臨時到訪人員。","src":"官方習題精選"},{"id":"d7-s01","ch":7,"level":"7-1","tag":"證據保全","diff":3,"q":"某零售企業的安全運營中心分析師 Lena 在深夜接到告警：一臺存放會員數據的 Windows 服務器疑似被入侵，攻擊者可能仍通過遠程會話在線操作，機器處於開機狀態且尚未重啟。取證團隊要 30 分鐘後才能到場，Lena 必須先決定現場保全的採集順序。按照通行的取證原則，她應當最先做的是？","opts":["立即硬關機斷電，防止攻擊者繼續破壞系統，然後再取硬盤鏡像","先採集內存鏡像，再對磁盤做鏡像，並全程記錄操作人、時間、工具及其版本","先對磁盤做完整鏡像，內存內容轉瞬即逝且不可靠，等磁盤鏡像做完再回頭處理內存","先讓系統管理員導出業務日誌並刪除可疑賬號，等取證團隊到場後再統一採集"],"ans":1,"exp":"解析：取證採集遵循「易失性順序」，越容易消失、越依賴運行狀態的證據越先採：CPU 寄存器與緩存、內存、交換文件與臨時文件、磁盤、遠程日誌、歸檔備份。機器還開著，內存裡的會話、進程和加密密鑰是第一個會沒的東西，所以先抓內存再拍磁盤，並把操作人、時間、工具版本記入證據鏈。選項 A 把機器關掉，內存內容直接蒸發，時間戳和運行狀態也被破壞，屬於最常見的現場錯誤；選項 C 把順序倒過來，磁盤鏡像做完可能要幾小時，期間內存早已被覆蓋或隨重啟丟失；選項 D 一邊導出日誌一邊刪賬號，等於在取證前主動修改系統狀態，破壞證據完整性，也讓後續無法證明採集過程是否被汙染。","src":"原創"},{"id":"d7-s02","ch":7,"level":"7-1","tag":"遏制策略","diff":3,"q":"某醫院的信息安全經理 Marcus 發現一臺生產數據庫服務器被植入 webshell，攻擊者仍在外連，而該服務器上還運行著尚未落盤的內存緩存，磁盤也啟用了全盤加密。他需要在儘量不銷燬證據的前提下阻斷攻擊。最合適的做法是？","opts":["立即硬關機斷電，徹底切斷攻擊者的遠程會話","直接格式化並重裝系統，先恢復業務，事後再說取證","在交換機上把該主機移入隔離 VLAN，保留供電與運行狀態，隨後採集內存鏡像","關閉數據中心邊界防火牆的全部入站規則，阻止外部訪問"],"ans":2,"exp":"解析：遏制的目標是在限制攻擊者活動的同時保留可恢復與可取證的狀態。按端口或 VLAN 做網絡隔離，攻擊者立刻失去通路，而機器的內存、進程和加密卷仍處在可用狀態，之後可以從容取證。選項 A 的硬關機看似乾淨，實際上會丟掉內存中的會話與密鑰；全盤加密的磁盤在關機後還需要恢復密鑰才能讀取，等於給取證加了一道牆。選項 B 直接銷燬證據，既無法確定入侵範圍和入口，也無法向監管證明發生過什麼。選項 D 屬於過度遏制：它對已經進入內網並持有合法憑據的攻擊者基本無效，卻會同時切斷正常業務流量，把影響面擴大到整個數據中心。","src":"原創"},{"id":"d7-31-01","ch":7,"level":"7-2","tag":"日誌管理","diff":3,"q":"當發現問題並檢查日誌時，結果卻發現攻擊者已經清除了他們洩露的系統上的日誌。\n今後如何才能防止這種情況發生呢？","opts":["加密本地日誌","需要管理權限才能改變日誌","啟用日誌滾動","將日誌發送到堡壘主機"],"ans":3,"exp":"攻擊者既然能把本機日誌清掉，說明他已經拿到了那臺機器的管理員權限，本地加密、限制修改權限這些都攔不住他——他直接把整個文件刪了就行。真正管用的是在日誌產生的當下就實時送到另一臺受保護的機器上，本地那份沒了，副本還在。日誌滾動只是換個文件寫，不解決被刪的問題。","src":"官方習題精選"},{"id":"d7-31-02","ch":7,"level":"7-2","tag":"日誌管理","diff":3,"q":"Jack如何使用其機構的新的集中式日誌記錄來檢測此類問題？","opts":["部署並使用IDS","將日誌發送到中央日誌服務器","部署並使用SIEM","使用syslog"],"ans":2,"exp":"已經有集中式日誌了，缺的是「從一堆日誌裡看出問題」的能力，SIEM 乾的就是這個活：把各處的日誌匯到一起做關聯分析，命中規則就告警。像日誌突然中斷這種信號，靠人肉翻基本翻不出來。IDS 看的是網絡流量而不是日誌，syslog 只是把日誌傳過去，本身不會分析。","src":"官方習題精選"},{"id":"d7-31-03","ch":7,"level":"7-2","tag":"日誌管理","diff":3,"q":"Jack如何才能最好地確保對其環境中的系統所採取的操作實現可問責性？","opts":["日誌檢查並要求對每個日誌進行數字簽名。","要求對採取的所有操作進行身份驗證，並集中捕獲日誌。","記錄管理憑據的使用情況，並加密傳輸中的日誌數據。","要求授權並集中捕獲日誌。"],"ans":1,"exp":"可問責的核心是「這件事到底是誰幹的」，所以每項操作都必須綁定到一個確定的身份，也就是先做身份驗證；然後日誌要集中收走，防止本人事後篡改或刪除。只做授權不行——授權只說明「允許他做」，證明不了「是他做的」。給每份日誌單獨數字簽名又太重，不是必須的。","src":"官方習題精選"},{"id":"d7-s03","ch":7,"level":"7-2","tag":"時鐘同步","diff":2,"q":"某電商的安全分析師 Chen 調查一起數據洩露，把防火牆、Web 服務器和應用服務器的日誌彙總到 SIEM 後發現時間線對不上：防火牆記錄的是 14:05，Web 服務器記錄的是 22:05，應用日誌又比前兩者慢約 3 分鐘，導致無法判斷入侵請求的先後順序。他首先應當做的是？","opts":["讓所有日誌源與統一的可信時間源做 NTP 同步，並統一以 UTC 記錄時間戳","在 SIEM 裡為每類設備手工配置時區偏移，據此重建時間線","丟棄設備自身的時間，改用 SIEM 收到日誌的時間來排序","把日誌留存期延長到一年，便於日後反覆比對"],"ans":0,"exp":"解析：日誌能否被關聯，取決於時間基準是否一致。正確做法是全部日誌源指向同一組可信 NTP 源（並做分層與訪問控制，防止時間源被投毒），時間戳統一用 UTC 存儲，展示時再按本地時區換算，這樣既能對齊時間線，也能避免夏令時和設備漂移帶來的偏差。選項 B 的手工偏移只是一次性補丁：設備時鐘仍會漂移、時區變更後配置會失真，而且設備數量一多就無法維護。選項 C 用接收時間替代發生時間，只能說明日誌什麼時候到達 SIEM，網絡延遲和批量轉發會讓先後關係徹底顛倒，反而製造錯誤結論。選項 D 隻影響能翻多久以前的記錄，與時間是否準確無關。","src":"原創"},{"id":"d7-s04","ch":7,"level":"7-2","tag":"日誌留存","diff":2,"q":"某支付服務商受監管要求約束：日誌至少留存一年，其中最近三個月必須能即時查詢分析。新任安全運營經理 Dana 接手時發現，SIEM 只保留 30 天熱數據，超期日誌被直接刪除，也沒有任何歸檔。她應當優先做的是？","opts":["把 SIEM 熱存儲擴容到能裝下一整年的日誌，讓所有數據始終在線可查","只在發生安全事件時臨時開啟日誌記錄，平時關閉以節省存儲","讓各服務器在本機磁盤上自行保留日誌，需要時再從主機上收集","按合規要求分層保存：近期日誌留在線可查詢，超期部分歸檔到防篡改的低成本存儲，並保證一年內可按需檢索"],"ans":3,"exp":"解析：日誌留存要求區分「可即時查詢」和「需可檢索」兩檔，前者對應在線熱存儲，後者對應歸檔冷存儲，因此分層保存既滿足合規又控制成本；歸檔介質還要防篡改，才能在調查或審計時證明記錄未被改動。選項 A 讓一年數據全部在線，成本高得沒有道理，也偏離了監管只要求近三個月可即時分析的原意。選項 B 平時不記錄，事件發生後再開啟，恰恰漏掉了最需要的那段日誌，事後無法補錄。選項 C 把日誌留在各自主機上，分散且受本機管理員控制，一次入侵或一次磁盤清理就能讓記錄消失，無法保證完整留存。","src":"原創"},{"id":"d7-s05","ch":7,"level":"7-2","tag":"日誌防篡改","diff":3,"q":"某企業的日誌服務器與生產系統處在同一個域中，由同一組系統管理員維護。內審發現，管理員可以修改甚至刪除自己操作產生的日誌，事後也無法證明日誌未被改動。最有效的改進措施是？","opts":["要求系統管理員簽署保密協議，並定期開展安全意識培訓","對日誌內容做對稱加密，密鑰由日誌管理員本人保管","把日誌實時送往另一個管理域的日誌平臺，由權限不同的賬號管理，並歸檔到只寫一次（WORM）存儲，配合哈希校驗","開啟日誌滾動，每天生成新文件並壓縮，便於集中管理"],"ans":2,"exp":"解析：防篡改要靠技術上的職責分離與不可改寫存儲：日誌實時離開產生它的系統，落到由另一組賬號管理的平臺，產生日誌的人既沒有刪除權也沒有改寫權，再配合 WORM 歸檔和哈希鏈，任何改動都能被發現。選項 A 屬於管理性控制，只能約束有意願遵守的人，無法阻止有權限的人動手。選項 B 的加密對內部人無效，持密鑰的管理員照樣能解密、修改、再加密，而且日誌本身失去可讀性，無法用於關聯分析。選項 D 的滾動只是按天切分文件，切出來的舊文件依然可以被刪除或修改，壓縮也不提供任何完整性證明。","src":"原創"},{"id":"d7-s06","ch":7,"level":"7-2","tag":"監控盲區","diff":3,"q":"某公司在互聯網邊界部署了完整的 IDS/IPS，但一次攻擊者用釣魚郵件拿到一名員工工作站的權限後，憑合法憑據在兩星期內橫向移動到財務數據庫，全程沒有觸發告警。覆盤發現，所有檢測設備都只覆蓋互聯網邊界。最應當優先補上的監控盲區是？","opts":["提高邊界 IDS 的規則更新頻率，縮短特徵庫更新週期","在數據中心各網段之間部署傳感器並採集 NetFlow，把內部東西向流量接入 SIEM 做異常檢測","提高終端殺毒軟件的掃描頻率與全盤掃描範圍","縮短防火牆日誌的輪轉週期，保留更多明細"],"ans":1,"exp":"解析：這次失陷的特徵是「已經進來、用合法憑據在內部移動」，邊界設備根本看不到內部主機之間的會話，缺口在東西向流量的可見性，所以要在網段之間加傳感器、採集 NetFlow 並接入 SIEM，用行為基線和關聯規則識別異常登錄與橫向訪問。選項 A 只加強邊界，流量不進邊界就沒有任何效果。選項 C 的殺毒掃描依賴惡意文件特徵，而橫向移動常用的是系統自帶的遠程服務和合法賬號，很容易被放過，也補不上網絡層的可見性。選項 D 縮短輪轉週期實際上會減少日誌保留時間，不僅不增加覆蓋範圍，還可能削弱事後追溯能力。","src":"原創"},{"id":"d7-s07","ch":7,"level":"7-2","tag":"日誌傳輸","diff":3,"q":"某銀行的 DMZ 服務器用 UDP 514 把 syslog 明文發往內網 SIEM。一次攻擊調查中，分析師發現受攻擊時段的日誌在 SIEM 中整段缺失，但服務器本地的日誌文件是完整的，SIEM 存儲用量長期只有 40%。最可能的原因與合適的修正分別是？","opts":["UDP syslog 無確認機制，在擁塞、防火牆會話超時或瞬時丟包時會丟失報文；應改為經 TLS 保護的可靠傳輸（如 syslog over TLS，TCP 6514），並在發送端保留本地緩衝","雙方時鐘不同步導致 SIEM 拒收日誌；配置統一的 NTP 時間源即可","SIEM 存儲寫滿後自動覆蓋了舊日誌；擴容存儲即可","攻擊者刪除了 DMZ 服務器上的日誌；啟用文件完整性監控即可"],"ans":0,"exp":"解析：UDP 是無連接、無確認的傳輸，syslog 報文發出即丟，擁塞或防火牆 UDP 會話表項超時都會造成成段丟失，而本地文件仍完整、SIEM 也不缺空間，正好排除了其他原因；修正方式是改用 TLS 承載的可靠傳輸，密碼套件同時解決明文可嗅探的問題，發送端本地緩衝則能在鏈路中斷時暫存待補。選項 B 的時間不同步會造成時間戳錯亂與關聯失敗，不會表現為「整段沒到」。選項 C 已被存儲用量 40% 的觀察排除。選項 D 與本地日誌完整這一事實矛盾：本地都在，只是沒送出去，說明問題出在傳輸鏈路而不是被刪除。","src":"原創"},{"id":"d7-29-01","ch":7,"level":"7-3","tag":"備份","diff":3,"q":"Tara應該首先對服務器應用哪些備份？","opts":["週日的完全備份","週一的差異備份","週二的差異備份","週三的差異備份"],"ans":0,"exp":"恢復是從最近一次「完全備份」開始往回拼的，所以第一步只能落在週日那一份上。差異備份只記錄「自週日以來改過的東西」，那些一直沒動過的原始文件它裡面壓根沒有，單拿它一個還原不出一臺完整的服務器。週二的差異備份比周三的還舊，更沒有理由先選它。","src":"官方習題精選"},{"id":"d7-29-02","ch":7,"level":"7-3","tag":"備份","diff":3,"q":"Tara總共必須對系統應用多少個備份，以使數據儘可能是最新的？","opts":["1","2","3","4"],"ans":1,"exp":"週三中午那份差異備份是故障前最新的，所以恢復只需要兩樣東西：週日完全備份打底，再把週三中午的差異覆蓋上去，一共 2 個。選 1 是以為差異備份能單獨用；選 3 或 4 是把差異備份當增量在數了。","src":"官方習題精選"},{"id":"d7-29-03","ch":7,"level":"7-3","tag":"備份","diff":3,"q":"在這個備份方式中，某些數據可能會不可挽回地丟失。多長時間內所做的更改將丟失？","opts":["3小時","5小時","8小時","不會丟失數據"],"ans":0,"exp":"週三中午剛做完差異備份，下午三點服務器就掛了，這中間三個小時裡的改動只存在於服務器本身，哪個備份裡都沒有。所以丟的就是這 3 小時。別被 5 小時、8 小時騙了，那是從週日或者早上開始算的。","src":"官方習題精選"},{"id":"d7-29-04","ch":7,"level":"7-3","tag":"備份","diff":3,"q":"如果Tara遵循相同的時間表，但將差異備份切換為增量備份，那麼她總共需要向系統應用多少個備份，以使數據儘可能是最新的？","opts":["1","2","3","4"],"ans":3,"exp":"增量備份和差異備份不是一回事：增量只記「自上次任意一次備份以來」的變化，是一層一層往上摞的。所以恢復時要把週日全備加上週一、週二、週三三次增量，按順序全部應用，一個都不能跳，一共 4 個。","src":"官方習題精選"},{"id":"d7-29-05","ch":7,"level":"7-3","tag":"備份","diff":3,"q":"如果Tara從差異備份更改為增量備份，並且假設每天更改的信息量相同，那麼以下哪個文件最大？","opts":["星期一的增量備份","星期二的增量備份","星期三的增量備份","這三個文件的大小相同。"],"ans":3,"exp":"每天改的數據量一樣多，而每個增量備份只裝當天那一點變化，所以週一、週二、週三三份大小是一樣的。容易錯在拿差異備份的思維套上去——差異是越積越大的，增量不是。","src":"官方習題精選"},{"id":"d7-s12","ch":7,"level":"7-3","tag":"備份類型","diff":3,"q":"某線上服務的資料庫超過 2 TB，做一次完整備份要 8 小時，而業務只允許每天 2 小時的備份窗口；管理層要求最多只能損失 4 小時的資料。備份策略最應該怎麼調整？","opts":["維持每日完整備份，用更高壓縮率把時間壓進窗口","改為每週一次完整備份，其餘每天做增量備份","取消檔案備份，改用磁碟 RAID 保證資料不丟","每天做兩次完整備份，分散在兩個時段"],"ans":1,"exp":"解析：備份窗口只有 2 小時、可接受損失 4 小時，這兩個條件決定了必須縮短每次備份的時間。增量備份只複製自上次備份以來變更的區塊，時間通常遠小於完整備份，配合每週一次完整備份做基準，既進得了窗口，也能把 RPO 控制在 4 小時內。A 的問題是壓縮率提升有限，壓不進窗口，而且每次都全量會持續擠壓業務；C 的 RAID 只防單顆磁碟故障，防不了誤刪、勒索軟體與站點級災難，它不是備份；D 只是把同樣的 16 小時拆成兩段，總時間與 I/O 壓力都沒解決。","src":"原創"},{"id":"d7-s13","ch":7,"level":"7-3","tag":"備份安全","diff":3,"q":"一家公司的備份磁帶一直存放在機房的金屬櫃裡，既沒加密也沒離線。某次勒索軟體加密了生產環境與備份伺服器上的所有資料，公司發現連備份也救不回來。事後最應該優先補上的兩件事是什麼？","opts":["把備份週期從每天改成每小時，並增加備份伺服器的磁碟容量","在機房加裝門禁與監視器，並提高備份作業的並行度","備份資料加密，且至少保留一份離線或異地的副本","改用雲端硬碟同步資料夾，讓資料自動上傳備份"],"ans":2,"exp":"解析：這次的根因不是備份不夠頻繁，而是備份與生產環境同處一個可被同一波攻擊觸及的範圍，而且沒有加密。離線或異地副本讓勒索軟體碰不到備份，加密則保證磁帶遺失或被竊時內容不會直接外洩，兩者合起來才構成可恢復的底線。A 只是把備份做得更頻繁，備份伺服器一樣會被加密，損失反而更密集；B 的門禁與監視器防的是實體入侵，對勒索軟體沒作用，並行度也和可恢復性無關；D 的同步工具通常會把加密後的檔案同步回本機，等於把破壞複製一份，雲端同步不等於備份。","src":"原創"},{"id":"d7-s14","ch":7,"level":"7-3","tag":"還原驗證","diff":2,"q":"季度檢查中，備份系統的報表顯示過去 90 天的備份任務全部成功、校驗和也都通過。但一次真實的資料誤刪事件中，維運人員按流程還原，卻發現還原出來的資料庫檔案無法開啟。事後檢討時，最該被指出缺少的環節是什麼？","opts":["備份頻率不足，應該從每天一次提高到每小時一次","沒有定期做還原演練，只驗證了備份有沒有跑完","備份伺服器的磁碟空間太小，導致檔案被截斷","沒有對備份資料做二次校驗和，無法確認內容正確"],"ans":1,"exp":"解析：備份任務成功、校驗和通過，只能說明資料被複製過去了，不能說明它還能被還原成可用的系統。真正的驗證是定期把備份還原到隔離環境並實際啟動，量測還原時間、確認應用能正常運作，這一步才能暴露檔案損壞、版本不相容、憑證缺漏這類問題。A 的頻率再高，如果還原流程本身有問題，結果一樣打不開；C 是臆測，題幹沒有任何空間不足的線索；D 的校驗和其實已經在做了，它保證的是傳輸與存放過程沒被改動，卻保證不了「還原後能不能用」，所以補二次校驗和解決不了這次的症狀。","src":"原創"},{"id":"d7-41-01","ch":7,"level":"7-4","tag":"DRP","diff":3,"q":"Florian正在為其組織制定災難恢復計劃，並希望確定特定IT服務在不對業務運營造成嚴重損害的情況下可以停機的時間量。\nFlorian在計算什麼變量？","opts":["RTO","MTD","RPO","SLA"],"ans":1,"exp":"題目問的是「最多能停多久還不出大事」，這就是 MTD——業務能扛的最大中斷時間，一超過就開始真傷筋動骨。RTO 說的是「打算花多久恢復」，那是目標不是底線；RPO 管能丟多少數據；SLA 是跟客戶籤的服務承諾，都不是這個變量。","src":"官方習題精選"},{"id":"d7-41-02","ch":7,"level":"7-4","tag":"DRP","diff":3,"q":"Greg正在為其組織制定災難恢復計劃，並希望確定在宕機後恢復特定IT服務應花費的時間。\nGreg在計算什麼變量？","opts":["RTO","MTD","RPO","SLA"],"ans":0,"exp":"這回問的是「恢復要花多少時間」，也就是給自己定的目標時長，答案自然是 RTO。MTD 是業務能忍的停機上限，RTO 必須壓在它之內，兩個不是一回事；RPO 管數據丟多少，SLA 是對外籤的服務承諾。","src":"官方習題精選"},{"id":"d7-41-03","ch":7,"level":"7-4","tag":"DRP","diff":3,"q":"James正在為其組織構建災難恢復計劃，並希望確定停機後可接受的數據丟失量。James正在確定的變量是什麼？","opts":["RTO","MTD","RPO","SLA"],"ans":2,"exp":"問能接受丟多少數據，對應的就是 RPO，通常用時間來量——比如「最多丟 15 分鐘的數據」，就意味著備份或複製至少得這麼勤。RTO 講恢復要多久，MTD 講最多能停多久，倆都不管數據丟多少。","src":"官方習題精選"},{"id":"d7-41-04","ch":7,"level":"7-4","tag":"DRP","diff":3,"q":"以下哪個事件標誌著災難恢復過程的完成？","opts":["保護財產和生命安全","在備用設施中的恢復運營","在主要設施中的恢復運營","現場急救人員停止工作（離場）"],"ans":2,"exp":"災難恢復的終點是把業務搬回主站點、讓它正常跑起來，備用站點只是中途的落腳處，不是家。保護生命財產是事發最初就要做的事，急救人員撤場更不代表系統恢復了。所以選 C。","src":"官方習題精選"},{"id":"d7-42-01","ch":7,"level":"7-4","tag":"DRP演練","diff":3,"q":"Glenda希望進行一項災後恢復測試，尋求一種測試方法，以便能夠在不中斷正常信息系統活動的情況下審查該計劃，並儘可能減少所需的時間。\n她應該選擇什麼類型的測試呢？","opts":["桌面演練","並行測試","完全中斷測試","檢查列表複核"],"ans":3,"exp":"她要的是「不碰生產、還最省時間」，那就是檢查表複核：大家對著計劃和檢查表逐條看，確認內容齊不齊，開個會念一遍就完事。桌面演練雖然也不停業務，但得把人湊齊做場景推演，明顯更花時間；並行測試和完全中斷測試都要真開機。","src":"官方習題精選"},{"id":"d7-42-02","ch":7,"level":"7-4","tag":"DRP演練","diff":3,"q":"Mark正在計劃為他的組織進行災難恢復測試。他希望對災難恢復設施執行真實的測試，但不想中斷主要設施的操作。\n馬克應該選擇什麼類型的測試？","opts":["桌面演練","並行測試","完全中斷測試","檢查列表複核"],"ans":1,"exp":"既要真的把災備站點跑起來，又不能影響主站點，只有並行測試符合：兩邊同時運行、災備那邊真處理數據，主站點照常營業。桌面演練只是嘴上過一遍，完全中斷測試會把主站停掉，檢查表複核連繫統都不碰。","src":"官方習題精選"},{"id":"d7-42-03","ch":7,"level":"7-4","tag":"DRP演練","diff":3,"q":"在以下哪些災難恢復測試中，團隊坐在一起討論對某場景的響應，但不實際激活任何災難恢復措施？","opts":["桌面演練","並行測試","完全中斷測試","檢查列表複核"],"ans":0,"exp":"題幹說的「坐在一起討論場景、什麼都不真啟動」，就是桌面演練的寫照，純口頭推演。並行測試和完全中斷測試都要實際拉起系統，檢查表複核只是照單核對、不做場景討論。","src":"官方習題精選"},{"id":"d7-42-04","ch":7,"level":"7-4","tag":"DRP演練","diff":3,"q":"Norm希望為他的組織進行災難恢復測試，並希望選擇最全面的測試類型，即使這可能會造成相當大的影響。諾姆想選擇什麼類型的測試？","opts":["桌面演練","並行測試","完全中斷測試","檢查列表複核"],"ans":2,"exp":"要最全面、還不怕影響業務，那就是完全中斷測試：把主站點真關掉，切到災備站點跑，最能暴露計劃裡的坑，代價是業務真的中斷。並行測試不動主站點，桌面演練只動嘴，檢查表複核只動眼，都驗不出真章。","src":"官方習題精選"},{"id":"d7-j15","ch":7,"level":"7-4","tag":"數據中心選址","diff":3,"q":"In addition to life, protection of which of the following elements is MOST important when planning a data center site?\n除了生命之外，在規劃數據中心站點時，保護以下哪些要素最重要?","opts":["Data and hardware 數據和硬件","Property and operations 屬性和操作","Profits and assets 利潤和資產","Resources and reputation 資源和聲譽"],"ans":2,"exp":"【作者解題思路原文】\n先聲明，我沒拿到標準答案，這是個人的建議。\n解題思路：\nA 顯然是保護對象，但數據中心裡東西這麼多，這裡只點出了兩個狹義的事項，而且根據這兩個詞應該可以立即聯想到至少還有軟件和服務啊，所以這個選項範圍收斂，根據“孤軍深入懸”“細作常偏頗”原則可以排除，至少可以認為不算理想答案；考試時要警惕這種明顯感覺到還有可並列項目的狹窄選項；\nB 初見之下我也是一頭霧水，但由於太不常見了，不大可能是個好選項；後來查了一下，好像跟“廣義函數”理論有關，屬計算和信號處理領域的理論知識。\nC 資產是“廣義”詞彙，除生命而外，利潤（收益）是任何決策的必然目標。“大言不須慚”“安全必圖財”，可留，而且資產包括A硬件和數據以及D資源和聲譽，勝出；\nD 是無形資產之倆，被C“資產”所包含，輪不到它了；而且對著數據中心這一大坨實物，不可能重點考慮保護無形資產。","src":"官方習題精選"},{"id":"d7-39-01","ch":7,"level":"7-5","tag":"介質淨化","diff":3,"q":"Saria工作的政府國防承包商最近關閉了一個重大研究項目，並計劃將用於該項目的數十萬美元的系統和數據存儲磁帶重新用於其他目的。當Saria審查公司的內部流程時，她發現自己無法重複使用這些磁帶，並且手冊說應該銷燬它們。為什麼不允許Saria消磁然後再使用磁帶以節省公司的經費？","opts":["數據持久性可能是一個問題。","數據殘留是一個隱憂。","磁帶可能會發生位衰減（就是放著放著數據就沒了）。","磁帶上的數據不能通過消磁來擦除。"],"ans":1,"exp":"消磁確實能把磁帶上的磁記錄抹掉，但抹不乾淨——專業手段還能從殘留磁跡裡撈回東西，這就是數據殘留。國防項目對這種殘餘最敏感，所以手冊乾脆要求物理銷燬，不冒這個險。A 的「數據持久性」是造出來的詞；C 的位衰減是介質放久了自然損壞，跟能不能安全複用不是一回事；D 說消磁擦不掉磁帶，正好說反了。","src":"官方習題精選"},{"id":"d7-39-02","ch":7,"level":"7-5","tag":"介質淨化","diff":3,"q":"Fred的組織允許在項目完成並清除系統後降級系統以供重用。Fred對於把“最高機密”分類項目中的系統重用於將來被歸類為“秘密”的項目，應該引起什麼關注？","opts":["最高機密數據可能與機密數據混合在一起，導致需要重新標記系統。","淨化過程的成本可能超過新設備的成本。","數據可能會在淨化過程中暴露。","由於數據標籤的差異，組織的DLP系統可能會標記新系統。"],"ans":2,"exp":"把絕密機器降級給秘密項目用，中間必須做淨化（比普通擦除更徹底的那種），而淨化要人上手操作、把殘留數據翻出來處理——這個環節恰恰是絕密數據最容易露出去的時候。所以 Fred 該擔心的是過程本身的暴露風險。A 講的是淨化沒做乾淨之後的後果，不是首要關注點；B 只是多花點錢；D 是 DLP 誤報的小麻煩。","src":"官方習題精選"},{"id":"d7-39-03","ch":7,"level":"7-5","tag":"介質淨化","diff":3,"q":"哪種方法使用強磁場擦除介質？","opts":["磁擦","消磁","淨化","消除"],"ans":1,"exp":"消磁就是拿強磁場把介質的磁化狀態攪亂，數據自然就沒了，磁帶、硬盤這類磁性介質都吃這一套。A 的「磁擦」是編的詞；C 淨化、D 清除都是更寬泛的處置類別，說的是「擦到什麼程度算乾淨」，不是特指用磁場這個手段。","src":"官方習題精選"},{"id":"d7-j08","ch":7,"level":"7-5","tag":"介質淨化","diff":3,"q":"以下哪一項是驗證介質淨化過程的最重要原因？","opts":["避免人為錯誤","遵守安全政策","保護機密性","碎紙機（切碎機）校準 （注）題幹中“驗證”的意義見下圖（出自NIST SP 800-88）："],"ans":1,"exp":"【作者解題思路原文】\n解析：\n這題比較容易誤選 C 。\n（1）介質淨化的真正目的是：\n確保基於時間、空間或其使命而言，不應該或不必要繼續存在的數據徹底消失。\n可能的理由包括：機密性、隱私、法律或監管風險、其他風險、成本等，機密性不是唯一的理由，也不總是最重要的。\n（2） “遵守安全政策”看起來很籠統，很“虛”，很不招人待見，但是，它可能不是最佳選項，卻絕對是天然正確的選項，用排除法做題時，千萬千萬不要它先排除了！！！一般來說，它是最終答案的可能性極大。\n（3）凡是具體的、“實”的項目，往往不是普適的，考試時要敢於避“實”就“虛”","src":"官方習題精選"},{"id":"d7-s08","ch":7,"level":"7-5","tag":"介質處置","diff":2,"q":"某公司退役一批筆記本電腦，其中裝有存放客戶數據的 NVMe 固態硬盤。資產管理員打算沿用機械硬盤時代的流程：先消磁，再捐給公益機構。作為安全顧問，你應當建議？","opts":["消磁後即可捐贈，固態硬盤與機械硬盤同屬磁性介質，處理方式一致","用多遍隨機數據覆寫整個磁盤，覆寫完成後即可捐贈","刪除全部分區並格式化，客戶數據已不可訪問","採用加密擦除（銷燬密鑰）或物理粉碎、切碎，按數據敏感度與介質類型選擇，並留存處置記錄"],"ans":3,"exp":"解析：閃存芯片靠浮柵電荷存儲，不是磁性介質，消磁對它沒有任何作用；更麻煩的是固態硬盤有磨損均衡、預留空間和壞塊重映射，主機側發起的覆寫無法保證覆蓋到每一個物理塊，因此對含敏感數據的固態硬盤，NIST SP 800-88 一類指南推薦加密擦除或物理銷燬。選項 A 建立在「固態硬盤是磁性介質」的錯誤前提上。選項 B 的覆寫對機械硬盤可行，對閃存卻無法驗證覆蓋是否徹底，不能作為捐贈前的保證。選項 C 只清除了文件系統索引，數據塊仍可能被專業工具恢復。無論選哪種方式，都要留下處置記錄，作為合規與審計的證據。","src":"原創"},{"id":"d7-s09","ch":7,"level":"7-5","tag":"雲端處置","diff":3,"q":"某企業把客戶數據備份遷到 SaaS 供應商，合同到期決定退出，需要確認數據已從供應商的存儲介質上清除。該供應商的存儲是多租戶共享的，客戶無法接觸物理磁盤。最合適的做法是？","opts":["派工程師到供應商機房，對所有相關磁盤執行消磁","在合同中約定退出時的數據銷燬義務，取得密鑰銷燬或數據刪除證明及獨立審計報告（如 SOC 2），並據此驗證","刪除自己側的備份索引，數據隨之在供應商處不可訪問","把數據下載回本地並覆寫一遍，作為已經清除的證據"],"ans":1,"exp":"解析：多租戶環境裡客戶拿不到物理介質，處置責任落在供應商，客戶能做的是在合同裡寫明銷燬義務、時限和證明形式，退出時索取密鑰銷燬或刪除證明，並結合獨立審計報告來驗證；如果數據在供應商側是加密存儲的，銷燬密鑰本身就能讓殘留數據不可讀。選項 A 在共享存儲上既無權限也不可行，消磁會波及其他租戶的數據。選項 C 刪掉索引只是讓自己的界面看不到數據，供應商磁盤上的數據仍在。選項 D 只證明本地副本被覆蓋，與供應商側是否已清除毫無關係，也無法作為審計證據。","src":"原創"},{"id":"d7-s10","ch":7,"level":"7-5","tag":"緊急變更","diff":3,"q":"週五傍晚，某支付網關被發現存在正被實際利用的高危漏洞，常規變更流程需要 5 個工作日審批。運維主管要求當晚直接在生產環境打補丁。符合變更管理原則的做法是？","opts":["嚴格執行常規流程，等變更諮詢委員會按 5 個工作日審批後再安排打補丁","由運維主管當場決定並在生產環境直接打補丁，事後在工單裡補一句說明即可","走緊急變更流程：由授權負責人即時審批，記錄風險評估與回滾方案，實施後補齊文檔並由變更諮詢委員會事後複核","把系統下線，等下週的常規測試窗口再處理，避免臨時變更帶來風險"],"ans":2,"exp":"解析：變更管理並不是只有一條審批通道，緊急變更（emergency change）正是為正在被利用的漏洞、重大故障這類情況準備的：由事先授權的負責人當場批准，同時記錄風險評估、實施步驟與回滾方案，事後補全文檔並交變更諮詢委員會複核，這樣既壓住了風險又不犧牲可追溯性。選項 A 用流程擋住了應急處置，漏洞正被利用時等 5 天等於主動擴大損失。選項 B 跳過了授權、記錄和回滾準備，一旦補丁引發故障既無法回退也無法審計。選項 D 讓系統直接停擺、業務中斷，代價遠大於風險本身，而且拖延並不消除漏洞。","src":"原創"},{"id":"d7-s11","ch":7,"level":"7-5","tag":"補丁管理","diff":3,"q":"某企業有 3000 臺服務器需要維護。漏洞管理平臺列出兩批待處理項：一批互聯網暴露的邊緣服務器存在可被遠程利用的高危漏洞；另一臺核心 ERP 因廠商兼容性原因無法立即安裝高危補丁，但該系統只在內網訪問。IT 經理需要排定處理順序。最合理的做法是？","opts":["按補丁發佈日期排序，先發布的先打，全網統一推進","按 CVSS 分數從高到低統一排序，分數相同的一律先處理","對無法打補丁的核心 ERP 立即下線，直到廠商發佈兼容補丁","按暴露面、可利用性與資產關鍵性綜合排序，優先處理互聯網暴露且可遠程利用的資產；對無法打補丁的系統登記風險例外、實施補償控制並定期複核"],"ans":3,"exp":"解析：補丁優先級應當基於風險而不是單一評分：CVSS 反映漏洞本身的嚴重程度，但不含資產暴露面、是否有可用的利用代碼、以及業務影響，所以要把三者放在一起排序；確實打不了補丁的系統走例外審批，用網絡隔離、虛擬補丁、加強監控等補償控制壓住風險，並設定複核期限。選項 A 按發佈時間排序與風險無關，一個剛發佈的中危補丁不該搶在暴露的高危漏洞之前。選項 B 只盯 CVSS 分數，會漏掉「分數不高但暴露在互聯網且已有利用代碼」的資產，也忽視了業務關鍵性。選項 C 的一刀切下線會造成業務中斷，處置應與業務方共同評估，先補償控制再決定是否停用。","src":"原創"},{"id":"d8-13-01","ch":8,"level":"8-1","tag":"軟件安全開發","diff":3,"q":"Barry是軟件測試人員，正在測試由其公司開發的新遊戲程序。他在智能手機上玩遊戲，以期在最能模擬正常最終用戶的環境中進行測試，但是他在進行測試時引用源代碼。Barry正在進行哪種類型的測試？","opts":["White box 白盒","Black box黑盒","Blue box藍盒","Gray box灰盒"],"ans":3,"exp":"他一邊在手機上像真實用戶那樣玩（外部視角），一邊翻源代碼（內部信息），兩樣都佔，所以是灰盒。白盒是完全盯著代碼做覆蓋分析，黑盒是隻從外面輸入輸出試，絕不給看源碼。藍盒純屬湊數的干擾項，不是標準分類。","src":"官方習題精選"},{"id":"d8-13-02","ch":8,"level":"8-1","tag":"軟件安全開發","diff":3,"q":"Miguel最近完成了對其組織一個處理敏感信息的應用程序的滲透測試。在測試過程中，他發現攻擊者可以利用定時條件（timing應該有時機選擇的意思，但考試時的確會被翻譯成“定時”）來操縱軟件，以使其能夠執行未經授權的操作。以下哪種攻擊類型適合這種情況？","opts":["SQL injection SQL注入","Cross-site scripting 跨站點腳本","Pass the hash 哈希傳遞","TOC/TOU"],"ans":3,"exp":"TOC/TOU 說的是「檢查的那一刻」和「使用的那一刻」中間有個縫：程序先查了權限、再去用這個文件，攻擊者就在縫隙裡把文件或權限換掉，用的時候已經不是檢查時那個東西了。這就是競態條件攻擊。SQL 注入、XSS、哈希傳遞都不靠這個時間窗口。（題裡那個「定時條件」翻譯得確實彆扭，其實就是時機。）","src":"官方習題精選"},{"id":"d8-13-03","ch":8,"level":"8-1","tag":"軟件安全開發","diff":3,"q":"圖中顯示的輸入參數用於安全審查過程的哪一部分？","opts":["SQL注入檢查","Sprint評審","範根檢查","攻擊面識別"],"ans":3,"exp":"圖裡乾的活是把配置、用戶、控制、後端等等各種入口參數列出來，再跟蹤它們流進代碼的哪些地方——這是在數敵人能從哪裡進來，也就是識別攻擊面。它比 SQL 注入檢查範圍大得多，也不屬於 Sprint 評審或範根（Fagan）正式審查的某個步驟。","src":"官方習題精選"},{"id":"d8-s01","ch":8,"level":"8-1","tag":"威脅建模","diff":3,"q":"Mia是安全架構師。團隊採用兩週一個sprint的敏捷開發，評審會上技術負責人提議：威脅建模太慢，等代碼寫完、功能穩定了再集中做一次，反正上線前還有滲透測試兜底。Mia最合適的回應是什麼？","opts":["同意，把威脅建模合併到上線前的滲透測試階段一起做，可以節省重複工作","主張在架構設計階段、編碼開始前進行威脅建模，並按sprint增量維護，因為設計缺陷在後期修復的成本遠高於改代碼","只在系統上線運行三個月、拿到真實攻擊日誌後再建模，這樣威脅列表更貼近實際","只對涉及資金支付的功能模塊做威脅建模，其餘模塊風險低，交給代碼評審覆蓋即可"],"ans":1,"exp":"威脅建模的全部價值都在時機上：此刻改一張數據流圖、刪掉一個不必要的信任邊界幾乎零成本；等到滲透測試階段，架構層面的缺陷（例如進程直接信任客戶端、根本沒有授權層）往往只能靠打補丁掩蓋，嚴重的只能推倒重來。它也不是一次性交付物，架構每個sprint都在變，所以按增量持續更新才對。選項A把建模和滲透測試混為一談，滲透測試驗證的是已經寫出來的代碼，改不動設計；選項C是事後諸葛，生產日誌只能證明攻擊已經發生，而建模本就是為了在實現之前預判；選項D把範圍縮到單一功能，可其餘模塊照樣跨信任邊界，攻擊者不會挑你建模過的地方進。","src":"原創"},{"id":"d8-s02","ch":8,"level":"8-1","tag":"失敗安全","diff":3,"q":"支付平臺的設計評審上，有人指出授權服務（負責判斷用戶是否有權執行某操作）偶爾會超時。架構師提出：為了可用性，超時就先放行，只在日誌裡記一筆。作為安全評審人員，最合適的意見是什麼？","opts":["同意，可用性優先，超時率很低，日誌足以支撐事後追責","把授權判斷下移到前端，由客戶端緩存權限結果，超時時用緩存值放行","要求失敗時默認拒絕受保護操作（fail secure），並按操作風險設計降級方案限制影響範圍，例如低風險只讀操作放行、涉及資金的操一律拒絕","超時就直接讓整個服務返回500，讓所有用戶重試，簡單而且絕對安全"],"ans":2,"exp":"fail secure 的核心是：控制失效時系統必須落到不允許的狀態，而不是落到允許的狀態。超時放行等於把「控制不可用」翻譯成「控制不存在」，攻擊者只要想辦法打滿授權服務的連接池，就能把鑑權整個繞過去。但真正的失敗安全不是一刀切全站癱瘓，而是按操作風險分級降級，這就是選項C裡「限制影響範圍」那半句的意義。選項A把可用性擺在保密性和完整性之前，日誌只能記錄已經被利用的越權；選項B把判斷放到客戶端，信任邊界直接破掉，緩存值既能偽造也能無限複用；選項D確實是拒絕，可它拒絕了全部業務，把可用性風險擴到最大——失敗安全不等於服務停擺。","src":"原創"},{"id":"d8-s03","ch":8,"level":"8-1","tag":"需求分析","diff":2,"q":"Ken是業務分析師，正在寫購物車的用戶故事。安全團隊要求「需求階段就要把安全做進去」。Ken的下列做法，哪一項最合適？","opts":["在需求文檔里加一句「本系統必須符合OWASP Top 10」","把安全需求全部留給測試團隊，在測試用例裡體現","在需求裡寫「系統必須安全可靠、不得存在漏洞」，作為驗收總綱","為關鍵功能補寫誤用或濫用案例，描述攻擊者會怎麼濫用，並據此寫出可測試的安全需求與驗收標準"],"ans":3,"exp":"需求階段能真正落地的東西只有兩種：可測試的安全需求，和可追蹤的攻擊場景。誤用案例屬於後者——從攻擊者視角寫「註冊接口可能被用來批量註冊撞庫」，再翻譯成「同一IP每分鐘不超過N次」「命中撞庫特徵必須鎖定並要求二次驗證」這類驗收時能判定的標準。選項A引用的是風險類別清單，不是本項目的具體需求，團隊照樣不知道要做什麼；選項B把問題推到下游，測試團隊只能驗證已經寫出來的東西，需求缺口補不回來；選項C是不可驗證的表述，沒有人能證明「不得存在漏洞」，它只會變成一句誰都不用負責的免責聲明。","src":"原創"},{"id":"d8-s04","ch":8,"level":"8-1","tag":"信任邊界","diff":3,"q":"Priya帶團隊完成了威脅建模的數據流圖，圖上畫了外部實體、進程、數據存儲和數據流。下一步進行什麼分析最有效？","opts":["先在圖上劃定信任邊界，優先分析每一條跨越邊界的數據流","對所有進程一個不漏地枚舉全部已知威脅類型，確保沒有遺漏","從漏洞掃描報告出發，按CVSS分數排序，先處理高危項","等拿到最新的APT威脅情報報告後再開始，否則威脅列表不完整"],"ans":0,"exp":"數據流圖只是地圖，真正決定風險密度的是信任邊界：同一信任域內的組件默認相互可信，只有跨界的每一條數據流才需要被反覆質疑。先劃邊界、按跨界流排序，工作量可控且命中率最高。選項B是典型的全枚舉，N個進程乘以六類威脅就是幾百條沒人看得完的條目，最後一定被丟進抽屜；選項C混淆了威脅建模與漏洞管理，掃描報告反映的是已實現代碼的已知缺陷，對設計層的威脅（信任客戶端、缺授權層）毫無覆蓋；選項D把建模變成被動等待，威脅情報是輸入之一而不是前置條件，建模本來就是用你現有的架構知識做預判。","src":"原創"},{"id":"d8-s05","ch":8,"level":"8-1","tag":"隱私需求","diff":2,"q":"註冊頁改版。產品經理要求收集生日、性別、手機號、所在城市，理由是「現在用不上，但以後做推薦可能有用，先收著再說」。隱私工程師Lisa最合適的意見是什麼？","opts":["先按產品經理說的收，等真正要做推薦功能時再評估收集的合法性","字段照收，但全部加密存儲，這樣即便過度收集也不會造成影響","刪掉沒有明確用途的字段，只保留為已定義目的所必需的項，並記錄用途與保留期限","字段全部保留，但在註冊頁增加用戶協議勾選框，用戶勾選後就不成問題"],"ans":2,"exp":"數據最小化是隱私設計的基線：收集範圍由已經定義的目的決定，而不是由「以後可能有用」決定。沒有目的的字段，等於沒有保留期限、沒有訪問約束、也沒有洩露應急方案的數據，一旦庫被拖走，代價是實打實的。選項A把決定權推給未來，可數據一旦收進來就再也刪不乾淨；選項B只解決存儲環節，洩露面、告知義務和訪問控制一個都沒解決，加密不是收集的許可證；選項C用「同意」替代必要性，同意是處理的合法性基礎之一，但它管不住「收不必要的字段」這件事本身，而且隨手加個勾選框通常也達不到有效同意的標準。","src":"原創"},{"id":"d8-11-01","ch":8,"level":"8-2","tag":"web安全","diff":3,"q":"Frank正嘗試保護他的web應用程序應對跨站腳本攻擊。由於用戶不需要提供包含腳本的輸入，所以他認定最有效的方式是編寫一個過濾器，在服務端檢查和移除“<SCRIPT>”標籤。他這樣做的會有什麼問題？","opts":["驗證應該總是在客戶端上執行。","攻擊者可能利用XSS過濾器規避技術來對抗這種方法。","服務器端驗證需要刪除所有的HTML標籤，不只是“<SCRIPT>”標籤。","Frank的方法沒有問題"],"ans":1,"exp":"只刪 <SCRIPT> 是典型的黑名單思路，而黑名單永遠列不全：大小寫混著寫、換成 <img onerror=...>、用事件屬性、上各種編碼，隨便一個就能繞過去。要真防住，得走白名單——規定允許什麼，其餘一律不要。A 說驗證要在客戶端做，方向就反了，客戶端代碼攻擊者隨手就能關掉；C 要求刪掉所有 HTML 標籤，太狠也沒必要。","src":"官方習題精選"},{"id":"d8-11-02","ch":8,"level":"8-2","tag":"web安全","diff":3,"q":"Carlos正在調查他所在機構的敏感信息的損害。他認為攻擊者設法從數據庫中檢索所有員工的人事信息，並在一個基於Web的人事管理系統的日誌條目中發現了以下由用戶提供的輸入：\nCollins'&1=1;––\n這說明發生了什麼類型的攻擊？","opts":["SQL injection SQL注入","Buffer overflow 緩衝區溢出","Cross-site scripting 跨站腳本","Cross-site request forgery 跨站請求偽造"],"ans":0,"exp":"看那串 Collins'&1=1 就夠判了：先來一個單引號把字符串提前閉合，再用 1=1 拼出一個永遠為真的條件，於是查詢條件形同虛設，整張人事表就被拖走了。這是標準的 SQL 注入。題裡沒有超長輸入，排除緩衝區溢出；也沒有跡象說腳本在受害者瀏覽器裡跑，排除 XSS 和 CSRF。","src":"官方習題精選"},{"id":"d8-11-03","ch":8,"level":"8-2","tag":"web安全","diff":3,"q":"Steve正在開發一個用於輸入驗證的例程（routine），來保護Web應用程序的後臺數據庫免受SQL注入攻擊。Steve應該把用於輸入驗證的代碼放在哪裡？","opts":["嵌入在網頁中的JavaScript","Web服務器上的後端代碼","數據庫存儲過程","用戶的web瀏覽器上的代碼"],"ans":1,"exp":"輸入驗證必須放在服務器端的後端代碼裡，因為只有那裡是攻擊者繞不過去的——請求到那兒的時候，惡意內容還沒進數據庫。A 和 D 都是客戶端 JavaScript，攻擊者改個請求、關掉瀏覽器腳本就失效了。C 的存儲過程更適合做參數化查詢，是另一層防護，不是「輸入驗證代碼該放哪」的答案。（縱深防禦裡它倆可以一起用，但問的位置只有一個。）","src":"官方習題精選"},{"id":"d8-12-01","ch":8,"level":"8-2","tag":"web安全","diff":3,"q":"攻擊者在Web應用程序中發現一個漏洞。他發現URL中的參數之一可用於添加JavaScript代碼，該JavaScript代碼在將請求發送到網站時在瀏覽器中執行。以下哪一項是此漏洞的正確描述？","opts":["這是一個存儲的XSS漏洞，攻擊者需要誘使受害者訪問URL。","這是一個存儲的XSS漏洞，當有人使用Web應用程序時，就會發生利用。","這是一個反射的XSS漏洞，攻擊者需要誘使受害者訪問URL。","這是一個反射的XSS漏洞，當有人使用Web應用程序時，就會發生利用。"],"ans":2,"exp":"關鍵詞是「URL 裡的參數」：腳本沒有存進服務器，只是被反射回本次響應、當場在瀏覽器裡執行。所以是反射型 XSS，而且必須騙受害者去點那個特製鏈接才成立。存儲型不一樣，腳本是留在服務器上的，誰來訪問這個頁面都會中招，不用專門誘導。A、B 都錯在「存儲型」，D 錯在「不用誘導」。","src":"官方習題精選"},{"id":"d8-12-02","ch":8,"level":"8-2","tag":"web安全","diff":3,"q":"一個web應用程序在處理請求時檢測到錯誤，並不顯示有關錯誤的完整信息，而是返回包含有關錯誤的參考的常規頁面。包括參考在內的有關錯誤的所有信息均在本地記錄。\n此解決方案最可能的主要原因是什麼？","opts":["這樣可以防止不必要的內部信息洩漏。","這比顯示完整的錯誤消息更加用戶友好。","這防止了帶寬的不必要使用。","這是開發人員解決和管理錯誤的首選方法。"],"ans":0,"exp":"這套做法的核心是不讓外人看見內部細節：只回一個帶參考號的通用頁面，堆棧跟蹤、文件路徑、SQL 語句這些全留在本地日誌裡。攻擊者拿不到這些，就沒法據此摸清系統結構、構造下一步攻擊。B 的用戶友好、C 的省帶寬都是順帶的副作用，A 才是安全上的真實目的。","src":"官方習題精選"},{"id":"d8-12-03","ch":8,"level":"8-2","tag":"web安全","diff":3,"q":"設計Web應用程序時應考慮各種信息的記錄。\n對於記錄有關安全性的信息，哪種類型的信息最重要？","opts":["啟動的模塊的版本信息。","在錯誤期間生成的堆棧跟蹤。","過程調用的進入，持續時間和退出時間戳。","增加或減少（提升或降低）登錄用戶的特權級別"],"ans":3,"exp":"安全日誌的價值在於能還原「誰在什麼時候幹了什麼」——認證、授權、權限變化。特權級別的提升或降低最值得記，因為它直接對應越權和提權攻擊的痕跡，事後追查就靠這一條線索。A 的模塊版本、B 的堆棧跟蹤、C 的過程調用時間戳，都是給運維排錯和性能分析用的，屬於可用性範疇。","src":"官方習題精選"},{"id":"d8-s06","ch":8,"level":"8-2","tag":"SSRF","diff":3,"q":"圖片服務接受用戶提交的URL，服務端去抓取後生成縮略圖。上線後有人提交了指向雲元數據地址的URL，拿到了實例憑證。最有效的整改措施是什麼？","opts":["在前端用正則校驗URL格式，只允許以http和https開頭","在WAF上增加規則，阻斷請求參數中出現內網IP和雲元數據地址","服務端解析目標地址後校驗解析結果不屬於內網與元數據網段，改用出站白名單，並對重定向後的地址做同樣校驗","把抓取請求改成POST，避免URL出現在日誌和瀏覽器歷史裡"],"ans":2,"exp":"SSRF的本質是「服務器替攻擊者發請求」，所以防禦必須落在服務端的出站決策上，而且必須校驗解析後的IP，不能只校驗字符串。白名單是首選——只允許訪問明確需要的域名；黑名單永遠堵不全，十進制或八進制IP、DNS重綁定、302跳轉回內網都能繞過去，這正是選項B的問題。選項A在前端做格式校驗，而攻擊者根本不經過你的前端；選項D就算把URL塞進POST body，請求該發還是發，只是沒人能從日誌裡看見，等於順手把可觀測性也關了。","src":"原創"},{"id":"d8-s07","ch":8,"level":"8-2","tag":"越權訪問","diff":2,"q":"訂單接口是/api/orders/1001這種形式。測試發現用戶A把id改成1002就能看到別人的訂單。開發負責人解釋：「界面上根本沒有這個按鈕，普通用戶發現不了。」根本性的修復應該是什麼？","opts":["把訂單id從自增數字換成UUID，讓id無法被猜測","在服務端每一個對象訪問點上，用當前會話身份校驗該用戶是否有權訪問這個對象，拒絕不屬於他的記錄","在前端頁面渲染時按角色隱藏入口，並加一段校驗腳本","為整個API啟用HTTPS，防止請求在傳輸中被篡改"],"ans":1,"exp":"這是典型的對象級授權缺失（IDOR），根因是服務端把「拿到了id」當成了「有權訪問」。修復只有一條路：每次對象訪問都在服務端做授權判定，把會話身份和數據歸屬綁在一起。選項A只提高了枚舉難度，而id會出現在導出文件、郵件鏈接、第三方回調裡，洩漏之後照樣能讀；不可預測也不等於已授權。選項B方向反了——那正是選項C在做的事，客戶端做訪問控制，攻擊者直接調API就繞過了，前端腳本連自己都護不住。選項D解決傳輸機密性，跟「誰能讀哪一條記錄」是兩回事，HTTPS之下的越權請求一樣會合法通過。","src":"原創"},{"id":"d8-50-01","ch":8,"level":"8-3","tag":"軟件安全","diff":3,"q":"琳達的留言板上肯定存在什麼漏洞？","opts":["跨站腳本","跨站請求偽造","SQL注入","不適當的身份驗證"],"ans":0,"exp":"留言板這種地方，用戶填什麼它就存什麼，存完還原樣吐回給下一個訪客的瀏覽器——瀏覽器分不清這是「別人寫的內容」還是「頁面自己的代碼」，於是照跑不誤。有人貼一段帶 <script> 的帖子，之後每個點開這帖的人都會中招，這就是典型的存儲型跨站腳本。B 的 CSRF 要的是借你已登錄的身份偷偷發請求，C 的 SQL 注入要的是能拼進數據庫語句，題幹一個都沒給，不能憑空斷定。","src":"官方習題精選"},{"id":"d8-50-02","ch":8,"level":"8-3","tag":"軟件安全","diff":3,"q":"在論壇上發佈包含此代碼的消息的用戶，其可能的動機是什麼？","opts":["偵察","竊取敏感信息","竊取憑證","社會工程學"],"ans":2,"exp":"這段代碼乾的事很直白：把瀏覽器的 document.cookie 打包發到外面那臺機器上。會話 cookie 就是登錄後的通行證，拿到它就等於拿到了這個人的登錄狀態，不用知道密碼也能冒充他，所以動機是竊取憑證。偵察只是探路摸信息，社會工程是騙人開口，跟這段純技術代碼都對不上。","src":"官方習題精選"},{"id":"d8-50-03","ch":8,"level":"8-3","tag":"軟件安全","diff":3,"q":"Linda與供應商聯繫，確定供應商沒有修補程序可以糾正此漏洞。\n以下哪種設備最能幫助她保護應用程序免受進一步攻擊？","opts":["VPN","WAF","DLP","IDS"],"ans":1,"exp":"補丁這條路堵死了，那就只能在流量進應用之前把它攔住。WAF 就站在 Web 應用前頭，一條條看 HTTP 請求和響應，發現 XSS 那種腳本載荷直接丟回去，等於給沒有補丁的應用套了一層外殼。IDS 是隻會喊「有人打你」不還手的，VPN 管加密通道，DLP 管資料別外流，都攔不住網頁注入。","src":"官方習題精選"},{"id":"d8-50-04","ch":8,"level":"8-3","tag":"軟件安全","diff":3,"q":"在與供應商的進一步討論中，Linda發現他們願意糾正問題，但不知道如何更新軟件。要減輕應用程序應對此類攻擊的脆弱性，哪種技術最有效？","opts":["邊界檢查","同行評審","輸入驗證","操作系統補丁"],"ans":2,"exp":"這類漏洞的根子不在別處，就在於「誰都能往服務器塞內容，而服務器全盤照收」。所以最有效的修法是從源頭管住輸入：白名單隻放行該有的字符，輸出時再做編碼，讓腳本變成一堆普通文字而不是能執行的代碼。邊界檢查是防緩衝區溢出的，操作系統補丁跟應用自身的邏輯沒關係，同行評審是好習慣但不屬於直接的技術控制。","src":"官方習題精選"},{"id":"d8-s08","ch":8,"level":"8-3","tag":"動態測試","diff":3,"q":"公司採購了一套只交付編譯產物的Web應用（war包與容器鏡像），拿不到源碼。安全團隊要在上線前做評估，最合適的方案是什麼？","opts":["對二進制跑SAST，把字節碼反編譯後按源碼規則掃描，結果等同於源碼審計","做DAST覆蓋運行時行為，並在合同中要求供應商提供獨立第三方評估報告與SBOM作為補充證據","只做SCA依賴掃描，只要組件沒有已知CVE就可以上線","採信供應商出具的「已通過安全開發流程」書面聲明，免於測試"],"ans":1,"exp":"沒有源碼就不具備做SAST的前提。DAST從外部發請求、看響應，正好不需要源碼，能覆蓋認證、越權、注入等運行時行為；侷限是覆蓋面取決於爬取深度和測試用例，所以要配合合同層面的證據（第三方評估報告、SBOM）補上你看不見的內部控制。選項A把反編譯產物當源碼，可讀性和分析精度都不成立，「等同於源碼審計」是過度斷言；選項B只回答了「用了哪些組件、有沒有已知CVE」，業務邏輯缺陷、配置錯誤、越權一概查不到；選項D是純自證，供應商說做過和真的做過、做得夠不夠，是兩件不同的事。","src":"原創"},{"id":"d8-s09","ch":8,"level":"8-3","tag":"IAST","diff":2,"q":"QA團隊在功能測試環境給應用掛上插樁agent，跑完一輪迴歸後報出若干漏洞，每條都帶著觸發它的請求和對應的代碼位置。這屬於哪種測試，它最大的侷限是什麼？","opts":["SAST，因為它能直接指向代碼行，而且不需要運行應用","DAST，因為它從外部發請求並觀察響應","SCA，因為它依賴運行時的組件清單","IAST，它要求測試用例真正執行到有漏洞的代碼路徑，執行不到的代碼不會報"],"ans":3,"exp":"IAST把插樁agent放進運行時，一邊跑一邊觀察數據在代碼裡的實際流動，所以既能定位到具體代碼位置，又只報被真實觸發的路徑，誤報率低是它最大的優點；代價也很明確：沒跑到的代碼（後臺任務、異常分支、未覆蓋的功能）就是盲區。選項A混淆了靜態分析，SAST不運行應用，也不需要agent；選項B少了內省能力，DAST看不到代碼裡的數據流，不可能精確指到行；選項C說的是組件清單，跟運行時插樁沒有任何關係。","src":"原創"},{"id":"d8-s10","ch":8,"level":"8-3","tag":"告警治理","diff":3,"q":"SAST接入CI之後，一次全量掃描報出4200條告警，開發組看都不看直接點忽略，還抱怨「除了添亂沒別的用」。最合適的處理方式是什麼？","opts":["先對存量代碼做基線、只對新增和變更代碼設質量門禁，同時按規則類別清理誤報並給出修復指引","關掉誤報最多的那幾條規則，先把告警量降下來，換取開發組的配合","要求開發組逐條確認這4200條，全部關閉後才允許合併代碼","提高告警閾值直到數字變成零，以此證明代碼是安全的"],"ans":0,"exp":"4200條沒人處理的告警和沒有告警是一回事，甚至更糟——它訓練了整個團隊忽略安全信號。正確順序是分而治之：存量做基線不再阻塞，增量設門禁保證不惡化，同時按規則類別區分真問題和誤報，誤報要麼調規則要麼帶到期日標註接受，真問題要給修復示例。選項B用關規則換配合，誤報降了漏報同時上來，而且沒人記得關掉的是哪一類；選項C把成本全壓在開發身上還不解決存量質量，最後一定演變成批量點忽略；選項D是在調整指標而不是修復問題，閾值調高只會讓真漏洞一起消失。","src":"原創"},{"id":"d8-s11","ch":8,"level":"8-3","tag":"模糊測試","diff":3,"q":"一個用C寫的圖片解析庫，歷史上多次出現堆溢出，這些漏洞都不是公開CVE，而是內部事後發現的。要在發佈前更早發現這類問題，最有效的措施是什麼？","opts":["每季度
